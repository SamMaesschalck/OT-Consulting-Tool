<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Export smoke test</title>
  <style>body{font:13px "Segoe UI",sans-serif;padding:20px;}.ok{color:#2E7D52}.bad{color:#B23A33;font-weight:600}</style>
</head>
<body>
  <h1>Export smoke test</h1>
  <div id="out"></div>

<script src="harness.js"></script>
<script>H.app({ xlsx: true, docx: true });</script>
  <script>
  (function () {
    var out = document.getElementById("out");
    function line(kind, text) {
      var d = document.createElement("div");
      d.className = kind; d.textContent = text;
      out.appendChild(d);
    }
    var App = window.App;
    var inst = App.Data.instruments["iec-62443-3-3"].instrument;
    var narr = App.Data.instruments["iec-62443-3-3"].narrative;
    var tax  = App.Data.shared.taxonomies["fr-7"];
    var prof = App.Data.shared.scoringProfiles["sl-target-closeness"];

    var postureInst = App.Data.instruments["general-ot-posture"].instrument;
    var postureNarr = App.Data.instruments["general-ot-posture"].narrative;
    var postureProf = App.Data.shared.scoringProfiles["posture-domain-letter"];
    var engagement = App.Storage.makeEmptyEngagement(inst);
    engagement.engagement.clientName = "Acme Petrochemicals";
    engagement.engagement.siteName = "Plant A";
    engagement.engagement.consultant = "S. Maesschalck";
    engagement.engagement.dateOfVisit = "2026-05-20";
    var fr1 = inst.requirements.filter(function (r) { return r.frId === "FR1"; });
    var tid = engagement.targets[0].id;
    fr1.forEach(function (r, i) {
      engagement.responses.push({ targetId: tid, requirementId: r.id,
        applicable: true, achievedSL: (i === 0 ? 0 : 2),
        evidence: "Reviewed " + r.code, notes: "" });
    });

    // 1. Excel
    try {
      if (!window.XLSX) throw new Error("XLSX global missing");
      var wb = App.ExportXLSX.build(engagement, inst, tax, prof);
      var sheets = (wb && wb.SheetNames) || [];
      line("ok", "PASS Excel build - sheets: " + sheets.join(", "));
      var arr = XLSX.write(wb, { bookType: "xlsx", type: "array" });
      line("ok", "PASS Excel serialize - " + (arr.byteLength || arr.length) + " bytes");
    } catch (e) {
      line("bad", "FAIL Excel - " + (e && (e.message + " :: " + e.stack) || e));
    }

    // 2. Word (async)
    try {
      if (!window.docx) throw new Error("docx global missing");
      App.ExportDOCX.buildAsync(engagement, inst, tax, prof, narr, { targetId: tid }, function (err, blob) {
        if (err) { line("bad", "FAIL Word (SL) - " + (err.message || err)); return; }
        line("ok", "PASS Word (SL) build - " + blob.size + " bytes");

        // 3. Posture Excel
        var postureEng = App.Storage.makeEmptyEngagement(postureInst);
        var postureTid = postureEng.targets[0].id;
        postureEng.responses.push({ targetId: postureTid, requirementId: "gov.1", applicable: true, band: 2, capture: { notes: "Owned by IT security." } });
        postureEng.responses.push({ targetId: postureTid, requirementId: "monitor.1", applicable: true, band: 0 });
        postureEng.responses.push({ targetId: postureTid, requirementId: "monitor.2", applicable: true, band: 0 });
        postureEng.responses.push({ targetId: postureTid, requirementId: "monitor.3", applicable: true, band: 1 });
        postureEng.responses.push({ targetId: postureTid, requirementId: "arch.5", applicable: true, band: 0, capture: { notes: "SIS shares segment with BPCS." } });
        try {
          var pwb = App.ExportXLSX.build(postureEng, postureInst, null, postureProf);
          line("ok", "PASS Posture Excel build - sheets: " + pwb.SheetNames.join(", "));
          var parr = XLSX.write(pwb, { bookType: "xlsx", type: "array" });
          line("ok", "PASS Posture Excel serialize - " + (parr.byteLength || parr.length) + " bytes");
        } catch (e2) { line("bad", "FAIL Posture Excel - " + (e2 && (e2.message + " :: " + e2.stack) || e2)); }

        // 4. Posture Word
        App.ExportDOCX.buildAsync(postureEng, postureInst, null, postureProf, postureNarr, { targetId: postureTid }, function (err2, blob2) {
          if (err2) { line("bad", "FAIL Posture Word - " + (err2.message || err2)); return; }
          line("ok", "PASS Posture Word build - " + blob2.size + " bytes");
          line("ok", "Total: smoke OK.");
        });
      });
    } catch (e) {
      line("bad", "FAIL Word - " + (e && e.message || e));
    }
  })();
  </script>
</body>
</html>
