<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>NIST + CIS Word exec summary</title></head>
<body>
<pre id="out">running…</pre>

<script src="harness.js"></script>
<script>H.app({ docx: "mock", tours: ["caf", "cis", "nist", "nist82"] }); H.dom();</script>
<script>
window.docx = (function () {
  function TextRun(o){ if(typeof o==="string")o={text:o}; this.__type="TextRun"; this.text=o.text!=null?o.text:(Array.isArray(o.children)?o.children.join(""):""); }
  function Paragraph(o){ o=o||{}; this.__type="Paragraph"; this.children=o.children||[]; this.text=this.children.map(function(r){return r&&r.text!=null?r.text:"";}).join(""); }
  function TableCell(o){ this.__type="TableCell"; this.children=(o&&o.children)||[]; }
  function TableRow(o){ this.__type="TableRow"; this.children=(o&&o.children)||[]; }
  function Table(o){ this.__type="Table"; this.rows=(o&&o.rows)||[]; }
  function ImageRun(){ this.__type="ImageRun"; this.text=""; }
  function PageBreak(){ this.__type="PageBreak"; this.text=""; }
  function Header(o){ this.__type="Header"; this.children=(o&&o.children)||[]; }
  function Footer(o){ this.__type="Footer"; this.children=(o&&o.children)||[]; }
  function Document(o){ this.__type="Document"; this.sections=(o&&o.sections)||[]; }
  return { Document:Document,Paragraph:Paragraph,TextRun:TextRun,TableCell:TableCell,TableRow:TableRow,Table:Table,ImageRun:ImageRun,PageBreak:PageBreak,Header:Header,Footer:Footer,
    HeadingLevel:{TITLE:"Title",HEADING_1:"Heading1",HEADING_2:"Heading2",HEADING_3:"Heading3"},
    AlignmentType:{LEFT:"left",CENTER:"center",RIGHT:"right",BOTH:"both"}, WidthType:{PERCENTAGE:"pct",DXA:"dxa"},
    ShadingType:{SOLID:"solid"}, TableLayoutType:{FIXED:"fixed"}, PageOrientation:{PORTRAIT:"portrait",LANDSCAPE:"landscape"},
    HeightRule:{EXACT:"exact",ATLEAST:"atLeast"}, PageNumber:{CURRENT:"current"},
    Packer:{ toBlob:function(doc){ window.__capturedDoc=doc; return Promise.resolve(new Blob(["dummy"])); } } };
})();
</script>
<script>
(function () {
  var lines = [], fail = 0;
  function ok(c, n, d) { lines.push((c ? "PASS " : "FAIL ") + n + (!c && d ? " - " + d : "")); if (!c) fail++; }
  window.confirm = function () { return true; }; window.alert = function () {};
  var A = window.App, E = A.Engine;
  A.Charts.svgToPngBlob = function (svg, s, cb) { cb(new Blob(["png"])); };

  function docText(cb) {
    var doc = window.__capturedDoc, paras = [];
    function walk(node) {
      if (!node) return;
      if (node.__type === "Paragraph") { paras.push(node); return; }
      if (node.__type === "Table") { node.rows.forEach(walk); return; }
      if (node.__type === "TableRow" || node.__type === "TableCell") { node.children.forEach(walk); return; }
      if (Array.isArray(node)) node.forEach(walk);
    }
    doc.sections.forEach(function (s) { walk(s.children); });
    return paras.map(function (p) { return p.text; }).join("\n");
  }

  var CASES = [
    { id: "ncsc-caf", tour: A.TourCAF, client: "Northbridge Manufacturing",
      must: ["This assessment finds that Northbridge Manufacturing", "Not Achieved", "Partially Achieved", "The gaps are not evenly spread", "four objectives", "weakest alignment in", "Outcome profile by objective"],
      mustNot: ["Other Than Satisfied", "Selected profile:"] },
    { id: "nist-800-53", tour: A.TourNIST, client: "Atlas Digital Services",
      must: ["This assessment finds that Atlas Digital Services", "Other Than Satisfied", "The gaps are not evenly spread", "Technical, Operational and Management", "neither a formal SP 800-53A control assessment", "The weakest area is", "Outcome profile by objective"],
      mustNot: ["Not Achieved", "Partially Implemented", "Selected profile:"] },
    { id: "nist-800-82", tour: A.TourNIST82, client: "Riverbend Water Authority",
      must: ["This assessment finds that Riverbend Water Authority", "OT Overlay", "Other Than Satisfied", "The gaps are not evenly spread", "OT-aware roadmap"],
      mustNot: ["Not Achieved", "Selected profile:"] },
    { id: "cis-controls-v8", tour: A.TourCIS, client: "Brightpath Retail Group",
      tweak: function (E) { E.setResponse(E.state.activeTargetId, "1.3", { applicable: true, state: "achieved" }); },
      must: ["This assessment finds that Brightpath Retail Group", "Implemented", "Partially Implemented", "Not Implemented", "The weakest Control is", "18 CIS Controls", "Outcome profile by control", "Inventory and Control of Enterprise Assets", "Additional controls implemented beyond"],
      mustNot: ["Other Than Satisfied", "Selected profile:", "Outcome profile by objective"] }
  ];

  var i = 0;
  function next() {
    if (i >= CASES.length) { lines.push(""); lines.push(fail === 0 ? "ALL TESTS PASSED" : fail + " FAILED"); document.getElementById("out").textContent = lines.join("\n"); return; }
    var c = CASES[i++];
    try {
      E.activateInstrument(c.id);
      c.tour.apply(E);
      if (c.tweak) c.tweak(E);
      var inst = E.state.instrument, tid = E.state.activeTargetId;
      A.ExportDOCX.buildAsync(E.state.engagement, inst, null, E.state.profile, E.getActiveNarrative(), {
        targetId: tid,
        cafOverlay: E.getActiveCAFOverlay(),
        cafProfile: E.getActiveCAFProfile ? E.getActiveCAFProfile() : null,
        cafProfileRegistry: E.getCAFProfileRegistry(),
        cafProfileId: E.getActiveCAFProfileId()
      }, function (err) {
        try {
          if (err) { ok(false, c.id + ": doc build - " + (err.message || err)); return next(); }
          var t = docText();
          ok(t.indexOf("Executive summary") !== -1, c.id + ": has an Executive summary section");
          c.must.forEach(function (m) { ok(t.indexOf(m) !== -1, c.id + ": exec contains \"" + m + "\""); });
          c.mustNot.forEach(function (m) { ok(t.indexOf(m) === -1, c.id + ": exec omits \"" + m + "\""); });
        } catch (e) { ok(false, c.id + ": assertions threw: " + e.message); }
        next();
      });
    } catch (e) { ok(false, c.id + ": threw: " + e.message + "\n" + (e.stack || "")); next(); }
  }

  try { E.loadCatalog(); A.UI.init({ autosave: false }); next(); }
  catch (e) { ok(false, "boot threw: " + e.message + "\n" + (e.stack || "")); document.getElementById("out").textContent = lines.join("\n"); }
})();
</script>
</body></html>
