<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>docx landscape tables</title></head>
<body>
<pre id="out">running…</pre>
<textarea id="b64" style="display:none"></textarea>

<script src="harness.js"></script>
<script>H.app({ xlsx: true, docx: true }); H.dom();</script>
<script>
(function () {
  var out = document.getElementById("out");
  var A = window.App, E = A.Engine;
  A.Charts.svgToPngBlob = function (svg, s, cb) { cb(new Blob(["png"])); };
  E.loadCatalog(); A.UI.init({ autosave: false });
  var id = (location.hash || "").replace(/^#/, "") || "cis-controls-v8";
  E.activateInstrument(id);
  var tid = E.state.activeTargetId;
  var inst = E.state.instrument, tax = E.state.taxonomy, prof = E.state.profile, eng = E.state.engagement;
  var narr = E.getActiveNarrative();
  var opts = { cafProfileRegistry: E.getCAFProfileRegistry(), cafProfileId: E.getActiveCAFProfileId(),
    cafProfile: E.getActiveCAFProfile(), cafOverlay: E.getActiveCAFOverlay(), targetId: tid };
  A.ExportDOCX.buildAsync(eng, inst, tax, prof, narr, opts, function (err, blob) {
    if (err) { out.textContent = "BUILD ERROR: " + err.message; return; }
    var r = new FileReader();
    r.onload = function () {
      var b64 = String(r.result).replace(/^data:[^,]*,/, "");
      document.getElementById("b64").textContent = b64;
      out.textContent = "DOCX_READY bytes=" + blob.size + " b64len=" + b64.length;
    };
    r.readAsDataURL(blob);
  });
})();
</script>
</body></html>
