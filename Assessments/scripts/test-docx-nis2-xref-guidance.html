<html lang="en"><head><meta charset="utf-8"/><title>NIS2 IEC 62443 guidance in Word and Excel</title></head>
<body>
<!--
  The NIS2 rows in data/shared/cross-references.json are keyed by obligation
  CODE ("GOV.1", "A.1"), but the Word roadmap and the Excel obligations sheet
  looked them up by the obligation's ID ("MA.1"), so the "Relevant
  IEC 62443 guidance" line never printed and the Excel column was blank for
  every NIS2 obligation.

  This builds both deliverables from the NIS2 demo and checks that every
  obligation the data maps carries its guidance, read independently from the
  same table, and that obligations with no row carry none. The NIS2 quick gap
  is the control: its area-level codes ("A", "REP") have no rows of their own,
  and the obligation-level rows must not be stretched to cover them.

  The Excel half depends on the matching fix in js/export-xlsx.js.
-->
<script src="harness.js"></script>
<script>H.app({ xlsx: true, docx: true, tours: ["nis2", "nis2-quick"] }); H.dom();</script>
<script>
function docXml(blob) {
  return blob.arrayBuffer().then(function (buf) {
    var v = new DataView(buf), u8 = new Uint8Array(buf), eocd = -1;
    for (var i = buf.byteLength - 22; i >= 0; i--) { if (v.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
    var n = v.getUint16(eocd + 10, true), p = v.getUint32(eocd + 16, true);
    for (var k = 0; k < n; k++) {
      var method = v.getUint16(p + 10, true), csize = v.getUint32(p + 20, true);
      var nlen = v.getUint16(p + 28, true), xlen = v.getUint16(p + 30, true), clen = v.getUint16(p + 32, true);
      var local = v.getUint32(p + 42, true);
      var name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
      if (name === "word/document.xml") {
        var start = local + 30 + v.getUint16(local + 26, true) + v.getUint16(local + 28, true);
        var data = u8.subarray(start, start + csize);
        var bytes = method === 0 ? Promise.resolve(data)
          : new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
        return bytes.then(function (b) { return new TextDecoder().decode(b); });
      }
      p += 46 + nlen + xlen + clen;
    }
    return "";
  });
}
var W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
function textOf(el) { return Array.prototype.map.call(el.getElementsByTagNameNS(W, "t"), function (t) { return t.textContent; }).join(""); }
// The roadmap entries: each Heading 2 "P<n>  <id> <title>" with the paragraphs under it.
function roadmapEntries(xml) {
  var doc = new DOMParser().parseFromString(xml, "application/xml");
  var body = doc.getElementsByTagNameNS(W, "body")[0], out = [], cur = null;
  Array.prototype.forEach.call(body.children, function (el) {
    var st = el.localName === "p" && el.getElementsByTagNameNS(W, "pStyle")[0];
    var val = st ? st.getAttribute("w:val") : "";
    if (/^Heading[12]$/i.test(val)) {
      var t = textOf(el).trim();
      cur = /^P\d+\s/.test(t) ? { head: t, text: "" } : null;
      if (cur) out.push(cur);
      return;
    }
    if (cur) cur.text += "\n" + textOf(el);
  });
  return out;
}
// The 62443 references the data maps a NIS2 code to, read straight from the table.
function rowsFor(code) {
  var tbl = window.App.Data.shared.crossReferences;
  var rows = Array.isArray(tbl) ? tbl : (tbl.rows || []);
  return rows.filter(function (r) {
    return r.fromStandard === "nis2" && r.fromId === code && r.relationship !== "informative-reference";
  });
}
function idsFor(code) {
  var ids = [];
  rowsFor(code).forEach(function (r) { (Array.isArray(r.toIds) ? r.toIds : [r.toIds]).forEach(function (id) { if (ids.indexOf(id) < 0) ids.push(id); }); });
  return ids;
}
var LABEL = "Relevant IEC 62443 guidance";

function activate(A, E, id, tour) {
  E.on("instrument-changed", function (inst) { if (inst && inst.id === id) tour.apply(E); });
  E.activateInstrument(id);
}
function buildWord(A, E) {
  return new Promise(function (res) {
    A.ExportDOCX.buildAsync(E.state.engagement, E.state.instrument, E.state.taxonomy, E.state.profile,
      E.getActiveNarrative(), { targetId: E.state.activeTargetId }, function (err, blob) { res(err ? null : blob); });
  }).then(function (blob) { return blob ? docXml(blob) : ""; });
}
function obligationsSheet(A, E) {
  var wb = A.ExportXLSX.build(E.state.engagement, E.state.instrument, E.state.taxonomy, E.state.profile, { targetId: E.state.activeTargetId });
  var ws = wb && wb.Sheets && wb.Sheets["Obligations"];
  if (!ws) return [];
  // Read cell by cell: a styled cell keeps its value one level down.
  var grid = [];
  Object.keys(ws).filter(function (k) { return k[0] !== "!"; }).forEach(function (k) {
    var a = XLSX.utils.decode_cell(k), c = ws[k], v = c && c.v;
    if (v && typeof v === "object" && "v" in v) v = v.v;
    (grid[a.r] = grid[a.r] || [])[a.c] = v == null ? "" : String(v);
  });
  for (var r = 0; r < grid.length; r++) { grid[r] = grid[r] || []; for (var c = 0; c < grid[r].length; c++) if (grid[r][c] === undefined) grid[r][c] = ""; }
  return grid;
}

H.test(function (ok, done) {
  window.confirm = function () { return true; }; window.alert = function () {};
  var A = window.App, E = A.Engine;
  E.loadCatalog(); A.UI.init({ autosave: false });
  activate(A, E, "nis2-assessment", A.TourNIS2);
  var inst = E.state.instrument;
  var scored = A.ScoringNIS2.scoreEngagement(E.state.engagement, inst, E.state.profile).perTarget[0].result;
  var roadmap = scored.roadmap || [];
  var mappedGaps = roadmap.filter(function (it) { return idsFor(it.code).length > 0; });
  ok(roadmap.length > 3 && mappedGaps.length > 0,
     "set-up: the demo roadmap has obligations the table maps (" + mappedGaps.length + " of " + roadmap.length + ")");
  ok(rowsFor("MA.1").length === 0 && rowsFor("A.1").length > 0 && rowsFor("A 1").length === 0,
     "set-up: the table keys NIS2 rows by code (A.1), not by id (MA.1)");

  buildWord(A, E).then(function (xml) {
    ok(xml.length > 1000, "the NIS2 Word report builds");
    var entries = roadmapEntries(xml);
    ok(entries.length === roadmap.length, "every roadmap obligation has its entry (" + entries.length + ")");
    roadmap.forEach(function (it) {
      var e = entries.filter(function (x) { return x.head.indexOf(it.code + " " + it.title) >= 0; })[0];
      var ids = idsFor(it.code);
      if (!e) { ok(false, it.code + ": roadmap entry found"); return; }
      var line = (e.text.split("\n").filter(function (l) { return l.indexOf(LABEL) === 0; })[0]) || "";
      if (ids.length) {
        ok(line !== "" && ids.every(function (id) { return line.indexOf(id) >= 0; }),
           it.code + ": the Word roadmap gives the 62443 guidance the table maps (" + ids.join(", ") + ")", line);
      } else {
        ok(line === "", it.code + ": no guidance line where the table has no row", line);
      }
    });

    // ---- Excel: the obligations register carries the same guidance ----
    var rows = obligationsSheet(A, E);
    var head = rows[0] || [];
    var col = head.indexOf(LABEL), titleCol = head.indexOf("Obligation");
    ok(col >= 0 && titleCol >= 0, "the Excel obligations sheet has a guidance column", head.join(" | "));
    var mappedItems = (scored.perItem || []).filter(function (it) { return idsFor(it.code).length > 0; });
    var filled = 0;
    mappedItems.forEach(function (it) {
      var r = rows.filter(function (x) { return x[titleCol] === it.title; })[0];
      var cellV = r ? String(r[col] || "") : "";
      if (cellV && idsFor(it.code).every(function (id) { return cellV.indexOf(id) >= 0; })) filled++;
      else ok(false, it.code + ": the Excel guidance cell gives what the table maps", cellV || "(blank)");
    });
    ok(mappedItems.length > 10 && filled === mappedItems.length,
       "Excel: every mapped obligation carries its guidance (" + filled + " of " + mappedItems.length + ")");
    var unmapped = (scored.perItem || []).filter(function (it) { return idsFor(it.code).length === 0; });
    ok(unmapped.every(function (it) {
      var r = rows.filter(function (x) { return x[titleCol] === it.title; })[0];
      return r && String(r[col] || "") === "";
    }), "Excel: and an obligation with no row carries none (" + unmapped.map(function (x) { return x.code; }).join(", ") + ")");

    // ---- Control: the NIS2 quick gap has no rows at its granularity ----
    activate(A, E, "nis2-quick-gap", A.TourNIS2Quick);
    return buildWord(A, E);
  }).then(function (xml) {
    ok(E.state.instrument.id === "nis2-quick-gap", "control: the quick gap is active");
    var q = A.ScoringNIS2.scoreEngagement(E.state.engagement, E.state.instrument, E.state.profile).perTarget[0].result;
    ok((q.roadmap || []).length > 0, "control: the quick gap demo has a roadmap");
    // The lookup key is the item's code ("GOV", "A", "REP"). Two quick-gap ids,
    // GOV.1 and REP.1, spell the same as full-assessment codes, which is why the
    // id is never used while a code is there.
    ok((q.perItem || []).every(function (it) { return it.code && idsFor(it.code).length === 0; }),
       "control: every quick-gap item has a code, and no row in the table is keyed to one");
    ok(xml.length > 1000 && xml.indexOf(LABEL) === -1,
       "control: so its Word roadmap prints no guidance rather than borrowing the obligation-level rows");
  }).then(done, function (e) { ok(false, "threw: " + (e && e.message)); done(); });
});
</script>
</body></html>
