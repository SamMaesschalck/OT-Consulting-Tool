<html lang="en"><head><meta charset="utf-8"/><title>Word report style, every instrument</title></head>
<body>
<!--
  The Word reports carry text from two places: the narrative packs (guarded by
  test-narrative-style.html) and fixed wording written into export-docx.js
  itself (cover banners, methodology bullets, captions, red prompts). This
  builds the real Word document for every instrument, opens it, and checks
  every body paragraph against the house style: no em or en dash (an ordinary
  spaced hyphen is fine). Table cells are left out, because a lone dash is the
  house placeholder for an empty cell.
-->
<script src="harness.js"></script>
<script>H.app({ xlsx: true, docx: true }); H.dom();</script>
<script>
function unzipText(blob) {
  return blob.arrayBuffer().then(function (buf) {
    var v = new DataView(buf), u8 = new Uint8Array(buf), eocd = -1;
    for (var i = buf.byteLength - 22; i >= 0; i--) { if (v.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
    if (eocd < 0) throw new Error("not a zip");
    var n = v.getUint16(eocd + 10, true), p = v.getUint32(eocd + 16, true), jobs = [];
    for (var k = 0; k < n; k++) {
      var method = v.getUint16(p + 10, true), csize = v.getUint32(p + 20, true);
      var nlen = v.getUint16(p + 28, true), xlen = v.getUint16(p + 30, true), clen = v.getUint16(p + 32, true);
      var local = v.getUint32(p + 42, true);
      var name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
      var start = local + 30 + v.getUint16(local + 26, true) + v.getUint16(local + 28, true);
      var data = u8.subarray(start, start + csize);
      jobs.push((function (name, method, data) {
        var bytes = method === 0 ? Promise.resolve(data)
          : new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer().then(function (b) { return new Uint8Array(b); });
        return bytes.then(function (b) { return { name: name, text: /\.(xml|rels)$/.test(name) ? new TextDecoder().decode(b) : "" }; });
      })(name, method, data));
      p += 46 + nlen + xlen + clen;
    }
    return Promise.all(jobs);
  });
}

// Body paragraphs of word/document.xml, with every table removed first.
function bodyParagraphs(xml) {
  var noTables = xml.replace(/<w:tbl>[\s\S]*?<\/w:tbl>/g, "");
  return (noTables.match(/<w:p[ >][\s\S]*?<\/w:p>/g) || []).map(function (p) {
    return (p.match(/<w:t(?: [^>]*)?>([^<]*)<\/w:t>/g) || []).map(function (t) { return t.replace(/<[^>]+>/g, ""); }).join("")
      .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, "\"").replace(/&apos;/g, "'");
  }).filter(function (s) { return s.trim(); });
}

H.test(function (ok, done) {
  window.confirm = function () { return true; }; window.alert = function () {};
  var A = window.App, E = A.Engine;
  A.Charts.svgToPngBlob = function (svg, s, cb) { cb(new Blob(["png"])); };
  E.loadCatalog(); A.UI.init({ autosave: false });

  function problems(s) {
    var f = [];
    if (/—/.test(s)) f.push("em dash");
    if (/–/.test(s)) f.push("en dash");
    return f;
  }
  ok(problems("Capability assessment — not a certification").length === 1 && problems("Capability assessment - not a certification").length === 0,
     "the check catches an em dash and lets a normal spaced hyphen through");

  var list = E.state.instruments.filter(function (i) { return i.status !== "placeholder"; });
  var chain = Promise.resolve(), checked = 0;
  list.forEach(function (i0) {
    chain = chain.then(function () {
      E.activateInstrument(i0.id);
      E.updateMetadata({ clientName: "Style Check Ltd" });
      var opts = {
        cafProfileRegistry: E.getCAFProfileRegistry ? E.getCAFProfileRegistry() : null,
        cafProfileId: E.getActiveCAFProfileId ? E.getActiveCAFProfileId() : null,
        cafProfile: E.getActiveCAFProfile ? E.getActiveCAFProfile() : null,
        cafOverlay: E.getActiveCAFOverlay ? E.getActiveCAFOverlay() : null,
        targetId: E.state.activeTargetId
      };
      return new Promise(function (res) {
        A.ExportDOCX.buildAsync(E.state.engagement, E.state.instrument, E.state.taxonomy, E.state.profile,
          E.getActiveNarrative ? E.getActiveNarrative() : null, opts, function (err, blob) { res(err ? null : blob); });
      }).then(function (blob) {
        if (!blob) { ok(false, i0.id + ": the Word document builds"); return; }
        return unzipText(blob).then(function (parts) {
          var doc = parts.filter(function (p) { return p.name === "word/document.xml"; })[0];
          var paras = doc ? bodyParagraphs(doc.text) : [];
          checked++;
          var bad = paras.map(function (s) { return { s: s, p: problems(s) }; }).filter(function (x) { return x.p.length; });
          ok(paras.length > 10 && bad.length === 0, i0.id + ": " + paras.length + " body paragraphs, no dashes",
             bad.slice(0, 3).map(function (x) { return x.p.join(", ") + " in: " + x.s.slice(0, 110); }).join(" | "));
        });
      });
    });
  });
  chain.then(function () {
    ok(checked >= 18, "every instrument's Word document was opened and checked (" + checked + ")");
    done();
  }, function (e) { ok(false, "threw: " + (e && e.message)); done(); });
});
</script>
</body></html>
