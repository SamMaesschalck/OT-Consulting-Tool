<body>
<pre id="out">running...</pre>
<!--
  The 3-2 fixes, step 2 (transfer has a page of its own, test-risk-transfer.html):
  - Unmitigated means before any cyber security countermeasure: built-in and
    non-cyber protection still counts (the hint, the hard rule on About,
    Word and Excel).
  - Separating business and control system assets is a requirement: not
    separated reads as a departure (zones page, step 6, Word, Excel, its
    warning); the recommendations keep their neutral words, and safety
    related assets kept together make the whole zone safety related.
  - The threat environment: sources of threat intelligence, current and
    emerging threats (step 2, step 6, Word and the specification), with a
    warning when it names no source.
  - Zone and conduit characteristics: a conduit's as a zone's, the applicable
    security requirements of each, an asset's classification and business
    value (Word, step 6, Excel, the register), all optional.
  - The specification's mandatory security countermeasures (step 6's first
    block, the specification file), and the ZCR 6.1 block in the lookup.
  - A zone or conduit assessed in detail with no vulnerability warns; the
    other depths are exempt.
  - Wording: the lookup's verified note, About; the method said once in Word;
    the approval says what it does not cover; the demo's ranking notes; a
    high-level-only decision named as the house method.
-->
<iframe id="f" style="width:1440px;height:900px;visibility:hidden"></iframe>
<script src="../data/tour-project.js"></script>
<script src="fixtures/v0.7.0-migrate.js"></script>
<script src="fixtures/tour-v0.7-saved.js"></script>
<script>
(function () {
  "use strict";
  var lines = [], failures = 0;
  function ok(cond, name, detail) { if (cond) lines.push("PASS " + name); else { failures++; lines.push("FAIL " + name + (detail ? " — " + detail : "")); } }
  function done() { lines.push(""); lines.push(failures === 0 ? "ALL TESTS PASSED" : failures + " TEST(S) FAILED"); document.getElementById("out").textContent = lines.join("\n"); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
  var DASH = /[–—]/;
  function paragraphsOf(xml) {
    var out = [], re = /<w:p[ >][\s\S]*?<\/w:p>/g, m;
    while ((m = re.exec(xml))) {
      var t = (m[0].match(/<w:t(?: [^>]*)?>[^<]*<\/w:t>/g) || []).map(function (x) { return x.replace(/<[^>]+>/g, ""); }).join("");
      if (t.replace(/\s+/g, "")) out.push(t.replace(/&apos;/g, "'").replace(/&quot;/g, "\"").replace(/&amp;/g, "&"));
    }
    return out;
  }

  var frame = document.getElementById("f");
  frame.onload = function () {
    var w = frame.contentWindow, tries = 0;
    var t = setInterval(function () {
      if (!w.RiskTool || !w.RiskExports || !w.RiskReview || !w.docx || !w.ExcelJS || !w.App.DocxBlocks || !w.RiskTool.state.project.zones.length) { if (++tries > 400) { clearInterval(t); ok(false, "the app exposed RiskTool with the demo"); done(); } return; }
      clearInterval(t);
      var r = null;
      try { r = run(w); } catch (e) { failures++; lines.push("FAIL exception: " + (e && e.message) + "\n" + (e && e.stack)); }
      if (r && typeof r.then === "function") r.then(done, function (e) { failures++; lines.push("FAIL async exception: " + (e && e.message) + "\n" + (e && e.stack)); done(); });
      else done();
    }, 50);
  };
  frame.src = "../index.html?tour=1";

  function run(w) {
    var RT = w.RiskTool, M = w.RiskApp.Model, E = w.RiskApp.Engine, MG = w.RiskApp.Migrate, RX = w.RiskExports, DB = w.App.DocxBlocks, AS = w.RiskApp.Assets, d = w.document;
    RT.setToday("2026-11-14"); // a fixed today: what is built from the demo must not change with the real date
    w.confirm = function () { return true; }; w.alert = function () {};
    var DEMO = window.SPT_TOUR_PROJECT, FX = window.RiskFixtures;
    function main() { return d.getElementById("main"); }
    function P() { return RT.state.project; }
    function load(p) { RT.loadProjectText(JSON.stringify(p)); }
    function ownerIn(p, id) { return p.zones.concat(p.conduits).filter(function (o) { return o.id === id; })[0]; }
    function type(el, v) { el.focus(); el.value = v; el.dispatchEvent(new w.Event("input", { bubbles: true })); el.dispatchEvent(new w.Event("change", { bubbles: true })); }
    function texts(p) { return E.completeness(p).map(function (i) { return i.text; }); }
    function has(list, re) { return list.some(function (x) { return re.test(x); }); }
    function fieldIn(scope, label) {
      var f = [].filter.call(scope.querySelectorAll(".field"), function (x) { var l = x.querySelector("label"); return l && l.textContent === label; })[0];
      return f ? f.querySelector("input, textarea, select") : null;
    }
    function after(list, s, from) { var i = list.indexOf(s, from || 0); return i < 0 ? [] : list.slice(i + 1); }
    function wordParas(p, opts) {
      return w.docx.Packer.toBlob(RX.buildWordDoc(p, opts || {})).then(function (b) { return DB.unzip(b); }).then(function (parts) {
        return paragraphsOf(new w.TextDecoder().decode(parts.filter(function (x) { return x.name === "word/document.xml"; })[0].bytes));
      });
    }
    function sheetRows(wb, name) { var out = []; wb.getWorksheet(name).eachRow(function (r) { var row = []; r.eachCell({ includeEmpty: true }, function (c) { row.push(c.value == null ? "" : String(c.value)); }); out.push(row); }); return out; }

    var base = MG.normaliseProject(clone(DEMO));
    var df, hl, nv;
    ok(E.completeness(base).length === 0, "the demo has nothing open", texts(base).join(" | "));

    // ---- 1. unmitigated: before any cyber security countermeasure ------------------------------
    ok(M.RULES.hardRules.some(function (r) { return /before any cyber security countermeasure\. Countermeasures built into the components still count, and so does protection outside cyber security, such as controlled site access, hardwired interlocks and relief devices\./.test(r); }) &&
      !M.RULES.hardRules.some(function (r) { return /before any countermeasure/.test(r); }), "the hard rule: before any cyber security countermeasure, built-in and non-cyber protection still counting");

    // ---- 2. separating business and control system assets -------------------------------------
    var sp = clone(base), z1 = ownerIn(sp, "Z1");
    z1.assets.push({ id: "AS90", name: "Production reporting PC", type: "business" });
    var rows = E.separationRows(z1, sp), br = rows.filter(function (r) { return r.id === "business"; })[0];
    ok(br && br.required && !br.departure && br.open && has(texts(sp), /^Z1 \(Unit 300 BPCS\): it is not recorded whether business and control system assets are kept separate\.$/), "a business system beside control system assets raises the row, a requirement, to answer");
    z1.separation.business = { answer: "not-separated", reason: "" };
    br = E.separationRows(z1, sp).filter(function (r) { return r.id === "business"; })[0];
    ok(br.departure && has(texts(sp), /^Z1 \(Unit 300 BPCS\): business and control system assets are not kept separate\. The standard requires the separation, and no justification is recorded\.$/), "not separated with no justification: the warning says it departs from a requirement", texts(sp).join(" | "));
    var z4 = ownerIn(sp, "Z4"); z4.separation.temporary.reason = "";
    ok(has(texts(sp), /^Z4 \(Engineering workstations\): temporarily connected devices are not kept separate and no reason is recorded\.$/), "a recommendation keeps its neutral warning");
    z1.separation.business.reason = "The reporting PC is being moved to the DMZ at the next outage.";
    z4.separation.temporary.reason = DEMO.zones[3].separation.temporary.reason;
    ok(!has(texts(sp), /kept separate/), "with the justification, nothing is open, yet the row is still a departure", texts(sp).join(" | "));
    var safeZ = clone(base), z2 = ownerIn(safeZ, "Z2"); z2.assets.push({ id: "AS91", name: "Shared PLC", type: "plc" });
    z2.separation = { safety: { answer: "not-separated", reason: "One PLC is shared until the upgrade." } };
    var sr = E.separationRows(z2, safeZ).filter(function (r) { return r.id === "safety"; })[0];
    ok(sr && sr.wholeZone && !sr.departure, "safety related assets kept with others: the whole zone is safety related, not a departure");

    return wordParas(sp, {}).then(function (det) {
      ok(det.indexOf("Business and control system assets are not kept separate. IEC 62443-3-2 requires this separation. The reporting PC is being moved to the DMZ at the next outage.") > 0, "Word: not separated reads as a departure from a requirement, with the justification");
      ok(det.indexOf("Temporarily connected devices are not kept separate. " + DEMO.zones[3].separation.temporary.reason) > 0, "the recommendations keep their neutral words");
      var xs = sheetRows(RX.buildWorkbook(sp), "Zones"), col = xs[0].indexOf("Separation not in place"), r1 = xs.filter(function (r) { return r[0] === "Z1"; })[0];
      ok(/^Business and control system assets \(a departure from IEC 62443-3-2\): The reporting PC/.test(r1[col]), "Excel: the departure is named", r1[col]);
      return wordParas(safeZ, {});
    }).then(function (det) {
      ok(det.indexOf("Safety related assets are not kept separate, so the whole zone is treated as safety related. One PLC is shared until the upgrade.") > 0, "Word: safety related assets kept together make the whole zone safety related");

      // ---- 3. the threat environment --------------------------------------------------------
      ok(M.listOf(base.srs.threatSources).length === 4 && M.listOf(base.srs.emergingThreats).length === 2, "the demo names its sources of threat intelligence and its emerging threats");
      var ns = clone(base); delete ns.srs.threatSources;
      ok(has(texts(ns), /^Requirements specification: no source of threat intelligence is recorded\.$/) && E.completeness(ns).filter(function (i) { return /no source of threat intelligence/.test(i.text); })[0].target.id === "threats",
        "a threat environment with no source warns, aimed at its block");
      ns.srs.knownThreats = []; ns.srs.adversaryClass = null;
      ok(has(texts(ns), /^Requirements specification: no assumed adversary, known threats or source of threat intelligence are recorded\.$/), "with nothing at all, one warning says both");
      ok(E.specBlocks(base).filter(function (b) { return b.id === "threats"; })[0].done, "the demo's block is done");
      var odd = clone(base); odd.srs.threatSources = "NCSC"; odd.srs.emergingThreats = ["x", 3, ""];
      var on = MG.normaliseProject(odd);
      ok(!("threatSources" in on.srs) && same(on.srs.emergingThreats, ["x"]), "the migration tidies the two lists, never adds them");
      ok(!("threatSources" in MG.normaliseProject(clone(FX["tour-v0.7-saved"])).srs), "and a v0.7 file gains neither");
      return wordParas(base, {});
    }).then(function (det) {
      var te = after(det, "Threat environment", det.indexOf("System under consideration and requirements"));
      ok(te[0] === "Assumed adversary: SL3-grade" && te[1] === "Sources of threat intelligence" && te[2] === DEMO.srs.threatSources[0] && te.indexOf("Current threats, known or presumed") === 6 && te.indexOf("Emerging threats") === 11 && te[12] === DEMO.srs.emergingThreats[0],
        "Word: Threat environment, with the adversary, the sources, the current and the emerging threats", te.slice(0, 14).join(" | "));
      ok(M.sectionKeyAlias("known-or-presumed-threats") === "threat-environment", "the old section key maps to the new one");
      // 1. unmitigated, in Word.
      ok(det.some(function (x) { return /^Of the \d+ threats above tolerable risk before any cyber security countermeasure, /.test(x); }) && det.some(function (x) { return /^Each threat scenario is rated before any cyber security countermeasure \(unmitigated\).*The unmitigated rating still counts countermeasures built into the components and protection that is not cyber security, such as controlled site access, hardwired interlocks and relief devices./.test(x); }),
        "Word: unmitigated means before any cyber security countermeasure");
      ok(!det.some(function (x) { return /before any countermeasure/.test(x); }) && !DASH.test(det.join("\n")), "and never before any countermeasure; no dashes");
      // 5. characteristics in Word.
      var c1 = after(det, "C1: Historian replication", det.indexOf("Zone and conduit characteristics"));
      function row(list, label) { var i = list.indexOf(label); return i < 0 ? null : list[i + 1]; }
      ok(row(c1, "Accountable organisation") === "Acme Petrochemicals, OT network team" && /^From the BPCS OPC UA server/.test(row(c1, "Logical boundary")) && row(c1, "Safety designation") === "Not safety related" &&
        /^OPC UA broker service/.test(row(c1, "Logical access points")) && row(c1, "Physical access points") && row(c1, "Data flows") && row(c1, "Security policies") && row(c1, "Assumptions") && row(c1, "External dependencies"),
        "Word: a conduit's characteristics table, as a zone's", c1.slice(0, 30).join(" | "));
      ok(/^IEC 62443-3-3 system requirements and requirement enhancements at its SL-T; Acme OT security standard GS-104, section 7/.test(row(c1, "Applicable security requirements")), "with its applicable security requirements");
      var z1w = after(det, "Z1: Unit 300 BPCS", det.indexOf("Zone and conduit characteristics"));
      ok(/^IEC 62443-3-3 system requirements/.test(row(z1w, "Applicable security requirements")), "and a zone's");
      // 9. the method said once.
      var wr = det.filter(function (x) { return /^The assessment follows IEC 62443-3-2\. /.test(x); })[0];
      ok(/ Its initial risk is above the tolerable risk, so every zone and conduit was assessed, at the depth shown under Risk comparison\. Threats were rated/.test(wr) && !/compared once/.test(wr), "the summary keeps one line of outcome", wr);
      var ml = after(det, "Method and limitations");
      ok(ml.indexOf("The comparison with the tolerable risk, and the depth each zone and conduit was assessed at, are under Risk comparison.") >= 0 && !det.some(function (x) { return /compared once with the tolerable risk/.test(x); }), "Method and limitations refers back in one sentence");
      ok(det.filter(function (x) { return /^The initial risk of the system under consideration is High/.test(x); }).length === 1, "the full statement is under Risk comparison, once");
      ok(det.indexOf("Mandatory security countermeasures") < 0, "the detailed report does not print the specification's countermeasure list (its treatment plan has them)");
      // 9. the demo's ranking notes.
      ok(det.some(function (x) { return x === "The primary control layer. Its loss forces a manual shutdown, and its manipulation is the path to an acid release. Assigned to Z1 and assessed in detail."; }) &&
        /* step 5: the outside-the-SUC mark is the ranking's own, so the note no longer says it */ det.some(function (x) { return /^Commodity IP equipment that is often probed but has no process consequence. It is ranked low\.$/.test(x); }) && det.indexOf("Outside the SUC") > 0 &&
        !det.some(function (x) { return /where a detailed assessment is required|not taken to a detailed assessment/.test(x); }), "the demo's ranking notes fit the model: assessed in detail, or outside the SUC");
      return wordParas(base, { spec: true });
    }).then(function (spec) {
      // 6. the specification's mandatory countermeasures.
      var mc = RT.mandatoryCountermeasures(base);
      ok(mc.length > 0 && mc.every(function (e) { return base.zones.concat(base.conduits).some(function (o) { return o.threats.some(function (t) { return e.threats.indexOf(t.id) >= 0 && (t.treatment.decision === "reduce" || t.treatment.decision === "slt") && t.treatment.confirmed; }); }); }),
        "the mandatory countermeasures are those the confirmed decisions to reduce a risk (and, step 5, to treat it through the SL-T) rest on", mc.map(function (e) { return e.owner.id + "/" + e.m.id; }).join());
      var at = spec.indexOf("Mandatory security countermeasures"), sl = spec.indexOf("Target security levels (SL-T, per foundational requirement)");
      ok(at > sl && at < spec.indexOf("Sign-off"), "the specification prints them after the SL-T, before the sign-off");
      var sec = spec.slice(at + 1);
      ok(/^Under the house reading, a countermeasure is mandatory when a decision to reduce a risk, or to treat it through the SL-T programme, rests on it\./.test(sec[0]) && sec.slice(1, 6).join("|") === "Countermeasure|Zone or conduit|In place or planned|Owner and due date|SR references", "with what they are and a table", sec.slice(0, 6).join(" | "));
      var e0 = mc[0];
      ok(sec.indexOf(e0.m.id + "  " + e0.m.description) > 0 && sec.indexOf(e0.m.existing ? "In place" : "Planned") > 0, "each one, by id, with its zone and whether in place or planned");
      ok(!DASH.test(spec.join("\n")), "no dashes");
      // The lookup.
      var Z = w.App.Data.zcrMap;
      ok(Object.keys(Z.specBlocks).filter(function (k) { return k.charAt(0) !== "_"; })[0] === "countermeasures" && Z.specBlocks.countermeasures === "ZCR 6.1" && RT.zcrOf("ZCR 6.1"), "the lookup has the ZCR 6.1 block, first");
      var none = clone(base); none.zones.concat(none.conduits).forEach(function (o) { o.threats.forEach(function (t) { if (t.treatment.decision === "reduce" || t.treatment.decision === "slt") M.setDecision(t, "accept", true); }); });
      ok(RT.mandatoryCountermeasures(none).length === 0, "with no decision to reduce (or, step 5, to treat through the SL-T), none is mandatory");
      // A justification that names a mandatory countermeasure is not flagged; one that names another still is.
      var jp = clone(base), mid = e0.m.id, other = null;
      jp.zones.concat(jp.conduits).forEach(function (o) { (o.countermeasures || []).forEach(function (m) { if (!other && !mc.some(function (e) { return e.m.id === m.id; })) other = m.id; }); });
      ownerIn(jp, "Z1").justification = "Rests on " + mid + (other ? " and " + other : "") + ".";
      var jt = E.completeness(jp).filter(function (i) { return /the justification names/.test(i.text); }).map(function (i) { return i.text; });
      ok(!jt.some(function (x) { return x.indexOf(mid) >= 0; }) && (!other || jt.some(function (x) { return x.indexOf(other) >= 0; })), "a justification naming a mandatory countermeasure is not flagged; another still is", jt.join(" | ") + " / " + other);

      // ---- 7. vulnerabilities ------------------------------------------------------------------
      nv = clone(base); ownerIn(nv, "Z3").vulnerabilities = [];
      var it = E.completeness(nv).filter(function (i) { return /no vulnerabilities recorded/.test(i.text); });
      ok(it.length === 1 && it[0].text === "Z3 (Plant DMZ & historian) has no vulnerabilities recorded." && it[0].stage === "risk" && it[0].target.part === "vulns", "a zone assessed in detail with no vulnerability warns, aimed at its vulnerabilities", JSON.stringify(it));
      ownerIn(nv, "Z3").vulnerabilities = [{ id: "V9", description: "  ", reference: "" }];
      ok(has(texts(nv), /^Z3 .* has no vulnerabilities recorded\.$/), "an empty one does not count");
      var ex = clone(base);
      ["proportionate", "grouped", "reused", "deferred"].forEach(function (dp) {
        var z = ownerIn(ex, "Z3"); z.vulnerabilities = []; z.assessment = { depth: dp, withId: dp === "grouped" ? "Z1" : "", reuseSource: "RD-1", considered: "x", reason: "later" };
        ok(!has(texts(ex), /^Z3 .*no vulnerabilities/), dp + " is exempt");
      });

      // ---- 8. wording ------------------------------------------------------------------------
      ok(/requirement wording of clauses 3 and 4/.test(Z.verified.confirmed) && Z.verified.on === "2026-11-26" && Z.verified.houseReading.some(function (h) { return /transferring it/.test(h); }) && Z.verified.houseReading.some(function (h) { return /mandatory/.test(h); }),
        "the lookup's note: the wording checked, and the new house readings listed");

      // ---- 9. the approval says what it does not cover ----------------------------------------
      df = clone(base); var z5 = M.emptyZone(5); z5.name = "Packaging line"; z5.assessment = { depth: "deferred", withId: "", reuseSource: "", considered: "", reason: "Not reachable until the 2027 outage." }; df.zones.push(z5);
      var sig = RX.signOffTexts(df);
      ok(/ It does not cover Z5, deferred to a later assessment\.$/.test(sig[2]) && / It does not cover Z5, deferred to a later assessment\.$/.test(sig[6]) && !/does not cover/.test(RX.signOffTexts(base)[2]),
        "the approval sentence says it does not cover a deferred zone, in the report and the specification", sig[2]);
      // A high-level-only assessment: its per-system decision is the house method.
      hl = clone(base); hl.assessmentType = "high-level";
      return wordParas(hl, { highLevelOnly: true });
    }).then(function (hlw) {
      ok(hlw.indexOf("Under the house method, each system's own comparison with the tolerable risk decides whether it goes forward to a detailed assessment. IEC 62443-3-2 compares the initial risk of the system under consideration as a whole.") > 0,
        "high-level only: the decision per system is the house method, never the standard's rule");

      // ---- the screens ------------------------------------------------------------------------
      load(base);
      // 1. the hint and About.
      RT.navigate("about");
      var um = main().querySelector('[data-method="unmitigated"]'), dm = main().querySelector('[data-method="decisions"]');
      ok(!!um && /before any cyber security countermeasure/.test(um.textContent) && /built into the components still count\. So does protection outside cyber security, such as controlled site access, hardwired interlocks and relief devices/.test(um.textContent)
, "About: unmitigated, as the standard means it");
      ok(!!dm && /transferred to another party/.test(dm.textContent) && /Treating a risk through the SL-T programme is a house method/.test(dm.textContent), "About: the four decisions, the SL-T programme as the house option");
      ok(/requirement wording against the published edition/.test(main().textContent) && /Unmitigated risk is impact × likelihood, rated before any cyber security countermeasure\./.test(main().textContent), "About: the wording checked, and the hard rule");
      // 4. step 2's fields.
      RT.navigate("srs");
      var src = main().querySelector('[data-field-block="threat-sources"] textarea'), em = main().querySelector('[data-field-block="emerging-threats"] textarea');
      ok(!!src && !!em && src.value.split("\n").length === 4 && fieldIn(main(), "Current threats, known or presumed"), "step 2 asks for the sources, the current and the emerging threats");
      type(src, ""); ok(!("threatSources" in P().srs), "cleared, the field goes from the file");
      type(src, "NCSC advisories"); ok(same(P().srs.threatSources, ["NCSC advisories"]), "typed, it is written");
      RT.navigate("spec");
      var tb = main().querySelector('[data-spec="threats"]');
      ok(/NCSC advisories/.test(tb.querySelector('[data-threat-list="sources"]').textContent) && /Ransomware groups targeting remote access/.test(tb.querySelector('[data-threat-list="emerging"]').textContent) && tb.querySelector('[data-threat-list="current"] li'), "step 6's threat environment lists all three");
      // 6. step 6's first block.
      var cb = main().querySelector('[data-spec="countermeasures"]');
      ok(main().querySelector("[data-spec]") === cb && cb.querySelector(".card-h h2").textContent === "Mandatory security countermeasures" && cb.querySelectorAll("[data-mandatory] tbody tr").length === RT.mandatoryCountermeasures().length && cb.querySelector('[data-action="spec-goto-risk"]'),
        "step 6 opens with the mandatory security countermeasures, each listed, with a link to step 5");
      ok(cb.querySelector(".spec-status").getAttribute("data-status") === "done", "done on the demo");
      // 5. the characteristics on step 6.
      var cht = main().querySelector('[data-spec="characteristics"]');
      ok(/^IEC 62443-3-3 system requirements/.test(cht.querySelector('[data-sec-req="Z1"]').textContent) && /^IEC 62443-3-3 system requirements/.test(cht.querySelector('[data-sec-req="C2"]').textContent), "step 6: the security requirements of each zone and conduit");
      // 5. the conduit's and zone's panels on step 3.
      RT.navigate("zones");
      main().querySelector('[data-conduit-row="C3"]').click();
      var det = main().querySelector('[data-detail="conduit"]');
      ["Accountable organisation", "Logical boundary", "Physical boundary", "Logical access points", "Physical access points", "Data flows", "External dependencies", "Applicable security policies", "Assumptions", "Applicable security requirements"].forEach(function (lb) {
        ok(!!fieldIn(det, lb), "the conduit's panel has " + lb.toLowerCase());
      });
      var sf = det.querySelector('[data-action="conduit-safety"]');
      ok(!!sf && !sf.checked, "and its safety designation");
      sf.click();
      ok(RT.state.project.conduits[2].safetyRelated === true, "ticked, it is recorded");
      det = main().querySelector('[data-detail="conduit"]');
      type(fieldIn(det, "Accountable organisation"), "");
      ok(!("accountableOrg" in P().conduits[2]), "a field cleared goes from the file");
      main().querySelector('[data-zone-row="Z2"]').click();
      var zd = main().querySelector('[data-detail="zone"]'), srq = fieldIn(zd, "Applicable security requirements");
      ok(!!srq && /^IEC 62443-3-3 system requirements/.test(srq.value), "a zone's panel has its applicable security requirements");
      // 2. the departure on step 3.
      var zp = clone(base); ownerIn(zp, "Z2").assets.push({ id: "AS92", name: "Maintenance laptop", type: "business" });
      load(zp); RT.navigate("zones"); main().querySelector('[data-zone-row="Z2"]').click();
      zd = main().querySelector('[data-detail="zone"]');
      zd.querySelector('[data-separation="business:not-separated"]').click();
      zd = main().querySelector('[data-detail="zone"]');
      var dep = zd.querySelector('[data-departure="business"]'), rin = zd.querySelector('[data-reason="sep-business"]');
      ok(!!dep && dep.textContent === "This departs from a requirement of the standard. Give the justification." && rin.getAttribute("placeholder") === "Why not, and what makes up for it", "step 3: not separated reads as a departure, asking for the justification");
      type(rin, "The laptop moves to a maintenance zone at the next outage.");
      RT.render();
      ok(main().querySelector('[data-detail="zone"] [data-departure="business"]').textContent === "This departs from a requirement of the standard.", "justified, it is still said to be a departure");
      // (A business system in the safety zone raises the safety row too: answered, nothing is open.)
      main().querySelector('[data-detail="zone"] [data-separation="safety:met"]').click();
      ok(!!main().querySelector('[data-zone-row="Z2"] [data-departure="zone"]') || /departure/.test(main().querySelector('[data-zone-row="Z2"]').textContent), "and the zone's row says so");
      RT.navigate("spec");
      ok(/a departure from the standard/.test(main().querySelector('[data-spec="characteristics"]').textContent), "step 6 says so too");
      // 5. the asset register: classification and business value.
      load(base);
      var a = P().zones[0].assets[0];
      AS.setField(a, "classification", "Process control"); AS.setField(a, "businessValue", "high");
      ok(a.classification === "Process control" && a.businessValue === "high" && M.assetExtended(a), "an asset takes a classification and a business value");
      AS.setField(a, "businessValue", "huge");
      ok(!("businessValue" in a), "a business value not on the scale is not kept");
      AS.setField(a, "businessValue", "medium");
      RT.navigate("zones"); main().querySelector('.step-tabs [data-tab="assets"]').click();
      var head = [].map.call(main().querySelectorAll("table thead th"), function (th) { return th.textContent; });
      ok(head.indexOf("Classification") > head.indexOf("Criticality") && head.indexOf("Business value") === head.indexOf("Classification") + 1, "the register shows both, after the criticality", head.join("|"));
      var bv = main().querySelector('[data-asset-id="' + a.id + '"] [data-asset-field="businessValue"]');
      ok(!!bv && bv.value === "medium" && [].map.call(bv.options, function (o) { return o.value; }).join() === ",high,medium,low", "the business value is a short scale");
      var pa = MG.normaliseProject(clone(P())), za = pa.zones[0].assets[0];
      ok(za.classification === "Process control" && za.businessValue === "medium", "kept through the migration");
      var oa = clone(P()); oa.zones[0].assets[0].classification = 5; oa.zones[0].assets[0].businessValue = "x";
      var na = MG.normaliseProject(oa).zones[0].assets[0];
      ok(!("classification" in na) && !("businessValue" in na), "and tidied when not usable");
      var ctx = RT.buildRiskContext(P());
      ok(!("classification" in ctx.zones[0].assets[0]) && !("businessValue" in ctx.zones[0].assets[0]), "the risk context does not carry them (its asset fields are fixed)");
      var xa = sheetRows(RX.buildWorkbook(P()), "Assets"), ci = xa[0].indexOf("Classification"), bi = xa[0].indexOf("Business value");
      ok(ci > 0 && bi === ci + 1 && xa[1][ci] === "Process control" && xa[1][bi] === "Medium", "Excel: the Assets sheet has both");
      var xc = sheetRows(RX.buildWorkbook(P()), "Conduits"), si = xc[0].indexOf("Applicable security requirements"), ai = xc[0].indexOf("Accountable organisation");
      ok(si > 0 && ai > 0 && /^IEC 62443-3-3/.test(xc[1][si]) && xc[1][ai] === "Acme Petrochemicals, OT network team", "Excel: the Conduits sheet carries the characteristics");
      // The released v0.7.0 normaliser keeps every new field.
      var OLD = FX["v0.7.0-migrate"](M, E), viaOld = OLD.normaliseProject(clone(P()));
      ok(same(viaOld.srs.threatSources, P().srs.threatSources) && same(viaOld.conduits[0].dataFlows, P().conduits[0].dataFlows) && viaOld.zones[0].assets[0].businessValue === "medium" && same(viaOld.zones[0].securityRequirements, P().zones[0].securityRequirements),
        "the released v0.7.0 normaliser keeps every new field");
      // 9. step 7 and step 2 (high-level only).
      load(df); RT.navigate("approval");
      ok(main().querySelector('[data-covers="deferred"]').textContent === "The approval does not cover Z5, deferred to a later assessment." && /asset owner's managers accountable for the process the SUC controls/.test(main().querySelector('[data-hint="approvers"]').textContent),
        "step 7 says what the approval does not cover, and who approves");
      load(hl); RT.navigate("srs");
      ok(/use the house method to decide which go forward to a detailed assessment/.test(main().querySelector(".page-sub").textContent), "high-level only: step 2 names the decision as the house method");
      // 7. Go to on a vulnerability item opens the list.
      load(nv); RT.navigate("review");
      var li = [].filter.call(main().querySelectorAll(".readiness li"), function (x) { return /Z3 \(Plant DMZ & historian\) has no vulnerabilities recorded/.test(x.textContent); })[0];
      ok(!!li, "Check and issue lists the missing vulnerabilities");
      li.querySelector('[data-action="goto"]').click();
      ok(RT.state.stage === "risk" && !!main().querySelector('[data-owner-id="Z3"] [data-part="vulns"]'), "and Go to opens step 5 at the zone's vulnerabilities");
      load(DEMO);
      ok(E.completeness(P()).length === 0, "the demo, loaded again, has nothing open");
    });
  }
})();
</script>
