<html lang="en">
<head><meta charset="utf-8" /><title>risk-tool zones, specification and approval</title></head>
<body>
<pre id="out">running…</pre>
<!--
  Phase 3b of docs/risk-tool-redesign.md: step 3's layout (the drawing on top,
  compact tables, one zone or conduit in a detail panel, collapsed
  characteristics), pasting assets several at a time, the separation rows
  raised only by a mix in the data, step 1's criteria (editable since phase 5) and the
  tolerable risk's confirmed marker, step 6's eight blocks with their status
  and links, step 7's approvers with their fingerprint, the review hash
  leaving the signature table out, the Word sections (requirements in order,
  risk comparison, characteristics, signature table, criteria appendix) and
  the Excel columns, and the new fields through the migration and the
  released v0.7 normaliser.
-->
<iframe id="app" src="../index.html" style="width:1280px;height:900px;visibility:hidden"></iframe>
<script src="../data/tour-project.js"></script>
<script src="fixtures/v0.7-normaliser.js"></script>
<script src="fixtures/tour-phase3-0.2.js"></script>
<script>
(function () {
  "use strict";
  var lines = [], failures = 0;
  function ok(cond, name, detail) { if (cond) lines.push("PASS " + name); else { failures++; lines.push("FAIL " + name + (detail ? " — " + detail : "")); } }
  function done() { lines.push(""); lines.push(failures === 0 ? "ALL TESTS PASSED" : failures + " TEST(S) FAILED"); document.getElementById("out").textContent = lines.join("\n"); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

  var tries = 0;
  var t = setInterval(function () {
    var w = document.getElementById("app").contentWindow;
    if (!w || !w.RiskTool || !w.RiskExports || !w.RiskReview || !w.docx || !w.ExcelJS) { if (++tries > 200) { clearInterval(t); lines.push("FAIL app did not expose RiskTool"); failures++; done(); } return; }
    clearInterval(t);
    var p = null;
    try { p = run(w); } catch (e) { failures++; lines.push("FAIL exception: " + (e && e.message) + "\n" + (e && e.stack)); }
    if (p && typeof p.then === "function") p.then(done, function (e) { failures++; lines.push("FAIL async exception: " + (e && e.message) + "\n" + (e && e.stack)); done(); });
    else done();
  }, 50);

  function run(w) {
    var RT = w.RiskTool, MG = w.RiskApp.Migrate, d = w.document, RX = w.RiskExports, RR = w.RiskReview, DB = w.App.DocxBlocks, RULES = w.App.Data.sltRules;
    w.confirm = function () { return true; };
    w.alert = function () {};
    var KEY = RT.AUTOSAVE_KEY, keptSnap = null;
    try { keptSnap = w.localStorage.getItem(KEY); w.localStorage.removeItem(KEY); } catch (e) {}
    var bar0 = d.querySelector(".autosave-bar"); if (bar0) bar0.parentNode.removeChild(bar0);
    function main() { return d.getElementById("main"); }
    function P() { return RT.state.project; }
    function texts() { return RT.completeness().map(function (i) { return i.text; }); }
    function has(list, re) { return list.some(function (x) { return re.test(x); }); }
    function change(el, v) { el.value = v; el.dispatchEvent(new w.Event("change", { bubbles: true })); }
    function type(el, v) { el.focus(); el.value = v; el.dispatchEvent(new w.Event("input", { bubbles: true })); el.dispatchEvent(new w.Event("change", { bubbles: true })); }
    function tick(el, v) { el.checked = v; el.dispatchEvent(new w.Event("change", { bubbles: true })); }
    function detail() { return main().querySelector("[data-detail]"); }
    function fieldIn(scope, label) {
      var f = [].filter.call(scope.querySelectorAll(".field"), function (x) { var l = x.querySelector("label"); return l && l.textContent === label; })[0];
      return f ? f.querySelector("input, textarea, select") : null;
    }

    // ---- step 3: the layout ------------------------------------------------------------
    RT.navigate("zones");
    ok(/Nothing selected/.test(main().textContent) && !detail(), "with no zones the detail panel says nothing is selected");
    main().querySelector('[data-action="add-zone"]').click();
    main().querySelector('[data-action="add-zone"]').click();
    ok(P().zones.length === 2 && detail().getAttribute("data-detail") === "zone" && detail().getAttribute("data-owner-id") === "Z2", "+ Add zone adds a zone and opens it in the detail panel");
    var cards = [].slice.call(main().querySelectorAll(":scope > .card, :scope > .zones-layout"));
    ok(cards[0] && cards[0].querySelector(".zone-map-wrap svg") && main().querySelector(".zones-layout"), "the drawing is on top, above the tables and the panel");
    ok(main().querySelectorAll('[data-zone-row]').length === 2 && main().querySelectorAll('[data-detail]').length === 1, "a compact table lists both zones, and one is open in the panel");
    var box1 = main().querySelector('.zone-map-wrap g[data-zone-id="Z1"]');
    ok(!!box1 && box1.getAttribute("role") === "button" && box1.getAttribute("tabindex") === "0", "a zone's box in the drawing is a button");
    box1.dispatchEvent(new w.MouseEvent("click", { bubbles: true }));
    ok(detail().getAttribute("data-owner-id") === "Z1", "and clicking it opens that zone");
    main().querySelector('[data-zone-row="Z2"]').click();
    ok(detail().getAttribute("data-owner-id") === "Z2" && main().querySelector('[data-zone-row="Z2"]').classList.contains("selected"), "a row of the table opens its zone, and is marked");
    main().querySelector('[data-zone-row="Z1"] [data-action="pick-Z1"]').click();
    var chars = detail().querySelector("details.chars");
    ok(!!chars && !chars.open, "the characteristics start collapsed");
    chars.open = true; chars.dispatchEvent(new w.Event("toggle"));
    RT.render();
    ok(detail().querySelector("details.chars").open, "and stay open through a redraw once opened");
    ["Accountable organisation", "Physical boundary", "Logical access points and boundary devices", "Physical access points", "Data flows", "External dependencies", "Applicable security policies", "Assumptions"].forEach(function (l) {
      ok(!!fieldIn(detail().querySelector("details.chars"), l), "the characteristics hold " + l.toLowerCase());
    });
    var z1 = P().zones[0];
    ok(!("accountableOrg" in z1) && !("dataFlows" in z1), "and nothing is written until it is entered");
    type(fieldIn(detail(), "Accountable organisation"), "Unit 1 operations");
    type(fieldIn(detail(), "Data flows"), "Values to the historian\nAlarms to the pager");
    ok(z1.accountableOrg === "Unit 1 operations" && same(z1.dataFlows, ["Values to the historian", "Alarms to the pager"]), "entered, they are stored on the zone");
    type(fieldIn(detail(), "Accountable organisation"), "");
    ok(!("accountableOrg" in z1), "and cleared, they go again");

    // ---- pasting assets ----------------------------------------------------------------
    ok(!!detail().querySelector('[data-action="paste-open"]'), "the zone offers Paste several");
    detail().querySelector('[data-action="paste-open"]').click();
    var ta = detail().querySelector('[data-action="paste-text"]');
    ok(!!ta && d.activeElement === ta, "which opens a box, with the focus in it");
    type(ta, "PLC-101\tPLC\nSIS-1\tSafety PLC\n\nMaintenance laptop\tEngineering workstation\tTemporary\nRadio gateway\tNetwork\twireless\nERP link\tbusiness system\nSpare\tgizmo");
    detail().querySelector('[data-action="paste-add"]').click();
    ok(z1.assets.length === 6 && !detail().querySelector('[data-action="paste-text"]'), "Add puts one asset per line, skipping blank lines, and closes the box", String(z1.assets.length));
    ok(same(z1.assets.map(function (a) { return a.type; }), ["plc", "safety-plc", "engineering-workstation", "network", "business", "other"]), "a type column is read by id or name, an unknown one is Other", JSON.stringify(z1.assets));
    ok(z1.assets[2].link === "temporary" && z1.assets[3].link === "wireless" && !("link" in z1.assets[0]), "a connection column marks a temporarily connected or wireless asset, and a fixed one has none");
    ok(/6 assets added/.test(d.getElementById("toast").textContent), "and the toast says how many");
    ok(same(RT.parseAssets("A\nB\tHMI"), [{ name: "A", type: "other" }, { name: "B", type: "hmi" }]), "a line with no type is Other");

    // ---- separation rows: raised only by a mix -----------------------------------------
    var rows = RT.separationRows(z1).map(function (r) { return r.id; }).join(",");
    ok(rows === "business,safety,temporary,wireless", "a zone mixing business, safety, temporary and wireless assets raises those four rows, in order", rows);
    var z2 = P().zones[1];
    z2.assets = [{ name: "PLC-201", type: "plc" }, { name: "HMI-201", type: "hmi" }];
    ok(RT.separationRows(z2).length === 0, "a zone of ordinary controllers raises none");
    RT.navigate("zones");
    main().querySelector('[data-zone-row="Z2"]').click();
    ok(!detail().querySelector(".sep-rows") && !has(texts(), /^Z2 /), "and asks nothing: no separation field, nothing open");
    z2.flags.wireless = true;
    ok(RT.separationRows(z2).map(function (r) { return r.id; }).join() === "wireless", "a zone marked for wireless links raises the wireless row");
    z2.flags.wireless = false;
    var c1 = RT.emptyConduit(1); c1.fromZone = "Z2"; c1.toZone = "EXT"; P().conduits.push(c1); P().counters.conduit = 1;
    ok(RT.separationRows(z2).map(function (r) { return r.id; }).join() === "external" && /C1/.test(RT.separationRows(z2)[0].why), "a conduit to EXT raises the external row on the zone it reaches, naming the conduit");
    P().conduits[0].toZone = "Z1"; P().conduits[0].external = true;
    ok(RT.separationRows(z2).map(function (r) { return r.id; }).join() === "external" && RT.separationRows(z1).some(function (r) { return r.id === "external"; }), "so does a conduit marked as an external network, on both its zones");
    P().conduits[0].toZone = "EXT"; delete P().conduits[0].external;
    var tx = texts();
    ok(has(tx, /^Z1: record whether safety related assets are kept separate\.$/) && has(tx, /^Z2: record whether devices connected via external networks are kept separate\.$/), "each raised row unanswered is in the completeness list", tx.filter(function (x) { return /^Z\d:/.test(x); }).join(" | "));
    ok(RT.completeness().filter(function (i) { return /kept separate/.test(i.text); }).every(function (i) { return i.stage === "zones" && i.doc === "detailed" && i.target.kind === "zone" && /^sep-/.test(i.target.part); }), "on step 3, for the detailed report, aimed at the row");
    ok(RT.stepStatus().zones.state === "open", "and step 3 shows them as open");
    // Go to a row: step 3 opens that zone, and the row flashes.
    RT.navigate("review");
    // Z2 is the open zone: Go to must switch the panel to Z1.
    RT.navigate("zones"); main().querySelector('[data-zone-row="Z2"]').click(); RT.navigate("review");
    var li = [].filter.call(main().querySelectorAll(".readiness li"), function (x) { return /Z1: record whether safety related/.test(x.textContent); })[0];
    li.querySelector('[data-action="goto"]').click();
    ok(RT.state.stage === "zones" && detail().getAttribute("data-owner-id") === "Z1" && detail().querySelector('[data-part="sep-safety"]').classList.contains("check-flash"), "Go to opens step 3 on the zone, at the separation row, which flashes");
    // Answering.
    var met = detail().querySelector('[data-separation="safety:met"]');
    met.focus(); met.click();
    ok(z1.separation && z1.separation.safety.answer === "met" && !has(texts(), /^Z1: record whether safety related/) && d.activeElement === detail().querySelector('[data-separation="safety:met"]'), "Met answers the row, and the choice keeps the focus");
    detail().querySelector('[data-separation="temporary:not-separated"]').click();
    ok(has(texts(), /^Z1: temporarily connected devices are not kept separate, with no reason\.$/) && /Give a reason/.test(detail().querySelector('[data-part="sep-temporary"]').textContent), "Not separated asks for a reason");
    type(detail().querySelector('input[data-reason="sep-temporary"]'), "Laptops only during shutdowns, under permit.");
    ok(!has(texts(), /^Z1: temporarily/) && z1.separation.temporary.reason === "Laptops only during shutdowns, under permit.", "and the reason settles it");
    detail().querySelector('[data-separation="safety:met"]').click();
    ok(!("safety" in z1.separation) && has(texts(), /^Z1: record whether safety related/), "clicking the answer again takes it back");
    z1.assets = z1.assets.filter(function (a) { return a.type !== "business"; });
    ok(!RT.separationRows(z1).some(function (r) { return r.id === "business"; }) && !has(texts(), /^Z1: record whether business/), "a row no longer raised stops asking");

    // ---- the safety designation --------------------------------------------------------
    RT.navigate("zones"); main().querySelector('[data-zone-row="Z2"]').click();
    var saf = detail().querySelector('input[data-action="safety"]');
    ok(!!saf && !saf.checked && !RT.suggestZone(z2, P()).safetyRelated, "the safety designation is a field of the zone");
    tick(saf, true);
    ok(z2.flags["sis-present"] === true && RT.suggestZone(z2, P()).safetyRelated && RT.suggestZone(z2, P()).byFR.UC.sl === 3 && RT.buildRiskContext().zones[1].safetyRelated === true, "ticked, it still drives safetyRelated, the SL3 floor and the risk context");
    tick(detail().querySelector('input[data-action="safety"]'), false);
    ok(!z2.flags["sis-present"] && ![].some.call(detail().querySelectorAll(".flag-grid label"), function (l) { return /safety instrumented|SIS/i.test(l.textContent); }), "and is not offered twice among the exposure flags");

    // ---- a conduit ----------------------------------------------------------------------
    main().querySelector('[data-conduit-row="C1"]').click();
    ok(detail().getAttribute("data-detail") === "conduit" && detail().getAttribute("data-owner-id") === "C1", "a conduit opens in the same panel");
    var ext = detail().querySelector('input[data-marker="external"]');
    ok(ext.checked && ext.disabled && !("external" in P().conduits[0]), "an EXT end marks it external, without storing a marker");
    detail().querySelector("details.chars").open = true;
    type(fieldIn(detail(), "External party"), "Vendor support");
    tick(detail().querySelector('input[data-marker="wireless"]'), true);
    change(detail().querySelector('select[data-action="direction"]'), "from-to");
    type(fieldIn(detail(), "Boundary devices"), "Firewall FW-1");
    var cc = P().conduits[0];
    ok(cc.externalParty === "Vendor support" && cc.wireless === true && cc.direction === "from-to" && same(cc.boundaryDevices, ["Firewall FW-1"]), "its characteristics: external party, markers, direction, boundary devices");
    tick(detail().querySelector('input[data-marker="wireless"]'), false);
    ok(!("wireless" in cc), "a marker taken off leaves no key behind");
    ok(/Z2 ↔ EXT/.test(main().querySelector('[data-conduit-row="C1"]').textContent), "the conduits table shows its ends");

    // ---- step 1: the criteria and the confirmed marker -----------------------------------
    RT.navigate("suc");
    var crit = main().querySelector('[data-check-anchor="criteria"]');
    var cells = crit.querySelectorAll(".matrix td[data-band]"), above = crit.querySelectorAll(".matrix td.above-tol");
    var want = 0; Object.keys(RULES.riskMatrix).filter(function (k) { return k !== "_note"; }).forEach(function (s) { Object.keys(RULES.riskMatrix[s]).forEach(function (l) { if (RT.exceedsTolerable(RULES.riskMatrix[s][l], P().srs.tolerableRisk)) want++; }); });
    ok(cells.length === 12 && above.length === want && want > 0, "step 1 shows the matrix beside the form, the cells above tolerable risk outlined", above.length + " / " + want);
    // Phase 5: the definitions are the project's criteria, edited in place
    // (re-pointed from the read-only list: the same definitions, no house prefix).
    var defIns = [].slice.call(crit.querySelectorAll("details.scales input[type=text], details.scales textarea"));
    ok(!!crit.querySelector("details.scales") && defIns.some(function (i) { return i.value === "Low"; }) && defIns.some(function (i) { return /^No known history/.test(i.value); }) && !/House default/.test(crit.textContent) && !defIns.some(function (i) { return /House default/.test(i.value); }), "with the scale definitions, without the house prefix");
    ok(has(texts(), /^Tolerable risk is not confirmed with the asset owner\.$/) && !RT.tolerableConfirmed(), "an unconfirmed tolerable risk is open (no silent default)");
    var it = RT.completeness().filter(function (i) { return /Tolerable risk is not confirmed/.test(i.text); })[0];
    ok(it.stage === "suc" && it.doc === "both" && it.target.kind === "criteria", "in step 1, for both reports");
    tick(crit.querySelector('input[data-action="tolerable-confirmed"]'), true);
    ok(P().srs.tolerableConfirmed === P().srs.tolerableRisk && !has(texts(), /Tolerable risk is not confirmed/), "ticking Confirmed with the asset owner records the band confirmed");
    change(main().querySelector('[data-check-anchor="criteria"] select'), "high");
    ok(!RT.tolerableConfirmed() && has(texts(), /Tolerable risk is not confirmed/) && /Confirmed for medium, before the change/.test(main().querySelector('[data-check-anchor="criteria"]').textContent), "changing the tolerable risk afterwards leaves it unconfirmed, and says so");
    change(main().querySelector('[data-check-anchor="criteria"] select'), "medium");
    ok(RT.tolerableConfirmed(), "and back at the band confirmed, it is confirmed again");

    // ---- step 6: the specification ------------------------------------------------------
    RT.navigate("spec");
    var blocks = [].map.call(main().querySelectorAll("[data-spec]"), function (b) { return b.getAttribute("data-spec"); }).join(",");
    var order = Object.keys(w.App.Data.zcrMap.specBlocks).filter(function (k) { return k.charAt(0) !== "_"; }).join(",");
    ok(blocks === "suc,drawings,characteristics,assumptions,threats,policies,tolerable,regulatory" && blocks === order, "step 6 has eight blocks, in the order the ZCR lookup gives", blocks);
    ok(main().querySelector(".page-sub .zcr-ref").textContent === "ZCR 6" && (main().textContent.match(/ZCR \d/g) || []).length === 1, "it shows ZCR 6 once, and no block carries a reference");
    var tl = [].map.call(main().querySelectorAll("[data-spec] .card-h h2"), function (h) { return h.textContent; }).join("|");
    ok(tl === "SUC description|Zone and conduit drawings|Zone and conduit characteristics|Operating environment assumptions|Threat environment|Organisational security policies|Tolerable risk|Regulatory requirements", "the blocks are named in plain words", tl);
    ok(main().querySelector('[data-spec="drawings"] .zone-map-wrap svg') && main().querySelector('[data-spec="characteristics"] table'), "the drawing and the characteristics are assembled from step 3");
    ok(main().querySelector('[data-spec="tolerable"] .spec-status').getAttribute("data-status") === "done" && main().querySelector('[data-spec="regulatory"] .spec-status').getAttribute("data-status") === "open", "each block has its status");
    var sp = RT.completeness().filter(function (i) { return i.stage === "spec"; }).map(function (i) { return i.text; });
    ok(sp.indexOf("Requirements specification: no regulatory requirements recorded.") >= 0 && sp.indexOf("Requirements specification: no organisational security policies recorded.") >= 0 && sp.indexOf("Requirements specification: no operating environment assumptions recorded.") >= 0, "blocks with no check elsewhere are open in the completeness list", sp.join(" | "));
    ok(RT.completeness().filter(function (i) { return i.stage === "spec"; }).every(function (i) { return i.doc === "detailed" && i.target.kind === "spec"; }), "for the detailed report, aimed at their block");
    // (Phase 3b review: the field is labelled Requirements, as its block is titled Regulatory requirements.)
    type(fieldIn(main().querySelector('[data-spec="regulatory"]'), "Requirements"), "UK NIS Regulations 2018");
    type(fieldIn(main().querySelector('[data-spec="policies"]'), "Policies"), "Group OT standard");
    ok(same(P().srs.regulatory, ["UK NIS Regulations 2018"]) && same(P().suc.policies, ["Group OT standard"]) && !has(texts(), /no regulatory|no organisational/), "the two with no other home are entered on the page");
    RT.navigate("spec");
    var lnk = main().querySelector('[data-spec="assumptions"] [data-action="spec-goto-suc"]');
    ok(!!lnk, "a block links back to where it was captured");
    lnk.click();
    ok(RT.state.stage === "suc" && main().querySelector('[data-check-anchor="suc"]').classList.contains("check-flash"), "and the link opens it there");
    RT.navigate("review");
    li = [].filter.call(main().querySelectorAll(".readiness li"), function (x) { return /no operating environment assumptions/.test(x.textContent); })[0];
    li.querySelector('[data-action="goto"]').click();
    ok(RT.state.stage === "spec" && main().querySelector('[data-spec="assumptions"]').classList.contains("check-flash"), "Go to on a block's item opens step 6 at the block");
    var emptyHL = { schema: "spt-risk-project/0.2", assessmentType: "high-level", suc: { name: "", description: "", scopeStatement: "", assumptions: [] }, srs: { highLevelAssets: [] }, zones: [], conduits: [] };
    MG.normaliseProject(emptyHL);
    ok(RT.stepStatus(emptyHL).spec.state === "na", "a high-level-only job reads step 6 as Not needed while it is empty");

    // ---- step 7: approval -----------------------------------------------------------------
    RT.navigate("approval");
    ok(main().querySelector(".page-sub .zcr-ref").textContent === "ZCR 7", "step 7 is the approval, with ZCR 7 as its reference");
    ok(main().querySelector('[data-covers="tolerable"]') && main().querySelector('[data-covers="accepted"]') && /What is being approved/.test(main().textContent), "it says what is being approved: the tolerable risk, the SL-T and the accepted risks");
    ok(!("approvals" in P()), "looking at it writes nothing");
    main().querySelector('[data-action="add-approver"]').click();
    ok(Array.isArray(P().approvals) && P().approvals.length === 1 && d.activeElement === main().querySelector('[data-approval="0"] [data-approval-field="name"]'), "+ Add approver adds one, with the focus on its name");
    var a0 = main().querySelector('[data-approval="0"]');
    type(a0.querySelector('[data-approval-field="name"]'), "A. Owner");
    type(a0.querySelector('[data-approval-field="role"]'), "Plant Manager");
    type(a0.querySelector('[data-approval-field="organisation"]'), "Works Ltd");
    type(a0.querySelector('[data-approval-field="scope"]'), "Tolerable risk and SL-T");
    ok(P().approval.name === "A. Owner" && P().approval.role === "Plant Manager" && P().approval.statement === "Tolerable risk and SL-T" && P().approval.approved === false, "the old single sign-off mirrors the first approver (scope as its statement)");
    tick(main().querySelector('[data-approval="0"] [data-approval-field="approved"]'), true);
    var fp = RT.approvalFingerprint();
    ok(P().approvals[0].approved === true && P().approvals[0].fingerprint === fp && P().approval.approved === true, "Approved records the fingerprint of what was approved");
    ok(/Unchanged since approval/.test(main().querySelector('[data-approval="0"]').textContent), "and says it is unchanged");
    z1.slTargetByFR.IAC = 3; RT.navigate("approval");
    ok(RT.approvalFingerprint() !== fp && /Changed since approval/.test(main().querySelector('[data-approval="0"]').textContent) && has(texts(), /^A\. Owner: approved before the SL-T changed\.$/), "a change to an SL-T afterwards reads changed since approval, and is open");
    ok(RT.completeness().filter(function (i) { return /approved before/.test(i.text); })[0].stage === "approval", "on step 7");
    var downloads = 0, origClick = w.HTMLAnchorElement.prototype.click;
    w.HTMLAnchorElement.prototype.click = function () { if (this.download) { downloads++; return; } return origClick.apply(this, arguments); };
    RT.navigate("review");
    main().querySelector('[data-download="risk-context"]').click();
    d.getElementById("issue-guard").querySelector('[data-action="generate-anyway"]').click();
    w.HTMLAnchorElement.prototype.click = origClick;
    ok(downloads === 1, "it never blocks: the export still goes ahead after the question");
    RT.navigate("approval");
    main().querySelector('[data-approval="0"] [data-action="approved-again"]').click();
    ok(P().approvals[0].fingerprint === RT.approvalFingerprint() && !has(texts(), /approved before/), "Approved again takes the new fingerprint");
    main().querySelector('[data-action="add-approver"]').click();
    type(main().querySelector('[data-approval="1"] [data-approval-field="name"]'), "B. Second");
    ok(P().approvals.length === 2 && P().approval.name === "A. Owner", "a second approver leaves the mirror on the first");
    var states = RT.approvalStates();
    ok(states.length === 2 && states[0].signed && !states[1].signed, "approvalStates lists both, signed or not");

    // An older build edits only the single sign-off: that is the later edit, and the first entry takes it.
    var file = clone(P()); file.approval.name = "A. Owner-Smith"; file.approval.date = "2026-11-01";
    var back = MG.normaliseProject(file);
    ok(back.approvals[0].name === "A. Owner-Smith" && back.approvals[0].date === "2026-11-01" && back.approvals[0].organisation === "Works Ltd" && back.approvals.length === 2, "a sign-off edited by an older build wins for the first approver, keeping the rest");
