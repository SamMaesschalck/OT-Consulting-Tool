<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>risk-tool report export tests</title></head>
<body>
<h1>risk-tool report exports — Word + Excel on the completed demo project</h1>
<pre id="out">running…</pre>
<iframe id="app" src="../index.html?tour=1" style="width:10px;height:10px;visibility:hidden"></iframe>
<script>
(function () {
  "use strict";
  var lines = [], failures = 0;
  function ok(cond, name, detail) { if (cond) lines.push("PASS " + name); else { failures++; lines.push("FAIL " + name + (detail ? " — " + detail : "")); } }
  function done() { lines.push(""); lines.push(failures === 0 ? "ALL TESTS PASSED" : failures + " TEST(S) FAILED"); document.getElementById("out").textContent = lines.join("\n"); }

  var tries = 0;
  var t = setInterval(function () {
    var w = document.getElementById("app").contentWindow;
    if (!w || !w.RiskTool || !w.RiskExports || !w.ExcelJS || !w.docx ||
        (w.RiskTool.state.project.suc.name || "").indexOf("Acme") !== 0) {
      if (++tries > 300) { clearInterval(t); lines.push("FAIL app/exports/libs did not load seeded"); failures++; done(); }
      return;
    }
    clearInterval(t);
    var p = null;
    try { p = run(w); } catch (e) { failures++; lines.push("FAIL exception: " + (e && e.message) + "\n" + (e && e.stack)); }
    if (p && typeof p.then === "function") p.then(done, function (e) { failures++; lines.push("FAIL async: " + (e && e.message)); done(); });
    else done();
  }, 50);

  // Minimal docx mock (same pattern as the Assessments content tests) so the
  // Word document tree can be walked and asserted. Installed only for the
  // build call; the real patched lib stays loaded for actual use.
  function mockDocx() {
    function TextRun(o) { if (typeof o === "string") o = { text: o }; this.__t = "run"; this.text = o.text != null ? o.text : ""; this.bold = !!o.bold; this.color = o.color || null; }
    function Paragraph(o) { o = o || {}; this.__t = "p"; this.children = o.children || []; this.heading = o.heading || null; this.text = this.children.map(function (r) { return r && r.text != null ? r.text : ""; }).join(""); }
    function TableCell(o) { this.__t = "cell"; this.children = (o && o.children) || []; this.shading = (o && o.shading) || null; }
    function TableRow(o) { this.__t = "row"; this.children = (o && o.children) || []; }
    function Table(o) { this.__t = "table"; this.rows = (o && o.rows) || []; }
    function Header(o) { this.__t = "hdr"; this.children = (o && o.children) || []; }
    function Footer(o) { this.__t = "ftr"; this.children = (o && o.children) || []; }
    function PageBreak() { this.__t = "br"; this.text = ""; }
    function ImageRun(o) { this.__t = "img"; this.data = (o && o.data) || null; this.floating = (o && o.floating) || null; }
    function Document(o) { this.__t = "doc"; this.sections = (o && o.sections) || []; }
    return {
      Document: Document, Paragraph: Paragraph, TextRun: TextRun, Table: Table, TableRow: TableRow, TableCell: TableCell,
      Header: Header, Footer: Footer, PageBreak: PageBreak, ImageRun: ImageRun,
      HeadingLevel: { HEADING_1: "h1", HEADING_2: "h2", HEADING_3: "h3", TITLE: "t" },
      WidthType: { DXA: "dxa", PERCENTAGE: "pct" },
      ShadingType: { SOLID: "solid" },
      TableLayoutType: { FIXED: "fixed" },
      AlignmentType: { LEFT: "l", CENTER: "c", RIGHT: "r" },
      HeightRule: { ATLEAST: "atLeast", EXACT: "exact" },
      PageNumber: { CURRENT: "current" },
      PageOrientation: { PORTRAIT: "portrait" },
      Packer: { toBlob: function () { return Promise.resolve(new Blob(["x"])); } }
    };
  }
  function docText(doc) {
    var out = [];
    (function walk(n) {
      if (!n) return;
      if (n.__t === "p") { out.push(n.text); return; }
      if (n.__t === "table") { n.rows.forEach(walk); return; }
      if (n.__t === "row" || n.__t === "cell") { n.children.forEach(walk); return; }
      if (Array.isArray(n)) n.forEach(walk);
    })(doc.sections.map(function (s) { return s.children; }));
    return out.join("\n");
  }

  function run(w) {
    var RT = w.RiskTool, RX = w.RiskExports;
    // A register cell by its column's header (phase 4b: the current and planned ratings are columns
    // between the risk and the decision, so the letters moved; each assertion keeps its row and its header).
    // Phase 4 review: a header that is not there fails, by name (was: it fell back to column 99, whose empty
    // cell let a negative check pass).
    function rc(ws, row, name) { var n = 0; ws.getRow(1).eachCell(function (c, i) { if (c.value === name) n = i; }); if (!n) ok(false, "the " + ws.name + " sheet has a column headed " + name); return ws.getCell(row, n || 99); }
    var J = "Treatment decision", L = "Reason / notes", M = "Status";
    w.confirm = function () { return true; };
    w.alert = function () {};
    var p = RT.state.project;

    ok(!!w.docx && !!w.ExcelJS && !!RX, "vendor libs and RiskExports loaded by index.html");
    ok(!!(w.App && w.App.Assets && w.App.Assets.logo && w.App.Assets.coverBg && w.App.Assets.logoCard), "brand assets (logo + cover art) loaded by index.html");
    ok(p.engagement && p.engagement.client === "Acme Petrochemicals Ltd", "tour project carries engagement details");

    // ---- Word (full) via the mock ----
    var realDocx = w.docx;
    w.docx = mockDocx();
    var doc = RX.buildWordDoc(p, {});
    var text = docText(doc);
    // Phase 4b: the body is three Word sections, the risk register, treatment plan and accepted risks
    // on landscape pages between portrait ones (was: cover + one body section).
    ok(!!doc && doc.sections.length === 4 && doc.sections.map(function (s) { return s.properties.page.size.orientation; }).join() === "portrait,portrait,landscape,portrait", "full Word doc builds (cover + body)", doc.sections.map(function (s) { return s.properties.page.size.orientation; }).join());
    ok(text.indexOf("OT CYBER RISK ASSESSMENT") !== -1 && text.indexOf("OT Cyber Risk") !== -1, "Design-B cover carries the kicker and title lines");
    ok(text.indexOf("www.solutionspt.com") !== -1 && text.indexOf("CLASSIFICATION") !== -1, "cover carries the SolutionsPT address block and issue/author/classification line");
    ok(text.indexOf("Acme Petrochemicals Ltd") !== -1 && text.indexOf("Unit 300") !== -1, "cover + document control carry the engagement client and SUC");
    (function () { // cover hero: floating background image behind the text, plus the logo card
      var imgs = [];
      (function walk(n) {
        if (!n) return;
        if (n.__t === "img") { imgs.push(n); return; }
        if (n.__t === "p" || n.__t === "cell" || n.__t === "hdr") { n.children.forEach(walk); return; }
        if (n.__t === "table") { n.rows.forEach(walk); return; }
        if (n.__t === "row") { n.children.forEach(walk); return; }
        if (Array.isArray(n)) n.forEach(walk);
      })(doc.sections[0].children);
      ok(imgs.length >= 2 && imgs.some(function (i) { return i.floating && i.floating.behindDocument; }), "cover section embeds the hero background (floating, behind text) and the logo card");
    })();
    ok(text.indexOf("Risk at a glance") !== -1 && text.indexOf("threats registered") !== -1 && text.indexOf("above tolerable (Medium)") !== -1, "scorecard page: headline tiles present");
    ok(text.indexOf("Risk profile by zone and conduit") !== -1 && text.indexOf("Z2 Safety Instrumented System") !== -1, "scorecard page: per-zone/conduit risk bars");
    ok(text.indexOf("Target security levels: worst case per foundational requirement") !== -1, "scorecard page: SL-T tile strip");
    ok(text.indexOf("Where to focus first") !== -1, "scorecard page: focus cards");
    // Phase 4 review (wording 3): the cards are the threats still above tolerable risk today, ranked on today's
    // rating and labelled so (was: ranked on the unmitigated rating, so T1, within tolerable risk today, was one).
    var wf = text.slice(text.indexOf("\nWhere to focus first\n"), text.indexOf("\nSystem under consideration and requirements\n"));
    ok(/\nT2  [^\n]*\nZ1 · High today\n/.test(wf) && /\nT4  [^\n]*\nZ2 · High today\n/.test(wf) && /\nT5  [^\n]*\nZ3 · High today\n/.test(wf) && wf.indexOf("\nT1  ") < 0 && wf.indexOf("\nT7  ") < 0,
      "scorecard page: the focus cards are the threats still above tolerable risk today, labelled with today's rating", wf.replace(/\n/g, " | ").slice(0, 400));
    ok(text.indexOf("Executive summary") !== -1 && text.indexOf("9 threats were registered") !== -1, "exec summary composed from the data (9 threats)");
    ok(text.indexOf("Why this assessment") !== -1 && text.indexOf("What this report is") !== -1 && text.indexOf("What we found") !== -1 && text.indexOf("What happens next") !== -1, "exec summary has the why/what/found/next structure");
    ok(text.indexOf("essential functions in scope are") !== -1 && text.indexOf("assumed adversary is SL3 grade") !== -1, "exec summary states the operational stakes and adversary assumption from the SRS");
    ok(text.indexOf("The findings are based on") !== -1 && text.indexOf("4 interviews") !== -1, "exec summary cites the evidence base (basis of assessment)");
    ok(text.indexOf("The assessment follows IEC 62443-3-2.") !== -1 && text.indexOf("Three artefacts") === -1 && text.indexOf("this document") === -1, "exec summary says what the assessment did, without talking about the document itself");
    ok(text.indexOf("Repeat this assessment after a significant change") !== -1, "exec summary sets the revisit expectation");
    // Phase 4 review (wording 1): "What we found" no longer repeats how many are above tolerable risk, so the
    // tolerable risk is named where the summary compares with it (was: "exceed the tolerable risk of Medium").
    var es0 = text.slice(text.indexOf("\nExecutive summary\n"), text.indexOf("\nRisk at a glance\n"));
    ok(/compared with the tolerable risk of Medium/.test(es0) && /\n9 threats were registered\. The most affected/.test(es0) && es0.indexOf("exceed the tolerable risk") < 0, "exec summary names the tolerable risk", (es0.match(/[^\n]*threats were registered[^\n]*/) || [""])[0]);
    ok(/The most affected is Z\d/.test(text) && text.indexOf("The highest unmitigated risk is") !== -1, "exec summary says where the risk concentrates and names the worst threat");
    // Phase 4b demo: one decision of each kind (was: 2 reduced, 4 being reduced, 1 accepted).
    // Phase 4 review (wording 1): one sentence of the decisions that stand, in the tables' words (was: "Of the 7
    // threats above tolerable risk, 3 are reduced ..., 1 is treated through the target security level programme
    // and 1 is formally accepted by the asset owner.").
    ok(/\nThe treatment decisions are: 3 reduced to within tolerable risk, 2 being reduced with countermeasures, 1 treated through the SL-T programme and 1 accepted by the asset owner\. The register holds 5 existing and 4 planned countermeasures\.\n/.test(text) && es0.indexOf("target security level programme") < 0 && es0.indexOf("formally") < 0,
      "treatment tally counts each kind of confirmed decision, in the words the tables use", (text.match(/The treatment decisions? (?:are|is): [^\n]*/) || [""])[0]);
    // Phase 4b: the summary points to the Accepted risks section, which holds the review date (was: "revisited at the next assessment").
    // Phase 4 review (wording 1): T8 is in the table of the threats above tolerable risk today, so no sentence of its own names it again.
    var topTbl = text.slice(text.indexOf("The threats above tolerable risk today:"), text.indexOf("\nDecisions required\n"));
    ok(/\nT8  [^\n]*\nZ4\nHigh\nHigh\nHigh\nRisk accepted(\n|$)/.test(topTbl) && text.indexOf("Accepted risk T8") < 0, "the accepted risk is named in the summary, once: in the table of the threats above tolerable risk today", topTbl.replace(/\n/g, " | ").slice(0, 600));
    ok(text.indexOf("no treatment decision recorded") === -1 && text.indexOf("No decision recorded") === -1 && text.indexOf("7/7") !== -1 && text.indexOf("with a treatment decision") !== -1, "the demo, every decision confirmed, prints no missing decision");
    ok(/ceiling is set by/.test(text) && text.indexOf("IEC 62443-3-3 assessment against these targets") !== -1, "SL-T outcome paragraph names the ceiling driver and the 3-3 handoff");
    ok(text.indexOf("Delete this note.") !== -1, "red consultant tailor-me note present");
    ok(text.indexOf("High-level risk ranking") !== -1 && text.indexOf("Laboratory information system link") !== -1, "high-level risk ranking table present with all systems");
    ok(text.indexOf("The assessment follows IEC 62443-3-2:2020.") !== -1 && text.split("62443-3-2:2020").length === 2, "the method text names the edition, once");
    ok(text.indexOf("Security functions that must be kept") !== -1 && text.indexOf("Mandatory security functions") === -1, "the security functions heading says what it holds");
    ok(text.indexOf("Z2: Safety Instrumented System") !== -1 && text.indexOf("T4") !== -1, "zone threat registers present");
    // Phase 4b: the acceptance prints in full in the Accepted risks table, with who accepted it (was: a line under the zone's register).
    var accAt = text.indexOf("\nAccepted risks\n");
    ok(accAt > 0 && text.indexOf(p.zones[3].threats[1].acceptance, accAt) > accAt && text.indexOf("\nR. Calder\nAsset Owner - Unit 300\n2026-07-04\n2027-06-30\n", accAt) > accAt, "the recorded acceptance text prints in full");
    // Phase 4b (owner decision): the SL-T table drops the "Worst case" row and marks the safety zones; the
    // scorecard keeps its worst-case strip.
    // Phase 4 review: renamed, as the row is gone (was: "SL-T matrix with worst-case row").
    ok(text.indexOf("Target security levels (SL-T, per foundational requirement)") !== -1 && !/\nWorst case\n/.test(text) && /\nZ2 Safety Instrumented System\nSafety related\nSL3/.test(text), "the SL-T matrix marks the safety zone and has no Worst case row");
    ok(text.indexOf("Justification for Z2") !== -1 && text.indexOf("SIS floor applies") !== -1, "per-zone SL-T justifications print");
    ok(text.indexOf("Sign-off") !== -1 && text.indexOf("R. Calder (Asset Owner - Unit 300)") !== -1, "sign-off section carries the approval");
    ok(text.indexOf("Method and limitations") !== -1 && text.indexOf("house defaults") !== -1, "limitations state the house-matrix caveat");
    ok(text.indexOf("undefined") === -1 && text.indexOf("[object") === -1, "no undefined/object leaks in the Word text");
    (function () { // prose style rule: no em-dashes in running text (table cells may use the dash as an empty placeholder)
      // Every body section (phase 4b: the register's landscape pages are sections of their own).
      var prose = [].concat.apply([], doc.sections.slice(1).map(function (s) { return s.children; })).filter(function (n) { return n.__t === "p"; }).map(function (n) { return n.text; }).join("\n");
      ok(prose.indexOf("—") === -1, "no em-dashes in the report prose");
    })();

    // ---- Word (high-level only) ----
    var hl = RX.buildWordDoc(p, { highLevelOnly: true });
    var hlText = docText(hl);
    ok(hlText.indexOf("High-Level OT Cyber") !== -1 && hlText.indexOf("High-level risk ranking") !== -1 && hlText.indexOf("the high-level cyber security risk assessment") !== -1, "high-level variant builds with the ranking");
    ok(hlText.indexOf("Risk at a glance") !== -1 && hlText.indexOf("systems ranked") !== -1 && hlText.indexOf("Where to look first") !== -1, "high-level variant has its own scorecard page");
    // Phase 3a: the candidates are the systems above tolerable risk (was: ranked High or above), and the decision is per zone, not per system.
    ok(hlText.indexOf("The systems above the tolerable risk of Medium (") !== -1 && hlText.indexOf("are the candidates for a detailed assessment") !== -1 && hlText.indexOf("Delete this note.") !== -1, "high-level exec summary names the candidates above tolerable risk and carries the tailor-me note");
    ok(hlText.indexOf("Why this assessment") !== -1 && hlText.indexOf("which justify a detailed assessment") !== -1 && hlText.indexOf("What happens next") !== -1, "high-level exec summary has the why/what/next structure");
    ok(!/per-system|detailed tier|promoted|Promoted|ranked High or above/.test(hlText + "\n" + text), "neither report speaks of promotion, a detailed tier or per-system assessment", (( hlText + "\n" + text).match(/[^\n]*(per-system|detailed tier|promoted|Promoted|ranked High or above)[^\n]*/) || [""])[0]);
    ok(text.indexOf("C1 and C3 were found not to need a detailed assessment") !== -1 && text.indexOf("Threats to the others were rated") !== -1, "the detailed method says which conduits the comparison found need no detailed assessment, and rates the others' threats");
    ok(hlText.indexOf("Target security levels") === -1 && hlText.indexOf("Zones, conduits and the detailed") === -1, "high-level variant omits the detailed tier");
    ok(hlText.indexOf("Sign-off") !== -1, "high-level variant still carries sign-off");

    // ---- deliverables carry names and judgement: no raw ids, no capitals for emphasis ----
    ok(!/NO DISPOSITION|WORST CASE|Dispositioned|dispositioned/.test(text), "Word: no capitals for emphasis, no 'dispositioned'");
    ok(!/safety-plc|engineering-workstation|\(plc\)|\(hmi\)|remote-access|sis-present|internet-adjacent|many-conduits/.test(text), "Word: no flag or asset-type ids",
      (text.match(/safety-plc|engineering-workstation|\(plc\)|\(hmi\)|remote-access|sis-present|internet-adjacent|many-conduits/) || [""])[0]);
    // Phase 3b: exposure is a row of each zone's characteristics table (label cell, then value cell).
    ok(text.indexOf("(Safety PLC)") !== -1 && text.indexOf("(PLC)") !== -1 && /\nExposure\n[a-z ,]*remote access/i.test(text), "Word: asset types and exposure print as names");
    ok(!/Very-high|very-high/.test(text), "Word: no band id");
    ok(text.indexOf("Reduced to within tolerable risk") !== -1 && text.indexOf("Reduce with countermeasures") !== -1 && text.indexOf("Risk accepted") !== -1 && text.indexOf("Within tolerable risk") !== -1,
      "Word: each confirmed decision prints in plain words");

    // ---- an unconfirmed suggestion prints as no decision, in red ----
    function runsOf(d) {
      var out = [];
      (function walk(n) {
        if (!n) return;
        if (n.__t === "run") { out.push(n); return; }
        if (n.__t === "p" || n.__t === "cell" || n.__t === "row") { n.children.forEach(walk); return; }
        if (n.__t === "table") { n.rows.forEach(walk); return; }
        if (Array.isArray(n)) n.forEach(walk);
      })(d.sections.slice(1).map(function (s) { return s.children; }));
      return out;
    }
    var z1 = p.zones[0], t2 = z1.threats[1], t8 = p.zones[3].threats[1];
    t2.treatment.confirmed = false;                  // still "reduce", and M2 still covers it: a suggestion only
    t8.treatment = { decision: null, confirmed: false, reason: "" }; // the acceptance text is still there, with no decision
    var undecided = RX.buildWordDoc(p, {}), uText = docText(undecided);
    var redRuns = runsOf(undecided).filter(function (r) { return r.color === "E00000"; }).map(function (r) { return r.text; });
    ok(redRuns.filter(function (t) { return t === "No decision recorded"; }).length === 2, "Word: the two threats with no confirmed decision say so in red, in their registers", redRuns.join(" | "));
    ok(redRuns.some(function (t) { return /^2 threats above tolerable risk have no treatment decision recorded: T2 \(Z1\), T8 \(Z4\)\.$/.test(t); }), "Word: and the executive summary names them, in red", redRuns.join(" | "));
    ok(uText.indexOf("5/7") !== -1 && /no decision recorded/.test(uText) && uText.indexOf("NO DISPOSITION") === -1, "Word: the scorecard counts only confirmed decisions");
    // Phase 4 review (wording 1): "formally" is gone from the tally, so the check is on its words now.
    ok(uText.indexOf("accepted by the asset owner") === -1 && uText.indexOf("risk acceptance: Accepted by R. Calder") === -1, "Word: acceptance text with no confirmed decision is not printed as an acceptance");
    ok(/\nThe treatment decisions are: 3 reduced to within tolerable risk, 1 being reduced with countermeasures and 1 treated through the SL-T programme\./.test(uText), "Word: the tally leaves the undecided out", (uText.match(/The treatment decisions? (?:are|is): [^\n]*/) || [""])[0]);
    var uWb = RX.buildWorkbook(p), uTr = uWb.getWorksheet("Threat register");
    ok(String(rc(uTr, 3, J).value) === "No decision recorded" && String(rc(uTr, 3, M).value) === "Open" && String(rc(uTr, 9, L).value) === "", "Excel: no confirmed decision reads as no decision, open, with no reason",
      [rc(uTr, 3, J).value, rc(uTr, 3, M).value, rc(uTr, 9, L).value].join(" | "));
    var S2 = RX.summarise(p);
    ok(S2.threats.filter(function (x) { return x.exceeds && !x.decided; }).length === 2 && S2.dispositionCounts.none === 2, "the shared summary counts them as undecided");
    t2.treatment.confirmed = true;
    t8.treatment = { decision: "accept", confirmed: true, reason: "" };

    // ---- a decision recorded without what it rests on is never printed as a treatment ----
    // Each case is a copy of the demo with one thing taken away. What is read:
    // the Word text and its red runs, the workbook, the risk context and the pack.
    function variant(change) {
      var q = JSON.parse(JSON.stringify(p));
      change(q);
      var d = RX.buildWordDoc(q, {}), keep = RT.state.project, out;
      RT.state.project = q;
      try { out = { q: q, text: docText(d), red: runsOf(d).filter(function (r) { return r.color === "E00000"; }).map(function (r) { return r.text; }), S: RX.summarise(q), reg: RX.buildWorkbook(q).getWorksheet("Threat register"), ctx: RT.buildRiskContext(), items: w.RiskReview.packItems().items }; }
      finally { RT.state.project = keep; }
      out.item = function (id) { return out.items.filter(function (i) { return i.itemId === id; })[0]; };
      // Phase 4 review (wording 1): the position and the decisions are two sentences now (was: one tally).
      out.tally = (out.text.match(/Of the \d+ threats? above[^\n]*/) || [""])[0];
      out.decisions = (out.text.match(/The treatment decisions? (?:are|is): [^\n]*/) || [""])[0];
      return out;
    }
    // Reduce, with a tolerable residual rating and no countermeasure at all (T1 of Z1; T2 loses its cover too).
    var vR = variant(function (q) { q.zones[0].countermeasures = []; });
    ok(vR.red.filter(function (t) { return t === "Reduce with countermeasures (none recorded)"; }).length === 2 && vR.text.indexOf("Z1") !== -1 && (vR.S.threats[0].current || vR.S.threats[0].residual) === "medium",
      "Word: reduce with no covering countermeasure prints as none recorded, in red, whatever the residual rating", vR.red.join(" | "));
    // Phase 4b demo: T7 and T9 stay reduced, T5 being reduced, T4 through the SL-T programme (was: 1 reduced, 3 being reduced).
    ok(/^The treatment decisions are: 2 reduced to within tolerable risk, 1 being reduced with countermeasures, 1 treated through the SL-T programme and 1 accepted by the asset owner\. The register holds 3 existing and 3 planned countermeasures\.$/.test(vR.decisions) && vR.S.dispositionCounts.mitigated === 2 && vR.S.dispositionCounts.none === 2,
      "Word: and is counted in neither 'by countermeasures' clause of the summary", vR.decisions);
    ok(vR.red.some(function (t) { return t === "2 treatment decisions are incomplete: T1 (Z1), reduce with countermeasures (none recorded); T2 (Z1), reduce with countermeasures (none recorded)."; }) && vR.text.indexOf("no treatment decision recorded") === -1 && vR.text.indexOf("5/7") !== -1,
      "Word: the summary names the incomplete decisions, in red, apart from those with no decision", vR.red.join(" | "));
    ok(rc(vR.reg, 2, J).value === "Reduce with countermeasures (none recorded)" && rc(vR.reg, 2, M).value === "Open" && vR.ctx.zones[0].threats[0].disposition === null && vR.ctx.zones[0].threats[1].disposition === null,
      "Excel reads it as open, and the risk context exports no disposition for it", [rc(vR.reg, 2, J).value, rc(vR.reg, 2, M).value, vR.ctx.zones[0].threats[0].disposition].join(" | "));
    ok(vR.item("Z1:T1").status === "finding" && vR.item("Z1:T1").priority === "" && vR.item("Z1:T1").action === "", "the review pack holds it as a finding with no treatment decision, so the reviewer's check raises it", JSON.stringify([vR.item("Z1:T1").status, vR.item("Z1:T1").priority]));
    // Reduce, with a tolerable residual rating and only planned countermeasures.
    var vP = variant(function (q) { q.zones[0].countermeasures.forEach(function (m) { m.existing = false; }); });
    // Phase 4b demo: T7 and T9 stay reduced by their own existing countermeasures (was: 1 reduced, 5 being reduced).
    ok(rc(vP.reg, 2, J).value === "Reduce with countermeasures" && vP.ctx.zones[0].threats[0].disposition === "countermeasure" && vP.S.dispositionCounts.mitigated === 2 && /: 2 reduced to within tolerable risk, 3 being reduced with countermeasures/.test(vP.decisions),
      "a tolerable residual with only planned countermeasures is still being reduced, not reduced", rc(vP.reg, 2, J).value + " | " + vP.decisions);
    // Accept, with no reason.
    var vA = variant(function (q) { q.zones[3].threats[1].acceptance = ""; });
    // Phase 4b: "Accepted risks" is a section heading now, so what is checked is that the summary names no accepted
    // risk and the section holds none; the summary's pointer replaced "rationale is recorded".

      var bad = [], ver = (w.App.Version && w.App.Version.number) || "x.y.z";
      wb.eachSheet(function (ws) { ws.eachRow(function (row) { row.eachCell(function (c) { var v = c.value == null ? "" : String(c.value); if (/^\s*[-–—]\s*$/.test(v) || /[–—]/.test(v) || v.indexOf(ver) >= 0 || /\bZCR\b|\b4\.[2-8]\b/.test(v)) bad.push(ws.name + "!" + c.address + "=" + v); }); }); });
