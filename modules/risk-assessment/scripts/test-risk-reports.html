<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>risk-tool report export tests</title></head>
<body>
<h1>risk-tool report exports — Word + Excel on the completed demo project</h1>
<pre id="out">running…</pre>
<iframe id="app" src="../index.html?tour=1" style="width:10px;height:10px;visibility:hidden"></iframe>
<script>
(function () {
  "use strict";
  var lines = [], failures = 0;
  function ok(cond, name, detail) { if (cond) lines.push("PASS " + name); else { failures++; lines.push("FAIL " + name + (detail ? " — " + detail : "")); } }
  function done() { lines.push(""); lines.push(failures === 0 ? "ALL TESTS PASSED" : failures + " TEST(S) FAILED"); document.getElementById("out").textContent = lines.join("\n"); }

  var tries = 0;
  var t = setInterval(function () {
    var w = document.getElementById("app").contentWindow;
    if (!w || !w.RiskTool || !w.RiskExports || !w.ExcelJS || !w.docx ||
        (w.RiskTool.state.project.suc.name || "").indexOf("Acme") !== 0) {
      if (++tries > 300) { clearInterval(t); lines.push("FAIL app/exports/libs did not load seeded"); failures++; done(); }
      return;
    }
    clearInterval(t);
    var p = null;
    try { p = run(w); } catch (e) { failures++; lines.push("FAIL exception: " + (e && e.message) + "\n" + (e && e.stack)); }
    if (p && typeof p.then === "function") p.then(done, function (e) { failures++; lines.push("FAIL async: " + (e && e.message)); done(); });
    else done();
  }, 50);

  // Minimal docx mock (same pattern as the Assessments content tests) so the
  // Word document tree can be walked and asserted. Installed only for the
  // build call; the real patched lib stays loaded for actual use.
  function mockDocx() {
    function TextRun(o) { if (typeof o === "string") o = { text: o }; this.__t = "run"; this.text = o.text != null ? o.text : ""; this.bold = !!o.bold; this.color = o.color || null; }
    function Paragraph(o) { o = o || {}; this.__t = "p"; this.children = o.children || []; this.heading = o.heading || null; this.text = this.children.map(function (r) { return r && r.text != null ? r.text : ""; }).join(""); }
    function TableCell(o) { this.__t = "cell"; this.children = (o && o.children) || []; this.shading = (o && o.shading) || null; }
    function TableRow(o) { this.__t = "row"; this.children = (o && o.children) || []; }
    function Table(o) { this.__t = "table"; this.rows = (o && o.rows) || []; }
    function Header(o) { this.__t = "hdr"; this.children = (o && o.children) || []; }
    function Footer(o) { this.__t = "ftr"; this.children = (o && o.children) || []; }
    function PageBreak() { this.__t = "br"; this.text = ""; }
    function ImageRun(o) { this.__t = "img"; this.data = (o && o.data) || null; this.floating = (o && o.floating) || null; }
    function Document(o) { this.__t = "doc"; this.sections = (o && o.sections) || []; }
    return {
      Document: Document, Paragraph: Paragraph, TextRun: TextRun, Table: Table, TableRow: TableRow, TableCell: TableCell,
      Header: Header, Footer: Footer, PageBreak: PageBreak, ImageRun: ImageRun,
      HeadingLevel: { HEADING_1: "h1", HEADING_2: "h2", HEADING_3: "h3", TITLE: "t" },
      WidthType: { DXA: "dxa", PERCENTAGE: "pct" },
      ShadingType: { SOLID: "solid" },
      TableLayoutType: { FIXED: "fixed" },
      AlignmentType: { LEFT: "l", CENTER: "c", RIGHT: "r" },
      HeightRule: { ATLEAST: "atLeast", EXACT: "exact" },
      PageNumber: { CURRENT: "current" },
      PageOrientation: { PORTRAIT: "portrait" },
      Packer: { toBlob: function () { return Promise.resolve(new Blob(["x"])); } }
    };
  }
  function docText(doc) {
    var out = [];
    (function walk(n) {
      if (!n) return;
      if (n.__t === "p") { out.push(n.text); return; }
      if (n.__t === "table") { n.rows.forEach(walk); return; }
      if (n.__t === "row" || n.__t === "cell") { n.children.forEach(walk); return; }
      if (Array.isArray(n)) n.forEach(walk);
    })(doc.sections.map(function (s) { return s.children; }));
    return out.join("\n");
  }

  function run(w) {
    var RT = w.RiskTool, RX = w.RiskExports;
    w.confirm = function () { return true; };
    w.alert = function () {};
    var p = RT.state.project;

    ok(!!w.docx && !!w.ExcelJS && !!RX, "vendor libs and RiskExports loaded by index.html");
    ok(!!(w.App && w.App.Assets && w.App.Assets.logo && w.App.Assets.coverBg && w.App.Assets.logoCard), "brand assets (logo + cover art) loaded by index.html");
    ok(p.engagement && p.engagement.client === "Acme Petrochemicals Ltd", "tour project carries engagement details");

    // ---- Word (full) via the mock ----
    var realDocx = w.docx;
    w.docx = mockDocx();
    var doc = RX.buildWordDoc(p, {});
    var text = docText(doc);
    ok(!!doc && doc.sections.length === 2, "full Word doc builds (cover + body)");
    ok(text.indexOf("OT CYBER RISK ASSESSMENT") !== -1 && text.indexOf("OT Cyber Risk") !== -1, "Design-B cover carries the kicker and title lines");
    ok(text.indexOf("www.solutionspt.com") !== -1 && text.indexOf("CLASSIFICATION") !== -1, "cover carries the SolutionsPT address block and issue/author/classification line");
    ok(text.indexOf("Acme Petrochemicals Ltd") !== -1 && text.indexOf("Unit 300") !== -1, "cover + document control carry the engagement client and SUC");
    (function () { // cover hero: floating background image behind the text, plus the logo card
      var imgs = [];
      (function walk(n) {
        if (!n) return;
        if (n.__t === "img") { imgs.push(n); return; }
        if (n.__t === "p" || n.__t === "cell" || n.__t === "hdr") { n.children.forEach(walk); return; }
        if (n.__t === "table") { n.rows.forEach(walk); return; }
        if (n.__t === "row") { n.children.forEach(walk); return; }
        if (Array.isArray(n)) n.forEach(walk);
      })(doc.sections[0].children);
      ok(imgs.length >= 2 && imgs.some(function (i) { return i.floating && i.floating.behindDocument; }), "cover section embeds the hero background (floating, behind text) and the logo card");
    })();
    ok(text.indexOf("Risk at a glance") !== -1 && text.indexOf("threats registered") !== -1 && text.indexOf("above tolerable (Medium)") !== -1, "scorecard page: headline tiles present");
    ok(text.indexOf("Risk profile by zone and conduit") !== -1 && text.indexOf("Z2 Safety Instrumented System") !== -1, "scorecard page: per-zone/conduit risk bars");
    ok(text.indexOf("Target security levels: worst case per foundational requirement") !== -1, "scorecard page: SL-T tile strip");
    ok(text.indexOf("Where to focus first") !== -1, "scorecard page: focus cards");
    ok(text.indexOf("Executive summary") !== -1 && text.indexOf("9 threats were registered") !== -1, "exec summary composed from the data (9 threats)");
    ok(text.indexOf("Why this assessment") !== -1 && text.indexOf("What this report is") !== -1 && text.indexOf("What we found") !== -1 && text.indexOf("What happens next") !== -1, "exec summary has the why/what/found/next structure");
    ok(text.indexOf("essential functions in scope are") !== -1 && text.indexOf("assumed adversary is SL3 grade") !== -1, "exec summary states the operational stakes and adversary assumption from the SRS");
    ok(text.indexOf("The findings are based on") !== -1 && text.indexOf("4 interviews") !== -1, "exec summary cites the evidence base (basis of assessment)");
    ok(text.indexOf("The assessment follows IEC 62443-3-2.") !== -1 && text.indexOf("Three artefacts") === -1 && text.indexOf("this document") === -1, "exec summary says what the assessment did, without talking about the document itself");
    ok(text.indexOf("Repeat this assessment after a significant change") !== -1, "exec summary sets the revisit expectation");
    ok(/exceed the tolerable risk of Medium/.test(text), "exec summary names the tolerable risk");
    ok(/The most affected is Z\d/.test(text) && text.indexOf("The highest unmitigated risk is") !== -1, "exec summary says where the risk concentrates and names the worst threat");
    ok(/Of the 7 threats above tolerable risk, 2 are reduced to within tolerable risk by countermeasures, 4 are being reduced with countermeasures and 1 is formally accepted by the asset owner\./.test(text), "treatment tally counts the confirmed decisions, and leaves out what there is none of", (text.match(/Of the [0-9]+ threats above.*/) || [""])[0]);
    ok(/Accepted risk T8 \(Z4\): /.test(text) && text.indexOf("revisited at the next assessment") !== -1, "the accepted risk is named in the summary");
    ok(text.indexOf("no treatment decision recorded") === -1 && text.indexOf("No decision recorded") === -1 && text.indexOf("7/7") !== -1 && text.indexOf("with a treatment decision") !== -1, "the demo, every decision confirmed, prints no missing decision");
    ok(/ceiling is set by/.test(text) && text.indexOf("IEC 62443-3-3 assessment against these targets") !== -1, "SL-T outcome paragraph names the ceiling driver and the 3-3 handoff");
    ok(text.indexOf("Delete this note.") !== -1, "red consultant tailor-me note present");
    ok(text.indexOf("High-level risk ranking") !== -1 && text.indexOf("Laboratory information system link") !== -1, "high-level risk ranking table present with all systems");
    ok(text.indexOf("The assessment follows IEC 62443-3-2:2020.") !== -1 && text.split("62443-3-2:2020").length === 2, "the method text names the edition, once");
    ok(text.indexOf("Security functions that must be kept") !== -1 && text.indexOf("Mandatory security functions") === -1, "the security functions heading says what it holds");
    ok(text.indexOf("Z2: Safety Instrumented System") !== -1 && text.indexOf("T4") !== -1, "zone threat registers present");
    ok(text.indexOf("risk acceptance: Accepted by R. Calder") !== -1, "the recorded acceptance text prints in full");
    ok(text.indexOf("Target security levels") !== -1 && /Worst case/.test(text) && /SL3/.test(text), "SL-T matrix with worst-case row");
    ok(text.indexOf("Justification for Z2") !== -1 && text.indexOf("SIS floor applies") !== -1, "per-zone SL-T justifications print");
    ok(text.indexOf("Sign-off") !== -1 && text.indexOf("R. Calder (Asset Owner - Unit 300)") !== -1, "sign-off section carries the approval");
    ok(text.indexOf("Method and limitations") !== -1 && text.indexOf("house defaults") !== -1, "limitations state the house-matrix caveat");
    ok(text.indexOf("undefined") === -1 && text.indexOf("[object") === -1, "no undefined/object leaks in the Word text");
    (function () { // prose style rule: no em-dashes in running text (table cells may use the dash as an empty placeholder)
      var prose = doc.sections[1].children.filter(function (n) { return n.__t === "p"; }).map(function (n) { return n.text; }).join("\n");
      ok(prose.indexOf("—") === -1, "no em-dashes in the report prose");
    })();

    // ---- Word (high-level only) ----
    var hl = RX.buildWordDoc(p, { highLevelOnly: true });
    var hlText = docText(hl);
    ok(hlText.indexOf("High-Level OT Cyber") !== -1 && hlText.indexOf("High-level risk ranking") !== -1 && hlText.indexOf("the high-level cyber security risk assessment") !== -1, "high-level variant builds with the ranking");
    ok(hlText.indexOf("Risk at a glance") !== -1 && hlText.indexOf("systems ranked") !== -1 && hlText.indexOf("Where to look first") !== -1, "high-level variant has its own scorecard page");
    // Phase 3a: the candidates are the systems above tolerable risk (was: ranked High or above), and the decision is per zone, not per system.
    ok(hlText.indexOf("The systems above the tolerable risk of Medium (") !== -1 && hlText.indexOf("are the candidates for a detailed assessment") !== -1 && hlText.indexOf("Delete this note.") !== -1, "high-level exec summary names the candidates above tolerable risk and carries the tailor-me note");
    ok(hlText.indexOf("Why this assessment") !== -1 && hlText.indexOf("which justify a detailed assessment") !== -1 && hlText.indexOf("What happens next") !== -1, "high-level exec summary has the why/what/next structure");
    ok(!/per-system|detailed tier|promoted|Promoted|ranked High or above/.test(hlText + "\n" + text), "neither report speaks of promotion, a detailed tier or per-system assessment", (( hlText + "\n" + text).match(/[^\n]*(per-system|detailed tier|promoted|Promoted|ranked High or above)[^\n]*/) || [""])[0]);
    ok(text.indexOf("C1 and C3 were found not to need a detailed assessment") !== -1 && text.indexOf("Threats to the others were rated") !== -1, "the detailed method says which conduits the comparison found need no detailed assessment, and rates the others' threats");
    ok(hlText.indexOf("Target security levels") === -1 && hlText.indexOf("Zones, conduits and the detailed") === -1, "high-level variant omits the detailed tier");
    ok(hlText.indexOf("Sign-off") !== -1, "high-level variant still carries sign-off");

    // ---- deliverables carry names and judgement: no raw ids, no capitals for emphasis ----
    ok(!/NO DISPOSITION|WORST CASE|Dispositioned|dispositioned/.test(text), "Word: no capitals for emphasis, no 'dispositioned'");
    ok(!/safety-plc|engineering-workstation|\(plc\)|\(hmi\)|remote-access|sis-present|internet-adjacent|many-conduits/.test(text), "Word: no flag or asset-type ids",
      (text.match(/safety-plc|engineering-workstation|\(plc\)|\(hmi\)|remote-access|sis-present|internet-adjacent|many-conduits/) || [""])[0]);
    // Phase 3b: exposure is a row of each zone's characteristics table (label cell, then value cell).
    ok(text.indexOf("(Safety PLC)") !== -1 && text.indexOf("(PLC)") !== -1 && /\nExposure\n[a-z ,]*remote access/i.test(text), "Word: asset types and exposure print as names");
    ok(!/Very-high|very-high/.test(text), "Word: no band id");
    ok(text.indexOf("Reduced to within tolerable risk") !== -1 && text.indexOf("Reduce with countermeasures") !== -1 && text.indexOf("Risk accepted") !== -1 && text.indexOf("Within tolerable risk") !== -1,
      "Word: each confirmed decision prints in plain words");

    // ---- an unconfirmed suggestion prints as no decision, in red ----
    function runsOf(d) {
      var out = [];
      (function walk(n) {
        if (!n) return;
        if (n.__t === "run") { out.push(n); return; }
        if (n.__t === "p" || n.__t === "cell" || n.__t === "row") { n.children.forEach(walk); return; }
        if (n.__t === "table") { n.rows.forEach(walk); return; }
        if (Array.isArray(n)) n.forEach(walk);
      })(d.sections[1].children);
      return out;
    }
    var z1 = p.zones[0], t2 = z1.threats[1], t8 = p.zones[3].threats[1];
    t2.treatment.confirmed = false;                  // still "reduce", and M2 still covers it: a suggestion only
    t8.treatment = { decision: null, confirmed: false, reason: "" }; // the acceptance text is still there, with no decision
    var undecided = RX.buildWordDoc(p, {}), uText = docText(undecided);
    var redRuns = runsOf(undecided).filter(function (r) { return r.color === "E00000"; }).map(function (r) { return r.text; });
    ok(redRuns.filter(function (t) { return t === "No decision recorded"; }).length === 2, "Word: the two threats with no confirmed decision say so in red, in their registers", redRuns.join(" | "));
    ok(redRuns.some(function (t) { return /^2 threats above tolerable risk have no treatment decision recorded: T2 \(Z1\), T8 \(Z4\)\.$/.test(t); }), "Word: and the executive summary names them, in red", redRuns.join(" | "));
    ok(uText.indexOf("5/7") !== -1 && /no decision recorded/.test(uText) && uText.indexOf("NO DISPOSITION") === -1, "Word: the scorecard counts only confirmed decisions");
    ok(uText.indexOf("formally accepted by the asset owner") === -1 && uText.indexOf("risk acceptance: Accepted by R. Calder") === -1, "Word: acceptance text with no confirmed decision is not printed as an acceptance");
    ok(/Of the 7 threats above tolerable risk, 2 are reduced to within tolerable risk by countermeasures and 3 are being reduced with countermeasures\./.test(uText), "Word: the tally leaves the undecided out", (uText.match(/Of the \d+ threats above[^\n]*/) || [""])[0]);
    var uWb = RX.buildWorkbook(p), uTr = uWb.getWorksheet("Threat register");
    ok(String(uTr.getCell("J3").value) === "No decision recorded" && String(uTr.getCell("M3").value) === "Open" && String(uTr.getCell("L9").value) === "", "Excel: no confirmed decision reads as no decision, open, with no reason",
      [uTr.getCell("J3").value, uTr.getCell("M3").value, uTr.getCell("L9").value].join(" | "));
    var S2 = RX.summarise(p);
    ok(S2.threats.filter(function (x) { return x.exceeds && !x.decided; }).length === 2 && S2.dispositionCounts.none === 2, "the shared summary counts them as undecided");
    t2.treatment.confirmed = true;
    t8.treatment = { decision: "accept", confirmed: true, reason: "" };

    // ---- a decision recorded without what it rests on is never printed as a treatment ----
    // Each case is a copy of the demo with one thing taken away. What is read:
    // the Word text and its red runs, the workbook, the risk context and the pack.
    function variant(change) {
      var q = JSON.parse(JSON.stringify(p));
      change(q);
      var d = RX.buildWordDoc(q, {}), keep = RT.state.project, out;
      RT.state.project = q;
      try { out = { q: q, text: docText(d), red: runsOf(d).filter(function (r) { return r.color === "E00000"; }).map(function (r) { return r.text; }), S: RX.summarise(q), reg: RX.buildWorkbook(q).getWorksheet("Threat register"), ctx: RT.buildRiskContext(), items: w.RiskReview.packItems().items }; }
      finally { RT.state.project = keep; }
      out.item = function (id) { return out.items.filter(function (i) { return i.itemId === id; })[0]; };
      out.tally = (out.text.match(/Of the \d+ threats? above[^\n]*/) || [""])[0];
      return out;
    }
    // Reduce, with a tolerable residual rating and no countermeasure at all (T1 of Z1; T2 loses its cover too).
    var vR = variant(function (q) { q.zones[0].countermeasures = []; });
    ok(vR.red.filter(function (t) { return t === "Reduce with countermeasures (none recorded)"; }).length === 2 && vR.text.indexOf("Z1") !== -1 && vR.S.threats[0].residual === "medium",
      "Word: reduce with no covering countermeasure prints as none recorded, in red, whatever the residual rating", vR.red.join(" | "));
    ok(/^Of the 7 threats above tolerable risk, 1 is reduced to within tolerable risk by countermeasures, 3 are being reduced with countermeasures and 1 is formally accepted by the asset owner\. The register holds 3 existing and 1 planned countermeasures.$/.test(vR.tally) && vR.S.dispositionCounts.mitigated === 1 && vR.S.dispositionCounts.none === 2,
      "Word: and is counted in neither 'by countermeasures' clause of the summary", vR.tally);
    ok(vR.red.some(function (t) { return t === "2 treatment decisions are incomplete: T1 (Z1), reduce with countermeasures (none recorded); T2 (Z1), reduce with countermeasures (none recorded)."; }) && vR.text.indexOf("no treatment decision recorded") === -1 && vR.text.indexOf("5/7") !== -1,
      "Word: the summary names the incomplete decisions, in red, apart from those with no decision", vR.red.join(" | "));
    ok(vR.reg.getCell("J2").value === "Reduce with countermeasures (none recorded)" && vR.reg.getCell("M2").value === "Open" && vR.ctx.zones[0].threats[0].disposition === null && vR.ctx.zones[0].threats[1].disposition === null,
      "Excel reads it as open, and the risk context exports no disposition for it", [vR.reg.getCell("J2").value, vR.reg.getCell("M2").value, vR.ctx.zones[0].threats[0].disposition].join(" | "));
    ok(vR.item("Z1:T1").status === "finding" && vR.item("Z1:T1").priority === "" && vR.item("Z1:T1").action === "", "the review pack holds it as a finding with no treatment decision, so the reviewer's check raises it", JSON.stringify([vR.item("Z1:T1").status, vR.item("Z1:T1").priority]));
    // Reduce, with a tolerable residual rating and only planned countermeasures.
    var vP = variant(function (q) { q.zones[0].countermeasures.forEach(function (m) { m.existing = false; }); });
    ok(vP.reg.getCell("J2").value === "Reduce with countermeasures" && vP.ctx.zones[0].threats[0].disposition === "countermeasure" && vP.S.dispositionCounts.mitigated === 1 && /1 is reduced to within tolerable risk by countermeasures, 5 are being reduced with countermeasures/.test(vP.tally),
      "a tolerable residual with only planned countermeasures is still being reduced, not reduced", vP.reg.getCell("J2").value + " | " + vP.tally);
    // Accept, with no reason.
    var vA = variant(function (q) { q.zones[3].threats[1].acceptance = ""; });
    ok(vA.red.indexOf("Accept (no reason recorded)") !== -1 && vA.text.indexOf("formally accepted by the asset owner") === -1 && vA.text.indexOf("Accepted risk") === -1 && vA.text.indexOf("rationale is recorded") === -1 && vA.text.indexOf("Risk accepted") === -1,
      "Word: an acceptance with no reason is not printed as formally accepted, nor its rationale as recorded", vA.tally);
    ok(vA.red.some(function (t) { return t === "1 treatment decision is incomplete: T8 (Z4), accept (no reason recorded)."; }) && vA.reg.getCell("J9").value === "Accept (no reason recorded)" && vA.reg.getCell("M9").value === "Open" && vA.ctx.zones[3].threats[1].disposition === null,
      "it is named as incomplete, open in Excel, and exported with no disposition", vA.red.join(" | "));
    ok(vA.item("Z4:T8").status === "finding" && vA.item("Z4:T8").priority === "" && vA.item("Z4:T8").notes === "", "and the review pack leaves its treatment decision empty");
    // Treat through the SL-T, with no SL-T set on a requirement it affects and no reason.
    function z3slt(reason) { return function (q) { q.zones[2].slTargetByFR.RDF = null; q.zones[2].threats[0].treatment = { decision: "slt", confirmed: true, reason: reason }; }; }
    var vS = variant(z3slt(""));
    ok(vS.red.indexOf("Treat through the SL-T programme (no SL-T set)") !== -1 && vS.text.indexOf("Treated through the SL-T programme") === -1 && vS.text.indexOf("treated through the target security level programme") === -1 && vS.S.dispositionCounts["sl-t"] === 0,
      "Word: the SL-T programme with no SL-T set and no reason is not printed or counted as a treatment", vS.tally);
    ok(vS.ctx.zones[2].threats[0].disposition === null && vS.item("Z3:T5").priority === "" && vS.item("Z3:T5").status === "finding" && vS.reg.getCell("M6").value === "Open", "nor exported, packed or tracked as one");
    // With its reason it is a recorded treatment, and the reason is printed with it.
    var vT = variant(z3slt("Raised in phase 2 of the programme."));
    ok(vT.text.indexOf("T5 treated through the SL-T programme: Raised in phase 2 of the programme.") !== -1 && /1 is treated through the target security level programme/.test(vT.tally) && vT.red.indexOf("Treated through the SL-T programme") === -1 && vT.text.indexOf("Treated through the SL-T programme") !== -1,
      "Word: a reasoned SL-T decision prints as treated, is counted, and its reason is printed under the register", vT.tally);
    ok(vT.reg.getCell("J6").value === "Treated through the SL-T programme" && vT.reg.getCell("L6").value === "Raised in phase 2 of the programme." && vT.reg.getCell("M6").value === "Decided" && vT.ctx.zones[2].threats[0].disposition === "sl-t",
      "Excel carries the reason beside the decision, and the risk context exports it", [vT.reg.getCell("J6").value, vT.reg.getCell("L6").value].join(" | "));
    var why = vT.item("Z3:T5").details.filter(function (r) { return r[0] === "Reason for treating through the SL-T"; });
    ok(why.length === 1 && why[0][1] === "Raised in phase 2 of the programme." && vT.item("Z3:T5").priority === "Treated through the SL-T programme" && !vS.item("Z3:T5").details.some(function (r) { return /Reason for treating/.test(r[0]); }),
      "the review pack shows the reason as a detail row, and no such row without one");
    // The decision is changed to reduce: the SL-T reason left behind is not printed against it.
    var vC = variant(function (q) { z3slt("Raised in phase 2 of the programme.")(q); q.zones[2].threats[0].treatment.decision = "reduce"; });
    ok(vC.reg.getCell("J6").value === "Reduce with countermeasures" && vC.reg.getCell("L6").value === "" && vC.text.indexOf("Raised in phase 2") === -1 && !vC.item("Z3:T5").details.some(function (r) { return /Reason for treating/.test(r[0]); }),
      "a reason typed for the SL-T is not printed once the decision is reduce, in Excel, Word or the pack", String(vC.reg.getCell("L6").value));
    // One threat above tolerable risk, and acceptance as the only decision: the sentence still reads.
    var vOne = variant(function (q) { q.zones.concat(q.conduits).forEach(function (o) { o.threats.forEach(function (t) { if (t.id !== "T1") { t.likelihood = "low"; t.impact = "minor"; } }); }); });
    ok(/^Of the 1 threat above tolerable risk, 1 is reduced to within tolerable risk by countermeasures\./.test(vOne.tally), "Word: with one threat above tolerable risk the tally says 'threat'", vOne.tally);
    var vAcc = variant(function (q) { q.zones.concat(q.conduits).forEach(function (o) { o.threats.forEach(function (t) { if (t.id !== "T8") t.treatment = { decision: null, confirmed: false, reason: "" }; }); }); });
    ok(/^Of the 7 threats above tolerable risk, 1 is formally accepted by the asset owner\./.test(vAcc.tally), "Word: with acceptance the only decision the tally still has its verb", vAcc.tally);

    // ---- a zone holding two ranked systems, and a system in two zones (phase 3a: zone.hlaIds) ----
    // The screen, both Word reports, the Excel ranking and the risk context read the same assignment.
    function multi(change) {
      var q = JSON.parse(JSON.stringify(p));
      q.zones[0].hlaIds = ["A1", "A5"]; q.zones[0].fromHLA = "A1";   // Z1 holds the BPCS and the lab link
      q.zones[2].hlaIds = ["A3", "A1"]; q.zones[2].fromHLA = "A3";   // and the BPCS sits in Z3 too
      if (change) change(q);
      var keep = RT.state.project, keepStage = RT.state.stage, out = {};
      out.hl = docText(RX.buildWordDoc(q, { highLevelOnly: true }));
      out.det = docText(RX.buildWordDoc(q, {}));
      out.rk = RX.buildWorkbook(q).getWorksheet("Ranking");
      RT.state.project = q;
      try {
        out.ctx = RT.buildRiskContext();
        RT.navigate("srs");
        out.screen = function (id) { var r = w.document.querySelector('#main [data-hla-id="' + id + '"]'); return r ? [].map.call(r.querySelectorAll(".assign-zone"), function (x) { return x.firstChild.textContent; }).join(", ") : null; };
        out.a1 = out.screen("A1"); out.a5 = out.screen("A5");
      } finally { RT.state.project = keep; RT.state.stage = keepStage; RT.render(); }
      out.rkZone = function (name) { var v = null; out.rk.eachRow(function (row, i) { if (i > 1 && row.getCell(1).value === name) v = String(row.getCell(6).value || ""); }); return v; };
      return out;
    }
    var BPCS = "Unit 300 BPCS (DCS servers, HMIs, unit PLCs)", LAB = "Laboratory information system link";
    var vM = multi();
    ok(vM.a1 === "Z1, Z3" && vM.a5 === "Z1", "screen: step 2 shows the BPCS in Z1 and Z3, and the lab link in Z1", vM.a1 + " | " + vM.a5);
    ok(vM.hl.indexOf(BPCS + "  → Z1, Z3") !== -1 && vM.hl.indexOf(LAB + "  → Z1") !== -1 && vM.det.indexOf(LAB + "  → Z1") !== -1, "Word: both reports' ranking list every zone of each system");
    ok(vM.hl.indexOf("An arrow marks the zones a system is assigned to.") !== -1 && !/detailed tier|promoted/.test(vM.hl), "Word: the arrow is described as the assignment, not as a detailed tier");
    ok(vM.rkZone(BPCS) === "Z1, Z3" && vM.rkZone(LAB) === "Z1", "Excel: the Ranking sheet's Zone column lists every zone", vM.rkZone(BPCS) + " | " + vM.rkZone(LAB));
    ok(/\n5\nfor detailed assessment/.test(vM.hl) && vM.hl.indexOf("; 5 ranked systems are in zones taken to a detailed assessment.") !== -1, "Word: the tile and the summary count distinct ranked systems (5), not zones (4)", (vM.hl.match(/[^\n]*in zones taken[^\n]*/) || [""])[0]);
    ok(vM.ctx.zones[0].fromHighLevelAsset === "A1" && vM.ctx.zones[2].fromHighLevelAsset === "A3" && vM.ctx.schema === "spt-risk-context/1.4", "the risk context keeps its one frozen field, the first system of each zone");
    var vM2 = multi(function (q) { q.zones[0].detailed = { required: false, reason: "Isolated by a data diode." }; });
    ok(vM2.hl.indexOf("; 4 ranked systems are in zones taken to a detailed assessment.") !== -1 && /\n4\nfor detailed assessment/.test(vM2.hl) && vM2.hl.indexOf(LAB + "  → Z1") !== -1,
      "Word: a zone recorded as Not required takes its only system out of the count (the BPCS stays, through Z3), and the ranking still shows the assignment");
    // A high-level-only assessment: the decision is per ranked system, and the summary follows it.
    var vH = multi(function (q) {
      q.assessmentType = "high-level";
      q.srs.highLevelAssets[0].detailed = { required: false, reason: "Retired next quarter." };
      q.srs.highLevelAssets[1].detailed = { required: true, reason: "" };
      q.srs.highLevelAssets[4].detailed = { required: true, reason: "Feeds the batch release." };
    });
    var hlFound = (vH.hl.match(/[^\n]*systems were ranked[^\n]*/) || [""])[0];
    ok(hlFound.indexOf("are the candidates for a detailed assessment") !== -1 && hlFound.split("are the candidates")[0].indexOf(BPCS) === -1 && hlFound.indexOf("A detailed assessment was judged not needed for " + BPCS + ": retired next quarter.") !== -1,
      "Word, high-level only: a system recorded as Not required leaves the candidates, with its reason", hlFound);
    ok(hlFound.indexOf("A detailed assessment was also judged needed for " + LAB + ": feeds the batch release.") !== -1 && /\n2\nfor detailed assessment/.test(vH.hl), "and one recorded as Required below tolerable risk is named, and the tile counts the two recorded as Required", hlFound);
    w.docx = realDocx;

    // ---- Word packs to a real .docx blob with the real (patched) lib ----
    var realDoc = RX.buildWordDoc(p, {});
    var packPromise = w.docx.Packer.toBlob(realDoc).then(function (blob) {
      ok(blob && blob.size > 5000, "real docx lib packs the report to a non-trivial blob", blob && ("size " + blob.size));
      return w.App.DocxBlocks.unzip(blob);
    }).then(function (parts) {
      var xml = new w.TextDecoder().decode(parts.filter(function (x) { return x.name === "word/document.xml"; })[0].bytes);
      // Phase 3b: the drawing is part of the requirements specification, under Zone and conduit
      // drawings, ahead of the characteristics (was: at the top of the zones section).
      var zonesAt = xml.indexOf(">Zone and conduit drawings<"), mapAt = xml.indexOf("name=\"zone-map\"");
      var firstZone = xml.indexOf(">Zone and conduit characteristics<", zonesAt);
      ok(zonesAt > 0 && mapAt > zonesAt && mapAt < firstZone, "the zone and conduit drawing is in the report, at the top of the zones section", zonesAt + " / " + mapAt + " / " + firstZone);
      var pngs = parts.filter(function (x) { return /^word\/media\//.test(x.name) && x.bytes[0] === 0x89 && x.bytes[1] === 0x50; });
      ok(pngs.some(function (x) { return x.bytes.length > 8000; }), "and it is a real picture", pngs.map(function (x) { return x.name + " " + x.bytes.length; }).join(", "));
      return w.docx.Packer.toBlob(RX.buildWordDoc(p, { highLevelOnly: true })).then(function (b) { return w.App.DocxBlocks.unzip(b); }).then(function (hp) {
        var hx = new w.TextDecoder().decode(hp.filter(function (x) { return x.name === "word/document.xml"; })[0].bytes);
        ok(hx.indexOf("zone-map") === -1, "the high-level report has no drawing");
      });
    });

    // ---- Excel via the real ExcelJS ----
    var wb = RX.buildWorkbook(p);
    var names = wb.worksheets.map(function (ws) { return ws.name; }).join(",");
    ok(names === "Front,Ranking,Threat register,Zones,Conduits,Countermeasures,SL-T,Basis", "workbook has the eight sheets", names);
    var front = wb.getWorksheet("Front");
    ok(front.getCell("B2").value === "Acme Petrochemicals Ltd", "Front carries the client");
    ok(/R\. Calder/.test(String(front.getCell("B13").value)), "Front carries the sign-off");
    var tr = wb.getWorksheet("Threat register");
    ok(tr.rowCount === 10, "threat register = header + 9 threats", String(tr.rowCount));
    ok(String(tr.getCell("H2").value).length > 0, "risk band cells filled");
    ok(tr.getCell("J1").value === "Treatment decision" && tr.getCell("J2").value === "Reduced to within tolerable risk" && tr.getCell("J3").value === "Reduce with countermeasures" && tr.getCell("J4").value === "Within tolerable risk" && tr.getCell("J9").value === "Risk accepted",
      "Excel: the register prints each confirmed decision in plain words", [tr.getCell("J2").value, tr.getCell("J3").value, tr.getCell("J4").value, tr.getCell("J9").value].join(" | "));
    ok(tr.getCell("I2").value === "Yes" && tr.getCell("I4").value === "No" && tr.getCell("M2").value === "Decided" && /^Accepted by R\. Calder/.test(String(tr.getCell("L9").value)) && tr.getCell("F2").value === "High" && tr.getCell("G2").value === "Serious",
      "Excel: no capitals for emphasis, scale names for ratings, the acceptance reason beside its decision");
    (function () {
      var all = [];
      wb.worksheets.forEach(function (ws) { ws.eachRow(function (row) { row.eachCell(function (c) { all.push(String(c.value)); }); }); });
      var joined = all.join("\n");
      ok(!/NO DISPOSITION|WORST CASE|\bYES\b|Dispositioned|safety-plc|\(plc\)|remote-access|sis-present|very-high/.test(joined), "Excel: no capitals for emphasis and no raw ids anywhere in the workbook",
        (joined.match(/NO DISPOSITION|WORST CASE|\bYES\b|Dispositioned|safety-plc|\(plc\)|remote-access|sis-present|very-high/) || [""])[0]);
    })();
    var dv = tr.getCell("M2").dataValidation;
    ok(!!dv && dv.type === "list", "Status column has the dropdown validation");
    ok(!!tr.autoFilter, "threat register is autofiltered");
    var sl = wb.getWorksheet("SL-T");
    ok(sl.getCell("A1").value === "Zone / conduit" && String(sl.getCell("B3").value) === "SL3", "SL-T matrix rows present (Z2 IAC SL3)");
    var worstRow = sl.getRow(sl.rowCount);
    ok(String(worstRow.getCell(1).value) === "Worst case" && String(worstRow.getCell(2).value) === "SL3", "worst-case SL-T row present, not in capitals");
    var rk = wb.getWorksheet("Ranking");
    ok(rk.rowCount === 7, "ranking sheet = header + 6 systems", String(rk.rowCount));
    var cm = wb.getWorksheet("Countermeasures");
    ok(cm.rowCount === 8, "countermeasures sheet = header + 7 measures", String(cm.rowCount));

    // ---- Excel writes a real .xlsx buffer ----
    var xlsxPromise = wb.xlsx.writeBuffer().then(function (buf) {
      ok(buf && buf.byteLength > 8000, "ExcelJS writes a non-trivial xlsx buffer", buf && ("bytes " + buf.byteLength));
    });

    // ---- builders survive an EMPTY project (no crashes on day one) ----
    var fresh = JSON.parse(JSON.stringify({ schema: "spt-risk-project/0.2", suc: { name: "", description: "", scopeStatement: "", assumptions: [] }, zones: [], conduits: [] }));
    RT.loadProjectText(JSON.stringify(fresh));
    var emptyP = RT.state.project;
    w.docx = mockDocx();
    var emptyDoc = RX.buildWordDoc(emptyP, {});
    ok(!!emptyDoc && docText(emptyDoc).indexOf("not yet signed off") !== -1, "Word builder handles an empty project");
    w.docx = realDocx;
    var emptyWb = RX.buildWorkbook(emptyP);
    ok(emptyWb.worksheets.length === 8, "Excel builder handles an empty project");

    return Promise.all([packPromise, xlsxPromise]);
  }
})();
</script>
</body>
</html>
