<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>risk-tool tests</title></head>
<body>
<h1>risk-tool engine tests (detailed risk assessment)</h1>
<pre id="out">running…</pre>
<iframe id="app" src="../index.html" style="width:10px;height:10px;visibility:hidden"></iframe>
<script>
(function () {
  "use strict";
  var lines = [], failures = 0;
  function ok(cond, name, detail) { if (cond) lines.push("PASS " + name); else { failures++; lines.push("FAIL " + name + (detail ? " — " + detail : "")); } }
  function done() { lines.push(""); lines.push(failures === 0 ? "ALL TESTS PASSED" : failures + " TEST(S) FAILED"); document.getElementById("out").textContent = lines.join("\n"); }

  var tries = 0;
  var t = setInterval(function () {
    var w = document.getElementById("app").contentWindow;
    if (!w || !w.RiskTool) { if (++tries > 100) { clearInterval(t); lines.push("FAIL app did not expose RiskTool"); failures++; done(); } return; }
    clearInterval(t);
    var p = null;
    try { p = run(w); } catch (e) { failures++; lines.push("FAIL exception: " + (e && e.message) + "\n" + (e && e.stack)); }
    if (p && typeof p.then === "function") {
      p.then(done, function (e) { failures++; lines.push("FAIL async exception: " + (e && e.message) + "\n" + (e && e.stack)); done(); });
    } else {
      done();
    }
  }, 50);

  function run(w) {
    var RT = w.RiskTool, RULES = w.App.Data.sltRules, proj = RT.state.project;

    // Headless Edge blocks on native confirm()/alert(); stub them. Default to
    // "yes" so the loadProjectText round-trips below proceed past the new Load
    // guard; individual tests override w.confirm to exercise the guard both ways.
    w.confirm = function () { return true; };
    w.alert = function () {};

    // --- risk matrix (house) ---
    ok(RT.riskFor("negligible", "high") === "low", "negligible×high -> low");
    ok(RT.riskFor("serious", "medium") === "high", "serious×medium -> high");
    ok(RT.riskFor("severe", "high") === "very-high", "severe×high -> very-high");
    ok(RT.riskFor("serious", "low") === "medium", "serious×low -> medium");
    ok(RT.riskFor("minor", "") === null, "missing likelihood -> null risk");

    // --- tolerable risk comparison ---
    proj.srs.tolerableRisk = "medium";
    ok(RT.exceedsTolerable("high", "medium") === true, "high exceeds medium tolerable");
    ok(RT.exceedsTolerable("medium", "medium") === false, "medium does not exceed medium tolerable");
    ok(RT.exceedsTolerable("low", "medium") === false, "low within tolerable");

    // --- per-FR suggestion from threats ---
    var z = RT.emptyZone(1); z.name = "BPCS"; proj.zones.push(z);
    var s = RT.suggestZone(z, proj);
    ok(s.byFR.IAC.sl === null && s.worstRisk === null, "no threats -> no per-FR suggestion");

    var th = RT.emptyThreat(1);
    th.statement = "External attacker via vendor VPN reaches PLCs.";
    th.source = "External attacker"; th.affectedFR = ["IAC", "RDF"];
    th.likelihood = "high"; th.impact = "serious"; // -> high risk -> SL3
    z.threats.push(th);
    s = RT.suggestZone(z, proj);
    ok(s.worstRisk === "high", "zone worst risk = high", "got " + s.worstRisk);
    ok(s.byFR.IAC.sl === 3 && s.byFR.RDF.sl === 3, "affected FRs (IAC,RDF) suggest SL3");
    ok(s.byFR.SI.sl === null, "unaffected FR (SI) has no suggestion");
    ok(s.byFR.IAC.risk === "high", "per-FR risk band surfaced");
    ok(s.byFR.IAC.trace.join(" ").indexOf("above tolerable risk (medium)") >= 0 && s.byFR.IAC.trace.join(" ").indexOf("clause") < 0, "trace flags above-tolerable for high vs medium, with no clause number");

    // second threat raises SI via severe/medium -> high
    var th2 = RT.emptyThreat(2); th2.affectedFR = ["SI"]; th2.likelihood = "low"; th2.impact = "severe"; // severe×low -> high
    z.threats.push(th2);
    s = RT.suggestZone(z, proj);
    ok(s.byFR.SI.sl === 3 && s.byFR.SI.risk === "high", "SI now SL3 from severe×low=high");

    // --- exposure modifier appears in trace for its FRs, does not auto-raise SL ---
    z.flags["remote-access"] = true; // affects IAC,UC,RDF
    s = RT.suggestZone(z, proj);
    ok(s.byFR.UC.trace.join(" ").indexOf("remote-access") >= 0, "remote-access consideration traced on UC");
    ok(s.byFR.UC.sl === null, "exposure alone does not create an SL where no threat hits UC", "got " + s.byFR.UC.sl);

    // --- SIS floor applies to every FR ---
    var zs = RT.emptyZone(2); zs.flags["sis-present"] = true; proj.zones.push(zs);
    s = RT.suggestZone(zs, proj);
    ok(w.RiskTool.FR_IDS.every(function (fr) { return s.byFR[fr].sl === 3; }), "SIS floor sets every FR to SL3");
    ok(s.safetyRelated === true, "SIS zone flagged safety-related");
    var za = RT.emptyZone(3); za.assets.push({ name: "SIS ctrl", type: "safety-plc" }); proj.zones.push(za);
    ok(RT.suggestZone(za, proj).byFR.RA.sl === 3, "safety-plc asset triggers SIS floor");

    // --- adversary mismatch flags, never raises ---
    proj.srs.adversaryClass = 4;
    s = RT.suggestZone(z, proj);
    ok(s.byFR.IAC.sl === 3, "adversary class 4 does not raise SL beyond risk-derived");
    ok(s.byFR.IAC.trace.join(" ").indexOf("Mismatch:") >= 0, "adversary mismatch flagged in trace");
    proj.srs.adversaryClass = null;

    // --- conduit inherits higher endpoint per FR ---
    var c = RT.emptyConduit(1); c.fromZone = "Z1"; c.toZone = "Z2"; proj.conduits.push(c);
    s = RT.suggestConduit(c, proj);
    ok(s.byFR.IAC.sl === 3, "conduit inherits SL3 for IAC from endpoints", "got " + s.byFR.IAC.sl);
    ok(s.byFR.IAC.trace.join(" ").indexOf("Inherits") >= 0, "conduit trace notes inheritance");

    // --- SL-T vector + export v1.1 ---
    w.RiskTool.FR_IDS.forEach(function (fr) { z.slTargetByFR[fr] = (fr === "SI" ? 2 : 3); }); // hold SI below suggestion
    z.justification = "Vendor rework planned; SI held at SL2 pending brokered access.";
    w.RiskTool.FR_IDS.forEach(function (fr) { zs.slTargetByFR[fr] = 3; }); zs.justification = "SIS floor.";
    w.RiskTool.FR_IDS.forEach(function (fr) { za.slTargetByFR[fr] = 3; }); za.justification = "Safety.";
    w.RiskTool.FR_IDS.forEach(function (fr) { c.slTargetByFR[fr] = 3; }); c.justification = "Carries safety signals.";
    // add a countermeasure so the exceed-tolerable threat is covered (existing control)
    z.countermeasures.push({ id: "M1", description: "Broker vendor access via DMZ.", addressesFR: ["IAC", "RDF"], reference: "SR 1.13", existing: true });
    proj.approval = { name: "A. Approver", role: "Plant Manager", date: "2026-07-01", statement: "Tolerable risk and SL-T targets approved.", approved: true };
    proj.suc.name = "Test Works"; proj.suc.assumptions = ["assumption 1"];
    proj.srs.tolerableRisk = "medium"; proj.srs.knownThreats = ["Capable criminal adversary"];
    proj.srs.mandatorySecurityFunctions = ["Hard-wired ESD"]; proj.srs.regulatory = ["UK NIS 2018"];
    proj.srs.clientMatrix = true; proj.srs.clientMatrixNote = "Client matrix v3";

    // high-level risk ranking + basis of assessment
    proj.srs.highLevelAssets.push({ id: "A1", name: "DCS servers", functionLocation: "Equipment room", consequence: "serious", likelihood: "high", note: "→ Z2" });
    proj.basisOfAssessment.interviews.push({ id: "I1", name: "J. Smith", role: "Control systems engineer", date: "2026-06-30", notes: "Network architecture" });
    proj.basisOfAssessment.documents.push({ id: "D1", title: "Network diagram", reference: "Rev C", source: "SI", relevance: "Confirmed conduits" });
    proj.basisOfAssessment.observations.push({ id: "O1", description: "DMZ firewall rules", location: "Control room", date: "2026-06-30", notes: "ANY-ANY rule" });

    // Nothing is inferred: a covering countermeasure and an SL-T are both in
    // place, and with no decision recorded neither threat exports a disposition.
    var ctx0 = RT.buildRiskContext();
    ok(ctx0.zones[0].threats[0].disposition === null && ctx0.zones[0].threats[1].disposition === null,
      "no treatment decision recorded: the disposition exports as null, whatever countermeasures and SL-T exist", JSON.stringify(ctx0.zones[0].threats.map(function (t) { return t.disposition; })));
    ok(RT.threatTreatment(z, th).state === "none" && RT.threatTreatment(z, th).open === true && RT.threatTreatment(z, th).covered === true,
      "the treatment state says so: required, open, and a countermeasure does cover it");
    ok(RT.suggestTreatment(z, th, "medium") === "reduce" && RT.suggestTreatment(z, th2, "medium") === "slt", "the old inference survives only as a suggestion");
    th.treatment = { decision: "reduce", confirmed: false, reason: "" };
    ok(RT.threatTreatment(z, th).state === "suggested" && RT.buildRiskContext().zones[0].threats[0].disposition === null, "an unconfirmed suggestion is never exported as a decision");
    // The consultant decides: T1 reduced by M1, T2 treated through the SL-T.
    th.treatment = { decision: "reduce", confirmed: true, reason: "" };
    th2.treatment = { decision: "slt", confirmed: true, reason: "" };
    // A zone with no SL-T of its own: the suggestion must not stand in for it.
    var zn = RT.emptyZone(4); zn.name = "No target yet"; zn.flags["sis-present"] = true; proj.zones.push(zn);
    var ctxN = RT.buildRiskContext().zones[3];
    ok(ctxN.slTarget === null && ctxN.slSuggestedByFR.IAC === 3 && ctxN.slTargetByFR.IAC === null, "no SL-T set: scalar slTarget is null, not the suggestion", JSON.stringify([ctxN.slTarget, ctxN.slSuggestedByFR.IAC]));
    proj.zones.pop();
    c.countermeasures.push({ id: "M5", description: "Unidirectional gateway.", addressesFR: ["RDF"], reference: "", existing: true });

    var ctx = RT.buildRiskContext();
    ok(ctx.schema === "spt-risk-context/1.4", "export schema is 1.4", "got " + ctx.schema);
    ok(ctx.conduits[0].countermeasures.length === 1 && ctx.conduits[0].countermeasures[0].existing === true, "conduit countermeasures export the existing-control flag");
    c.countermeasures.pop();
    ok(ctx.highLevelAssets.length === 1 && ctx.highLevelAssets[0].risk === "high", "high-level asset ranking exported with computed risk (serious×high=high)");
    ok(ctx.basisOfAssessment.interviews.length === 1 && ctx.basisOfAssessment.documents.length === 1 && ctx.basisOfAssessment.observations.length === 1, "basis of assessment exported (interviews/documents/observations)");
    ok(ctx.generatedBy === "spt-risk-tool/" + w.App.Version.number && /^spt-risk-tool\/\d+\.\d+\.\d+$/.test(ctx.generatedBy), "generatedBy stamped with the suite version", ctx.generatedBy);
    ok(ctx.securityRequirements.tolerableRisk === "medium", "tolerable risk exported");
    ok(ctx.securityRequirements.knownThreats.length === 1 && ctx.securityRequirements.mandatorySecurityFunctions.length === 1, "SRS threats/functions exported");
    var ez = ctx.zones[0];
    ok(ez.slTargetByFR.IAC === 3 && ez.slTargetByFR.SI === 2, "per-FR SL-T vector exported (SI held at 2)");
    ok(ez.slSuggestedByFR.IAC === 3, "per-FR suggestion exported");
    ok(ez.slTarget === 3, "scalar slTarget = max of the FR vector (import compat)");
    ok(ez.worstUnmitigatedRisk === "high", "worst unmitigated risk exported");
    ok(ez.threats.length === 2 && typeof ez.threats[0].unmitigatedRisk === "string" && typeof ez.threats[0].exceedsTolerable === "boolean", "threats exported with risk + exceedsTolerable");
    ok(ez.countermeasures.length === 1 && ez.countermeasures[0].reference === "SR 1.13", "countermeasures exported");
    ok(ez.countermeasures[0].existing === true, "countermeasures export the existing-control flag");
    ok(ez.threats[0].disposition === "countermeasure", "T1 disposition exported: countermeasure (confirmed reduce, no residual yet)", "got " + ez.threats[0].disposition);
    // SI is held at SL2 against a suggested SL3, so the SL-T decision needs a reason,
    // and until it has one it is not exported, printed or packed as a treatment.
    ok(ez.threats[1].disposition === null, "T2: the SL-T programme below the suggestion with no reason is not exported as a treatment", "got " + ez.threats[1].disposition);
    var t2T = RT.threatTreatment(z, th2);
    ok(t2T.sltShortfall.join() === "SI" && t2T.sltBelow.join() === "SI" && t2T.sltUnset.length === 0 && t2T.reasonNeeded && t2T.reasonMissing && /below the suggestion/.test(t2T.gap), "SL-T below the suggestion on an affected FR: a reason is needed", JSON.stringify(t2T.sltShortfall) + " " + t2T.gap);
    ok(t2T.confirmed && !t2T.complete && t2T.label === "Treat through the SL-T programme (no reason recorded)", "and its label says what is missing", t2T.label);
    ok(RT.exportProblems().some(function (p) { return p.indexOf("Z1") >= 0 && p.indexOf("T2") >= 0 && p.indexOf("below the suggestion") >= 0; }), "and the completeness list says so");
    th2.treatment.reason = "SI is raised to SL3 in phase 2, agreed with the asset owner.";
    ok(!RT.threatTreatment(z, th2).gap && !RT.exportProblems().some(function (p) { return p.indexOf("T2") >= 0 && p.indexOf("below the suggestion") >= 0; }), "a recorded reason settles it");
    ok(RT.buildRiskContext().zones[0].threats[1].disposition === "sl-t" && RT.threatTreatment(z, th2).complete && RT.threatTreatment(z, th2).label === "Treated through the SL-T programme", "T2 disposition exported: treated through the SL-T (confirmed, with its reason)", RT.threatTreatment(z, th2).label);
    ok(typeof ez.threats[0].acceptance === "string", "threats export an acceptance field");
    ok(ez.threats[0].residualRisk === null && ez.threats[0].residualLikelihood === null, "threats export residual fields (null when untreated)");
    ok(ctx.approval && ctx.approval.name === "A. Approver" && ctx.approval.approved === true, "risk context exports the asset-owner sign-off");
    ok(ctx.zones[1].safetyRelated === true, "safetyRelated exported");
    ok(ctx.conduits.length === 1 && ctx.conduits[0].slTargetByFR.IAC === 3 && ctx.conduits[0].slTarget === 3, "conduit exported with per-FR + scalar SL-T");
    ok(ctx.assumptions.some(function (a) { return a.indexOf("Client risk matrix used") === 0; }), "client-matrix assumption surfaced");

    // --- completeness validation ---
    var probs = RT.exportProblems();
    ok(Array.isArray(probs), "exportProblems returns a list");
    var zEmpty = RT.emptyZone(9); proj.zones.push(zEmpty);
    ok(RT.exportProblems().some(function (p) { return p.indexOf("Z9") >= 0 && p.indexOf("no threats") >= 0; }), "empty zone flagged: no threats");
    proj.zones.pop();
    // Conduits are checked too: one with no threats and nothing written is open,
    // and one whose justification gives the basis for its SL-T is not.
    var cEmpty = RT.emptyConduit(9); proj.conduits.push(cEmpty);
    ok(RT.exportProblems().some(function (p) { return p.indexOf("C9") >= 0 && p.indexOf("no threats") >= 0; }), "empty conduit flagged: no threats");
    cEmpty.slTargetByFR.IAC = 2;
    ok(RT.exportProblems().some(function (p) { return p.indexOf("C9") >= 0 && p.indexOf("SL-T set with no threats") >= 0; }), "conduit with an SL-T, no threats and no justification asks for the basis");
    cEmpty.justification = "Takes the higher SL-T of the two zones it joins.";
    // (Phase 3a: a conduit also needs its risk comparison decided; recorded
    // here so this checks the justification rule alone, as it did.)
    ok(RT.exportProblems().some(function (p) { return p.indexOf("C9") >= 0 && /risk comparison|initial risk/.test(p); }), "an undecided conduit is listed for its risk comparison");
    cEmpty.detailed = { required: true, reason: "" };
    // (Phase 3a review: a decision with no initial risk to compare needs a
    // reason, so the conduit is given the initial risk its decision rests on.)
    ok(RT.exportProblems().some(function (p) { return p.indexOf("C9") >= 0 && /no initial risk to rest on/.test(p); }), "a comparison decided with no initial risk asks for its reason");
    cEmpty.initialRisk = "high";
    // (Phase 3b review: a conduit with an end not set is open on step 3, so
    // the conduit is given the two zones it joins, and this checks the
    // justification rule alone, as it did.)
    ok(RT.exportProblems().some(function (p) { return p.indexOf("C9") >= 0 && /neither end is set/.test(p); }), "a conduit with no ends is listed for them");
    cEmpty.fromZone = "Z1"; cEmpty.toZone = "Z2";
    ok(!RT.exportProblems().some(function (p) { return p.indexOf("C9") >= 0; }), "a conduit's justification is the basis when it has no threat of its own");
    proj.conduits.pop();

    // --- treatment decisions: recorded by the consultant, never inferred ---
    var zd = RT.emptyZone(7); proj.zones.push(zd);
    var td = RT.emptyThreat(7); td.statement = "x"; td.affectedFR = ["UC"]; td.likelihood = "high"; td.impact = "serious"; // high > medium tolerable
    zd.threats.push(td);
    function z7Open() { return RT.exportProblems().some(function (p) { return p.indexOf("Z7") >= 0 && p.indexOf("no treatment decision") >= 0; }); }
    ok(td.treatment && td.treatment.decision === null && td.treatment.confirmed === false && td.treatment.reason === "", "a new threat carries an empty treatment record");
    ok(RT.threatDisposition(zd, td) === null && RT.threatTreatment(zd, td).state === "none", "over-tolerable threat with nothing recorded has no decision");
    ok(z7Open(), "completeness flags the threat with no treatment decision");
    zd.slTargetByFR.UC = 3; // an SL-T alone decides nothing
    ok(RT.threatDisposition(zd, td) === null && z7Open(), "an SL-T on the affected FR does not clear it by itself");
    ok(RT.suggestTreatment(zd, td, "medium") === "slt", "it only makes 'treat through the SL-T' the suggestion");
    td.treatment = { decision: "slt", confirmed: false, reason: "" };
    ok(RT.threatTreatment(zd, td).state === "suggested" && RT.threatTreatment(zd, td).open && z7Open(), "a suggestion not yet confirmed is still open");
    ok(RT.exportProblems().some(function (p) { return p.indexOf("Z7") >= 0 && p.indexOf("suggestion is waiting") >= 0; }), "and the list says a suggestion is waiting");
    td.treatment.confirmed = true; // immature environment: no countermeasures, SL-T is the plan
    var tSlt = RT.threatTreatment(zd, td);
    ok(tSlt.disposition === "sl-t" && tSlt.state === "confirmed" && !tSlt.open && !tSlt.gap && !tSlt.reasonNeeded && tSlt.label === "Treated through the SL-T programme",
      "confirmed: treated through the SL-T with no countermeasure and, at the suggested level, no reason needed", JSON.stringify(tSlt));
    ok(!z7Open() && !RT.exportProblems().some(function (p) { return p.indexOf("Z7 / T7") >= 0; }), "completeness accepts the SL-T as the treatment plan");
    zd.slTargetByFR.UC = null;
    var tUnset = RT.threatTreatment(zd, td);
    ok(tUnset.reasonMissing && tUnset.sltUnset.join() === "UC" && tUnset.sltBelow.length === 0 && tUnset.gap === "no SL-T is set on a requirement it affects and no reason is recorded" && !/below the suggestion/.test(tUnset.gap),
      "with the SL-T unset on the affected FR the decision needs a reason, and the gap says the SL-T is not set", tUnset.gap);
    ok(tUnset.disposition === null && !tUnset.complete && tUnset.label === "Treat through the SL-T programme (no SL-T set)" && RT.buildRiskContext().zones[RT.state.project.zones.length - 1].threats[0].disposition === null,
      "and it is not stated or exported as treated", tUnset.label + " / " + tUnset.disposition);
    ok(RT.exportProblems().some(function (p) { return p.indexOf("Z7 / T7") >= 0 && p.indexOf("no SL-T is set") >= 0; }), "the completeness list says the SL-T is not set");
    td.treatment.reason = "The SL-T is set at the design workshop in phase 2.";
    ok(RT.threatDisposition(zd, td) === "sl-t" && RT.threatTreatment(zd, td).gap === "" && RT.threatTreatment(zd, td).label === "Treated through the SL-T programme", "a reason makes it a recorded treatment");
    // The SL-T reason belongs to the SL-T decision: it is not carried to another.
    td.treatment.decision = "reduce";
    ok(RT.threatTreatment(zd, td).reason === "" && td.treatment.reason !== "", "changed to reduce, the SL-T reason is no longer the decision's reason (it is kept in case the choice is changed back)");
    td.treatment = { decision: "accept", confirmed: true, reason: "" };
    var tAcc = RT.threatTreatment(zd, td);
    ok(tAcc.disposition === null && !tAcc.complete && tAcc.gap === "accepted with no reason recorded" && tAcc.label === "Accept (no reason recorded)", "an acceptance always needs its reason, and is not a recorded acceptance without it", tAcc.label + " / " + tAcc.disposition);
    ok(RT.exportProblems().some(function (p) { return p.indexOf("Z7") >= 0 && p.indexOf("accepted with no reason") >= 0; }), "the list shows the acceptance with no reason");
    td.acceptance = "Accepted by Operations Director, 2026-07; revisit at next assessment.";
    ok(RT.threatTreatment(zd, td).gap === "" && RT.threatTreatment(zd, td).reason === td.acceptance && RT.threatTreatment(zd, td).label === "Risk accepted" && RT.threatDisposition(zd, td) === "accepted", "the acceptance text is the reason");
    td.acceptance = "";
    td.treatment = { decision: "reduce", confirmed: true, reason: "" };
    zd.countermeasures.push({ id: "M9", description: "Broker access via jump host", addressesFR: ["RDF"], reference: "", existing: false });
    ok(RT.threatTreatment(zd, td).covered === false && /no countermeasure/.test(RT.threatTreatment(zd, td).gap) && RT.threatTreatment(zd, td).label === "Reduce with countermeasures (none recorded)",
      "reduce: a countermeasure on unrelated FRs does not cover the threat");
    // A residual rating alone reduces nothing: with no covering countermeasure
    // the threat is not "reduced", whatever the residual says.
    td.residualLikelihood = "low";
    var tBare = RT.threatTreatment(zd, td);
    ok(tBare.residualWithin && tBare.label === "Reduce with countermeasures (none recorded)" && tBare.disposition === null && !tBare.complete && /no countermeasure/.test(tBare.gap),
      "reduce with a tolerable residual and no covering countermeasure is not reduced or mitigated", tBare.label + " / " + tBare.disposition);
    td.residualLikelihood = "";
    zd.countermeasures[0].addressesFR = [];
    ok(RT.threatTreatment(zd, td).covered === false, "reduce: an untagged countermeasure covers nothing");
    ok(RT.suggestTreatment(zd, td, "medium") === "reduce", "(it can only suggest)");
    zd.countermeasures[0].addressesFR = ["UC"];
    var tRed = RT.threatTreatment(zd, td);
    ok(tRed.covered && tRed.covering[0].id === "M9" && tRed.disposition === "countermeasure" && tRed.gap === "" && tRed.label === "Reduce with countermeasures", "reduce: an FR-overlapping countermeasure covers the threat");
    // Residual risk: countermeasures that bring it within tolerable = mitigated.
    td.residualLikelihood = "low"; td.residualImpact = "serious"; // serious×low = medium = tolerable
    ok(RT.residualRisk(td) === "medium", "residual risk computed from residual likelihood/impact", "got " + RT.residualRisk(td));
    ok(RT.threatDisposition(zd, td) === "countermeasure" && RT.threatTreatment(zd, td).residualWithin && RT.threatTreatment(zd, td).label === "Reduce with countermeasures", "residual within tolerable with only a planned countermeasure is still being reduced", RT.threatTreatment(zd, td).label);
    zd.countermeasures[0].existing = true;
    ok(RT.threatDisposition(zd, td) === "mitigated" && RT.threatTreatment(zd, td).residualWithin && RT.threatTreatment(zd, td).label === "Reduced to within tolerable risk", "residual within tolerable with a countermeasure in place = mitigated");
    td.residualLikelihood = "medium"; // serious×medium = high, still exceeds
    ok(RT.threatDisposition(zd, td) === "countermeasure" && !RT.threatTreatment(zd, td).residualWithin, "residual still above tolerable stays a countermeasure in progress");
    td.treatment.confirmed = false;
    ok(RT.threatDisposition(zd, td) === null, "and unconfirmed, it is no decision at all");
    td.residualLikelihood = ""; td.residualImpact = "";
    ok(RT.residualRisk(td) === null, "residual risk is null when neither residual field is set");
    // A threat within tolerable risk needs no decision.
    td.likelihood = "low"; // serious×low = medium
    ok(RT.threatTreatment(zd, td).state === "within" && !RT.threatTreatment(zd, td).required && !RT.threatTreatment(zd, td).open && RT.threatTreatment(zd, td).label === "Within tolerable risk", "within tolerable risk: no decision needed");
    proj.zones.pop();

    // --- project round-trip ---
    var saved = JSON.stringify(proj);
    RT.loadProjectText(saved);
    ok(RT.state.project.zones.length === 3 && RT.state.project.zones[0].slTargetByFR.SI === 2, "project JSON round-trips (per-FR preserved)");
    ok(RT.state.project.zones[0].threats.length === 2, "threats survive round-trip");
    ok(RT.state.project.srs.highLevelAssets.length === 1, "high-level asset ranking survives round-trip");

    // autosave failure surfaces a warning instead of failing silently (dirty + content present)
    var origSet = w.Storage.prototype.setItem;
    w.Storage.prototype.setItem = function () { throw new Error("blocked"); };
    RT.flushAutosave();
    w.Storage.prototype.setItem = origSet;
    ok(doc.getElementById("toast").textContent.indexOf("Autosave unavailable") >= 0, "autosave failure surfaces a one-time warning (locked-down laptop)");

    // New resets to a clean project (confirm is stubbed to true)
    doc.getElementById("btn-new").click();
    ok(RT.isDirty() === false && saveBtn.textContent === "Save", "New resets to a clean project (Save no longer starred)");

    // restore gate is widened: high-level-only work (no zones/conduits/suc name) is still offered back
    var existingBar = doc.querySelector(".autosave-bar"); if (existingBar) existingBar.parentNode.removeChild(existingBar);
    try { w.localStorage.setItem(RT.AUTOSAVE_KEY, JSON.stringify({ savedOn: new Date().toISOString(), stage: "srs", project: { schema: "spt-risk-project/0.2", suc: { name: "", description: "", scopeStatement: "", assumptions: [] }, srs: { highLevelAssets: [{ id: "A1", name: "DCS servers" }] }, zones: [], conduits: [] } })); } catch (e) {}
    RT.offerRestore();
    ok(doc.querySelector(".autosave-bar") != null, "restore is offered for high-level-only work (widened gate)");
    var bar2 = doc.querySelector(".autosave-bar"); if (bar2) bar2.parentNode.removeChild(bar2);
    try { w.localStorage.removeItem(RT.AUTOSAVE_KEY); } catch (e) {}

    // --- #7 sharper SL-T-basis warnings (soft; never blocks) + inline cue ---
    RT.loadProjectText(JSON.stringify({ schema: "spt-risk-project/0.2", suc: { name: "SLT Test", description: "", scopeStatement: "", assumptions: [] }, zones: [{ id: "Z8", name: "", slTargetByFR: { IAC: 2 }, justification: "", threats: [], vulnerabilities: [], countermeasures: [] }], conduits: [] }));
    var cur = RT.state.project;
    var p7 = RT.exportProblems();
    ok(p7.some(function (p) { return p.indexOf("Z8") >= 0 && p.indexOf("no justification") >= 0; }), "#7 an SL-T set without a justification is named in the export warning");
    ok(p7.some(function (p) { return p.indexOf("Z8") >= 0 && p.indexOf("no threats") >= 0 && p.indexOf("basis") >= 0; }), "#7 an SL-T on a zone with no threats prompts recording the basis");
    clickNav("risk"); clickTab("slt");
    ok(doc.body.textContent.indexOf("needs justification") >= 0, "#7 the SL-T card flags 'needs justification' inline when a target is set but unjustified");
    cur.zones[0].justification = "Corporate SL2 floor for all OT zones; no site-specific threats modelled.";
    ok(!RT.exportProblems().some(function (p) { return p.indexOf("Z8") >= 0 && p.indexOf("no justification") >= 0; }), "#7 recording a justification clears the warning (soft, never blocked)");
    RT.FR_IDS.forEach(function (fr) { cur.zones[0].slTargetByFR[fr] = null; });
    cur.zones[0].justification = "";
    var p7b = RT.exportProblems();
    ok(p7b.some(function (p) { return p.indexOf("Z8") >= 0 && p.indexOf("no SL-T set") >= 0; }), "#7 a zone with no SL-T is flagged as incomplete");
    ok(!p7b.some(function (p) { return p.indexOf("Z8") >= 0 && p.indexOf("no justification") >= 0; }), "#7 no justification-nag when there is no SL-T to justify yet");

    // --- save-in-place (File System Access API, stubbed): Save overwrites the
    // --- same file instead of downloading "name (1).json" copies -----------
    var pickCount = 0, written = [];
    function fakeHandle(name) {
      return {
        name: name,
        queryPermission: function () { return Promise.resolve("granted"); },
        createWritable: function () {
          return Promise.resolve({
            write: function (t) { written.push({ name: name, text: t }); return Promise.resolve(); },
            close: function () { return Promise.resolve(); }
          });
        }
      };
    }
    w.showSaveFilePicker = function () { pickCount++; return Promise.resolve(fakeHandle("demo-risk-project.json")); };
    RT.forgetProjectFile();
    ok(RT.supportsFilePickers() === true, "picker support detected once the API is present");

    return new Promise(function (resolve, reject) {
      RT.saveProject(null, function (r1) {
        try {
          ok(r1.ok && r1.method === "file" && r1.name === "demo-risk-project.json", "first save asks where to save and writes the file");
          ok(pickCount === 1 && written.length === 1, "one dialog, one write");
          var parsed = null; try { parsed = JSON.parse(written[0].text); } catch (e) {}
          ok(parsed && /^spt-risk-project\//.test(parsed.schema) && parsed.suc, "the written file is the project JSON");
          ok(RT.isDirty() === false, "a successful save marks the project clean");
        } catch (e) { reject(e); return; }
        RT.saveProject(null, function (r2) {
          try {
            ok(r2.ok && r2.method === "file" && pickCount === 1 && written.length === 2, "second save OVERWRITES the same file - no new dialog, no (1) copy");
          } catch (e) { reject(e); return; }
          RT.saveProject({ shiftKey: true }, function (r3) {
            try {
              ok(r3.ok && pickCount === 2, "Shift+click (Save as…) shows the dialog for a fresh copy");
            } catch (e) { reject(e); return; }

            // Load via the picker captures the handle: Save then writes back
            // to the loaded file, not the previously saved one.
            var loadedDoc = JSON.parse(other); loadedDoc.suc.name = "Picker Loaded Works";
            var loadedHandle = fakeHandle("loaded-project.json");
            loadedHandle.getFile = function () { return Promise.resolve(new w.Blob([JSON.stringify(loadedDoc)])); };
            w.showOpenFilePicker = function () { return Promise.resolve([loadedHandle]); };
            doc.getElementById("btn-load").click();
            var waited = 0;
            (function poll() {
              if (RT.state.project.suc.name === "Picker Loaded Works") {
                RT.saveProject(null, function (r4) {
                  try {
                    ok(r4.ok && r4.name === "loaded-project.json" && pickCount === 2, "after a picker Load, Save writes back to the LOADED file without asking");
                    // New forgets the file: next save must ask again.
                    doc.getElementById("btn-new").click();
                    RT.saveProject(null, function (r5) {
                      try {
                        ok(r5.ok && pickCount === 3, "after New, Save asks where to save (never overwrites the old project's file)");
                        // No API -> the classic download branch applies. Assert
                        // the detection only: actually clicking a blob-URL
                        // download hangs headless Edge, and that code path is
                        // the unchanged pre-existing save behaviour.
                        delete w.showSaveFilePicker;
                        ok(RT.supportsFilePickers() === false, "without the API, Save falls back to the classic download");
                        resolve();
                      } catch (e) { reject(e); }
                    });
                  } catch (e) { reject(e); }
                });
              } else if (++waited > 100) {
                ok(false, "picker Load applied the file", "suc.name=" + RT.state.project.suc.name);
                resolve();
              } else {
                w.setTimeout(poll, 30);
              }
            })();
          });
        });
      });
    });
  }
}());
</script>
</body>
</html>
