<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OT Cyber Risk Assessment Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <link rel="stylesheet" href="css/spt-theme.css" />
  <link rel="stylesheet" href="css/review-author.css" />
  <link rel="stylesheet" href="css/report-page.css" />
  <link rel="stylesheet" href="css/doc-preview.css" />
  <!-- Apply the saved (or system) colour theme before first paint to avoid a
       flash. The toggle in the header updates this and persists the choice.
       Shares the "ot-theme" key with the assessment tool so the two apps agree
       on light/dark and feel like one product. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("ot-theme");
        if (t !== "dark" && t !== "light") {
          t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <style>
    /* ---- Risk-tool-specific styles (kept out of spt-theme.css so the theme
       stays a pure copy of the shared design system) ---- */
    .stage-badge { font-size: 11px; }

    .trace details { margin: 4px 0 0; }
    .trace summary {
      cursor: pointer; color: var(--brand-blue); font-size: 12px; font-weight: 600;
      list-style: none;
    }
    .trace summary::-webkit-details-marker { display: none; }
    .trace summary::before { content: "\25B8 "; }
    .trace details[open] summary::before { content: "\25BE "; }
    .trace-box {
      background: var(--surface-2); border: 1px solid var(--border);
      border-left: 3px solid var(--brand-blue); border-radius: var(--radius);
      padding: 8px 10px; font-size: 12px; margin: 6px 0 4px;
    }
    .trace-box ul { margin: 0; padding-left: 16px; }
    .trace-box li { margin: 2px 0; }

    .sis-box {
      background: var(--near-bg); border: 1px solid var(--near);
      border-radius: var(--radius); padding: 10px 12px; font-size: 13px; margin: 8px 0 12px;
    }
    .framing-note {
      background: var(--brand-blue-tint); border: 1px solid var(--brand-blue);
      border-radius: var(--radius); padding: 10px 12px; font-size: 13px; margin-bottom: 14px;
    }

    .flag-grid { display: flex; flex-wrap: wrap; gap: 6px 16px; }
    .flag-grid label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 400; cursor: pointer; user-select: none; }

    .asset-row, .line-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
    .asset-row input[type=text], .line-row input[type=text] { flex: 1; }
    .asset-row select { width: 200px; }
    .asset-row input, .asset-row select, .line-row input {
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 6px 9px; outline: none;
    }

    .fr-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .fr-chip {
      border: 1px solid var(--border-strong); background: var(--surface);
      border-radius: 999px; padding: 2px 9px; font-size: 12px; cursor: pointer; user-select: none;
      font-weight: 600; color: var(--text-muted);
    }
    .fr-chip.on { background: var(--brand-blue); border-color: var(--brand-blue); color: #FFF; }

    .treat { margin-top: 8px; }
    .treat-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
    .treat-opts { display: inline-flex; flex-wrap: wrap; gap: 4px; }
    .treat-opt {
      border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
      border-radius: var(--radius); padding: 4px 10px; font-size: 13px; cursor: pointer; font-family: inherit;
    }
    .treat-opt.on { background: var(--brand-blue); border-color: var(--brand-blue); color: #FFF; font-weight: 600; }
    .treat-opt.suggested { border: 2px dashed var(--brand-blue); font-style: italic; }
    .treat-status { font-size: 13px; }

    .threat-card {
      border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 10px;
      background: var(--surface-2);
    }
    .threat-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
    .threat-head .tid { font-weight: 700; color: var(--brand-blue-dark); }
    .threat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
    @media (max-width: 820px) { .threat-grid { grid-template-columns: 1fr; } }

    .risk-pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .risk-low       { background: var(--met-bg);  color: var(--met); }
    .risk-medium    { background: var(--near-bg); color: var(--near); }
    .risk-high      { background: var(--gap-bg);  color: var(--gap); }
    .risk-very-high { background: var(--gap);     color: #FFF; }
    .risk-none      { background: var(--surface-3); color: var(--text-muted); }

    .zone-map-wrap { overflow-x: auto; }
    .zone-map-wrap svg { display: block; margin: 0 auto; }

    .req-star { color: var(--gap); font-weight: 700; }
    .fr-slt-table td { vertical-align: top; }

    .tbl input[type=text], .tbl input[type=date], .tbl select, .tbl textarea {
      width: 100%; background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: var(--radius); padding: 5px 8px; outline: none; font-size: 13px;
    }
    .val-warn { color: var(--gap); }

    /* ---- The sidebar's steps and their status; Home; step 4; Check and issue ---- */
    /* Save holds the header's primary place; with unsaved changes it turns amber. */
    .header .btn.primary.btn-unsaved { background: var(--near); border-color: var(--near); color: #FFF; }
    .nav-sep { height: 1px; background: var(--border); margin: 6px 18px; }
    .nav-item:focus-visible { outline: 2px solid var(--brand-blue); outline-offset: -2px; }
    .nav-num { display: inline-block; min-width: 12px; font-weight: 700; color: var(--brand-blue); }
    .nav-status { display: block; font-size: 11px; font-weight: 400; color: var(--text-muted); }
    .nav-status[data-status="open"] { color: var(--near); }
    .nav-status[data-status="done"] { color: var(--met); }
    .step-tabs, .rp-viewbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 0 0 14px; }
    .rp-views { display: inline-flex; gap: 4px; }
    .step-tabs .sl-btn .badge, .rp-views .badge { margin-left: 6px; font-size: 11px; border-radius: 12px; padding: 0 7px; background: var(--surface-3); color: var(--text-muted); }
    .step-tabs .sl-btn.active .badge { background: rgba(255, 255, 255, 0.85); color: var(--brand-blue-dark); }
    .issue-guard { border: 2px solid var(--near); }
    .issue-guard .guard-group { margin: 0 0 4px; font-weight: 600; }
    .issue-guard ul { margin: 0 0 10px; }
    .readiness { list-style: none; margin: 0; padding: 0; }
    .readiness li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .readiness li:last-child { border-bottom: 0; }
    .assign { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .assign select { flex: 1 1 130px; min-width: 130px; }
    h1.page-title[tabindex="-1"]:focus { outline: none; }
    .assign-x { border: 0; background: transparent; color: inherit; cursor: pointer; font-weight: 700; padding: 0 0 0 4px; font-family: inherit; }
    .cmp-table td { vertical-align: top; }
    .cmp-entry select { margin-top: 4px; min-width: 190px; }
    .cmp-source, .cmp-words { font-size: 12px; margin-top: 2px; }
    .detailed-choice .treat-opts { margin-bottom: 4px; }
    .detailed-reason { margin-top: 4px; width: 100%; box-sizing: border-box; }
    .home-kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 720px) { .home-kinds { grid-template-columns: 1fr; } }
    .home-kind {
      display: flex; flex-direction: column; gap: 4px; text-align: left; cursor: pointer; font-family: inherit;
      border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
      border-radius: var(--radius); padding: 10px 12px; font-size: 13px;
    }
    .home-kind.on { border: 2px solid var(--brand-blue); background: var(--brand-blue-tint); }
    .home-steps { list-style: none; margin: 0; padding: 0; }
    .home-step {
      display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%;
      border: 0; border-bottom: 1px solid var(--border); background: transparent; color: var(--text);
      padding: 8px 4px; cursor: pointer; font-family: inherit; font-size: 14px; text-align: left;
    }
    .home-step:hover { background: var(--surface-2); }
    .home-step .nav-status { display: inline; font-size: 12px; }

    /* ---- Step 1's criteria; step 3's layout; steps 6 and 7 ---- */
    .check-line { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 400; text-transform: none; color: var(--text); cursor: pointer; }
    .criteria-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
    @media (max-width: 980px) { .criteria-layout { grid-template-columns: 1fr; } }
    .criteria-cap { font-size: 12px; margin-bottom: 6px; }
    .tbl.matrix td, .tbl.matrix th { padding: 4px 6px; }
    .tbl.matrix td.above-tol { outline: 2px dashed var(--gap); outline-offset: -3px; }
    .scales { margin-top: 8px; font-size: 13px; }
    .scales summary { cursor: pointer; color: var(--brand-blue); font-weight: 600; font-size: 12px; }
    .scale-list { margin: 4px 0 8px; padding-left: 18px; }
    .scale-name { font-weight: 600; }
    .zones-layout { display: grid; grid-template-columns: minmax(260px, 2fr) minmax(0, 3fr); gap: 16px; align-items: start; }
    @media (max-width: 1100px) { .zones-layout { grid-template-columns: 1fr; } }
    .zones-detail { position: sticky; top: 0; }
    .tbl.compact td, .tbl.compact th { padding: 5px 8px; font-size: 13px; }
    .pick-row { cursor: pointer; }
    .pick-row.selected td { background: var(--brand-blue-tint); }
    .link-btn { border: 0; background: transparent; color: var(--brand-blue); font-weight: 700; cursor: pointer; padding: 0; font-family: inherit; font-size: 13px; }
    .zone-box-link { cursor: pointer; }
    .zone-box-link:focus-visible rect, .zone-box-link:hover rect { stroke-width: 3; }
    .zones-detail .asset-row { flex-wrap: wrap; }
    .zones-detail .asset-row input[type=text] { flex: 2 1 180px; min-width: 140px; }
    .zones-detail .asset-row select { flex: 1 1 140px; width: auto; min-width: 0; }
    .paste-box { margin-top: 8px; }
    .paste-box textarea { width: 100%; box-sizing: border-box; font-family: inherit; }
    .sep-rows .sep-row { border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; margin-bottom: 8px; background: var(--surface-2); }
    .sep-head { font-size: 13px; margin-bottom: 6px; }
    .sep-reason { margin-top: 6px; width: 100%; box-sizing: border-box; }
    .chars { margin-top: 6px; }
    .chars > summary { cursor: pointer; color: var(--brand-blue); font-weight: 600; font-size: 13px; margin-bottom: 8px; }
    .spec-status { font-size: 12px; font-weight: 600; color: var(--near); }
    .spec-status[data-status="done"] { color: var(--met); }
    .spec-kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0 0 8px; font-size: 13px; }
    .spec-kv dt { font-weight: 600; color: var(--text-muted); }
    .spec-kv dd { margin: 0; }
    .spec-list { margin: 4px 0 8px; padding-left: 18px; font-size: 13px; }
    .approval-entry { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 10px; background: var(--surface-2); }
    .approval-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .approval-status { margin-top: 6px; font-size: 13px; }

    /* ---- The header at laptop widths: the theme's header (a synced copy)
       lets the product name and the project summary wrap and spill out of
       the bar; here they stay on one line and the summary gives way. ---- */
    .header { min-width: 0; overflow: hidden; }
    .header .brand { min-width: 0; flex: 0 1 auto; }
    .header .brand .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .header .brand .brand-logo { flex: 0 0 auto; }
    #suc-summary { color: #C9D8E5; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 0; }
    .header .spacer { flex: 0 0 0; }
    .header-actions { flex: 0 0 auto; }
    .header-actions .btn { white-space: nowrap; }

    /* ---- Step 5: the zone workshop, register, heat map and SL-T grid ---- */
    .risk-layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 14px; align-items: start; }
    @media (max-width: 1000px) { .risk-layout { grid-template-columns: 1fr; } }
    .risk-rail { position: sticky; top: 0; display: flex; flex-direction: column; gap: 4px; max-height: calc(100vh - 140px); overflow-y: auto; }
    .rail-h { font-size: 11px; font-weight: 700; color: var(--text-muted); margin: 6px 4px 2px; }
    .rail-item { display: flex; flex-direction: column; gap: 3px; text-align: left; cursor: pointer; font-family: inherit; font-size: 13px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: var(--radius); padding: 6px 8px; }
    .rail-item.on { border: 2px solid var(--brand-blue); background: var(--brand-blue-tint); }
    .rail-item:focus-visible { outline: 2px solid var(--brand-blue); outline-offset: 1px; }
    .rail-name { font-weight: 600; }
    .rail-meta { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 12px; }
    .rail-open { font-weight: 600; }
    .slt-strip { border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; margin-bottom: 12px; background: var(--surface-2); }
    .strip-head { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 13px; }
    .slt-strip-table th, .slt-strip-table td { padding: 3px 4px; }
    .slt-strip-table { table-layout: fixed; width: 100%; }
    .slt-strip-table th:first-child { width: 84px; }
    .slt-strip-table select { width: 100%; min-width: 0; padding: 4px 2px; }
    .slt-grid select { min-width: 74px; width: auto; }
    .btn.xs { padding: 1px 6px; font-size: 11px; margin-top: 3px; }
    td.below-sug select { border-color: var(--near); }
    .strip-actions { margin-top: 6px; align-items: flex-start; flex-wrap: wrap; gap: 6px; }
    .strip-actions select { max-width: 200px; }
    .strip-why { flex: 1 1 100%; }
    .scen-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 4px 0 6px; }
    .scen-bar .spacer { flex: 1; }
    .ed-h { font-size: 13px; font-weight: 700; margin: 0; color: var(--brand-blue-dark); }
    .scen-table tbody.open > tr.scen-row td { background: var(--brand-blue-tint); }
    .scen-row { cursor: pointer; }
    .scen-statement { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .scen-table th, .scen-table td { font-size: 12.5px; }
    .scen-editor-row > td { padding: 0 !important; }
    .scen-editor { margin: 6px 0 10px; }
    .ed-section { border-top: 1px solid var(--border); padding: 8px 0 4px; }
    .ed-section:first-child { border-top: 0; padding-top: 0; }
    .ed-section > .ed-h { margin-bottom: 6px; }
    .ed-none { margin: 0 0 6px; font-size: 13px; }
    .ed-section > .btn-row { margin: 2px 0 8px; }
    .lbl { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
    .chip-btn { border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); border-radius: 999px; padding: 2px 10px;
      font-size: 12px; cursor: pointer; font-family: inherit; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip-btn.on { background: var(--brand-blue); border-color: var(--brand-blue); color: #FFF; font-weight: 600; }
    .chip-btn.matches { border-color: var(--brand-blue); }
    .chip-btn.suggested { border: 2px dashed var(--brand-blue); font-style: italic; }
    .chip-btn.xs { padding: 1px 6px; font-size: 11px; }
    .inline-add { display: flex; gap: 6px; align-items: center; }
    .inline-add input { flex: 1; }
    .rating-line { margin-top: 6px; font-size: 13px; }
    .cm-row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: flex-start; border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 8px; margin-bottom: 6px; background: var(--surface); }
    .cm-row .tid { font-weight: 700; color: var(--brand-blue-dark); padding-top: 6px; min-width: 30px; }
    .cm-row .cm-desc { flex: 1 1 260px; }
    .cm-row .cm-desc input { width: 100%; box-sizing: border-box; }
    .cm-plan { display: grid; grid-template-columns: repeat(4, minmax(110px, 1fr)); gap: 4px 8px; flex: 1 1 100%; }
    .cm-plan .field { margin: 0; }
    @media (max-width: 820px) { .cm-plan { grid-template-columns: 1fr 1fr; } }
    .acc-detail { display: grid; grid-template-columns: repeat(4, minmax(110px, 1fr)); gap: 4px 8px; margin-top: 6px; }
    .acc-detail .field { margin: 0; }
    .scen-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; border-top: 1px solid var(--border); padding-top: 8px; margin-top: 6px; }
    .scen-move > summary { cursor: pointer; color: var(--brand-blue); font-weight: 600; font-size: 13px; padding: 4px 0; }
    .scen-move-body { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 6px; }
    .scen-move-body .field { margin: 0; }
    .scen-move-body select { min-width: 180px; display: block; margin-bottom: 4px; }
    .owner-sec { margin-top: 12px; }
    .owner-sec > summary { cursor: pointer; color: var(--brand-blue); font-weight: 600; font-size: 13px; margin-bottom: 6px; }
    .cm-table td { vertical-align: top; }
    .cm-table input[type=text] { margin-bottom: 4px; }
    .scales-pop { position: relative; }
    .scales-pop > summary { cursor: pointer; color: var(--brand-blue); font-weight: 600; font-size: 13px; }
    .scales-pop-body { position: absolute; right: 0; z-index: 20; width: min(520px, 80vw); background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: var(--radius); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18); padding: 10px 12px; font-size: 13px; }
    .reg-filters { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-bottom: 10px; }
    .reg-filters select { width: auto; min-width: 150px; }
    .reg-table td { vertical-align: top; }
    .heat-toggle { margin-bottom: 8px; }
    .tbl.heat td.heat-cell { padding: 0; height: 52px; min-width: 90px; }
    .heat-btn { width: 100%; height: 100%; min-height: 52px; border: 0; background: transparent; color: inherit; font: inherit; font-size: 18px; font-weight: 700; cursor: pointer; }
    .heat-btn:disabled { cursor: default; }
    .heat-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .heat-band { font-size: 10px; font-weight: 600; opacity: 0.75; }
    .heat-btn:focus-visible { outline: 3px solid var(--brand-blue); outline-offset: -3px; }
    /* The above-tolerable outline on the dark Very high fill would vanish in its own colour. */
    .tbl.heat td.above-tol.risk-very-high { outline-color: #FFF; }
    .tbl.heat th.heat-axis { font-weight: 700; }
    .slt-grid .btn.xs { white-space: nowrap; }
    .slt-grid td:first-child { min-width: 170px; }
    .grid-scroll { overflow-x: auto; }
    .sug-word { font-size: 11px; margin-top: 2px; }

    .print-only { display: none; }
    @media print {
      .app { display: block; height: auto; }
      .header, .sidebar, .no-print, .toast, .autosave-bar { display: none !important; }
      .main { overflow: visible; padding: 0; background: #FFF; }
      .main > * { max-width: none; }
      .print-only { display: block; }
      .card { box-shadow: none; border-color: #BBB; page-break-inside: avoid; }
      body { font-size: 12px; background: #FFF; }
      .page-title { font-size: 18px; }
      a { color: inherit; }
      .trace summary { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <span class="brand-logo"><img src="data/AVEVASelect-LogoLockup-Landscape-Positive.png" alt="SolutionsPT - AVEVA Select UK &amp; Ireland" /></span>
        <span class="sub">OT Cyber Risk Assessment Tool <span id="stage-badge" class="stage-badge">62443-3-2-aligned</span></span>
      </div>
      <span id="suc-summary" class="engagement-summary"></span>
      <div class="spacer"></div>
      <div class="header-actions no-print">
        <button id="btn-theme" class="btn ghost" title="Toggle dark mode" aria-label="Toggle dark mode"></button>
        <button id="btn-new"  class="btn ghost" title="Start a new risk assessment">New</button>
        <button id="btn-load" class="btn ghost" title="Open a saved risk project">Load</button>
        <button id="btn-save" class="btn primary" title="Shift+click to save a copy">Save</button>
        <button id="btn-export" class="btn ghost" title="For the assessment tool's 62443-3-3 import">Export risk context</button>
        <input id="file-input" type="file" accept="application/json,.json" class="hidden" />
      </div>
    </div>
    <div id="sidebar" class="sidebar no-print"></div>
    <div id="main" class="main"></div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <!-- The suite version (js/version.js, copied in from shared/version.js) and
       this module's product name (js/product.js). js/host-bridge.js (copied
       in from shared/) lets the suite host the tool; standalone it does
       nothing, and the tool runs the same without it. -->
  <script src="js/version.js"></script>
  <script src="js/product.js"></script>
  <script src="js/host-bridge.js"></script>
  <script src="data/slt-suggestion-rules.js"></script>
  <script src="data/zcr-map.js"></script>
  <script src="data/risk-context-interchange.js"></script>
  <script src="data/engagement-guidance.js"></script>
  <script src="js/zone-map.js"></script>
  <!-- The app itself, as classic scripts in this order (no modules, so it
