<html lang="en">

  <!-- Apply the saved (or system) colour theme before first paint to avoid a
       flash. The toggle in the header updates this and persists the choice.
       Shares the "ot-theme" key with the assessment tool so the two apps agree
       on light/dark and feel like one product. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("ot-theme");
        if (t !== "dark" && t !== "light") {
          t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <style>
    /* ---- Risk-tool-specific styles (kept out of spt-theme.css so the theme
       stays a pure copy of the shared design system) ---- */
    .stage-badge { font-size: 11px; }

    .trace details { margin: 4px 0 0; }
    .trace summary {
      cursor: pointer; color: var(--brand-blue); font-size: 12px; font-weight: 600;
      list-style: none;
    }
    .trace summary::-webkit-details-marker { display: none; }
    .trace summary::before { content: "\25B8 "; }
    .trace details[open] summary::before { content: "\25BE "; }
    .trace-box {
      background: var(--surface-2); border: 1px solid var(--border);
      border-left: 3px solid var(--brand-blue); border-radius: var(--radius);
      padding: 8px 10px; font-size: 12px; margin: 6px 0 4px;
    }
    .trace-box ul { margin: 0; padding-left: 16px; }
    .trace-box li { margin: 2px 0; }

    .sis-box {
      background: var(--near-bg); border: 1px solid var(--near);
      border-radius: var(--radius); padding: 10px 12px; font-size: 13px; margin: 8px 0 12px;
    }
    .framing-note {
      background: var(--brand-blue-tint); border: 1px solid var(--brand-blue);
      border-radius: var(--radius); padding: 10px 12px; font-size: 13px; margin-bottom: 14px;
    }

    .flag-grid { display: flex; flex-wrap: wrap; gap: 6px 16px; }
    .flag-grid label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 400; cursor: pointer; user-select: none; }

    .asset-row, .line-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
    .asset-row input[type=text], .line-row input[type=text] { flex: 1; }
    .asset-row select { width: 200px; }
    .asset-row input, .asset-row select, .line-row input {
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 6px 9px; outline: none;
    }

    .fr-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .fr-chip {
      border: 1px solid var(--border-strong); background: var(--surface);
      border-radius: 999px; padding: 2px 9px; font-size: 12px; cursor: pointer; user-select: none;
      font-weight: 600; color: var(--text-muted);
    }
    .fr-chip.on { background: var(--brand-blue); border-color: var(--brand-blue); color: #FFF; }

    .threat-card {
      border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 10px;
      background: var(--surface-2);
    }
    .threat-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
    .threat-head .tid { font-weight: 700; color: var(--brand-blue-dark); }
    .threat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
    @media (max-width: 820px) { .threat-grid { grid-template-columns: 1fr; } }

    .risk-pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .risk-low       { background: var(--met-bg);  color: var(--met); }
    .risk-medium    { background: var(--near-bg); color: var(--near); }
    .risk-high      { background: var(--gap-bg);  color: var(--gap); }
    .risk-very-high { background: var(--gap);     color: #FFF; }
    .risk-none      { background: var(--surface-3); color: var(--text-muted); }

    .zone-map-wrap { overflow-x: auto; }
    .zone-map-wrap svg { display: block; margin: 0 auto; }

    .req-star { color: var(--gap); font-weight: 700; }
    .fr-slt-table td { vertical-align: top; }

    .tbl input[type=text], .tbl input[type=date], .tbl select, .tbl textarea {
      width: 100%; background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: var(--radius); padding: 5px 8px; outline: none; font-size: 13px;
    }
    .val-warn { color: var(--gap); }

    .print-only { display: none; }
    @media print {
      .app { display: block; height: auto; }
      .header, .sidebar, .no-print, .toast, .autosave-bar { display: none !important; }
      .main { overflow: visible; padding: 0; background: #FFF; }
      .main > * { max-width: none; }
      .print-only { display: block; }
      .card { box-shadow: none; border-color: #BBB; page-break-inside: avoid; }
      body { font-size: 12px; background: #FFF; }
      .page-title { font-size: 18px; }
      a { color: inherit; }
      .trace summary { display: none; }
    }
  </style>

<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <span class="brand-logo"><img src="data/AVEVASelect-LogoLockup-Landscape-Positive.png" alt="SolutionsPT - AVEVA Select UK &amp; Ireland" /></span>

  <!-- The suite version (js/version.js, copied in from shared/version.js) and
       this module's product name (js/product.js). js/host-bridge.js (copied
       in from shared/) lets the suite host the tool; standalone it does
       nothing, and the tool runs the same without it. -->
  <script src="js/version.js"></script>
  <script src="js/product.js"></script>
  <script src="js/host-bridge.js"></script>
  <script src="data/slt-suggestion-rules.js"></script>
  <script src="data/risk-context-interchange.js"></script>
  <script src="data/engagement-guidance.js"></script>

  <script>
  (function () {
    "use strict";

    var RULES = window.App.Data.sltRules;

    // Ownership notice, shown in the sidebar and on the About page. The tool
    // goes to contractors; the terms themselves are in LICENCE.txt.
    var LEGAL_SHORT = "© 2026 SolutionsPT. All rights reserved.";
    var LEGAL_NOTICE = "© 2026 SolutionsPT. All rights reserved. Proprietary and confidential. " +
      "Licensed only for work commissioned by SolutionsPT; it may not be resold, shared or used for any other " +
      "client or purpose. See LICENCE.txt for the full terms.";
    var INTERCHANGE = window.App.Data.interchange;

    // The suite version, one number for every module (js/version.js). Shown in
    // the header badge and on the About page, and carried as generatedBy in
    // the risk-context file; never put in the Word or Excel deliverables.
    var VERSION = window.App.Version;
    var TOOL_ID = "spt-risk-tool/" + VERSION.number;
    var PROJECT_SCHEMA = "spt-risk-project/0.2";
    var ACCEPTED_PROJECT_SCHEMAS = ["spt-risk-project/0.1", "spt-risk-project/0.2"];
    var AUTOSAVE_KEY = "spt-risk-tool:autosave:v1";
    // Tour mode (?tour): tour.html redirects here with the flag; the completed
    // demo project (data/tour-project.js) is loaded on boot and autosave is
    // made inert, so the demo can neither overwrite nor clear a consultant's
    // real unsaved-work snapshot. An iframe-based tour is not possible on
    // plain file:// (cross-window access between file pages is blocked unless
    // the browser runs with --allow-file-access-from-files). The suite opens
    // the tour by launching the tool with { tour: true } (js/host-bridge.js),
    // since a page it builds in memory can carry no query string.
    var TOUR_MODE = /[?&]tour(=|&|$)/.test(location.search) ||
      !!(window.App.HostBridge && window.App.HostBridge.launch.tour);

    var FRS = RULES.foundationalRequirements;           // [{id,fr,name}]
    var FR_IDS = FRS.map(function (f) { return f.id; });
    var CATS = RULES.consequenceCategories;
    var SEV = RULES.severityScale;                       // [{id,name,rank,note}]
    var LIK = RULES.likelihoodScale;                     // [{id,name,rank,note}]
    var BANDS = RULES.riskBands;                         // [{id,name,rank}]
    var MODS = RULES.exposureModifiers;

    var SIS_RULE = null, MISMATCH_RULE = null;
    RULES.specialRules.forEach(function (r) {
      if (r.id === "sis-present") SIS_RULE = r;
      if (r.id === "adversary-mismatch") MISMATCH_RULE = r;
    });

    var ASSET_TYPES = ["plc", "safety-plc", "hmi", "historian", "engineering-workstation", "server", "network", "other"];

    // rank lookups
    function rankMap(arr) { var m = {}; arr.forEach(function (x) { m[x.id] = x.rank; }); return m; }
    var SEV_RANK = rankMap(SEV), LIK_RANK = rankMap(LIK), BAND_RANK = rankMap(BANDS);
    function nameMap(arr) { var m = {}; arr.forEach(function (x) { m[x.id] = x.name; }); return m; }
    var BAND_NAME = nameMap(BANDS), FR_NAME = {}; FRS.forEach(function (f) { FR_NAME[f.id] = f.name; });

    var STAGES = [
      { id: "suc",    label: "1. System under consideration",  sub: "§4.1" },
      { id: "srs",    label: "2. High-level risk & requirements", sub: "§4.2 / 4.3" },
      { id: "zones",  label: "3. Zones & conduits",            sub: "§4.4" },
      { id: "risk",   label: "4. Detailed risk assessment",    sub: "§4.5 / 4.6 / 4.7" },
      { id: "slt",    label: "5. SL-T assignment",             sub: "per foundational requirement" }
    ];

    // ---------- State ----------

    function emptyProject() {
      return {
        schema: PROJECT_SCHEMA,
        savedOn: null,
        suc: { name: "", description: "", scopeStatement: "", assumptions: [] },
        srs: {
          adversaryClass: null,
          essentialFunctions: "",
          worstCase: "",
          tolerableRisk: (RULES.tolerableRisk && RULES.tolerableRisk.default) || "medium",
          highLevelAssets: [],   // §4.2 relative asset/system risk ranking that frames the zoning
          knownThreats: [],
          mandatorySecurityFunctions: [],
          regulatory: [],
          clientMatrix: false,
          clientMatrixNote: ""
        },
        // Engagement details for the report deliverables (Word/Excel document
        // control). Optional; blanks render as "(not set)" in the exports.
        // qaReviewBy: who did the internal QA review (an approval offers to fill it).
        engagement: { client: "", consultant: "", assessmentDate: "", revision: "", confidentiality: "", qaReviewBy: "" },
        // Evidence basis for the engagement: who we spoke to, what we read, what we saw.
        basisOfAssessment: { interviews: [], documents: [], observations: [] },
        // Asset-owner sign-off of the tolerable risk and the assessment outcome (§4.3.6 / §4).
        approval: { name: "", role: "", date: "", statement: "", approved: false },
        zones: [],
        conduits: [],
        counters: { zone: 0, conduit: 0, threat: 0, vuln: 0, cm: 0, hla: 0, interview: 0, document: 0, observation: 0 }
      };
    }

    function emptyHLA(n) { return { id: "A" + n, name: "", functionLocation: "", consequence: "", likelihood: "", note: "" }; }
    function emptyInterview(n) { return { id: "I" + n, name: "", role: "", date: "", notes: "" }; }
    function emptyDocument(n) { return { id: "D" + n, title: "", reference: "", source: "", relevance: "" }; }
    function emptyObservation(n) { return { id: "O" + n, description: "", location: "", date: "", notes: "" }; }

    function emptyFRVector() { var o = {}; FR_IDS.forEach(function (fr) { o[fr] = null; }); return o; }

    function emptyZone(n) {
      var flags = { "sis-present": false };
      MODS.forEach(function (m) { flags[m.id] = false; });
      return {
        id: "Z" + n, name: "", description: "", fn: "",
        assets: [], flags: flags,
        accessPoints: [], externalDependencies: [], securityPolicies: [],
        threats: [], vulnerabilities: [], countermeasures: [],
        slTargetByFR: emptyFRVector(), justification: "",
        fromHLA: ""   // id of the high-level asset this zone was promoted from, if any
      };
    }

    function emptyConduit(n) {
      return {
        id: "C" + n, fromZone: "", toZone: "", name: "", channels: [], notes: "",
        threats: [], vulnerabilities: [], countermeasures: [],
        slTargetByFR: emptyFRVector(), justification: ""
      };
    }

    function emptyThreat(n) {
      return { id: "T" + n, statement: "", source: "", affectedFR: [], likelihood: "", impact: "", residualLikelihood: "", residualImpact: "", acceptance: "" };
    }

    // Normalise one threat / countermeasure loaded from an older file in place.
    function normThreat(t) {
      if (!Array.isArray(t.affectedFR)) t.affectedFR = [];
      ["acceptance", "residualLikelihood", "residualImpact"].forEach(function (k) { if (typeof t[k] !== "string") t[k] = ""; });
    }
    function normCM(m) {
      if (!Array.isArray(m.addressesFR)) m.addressesFR = [];
      if (typeof m.existing !== "boolean") m.existing = false;
    }

    var state = { project: emptyProject(), stage: "suc" };

    // ---------- DOM helpers ----------

    function $(id) { return document.getElementById(id); }

    function h(tag, attrs, children) {
      var el = document.createElement(tag);
      attrs = attrs || {};
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (k === "text") el.textContent = v;
        else if (k === "class") el.className = v;
        else if (k === "onClick") el.addEventListener("click", v);
        else if (k === "onInput") el.addEventListener("input", v);
        else if (k === "onChange") el.addEventListener("change", v);
        else if (k === "checked") el.checked = !!v;
        else if (k === "value") el.value = v;
        else el.setAttribute(k, v);
      });
      (children || []).forEach(function (c) {
        if (c == null) return;
        el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
      });
      return el;
    }

    // ---------- Theme (light / dark) ----------
    // Shares the "ot-theme" localStorage key with the assessment tool so a
    // choice in one app carries to the other. The theme is pre-applied before
    // first paint by the inline script in <head>; this just wires the toggle.

    function currentTheme() { return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light"; }
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      try { localStorage.setItem("ot-theme", theme); } catch (e) {}
      var btn = $("btn-theme");
      if (btn) {
        var dark = theme === "dark";
        btn.textContent = dark ? "☀ Light" : "☾ Dark"; // icon for the mode you'd switch TO
        btn.setAttribute("title", dark ? "Switch to light mode" : "Switch to dark mode");
        btn.setAttribute("aria-pressed", dark ? "true" : "false");
      }
    }
    function setupThemeToggle() {
      applyTheme(currentTheme());
      var btn = $("btn-theme");
      if (!btn) return;
      btn.addEventListener("click", function () { applyTheme(currentTheme() === "dark" ? "light" : "dark"); });
    }

    var toastTimer = null;
    function toast(msg, kind) {
      var t = $("toast");
      t.textContent = msg;
      t.className = "toast" + (kind ? " " + kind : "");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { t.className = "toast hidden"; }, 3800);
    }

    function todayISO() {
      var d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
    function slug(s) { return (s || "risk-assessment").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "risk-assessment"; }
    function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
    function lines(v) { return v.split("\n").map(function (s) { return s.trim(); }).filter(Boolean); }

    // ---------- Persistence ----------

    // Unsaved-changes tracking: `dirty` is set on every edit and cleared on
    // save/load/new. It drives the Save* button and the beforeunload guard.
    var dirty = false, autosaveTimer = null, autosaveBroken = false;

    function updateSaveButton() {
      // The suite, when it hosts the tool, marks tools with unsaved changes
      // in its bar and warns before it closes (js/host-bridge.js; absent or
      // standalone, nothing happens). A tour is a demo whose changes are never
      // kept, so it never reports any.
      if (window.App.HostBridge) window.App.HostBridge.setDirty(dirty && !TOUR_MODE);
      var b = document.getElementById("btn-save");
      if (!b) return;
      if (dirty) { b.textContent = "Save*"; b.classList.add("btn-unsaved"); b.title = "Unsaved changes: Save overwrites the project's file in place (Shift+click: Save as…)"; }
      else { b.textContent = "Save"; b.classList.remove("btn-unsaved"); b.title = "Save the project to its file: overwrites in place (Shift+click: Save as…)"; }
    }
    function markDirty() { if (!dirty) { dirty = true; updateSaveButton(); } }
    function markClean() { if (dirty) { dirty = false; updateSaveButton(); } else updateSaveButton(); }

    // Write the crash-net snapshot now. Surfaces a one-time warning if browser
    // storage is blocked/full, so the consultant knows there is no safety net
    // (a locked-down client laptop) rather than losing work silently.
    // Inert in tour mode: the demo must never overwrite a real snapshot.
    function writeAutosave() {
      if (TOUR_MODE) return;
      try {
        localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({ savedOn: new Date().toISOString(), stage: state.stage, project: state.project }));
      } catch (e) {
        if (!autosaveBroken) { autosaveBroken = true; toast("Autosave unavailable (browser storage blocked or full). Save to a file regularly.", "err"); }
      }
    }
    function scheduleAutosave() {
      clearTimeout(autosaveTimer);
      autosaveTimer = setTimeout(writeAutosave, 800);
    }
    function flushAutosave() { clearTimeout(autosaveTimer); if (dirty && projectHasContent(state.project)) writeAutosave(); }
    function touched() { markDirty(); scheduleAutosave(); renderHeaderSummary(); }

    // True when the consultant has entered anything worth protecting — gates the
    // Load confirm so an untouched session opens a file without a needless nag.
    function projectHasContent(pj) {
      if (!pj) return false;
      var s = pj.suc || {}, r = pj.srs || {}, b = pj.basisOfAssessment || {};
      function any(a) { return Array.isArray(a) && a.length > 0; }
      var eng = pj.engagement || {};
      return !!(
        s.name || s.description || s.scopeStatement || any(s.assumptions) ||
        r.essentialFunctions || r.worstCase || r.adversaryClass || r.clientMatrixNote ||
        any(r.highLevelAssets) || any(r.knownThreats) || any(r.mandatorySecurityFunctions) || any(r.regulatory) ||
        any(b.interviews) || any(b.documents) || any(b.observations) ||
        eng.client || eng.consultant || eng.assessmentDate ||
        any(pj.zones) || any(pj.conduits)
      );
    }

    // A destructive delete confirms only when the row has real content, so
    // adding then removing a blank row stays friction-free while filled work
    // can't vanish on one misclick. Returns true when it's OK to proceed.
    function confirmRemove(filled, label) {
      return !filled || confirm("Remove this " + label + "? This can't be undone.");
    }

    function downloadBlob(text, filename) {
      var blob = new Blob([text], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 500);
    }

    // ---------- Save-in-place (File System Access API) ----------
    // A download can never overwrite, so repeated saves pile up as
    // "name (1).json" copies. On Chromium (incl. file://) Save keeps a handle
    // to the project file and writes back to it in place; Load through the
    // picker captures the handle so Save overwrites the loaded file. The
    // handle persists in IndexedDB across sessions (the browser re-confirms
    // permission on the first save of a new session). Where the API is
    // missing, Save falls back to the classic download.

    var projectHandle = null;
    var IDB_NAME = "spt-risk-files", IDB_STORE = "handles", IDB_KEY = "project";

    // The browser refuses the file dialogs to a page framed by a page of
    // another origin (the suite's folder build frames this file:// page, and
    // the browser counts every file:// page as an origin of its own). There
    // Save downloads and Load uses the file input, as in a browser without
    // the dialogs. Standalone, or framed by a page of the same origin (the
    // suite's single-file build), the dialogs are used as normal.
    function inForeignFrame() {
      try { return window.top !== window.self && !window.top.location.href; } catch (e) { return true; }
    }
    function supportsFilePickers() { return typeof window.showSaveFilePicker === "function" && !inForeignFrame(); }

    // In the suite, a project file saved or opened goes on its Recent files
    // list: the name, the customer and when, never the contents. The handle,
    // when the browser gave one, stays in this tool's own storage (see
    // js/host-bridge.js). Standalone, nothing happens.
    function noteRecentFile(action, name, handle) {
      var HB = window.App.HostBridge;
      if (!HB || !HB.hosted || !name || TOUR_MODE) return;   // a tour saves nothing worth reopening
      var p = state.project || {};
      HB.recent({ action: action, name: name, handle: handle || null,
                  label: ((p.engagement && p.engagement.client) || (p.suc && p.suc.name) || "") });
    }

    // Handle persistence is a convenience, never a dependency: all failures
    // (no IndexedDB, non-cloneable handle, private mode) are swallowed.
    function persistHandle(h) {
      try {
        var req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = function () { req.result.createObjectStore(IDB_STORE); };
        req.onerror = function () {};
        req.onsuccess = function () {
          try {
            var st = req.result.transaction(IDB_STORE, "readwrite").objectStore(IDB_STORE);
            if (h) st.put(h, IDB_KEY); else st["delete"](IDB_KEY);
          } catch (e) {}
        };
      } catch (e) {}
    }

    function restoreHandle(cb) {
      var called = false;
      function finish(h) { if (!called) { called = true; cb(h || null); } }
      if (!supportsFilePickers() || typeof indexedDB === "undefined") { finish(null); return; }
      try {
        var req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = function () { req.result.createObjectStore(IDB_STORE); };
        req.onerror = function () { finish(null); };
        req.onsuccess = function () {
          try {
            var g = req.result.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(IDB_KEY);
            g.onsuccess = function () { finish(g.result); };
            g.onerror = function () { finish(null); };
          } catch (e) { finish(null); }
        };
      } catch (e) { finish(null); }
      setTimeout(function () { finish(null); }, 1500); // broken storage must not hang the save
    }

    function ensureWritePermission(handle) {
      if (!handle.queryPermission) return Promise.resolve(true);
      return handle.queryPermission({ mode: "readwrite" }).then(function (p) {
        if (p === "granted") return true;
        return handle.requestPermission({ mode: "readwrite" }).then(function (p2) { return p2 === "granted"; });
      }).catch(function () { return false; });
    }

    // Forget the current file (New project, or a legacy file-input load) so a
    // later Save can never overwrite the WRONG project's file.
    function forgetProjectFile() { projectHandle = null; persistHandle(null); }

    // Save. Wired directly to the button click, so `ev` is the click event:
    // Shift+click forces the save dialog (a fresh copy / snapshot).
    function saveProject(ev, onDone) {
      onDone = onDone || function () {};
      var saveAs = !!(ev && ev.shiftKey);
      state.project.savedOn = new Date().toISOString();
      var text = JSON.stringify(state.project, null, 2);
      var suggested = slug(state.project.suc.name) + "-risk-project.json";

      function download(blocked) {
        downloadBlob(text, suggested);
        markClean();
        toast(blocked ? "Risk project saved (downloaded as " + suggested + "). Saving back into the same file is not available here, so each save downloads a new copy."
                      : "Risk project saved (downloaded).");
        noteRecentFile("save", suggested, null);
        onDone({ ok: true, method: "download", name: suggested, blocked: !!blocked });
      }

      if (!supportsFilePickers()) { download(inForeignFrame()); return; }

      function pick() {
        window.showSaveFilePicker({
          suggestedName: suggested,
          types: [{ description: "OT risk project", accept: { "application/json": [".json"] } }]
        }).then(function (h) { writeTo(h, false); }, function (e) {
          // Refused for a security reason (a frame the browser will not show
          // the dialog in, or the click that asked for it has expired): the
          // work still has to reach a file, so it downloads instead.
          if (e && e.name === "SecurityError") { download(true); return; }
          if (!(e && e.name === "AbortError")) toast("Save failed: " + ((e && e.message) || "save dialog failed"), "err");
          onDone({ ok: false, aborted: !!(e && e.name === "AbortError") });
        });
      }

      // canFallback: a reused/restored handle may be stale (file moved/deleted
      // or permission refused) — fall back to the picker instead of failing.
      function writeTo(handle, canFallback) {
        ensureWritePermission(handle).then(function (granted) {
          if (!granted) {
            if (canFallback) pick();
            else { toast("Save failed: write permission refused.", "err"); onDone({ ok: false }); }
            return;
          }
          handle.createWritable().then(function (w) {
            return w.write(text).then(function () { return w.close(); });
          }).then(function () {
            projectHandle = handle;
            persistHandle(handle);
            markClean();
            toast("Saved to " + handle.name + ".");
            noteRecentFile("save", handle.name, handle);
            onDone({ ok: true, method: "file", name: handle.name });
          }).catch(function (e) {
            if (canFallback) pick();
            else { toast("Save failed: " + ((e && e.message) || "could not write file"), "err"); onDone({ ok: false }); }
          });
        });
      }

      if (saveAs) { pick(); return; }
      if (projectHandle) { writeTo(projectHandle, true); return; }
      restoreHandle(function (h) { if (h) writeTo(h, true); else pick(); });
    }

    // Picker-based load: captures the handle so Save writes back to this file.
    function loadViaPicker() {
      window.showOpenFilePicker({
        types: [{ description: "OT risk project", accept: { "application/json": [".json"] } }],
        multiple: false
      }).then(function (handles) {
        var handle = handles && handles[0];
        if (!handle) return;
        handle.getFile().then(function (f) {
          var reader = new FileReader();
          reader.onload = function () {
            if (loadProjectText(String(reader.result))) { projectHandle = handle; persistHandle(handle); noteRecentFile("open", handle.name, handle); }
          };
          reader.onerror = function () { toast("Could not read the file.", "err"); };
          reader.readAsText(f);
        }, function () { toast("Could not read the file.", "err"); });
      }, function (e) {
        if (!(e && e.name === "AbortError")) toast("Open failed: " + ((e && e.message) || "open dialog failed"), "err");
      });
    }

    // Normalise a loaded project (fill missing keys, migrate 0.1 -> 0.2 shape).
    function normaliseProject(data) {
      var base = emptyProject();
      Object.keys(base).forEach(function (k) { if (data[k] == null) data[k] = base[k]; });
      // migrate old initialRisk -> srs
      if (data.initialRisk && !data.srs.essentialFunctions && !data.srs.adversaryClass) {
        data.srs.adversaryClass = data.initialRisk.adversaryClass || null;
        data.srs.essentialFunctions = data.initialRisk.essentialFunctions || "";
        data.srs.worstCase = data.initialRisk.worstCase || "";
        data.srs.clientMatrix = !!data.initialRisk.clientMatrix;
        data.srs.clientMatrixNote = data.initialRisk.clientMatrixNote || "";
      }
      delete data.initialRisk;
      ["knownThreats", "mandatorySecurityFunctions", "regulatory", "highLevelAssets"].forEach(function (k) { if (!Array.isArray(data.srs[k])) data.srs[k] = []; });
      if (!data.basisOfAssessment || typeof data.basisOfAssessment !== "object") data.basisOfAssessment = { interviews: [], documents: [], observations: [] };
      ["interviews", "documents", "observations"].forEach(function (k) { if (!Array.isArray(data.basisOfAssessment[k])) data.basisOfAssessment[k] = []; });
      if (!data.engagement || typeof data.engagement !== "object") data.engagement = { client: "", consultant: "", assessmentDate: "", revision: "", confidentiality: "", qaReviewBy: "" };
      ["client", "consultant", "assessmentDate", "revision", "confidentiality", "qaReviewBy"].forEach(function (k) { if (typeof data.engagement[k] !== "string") data.engagement[k] = ""; });
      if (!data.approval || typeof data.approval !== "object") data.approval = { name: "", role: "", date: "", statement: "", approved: false };
      ["name", "role", "date", "statement"].forEach(function (k) { if (typeof data.approval[k] !== "string") data.approval[k] = ""; });
      data.approval.approved = !!data.approval.approved;
      if (!data.counters) data.counters = base.counters;
      ["zone", "conduit", "threat", "vuln", "cm", "hla", "interview", "document", "observation"].forEach(function (k) { if (typeof data.counters[k] !== "number") data.counters[k] = 0; });
      (data.zones || []).forEach(function (z) {
        var ez = emptyZone(0);
        Object.keys(ez).forEach(function (k) { if (z[k] == null) z[k] = ez[k]; });
        if (!z.slTargetByFR || typeof z.slTargetByFR !== "object") z.slTargetByFR = emptyFRVector();
        FR_IDS.forEach(function (fr) { if (!(fr in z.slTargetByFR)) z.slTargetByFR[fr] = null; });
        // migrate old scalar slTarget -> all-FR vector
        if (typeof z.slTarget === "number") { FR_IDS.forEach(function (fr) { if (z.slTargetByFR[fr] == null) z.slTargetByFR[fr] = z.slTarget; }); delete z.slTarget; }
        delete z.consequences;
        z.threats.forEach(normThreat);
        z.countermeasures.forEach(normCM);
      });
      (data.conduits || []).forEach(function (c) {
        var ec = emptyConduit(0);
        Object.keys(ec).forEach(function (k) { if (c[k] == null) c[k] = ec[k]; });
        c.threats.forEach(normThreat);
        c.countermeasures.forEach(normCM);
        if (!c.slTargetByFR || typeof c.slTargetByFR !== "object") c.slTargetByFR = emptyFRVector();
        FR_IDS.forEach(function (fr) { if (!(fr in c.slTargetByFR)) c.slTargetByFR[fr] = null; });
        if (typeof c.slTarget === "number") { FR_IDS.forEach(function (fr) { if (c.slTargetByFR[fr] == null) c.slTargetByFR[fr] = c.slTarget; }); delete c.slTarget; }
      });
      // The consultant's section overrides, one set per report (js/report-page.js).
      // Optional and additive, so the file format stays at this schema: a file
      // without them loads as before, and an older copy of the tool keeps them.
      if (data.reportCustom != null) {
        if (typeof data.reportCustom !== "object" || Array.isArray(data.reportCustom)) delete data.reportCustom;
        else ["detailed", "highLevel"].forEach(function (k) {
          var c = data.reportCustom[k];
          if (c != null && (typeof c !== "object" || Array.isArray(c))) delete data.reportCustom[k];
        });
      }
      data.schema = PROJECT_SCHEMA;
      return data;
    }

    // Returns true only when the project was actually replaced, so callers can
    // tie follow-up state (e.g. the save-file handle) to a successful load.
    function loadProjectText(text) {
      var data;
      try { data = JSON.parse(text); }
      catch (e) { toast("Not a valid JSON file.", "err"); return false; }
      if (!data || ACCEPTED_PROJECT_SCHEMAS.indexOf(data.schema) < 0) {
        toast("Unrecognised file: expected " + ACCEPTED_PROJECT_SCHEMAS.join(" or ") + ", got " + (data && data.schema ? data.schema : "none") + ".", "err");
        return false;
      }
      if (projectHasContent(state.project)) {
        var incoming = (data.suc && data.suc.name) ? "“" + data.suc.name + "”" : "this project";
        if (!confirm("Load " + incoming + "? Unsaved changes to the current assessment will be replaced. Save first if you want to keep them.")) return false;
      }
      state.project = normaliseProject(data);
      state.stage = "suc";
      render(); writeAutosave(); markClean();
      toast("Risk project loaded.");
      return true;
    }

    // ---------- Risk engine (reads RULES; no thresholds hardcoded) ----------

    function findZone(id) { for (var i = 0; i < state.project.zones.length; i++) if (state.project.zones[i].id === id) return state.project.zones[i]; return null; }

    function riskFor(impact, likelihood) {
      if (!impact || !likelihood) return null;
      var row = RULES.riskMatrix[impact];
      return (row && row[likelihood]) || null;
    }
    function threatRisk(t) { return riskFor(t.impact, t.likelihood); }
    function exceedsTolerable(band, tolerable) { return band ? (BAND_RANK[band] > BAND_RANK[tolerable]) : false; }

    // §4.7 residual risk — the risk remaining after countermeasures. Exists only
    // once the consultant has entered a residual likelihood and/or impact
    // (either alone falls back to the unmitigated value for the other); a
    // first-pass or immature assessment leaves both blank and the unmitigated
    // risk stands.
    function residualRisk(t) {
      if (!t.residualLikelihood && !t.residualImpact) return null;
      return riskFor(t.residualImpact || t.impact, t.residualLikelihood || t.likelihood);
    }
    // Worst operative risk across a set of threats: residual where recorded,
    // otherwise unmitigated. Used to keep the report from reading as alarmist
    // when controls are already in place.
    function worstResidualOf(items) {
      var worst = null;
      items.forEach(function (t) { var r = residualRisk(t) || threatRisk(t); if (r && (worst == null || BAND_RANK[r] > BAND_RANK[worst])) worst = r; });
      return worst;
    }

    // §4.6/4.7 disposition of an over-tolerable threat, in priority order:
    //  "mitigated"     — countermeasures bring the residual risk to tolerable.
    //  "countermeasure" — a relevant countermeasure is identified (treatment in
    //                     progress; residual may not yet reach tolerable).
    //  "accepted"      — a residual risk formally recorded as accepted (§4.6).
    //  "sl-t"          — carried into the SL-T; capability is built through the
    //                     3-3 programme, so an empty countermeasure register is a
    //                     legitimate position in less mature environments.
    //  null            — no disposition at all (the only thing that is flagged).
    function threatDisposition(owner, t, tolerable) {
      tolerable = tolerable || (state.project.srs.tolerableRisk || RULES.tolerableRisk.default);
      var resid = residualRisk(t);
      if (resid != null && !exceedsTolerable(resid, tolerable)) return "mitigated";
      var covered = owner.countermeasures.some(function (m) {
        if (!(m.description || "").trim()) return false;
        // Untagged on either side: coverage can't be ruled out, so count it.
        if (!m.addressesFR.length || !t.affectedFR.length) return true;
        return m.addressesFR.some(function (fr) { return t.affectedFR.indexOf(fr) >= 0; });
      });
      if (covered) return "countermeasure";
      if ((t.acceptance || "").trim()) return "accepted";
      var set = function (fr) { return owner.slTargetByFR[fr] != null; };
      if (t.affectedFR.length ? t.affectedFR.every(set) : FR_IDS.some(set)) return "sl-t";
      return null;
    }
    function zoneSafety(zone) { return !!zone.flags["sis-present"] || zone.assets.some(function (a) { return a.type === "safety-plc"; }); }

    function worstRiskOf(items) {
      var worst = null;
      items.forEach(function (t) { var r = threatRisk(t); if (r && (worst == null || BAND_RANK[r] > BAND_RANK[worst])) worst = r; });
      return worst;
    }

    // Per-foundational-requirement suggestion for a zone.
    // Returns { byFR: {fr: {sl, risk, trace[]}}, safetyRelated, worstRisk }.
    function suggestZone(zone, project) {
      var tolerable = project.srs.tolerableRisk || RULES.tolerableRisk.default;
      var safety = zoneSafety(zone);
      var adv = project.srs.adversaryClass;
      var result = { byFR: {}, safetyRelated: safety, worstRisk: worstRiskOf(zone.threats) };

      FR_IDS.forEach(function (fr) {
        var trace = [];
        var maxBand = null, contributing = 0;
        zone.threats.forEach(function (t) {
          if (t.affectedFR && t.affectedFR.indexOf(fr) >= 0) {
            var r = threatRisk(t);
            if (r) { contributing++; if (maxBand == null || BAND_RANK[r] > BAND_RANK[maxBand]) maxBand = r; }
          }
        });

        var sl = null;
        if (maxBand) {
          var m = RULES.riskToSL[maxBand];
          sl = m.suggest;
          trace.push("Unmitigated risk " + BAND_NAME[maxBand].toLowerCase() + " for " + fr + " (from " + contributing + " threat" + (contributing === 1 ? "" : "s") + "): " + m.trace);
          if (maxBand === "very-high" && m.escalateTo) trace.push("Escalation to SL" + m.escalateTo + " available for " + fr + " only where a nation-state-grade adversary is genuinely in scope.");
          if (exceedsTolerable(maxBand, tolerable)) trace.push("This risk exceeds tolerable risk (" + tolerable + "): address via countermeasures, by carrying it into the SL-T, or with a recorded acceptance (clause 4.6/4.7).");
        } else {
          trace.push("No threats affecting " + fr + " captured yet.");
        }

        MODS.forEach(function (mod) {
          if (zone.flags[mod.id] && mod.affectsFR && mod.affectsFR.indexOf(fr) >= 0) {
            trace.push(cap(mod.effect) + " from " + mod.id + " (" + mod.label + "): " + mod.trace);
          }
        });

        if (safety) {
          var floor = SIS_RULE ? SIS_RULE.floorSL : 3;
          if (sl == null || sl < floor) { sl = floor; trace.push("SL" + floor + " floor applied (SIS present): " + SIS_RULE.trace); }
          else trace.push("SIS present: SL" + floor + " floor already met.");
        }

        if (sl != null && adv && MISMATCH_RULE && adv > sl) {
          trace.push("FLAG: assumed adversary class (SL" + adv + "-grade) exceeds suggested SL" + sl + " for " + fr + ": " + MISMATCH_RULE.trace);
        }

        result.byFR[fr] = { sl: sl, risk: maxBand, trace: trace };
      });

      if (project.srs.clientMatrix) {
        FR_IDS.forEach(function (fr) { result.byFR[fr].trace.push("Client risk matrix in use: it takes precedence over this house heuristic (hard rule)."); });
      }
      return result;
    }

    // Per-FR suggestion for a conduit: higher of its own risk-derived SL and the
    // connected zones' suggested SL, per FR (house heuristic).
    function suggestConduit(cond, project) {
      var ends = ["fromZone", "toZone"].map(function (k) { var z = findZone(cond[k]); return z ? { id: cond[k], sug: suggestZone(z, project), name: z.name } : (cond[k] === "EXT" ? { id: "EXT", sug: null, name: "external" } : null); });
      var result = { byFR: {}, worstRisk: worstRiskOf(cond.threats) };

      FR_IDS.forEach(function (fr) {
        var trace = ["House heuristic: a conduit takes the higher of its own risk-derived SL and the connected zones' suggested SL, per FR."];
        var sl = null, band = null;
        cond.threats.forEach(function (t) {
          if (t.affectedFR.indexOf(fr) >= 0) { var r = threatRisk(t); if (r && (band == null || BAND_RANK[r] > BAND_RANK[band])) band = r; }
        });
        if (band) { var m = RULES.riskToSL[band]; sl = m.suggest; trace.push("Conduit's own unmitigated risk " + BAND_NAME[band].toLowerCase() + " for " + fr + ": " + m.trace); }
        ends.forEach(function (e) {
          if (e && e.sug && e.sug.byFR[fr] && e.sug.byFR[fr].sl != null) {
            if (sl == null || e.sug.byFR[fr].sl > sl) sl = e.sug.byFR[fr].sl;
            trace.push("Inherits SL" + e.sug.byFR[fr].sl + " for " + fr + " from " + e.id + (e.name ? " (" + e.name + ")" : "") + ".");
          } else if (e && e.id === "EXT") {
            trace.push("EXT endpoint: external party (the conduit boundary is the protection point).");
          }
        });
        if (sl == null) trace.push("No threats or connected-zone suggestion for " + fr + " yet.");
        result.byFR[fr] = { sl: sl, risk: band, trace: trace };
      });
      return result;
    }

    function maxDefined(obj) { var best = null; Object.keys(obj).forEach(function (k) { if (typeof obj[k] === "number" && (best == null || obj[k] > best)) best = obj[k]; }); return best; }

    // ---------- Header / nav ----------

      if (p.conduits.length) bits.push(p.conduits.length + " conduit" + (p.conduits.length === 1 ? "" : "s"));
      var nt = p.zones.reduce(function (a, z) { return a + z.threats.length; }, 0);
      if (nt) bits.push(nt + " threat" + (nt === 1 ? "" : "s"));
      $("suc-summary").textContent = bits.join(" · ");
    }

      if (id === "slt") {
        var set = p.zones.filter(function (z) { return FR_IDS.some(function (fr) { return z.slTargetByFR[fr] != null; }); }).length;
        return p.zones.length ? set + "/" + p.zones.length : null;
      }
      return null;
    }

    // ---------- Field helpers ----------

    function textField(label, value, onInput, opts) {
      opts = opts || {};
      var input = opts.textarea
        ? h("textarea", { value: value || "", onInput: function (e) { onInput(e.target.value); } })
        : h("input", { type: "text", value: value || "", onInput: function (e) { onInput(e.target.value); } });
      if (opts.placeholder) input.setAttribute("placeholder", opts.placeholder);
      var kids = [h("label", { text: label }), input];
      if (opts.hint) kids.push(h("div", { class: "hint", text: opts.hint }));
      return h("div", { class: "field" }, kids);
    }

    function selectField(label, value, options, onChange, opts) {
      opts = opts || {};
      var sel = h("select", { onChange: function (e) { onChange(e.target.value); } });
      (opts.placeholder !== false) && sel.appendChild(h("option", { value: "", text: opts.placeholderText || "— not set —" }));
      options.forEach(function (o) {
        var op = h("option", { value: o.value, text: o.text });
        if (String(value) === String(o.value)) op.setAttribute("selected", "selected");
        sel.appendChild(op);
      });
      var kids = [h("label", { text: label }), sel];
      if (opts.hint) kids.push(h("div", { class: "hint", text: opts.hint }));
      return h("div", { class: "field" }, kids);
    }

    // Editable list of free-text lines stored as an array.
    function lineListField(label, arr, onChange, placeholder) {
      return textField(label, arr.join("\n"), function (v) { onChange(lines(v)); }, { textarea: true, placeholder: placeholder, hint: "One per line." });
    }

    // attrs: optional extra attributes, such as data-owner-id, which a review
    // comment's Go to scrolls to.
    function card(title, sub, bodyKids, headExtra, attrs) {
      var head = [h("h2", { text: title })];
      if (sub) head.push(h("span", { class: "sub", text: sub }));
      if (headExtra) head.push(headExtra);
      return h("div", Object.assign({ class: "card" }, attrs || {}), [h("div", { class: "card-h" }, head), h("div", { class: "card-b" }, bodyKids)]);
    }

    function frChips(selected, onToggle) {
      var wrap = h("div", { class: "fr-chips" });
      FRS.forEach(function (f) {
        var on = selected.indexOf(f.id) >= 0;
        wrap.appendChild(h("span", {
          class: "fr-chip" + (on ? " on" : ""),
          title: f.fr + ": " + f.name,
          onClick: function () { onToggle(f.id); },
          text: f.id

      p.counters.zone += 1;

      z.name = asset.name || ("System " + asset.id);

    function svgEl(tag, attrs, children) {

          if (!t.affectedFR.length) probs.push(label + " / " + t.id + ": no affected foundational requirements marked.");
          if (exceedsTolerable(threatRisk(t), tolerable) && !threatDisposition(o, t, tolerable)) probs.push(label + " / " + t.id + ": exceeds tolerable risk with no disposition. There is no countermeasure, no SL-T on its affected FRs, and no recorded acceptance (§4.6/4.7).");
        });
        // The justification is the deliverable, so flag it only where there is a
        // target to justify — a zone with no SL-T yet is 'incomplete', not
        // 'unjustified'. Neither blocks export (the ruling: never hard-gate).
        if (!hasSLT) probs.push(label + ": no SL-T set for any FR.");
        else if (!hasJust) probs.push(label + ": SL-T set but no justification. The per-FR justification is the deliverable, so record why, especially for any FR held below its suggestion.");
      }
      p.zones.forEach(function (z) { checkOwner(z, z.id + (z.name ? " (" + z.name + ")" : ""), true); });
      p.conduits.forEach(function (c) { checkOwner(c, c.id + (c.name ? " (" + c.name + ")" : ""), false); });
      if (p.zones.length && !(p.approval && (p.approval.name || "").trim())) probs.push("No asset-owner sign-off recorded: approve the tolerable risk and outcome on the review page (§4.3.6 / §4).");
      return probs;
    }

    function buildRiskContext() {
      var p = state.project, tolerable = p.srs.tolerableRisk || RULES.tolerableRisk.default;
      function mapThreats(o) { return o.threats.map(function (t) { var r = threatRisk(t), ex = exceedsTolerable(r, tolerable); return { id: t.id, statement: t.statement, source: t.source, affectedFR: t.affectedFR.slice(), likelihood: t.likelihood, impact: t.impact, unmitigatedRisk: r, residualLikelihood: t.residualLikelihood || null, residualImpact: t.residualImpact || null, residualRisk: residualRisk(t), exceedsTolerable: ex, disposition: ex ? threatDisposition(o, t, tolerable) : null, acceptance: t.acceptance || "" }; }); }
      function vecFrom(sug) { var o = {}; FR_IDS.forEach(function (fr) { o[fr] = sug.byFR[fr].sl; }); return o; }
      function tgtVec(owner, sug) { var o = {}; FR_IDS.forEach(function (fr) { o[fr] = owner.slTargetByFR[fr] != null ? owner.slTargetByFR[fr] : null; }); return o; }
      function scalar(tgt, sug) { var m = maxDefined(tgt); return m != null ? m : maxDefined(vecFrom(sug)); }

      return {
        schema: INTERCHANGE.schema,
        generatedBy: TOOL_ID,
        generatedOn: todayISO(),
        suc: { name: p.suc.name, description: p.suc.description, scopeStatement: p.suc.scopeStatement },
        securityRequirements: {
          tolerableRisk: tolerable,
          knownThreats: p.srs.knownThreats.slice(),
          mandatorySecurityFunctions: p.srs.mandatorySecurityFunctions.slice(),
          regulatory: p.srs.regulatory.slice()
        },
        highLevelAssets: p.srs.highLevelAssets.map(function (a) { return { id: a.id, name: a.name, functionLocation: a.functionLocation, consequence: a.consequence, likelihood: a.likelihood, risk: riskFor(a.consequence, a.likelihood), note: a.note }; }),
        basisOfAssessment: {
          interviews: p.basisOfAssessment.interviews.map(function (x) { return { id: x.id, name: x.name, role: x.role, date: x.date, notes: x.notes }; }),
          documents: p.basisOfAssessment.documents.map(function (x) { return { id: x.id, title: x.title, reference: x.reference, source: x.source, relevance: x.relevance }; }),
          observations: p.basisOfAssessment.observations.map(function (x) { return { id: x.id, description: x.description, location: x.location, date: x.date, notes: x.notes }; })
        },
        assumptions: p.suc.assumptions.slice().concat(p.srs.clientMatrix ? ["Client risk matrix used" + (p.srs.clientMatrixNote ? ": " + p.srs.clientMatrixNote : "")] : []),
        approval: { name: p.approval.name, role: p.approval.role, date: p.approval.date, statement: p.approval.statement, approved: !!p.approval.approved },
        zones: p.zones.map(function (z) {
          var s = suggestZone(z, p), tgt = tgtVec(z, s);
          return {
            id: z.id, name: z.name, safetyRelated: s.safetyRelated,
            fromHighLevelAsset: z.fromHLA || null,
            slSuggestedByFR: vecFrom(s), slTargetByFR: tgt, slTarget: scalar(tgt, s),
            worstUnmitigatedRisk: s.worstRisk,
            justification: z.justification,
            assets: z.assets.map(function (a) { return { name: a.name, type: a.type }; }),
            accessPoints: z.accessPoints.slice(), externalDependencies: z.externalDependencies.slice(), securityPolicies: z.securityPolicies.slice(),
            threats: mapThreats(z),
            vulnerabilities: z.vulnerabilities.map(function (v) { return { id: v.id, description: v.description }; }),
            countermeasures: z.countermeasures.map(function (m) { return { id: m.id, description: m.description, addressesFR: m.addressesFR.slice(), reference: m.reference, existing: !!m.existing }; })
          };
        }),
        conduits: p.conduits.map(function (c) {
          var s = suggestConduit(c, p), tgt = tgtVec(c, s);
          return {
            id: c.id, fromZone: c.fromZone, toZone: c.toZone, name: c.name, channels: c.channels.slice(),
            slSuggestedByFR: vecFrom(s), slTargetByFR: tgt, slTarget: scalar(tgt, s),
            justification: c.justification,
            threats: mapThreats(c),
            vulnerabilities: c.vulnerabilities.map(function (v) { return { id: v.id, description: v.description }; }),
            countermeasures: c.countermeasures.map(function (m) { return { id: m.id, description: m.description, addressesFR: m.addressesFR.slice(), reference: m.reference }; })
          };
        })
      };
    }

    function exportRiskContext() {
      var probs = exportProblems();
      if (probs.length && !confirm("The risk context is incomplete:\n\n- " + probs.slice(0, 20).join("\n- ") + (probs.length > 20 ? "\n…and " + (probs.length - 20) + " more" : "") + "\n\nExport anyway?")) return;

    }

    function vecStr(vec) { return FR_IDS.map(function (fr) { return vec[fr] != null ? vec[fr] : "–"; }).join("/"); }

    // ---------- Shared report fragments (used by the review and the high-level report) ----------

    function basisCount(b) { return b.interviews.length + b.documents.length + b.observations.length; }

    function basisCardKids(b) {
      function basisTable(rows, heads, cells) {

    function highLevelRankingTable() {

        h("th", { text: "SL-T (" + FR_IDS.join("/") + ")" }), h("th", { text: "Justification" })
      ])])]);
      var ztb = h("tbody");

          h("td", { class: "center" }, [riskPill(s.worstRisk), (wres && wres !== s.worstRisk) ? h("span", null, [document.createTextNode(" → "), riskPill(wres)]) : null]),

        ]));

      main.appendChild(card("Zones", p.zones.length + " zone" + (p.zones.length === 1 ? "" : "s"), [
        p.zones.length ? zt : h("p", { class: "muted", text: "No zones defined." }),
        anyResidual ? h("p", { class: "hint", style: "margin-top:8px", text: "Worst risk shows unmitigated → residual where recorded countermeasures reduce it (§4.7). Residual is the operative risk for the tolerable-risk comparison." }) : null
      ]));

          h("th", { text: "Conduit" }), h("th", { text: "Path" }), h("th", { text: "Channels" }),
          h("th", { text: "SL-T (" + FR_IDS.join("/") + ")" }), h("th", { text: "Justification" })
        ])])]);
        var ctb = h("tbody");
        p.conduits.forEach(function (c) {
          ctb.appendChild(h("tr", null, [
            h("td", { text: c.id + (c.name ? ": " + c.name : "") }),
            h("td", { text: (c.fromZone || "?") + " ↔ " + (c.toZone || "?") }),
            h("td", { text: c.channels.join(", ") || "—" }),

            h("td", { text: c.justification || "—" })

      main.appendChild(approvalCard(p));

      main.appendChild(h("div", { class: "btn-row no-print" }, [
        h("button", { class: "btn primary", text: "Download Word report", title: "The full readable deliverable for a management audience", onClick: function () { downloadWordReport({}); } }),

      ]));
      main.appendChild(h("p", { class: "hint no-print", style: "margin-top:8px", text: "Word is the readable deliverable; Excel is the engineers' working tracker. Engagement details (client, consultant, date) for the document control come from the Basis of assessment page. The risk-context file is what the assessment tool's 62443-3-3 instrument imports (“Import risk context”) to scope the assessment per zone with each zone's SL-T pre-set." }));

    // ---------- Word / Excel deliverables (js/exports.js + vendor libs) ----------

    function reportsAvailable() {
      if (window.RiskExports && window.docx && window.ExcelJS) return true;
      toast("Report libraries not loaded: open the app from its folder so vendor/ and js/ are alongside index.html.", "err");
      return false;
    }
    // One question before a download, never a block. The completeness list is
    // about zones and threats, so the high-level report (the zone-free §4.2
    // deliverable) skips it; the peer review's warnings (js/review.js) apply to
    // every download, once a review has started.
    function reportGuard(opts) {
      opts = opts || {};
      var probs = opts.highLevelOnly ? [] : exportProblems();
      var rw = window.RiskReview ? window.RiskReview.exportWarningTexts() : [];
      if (!probs.length && !rw.length) return true;
      var parts = [];
      if (probs.length) parts.push("The assessment is incomplete:\n\n- " + probs.slice(0, 20).join("\n- ") + (probs.length > 20 ? "\n…and " + (probs.length - 20) + " more" : ""));
      if (rw.length) parts.push("Peer review:\n\n- " + rw.join("\n- "));
      return confirm(parts.join("\n\n") + "\n\nGenerate the report anyway?");
    }
    // Whether the report has changed since a review approved it needs the
    // reports as they are now: built first when they are not to hand.
    function reviewChecked(go) {
      var RR = window.RiskReview;
      if (RR && RR.needsDocs && RR.needsDocs()) { toast("Checking the report against its review…"); RR.refreshDocs(go); }
      else go();
    }
    function downloadWordReport(opts) {
      opts = opts || {};
      if (!reportsAvailable()) return;
      reviewChecked(function () {
        if (!reportGuard(opts)) return;
        window.RiskExports.downloadWord(opts, function (err) {
          toast(err ? ("Word report failed: " + (err && err.message)) : "Word report downloaded.", err ? "err" : undefined);
        });
      });
    }
    function downloadExcelReport() {
      if (!reportsAvailable()) return;
      reviewChecked(function () {
        if (!reportGuard({})) return;
        window.RiskExports.downloadExcel(function (err) {
          toast(err ? ("Excel workbook failed: " + (err && err.message)) : "Excel workbook downloaded.", err ? "err" : undefined);
        });
      });
    }

    // ---------- About ----------

    function renderAbout(main) {
      main.appendChild(h("h1", { class: "page-title", text: "About & framing" }));
      main.appendChild(h("p", { class: "page-sub", text: VERSION.product + " (zones & conduits) " + VERSION.label + " (version " + VERSION.number + ")" }));

      main.appendChild(card("What this tool is (and is not)", null, [
        h("p", null, ["This tool implements the IEC 62443-3-2 Clause 4 workflow: define the SuC (4.1), high-level risk for zoning (4.2), a security requirements specification including tolerable risk (4.3), zones & conduits (4.4), a per-zone/conduit detailed risk assessment covering threats, vulnerabilities and likelihood × impact = unmitigated risk (4.5), comparison against tolerable risk (4.6), and countermeasures with the resulting residual risk (4.7). SL-T is assigned as a vector, one target per foundational requirement, and the asset owner signs off the tolerable risk and outcome."]),
        h("p", null, [h("strong", { text: "Framing built from the process description" }), ". The workflow structure follows the publicly described 62443-3-2 process (also in NIST SP 800-82 and ISA public material). Verbatim normative text, and the standard's own example risk tables, are ", h("strong", { text: "not reproduced here" }), ". They belong to the licence holder. Version 0.x reflects that the tool has not been line-by-line conformance-checked against a licensed copy of the standard."]),
        h("p", null, [h("strong", { text: "The risk matrix and SL mapping are SolutionsPT house defaults." }), " 62443-3-2 does not prescribe a risk matrix or a risk-to-SL mapping; it requires the organisation's own risk criteria and tolerable-risk threshold (def. 3.1.39, clause 4.3.6). The tool shows the full rule trace for every suggestion; the consultant's per-FR SL-T and written justification are the deliverable. Where the client has their own corporate matrix, it takes precedence."])
      ]));

      main.appendChild(card("Security level definitions", "paraphrased from published 62443 material", [
        h("table", { class: "tbl" }, [
          h("thead", null, [h("tr", null, [h("th", { text: "SL", style: "width:60px" }), h("th", { text: "Protects against" })])]),
          h("tbody", null, Object.keys(RULES.slDefinitions).filter(function (k) { return k !== "_note"; }).map(function (k) { return h("tr", null, [h("td", { text: "SL" + k }), h("td", { text: RULES.slDefinitions[k] })]); }))
        ])
      ]));

      main.appendChild(card("House risk matrix", "impact × likelihood → risk band (tune in data/slt-suggestion-rules.json)", [
        (function () {
          var t = h("table", { class: "tbl" });
          var head = h("tr", null, [h("th", { text: "Impact \\ Likelihood" })].concat(LIK.map(function (l) { return h("th", { text: l.name, class: "center" }); })));
          t.appendChild(h("thead", null, [head]));
          var tb = h("tbody");
          SEV.slice().reverse().forEach(function (sv) {
            tb.appendChild(h("tr", null, [h("td", null, [h("strong", { text: sv.name })])].concat(LIK.map(function (l) { var b = RULES.riskMatrix[sv.id][l.id]; return h("td", { class: "center" }, [riskPill(b)]); }))));
          });
          t.appendChild(tb);
          return t;
        })(),
        h("p", { class: "hint", style: "margin-top:8px", text: "Risk band → suggested SL-T: " + BANDS.map(function (b) { var m = RULES.riskToSL[b.id]; return b.name + " → SL" + m.suggest + (m.escalateTo ? " (escalatable to SL" + m.escalateTo + ")" : ""); }).join("; ") + "." })
      ]));

      main.appendChild(card("Exposure modifiers & special rules", null, [
        h("table", { class: "tbl" }, [
          h("thead", null, [h("tr", null, [h("th", { text: "Flag" }), h("th", { text: "Effect" }), h("th", { text: "FRs" }), h("th", { text: "Why" })])]),
          h("tbody", null, MODS.map(function (m) { return h("tr", null, [h("td", { text: m.label }), h("td", { text: m.effect }), h("td", { text: (m.affectsFR || []).join(", ") }), h("td", { text: m.trace })]); }))
        ]),
        h("div", { class: "spacer-12" }),
        h("p", null, [h("strong", { text: "Special rules: " }), RULES.specialRules.map(function (r) { return r.label + ": " + r.trace; }).join(" ")])
      ]));

      main.appendChild(card("Hard rules", null, [h("ul", null, RULES.hardRules.map(function (r) { return h("li", { text: r }); }))]));

      main.appendChild(card("Interchange with the assessment tool", null, [
        h("p", null, ["“Export risk context” writes a ", h("strong", { text: INTERCHANGE.schema }), " JSON file. The assessment tool's 62443-3-3 instrument imports it to scope the assessment per zone, pre-setting each zone's SL-T (a scalar, or per-FR where supported: still overridable there) and showing your justification as target provenance. The threat/vulnerability/countermeasure register travels as context and never auto-scores the 3-3 assessment. The two tools share nothing else: the file is the whole contract."])
      ]));

      main.appendChild(card("Copyright and licence", null, [h("p", { text: LEGAL_NOTICE })]));
    }

    // ---------- Render root ----------

    function render() {
      renderNav(); renderHeaderSummary();
      var main = $("main"); main.innerHTML = "";
      var fn = { suc: renderSuc, srs: renderSrs, zones: renderZones, risk: renderRisk, slt: renderSlt, review: renderReview, basis: renderBasis, hlreport: renderHLReport, about: renderAbout,
        // js/review.js (loaded after this script): the reports' peer review.
        peer: function (m) { if (window.RiskReview) window.RiskReview.render(m, h, card); },
        // js/report-page.js: both Word reports, to read and edit section by section.
        report: function (m) { if (window.RiskReportPage) window.RiskReportPage.render(m, h); }
      }[state.stage];
      (fn || renderSuc)(main);
    }

    // ---------- Header wiring ----------

    $("btn-new").addEventListener("click", function () {
      if (dirty && projectHasContent(state.project) && !confirm("Start a new risk assessment? Unsaved changes will be lost. Save first if you want to keep them.")) return;
      state.project = emptyProject(); state.stage = "suc";
      // In tour mode the snapshot belongs to the consultant's real session.
      if (!TOUR_MODE) { try { localStorage.removeItem(AUTOSAVE_KEY); } catch (e) {} }
      // Forget the previous project's file so Save can't overwrite it with
      // this new, unrelated assessment — the first save will ask where to save.
      forgetProjectFile();
      render(); markClean(); toast("New risk assessment started.");
    });
    $("btn-save").addEventListener("click", saveProject); // Shift+click = Save as…
    $("btn-export").addEventListener("click", exportRiskContext);
    $("btn-load").addEventListener("click", function () {
      if (supportsFilePickers() && typeof window.showOpenFilePicker === "function") loadViaPicker();
      else $("file-input").click();
    });
    $("file-input").addEventListener("change", function (ev) {
      var file = ev.target.files && ev.target.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        // A plain file input yields no handle: forget any previous one so Save
        // can't overwrite a DIFFERENT project's file with this one's content.
        if (loadProjectText(String(reader.result))) { forgetProjectFile(); noteRecentFile("open", file.name, null); }
      };
      reader.onerror = function () { toast("Could not read the file.", "err"); };
      reader.readAsText(file); ev.target.value = "";
    });
    // In the suite: reopening a file from its Recent files list. The bridge
    // hands over the file the consultant chose to reopen (and its handle,
    // when the browser kept one, so Save writes back to it); it goes through
    // the same checks as Load.
    if (window.App.HostBridge && window.App.HostBridge.hosted) {
      window.App.HostBridge.register({
        loadButton: "btn-load",
        applyTheme: applyTheme,
        openFile: function (file, handle) {
          var reader = new FileReader();
          reader.onload = function () {
            if (!loadProjectText(String(reader.result))) return;
            if (handle) { projectHandle = handle; persistHandle(handle); } else forgetProjectFile();
            noteRecentFile("open", file.name, handle);
          };
          reader.onerror = function () { toast("Could not read the file.", "err"); };
          reader.readAsText(file);
        }
      });
    }

    // Warn before leaving with unsaved work, and flush the crash-net first so a
    // confirmed leave (or a tab crash) can still be recovered on next open.
    // A tour is a demo: nothing to keep, so no warning.
    window.addEventListener("beforeunload", function (e) {
      if (TOUR_MODE) return;
      flushAutosave();
      if (dirty && projectHasContent(state.project)) { e.preventDefault(); e.returnValue = ""; return ""; }
    });

    // ---------- Autosave restore ----------

    function offerRestore() {
      if (TOUR_MODE) return; // the demo replaces the project; don't offer (or risk) real work here
      var raw = null; try { raw = localStorage.getItem(AUTOSAVE_KEY); } catch (e) {}
      if (!raw) return;
      var snap; try { snap = JSON.parse(raw); } catch (e) { return; }
      if (!snap || !snap.project || ACCEPTED_PROJECT_SCHEMAS.indexOf(snap.project.schema) < 0) return;
      var pj = snap.project;
      // Offer to recover ANY substantive work — including a high-level-only or
      // basis-only session that has no zones yet (both are valid deliverables).
      if (!projectHasContent(pj)) return;
      var bar = h("div", { class: "autosave-bar no-print" }, [
        h("span", { class: "autosave-msg", text: "Unsaved work from " + new Date(snap.savedOn).toLocaleString() + (pj.suc.name ? " (“" + pj.suc.name + "”)" : "") + " found." }),
        h("button", { class: "btn sm primary", text: "Restore", onClick: function () { state.project = normaliseProject(pj); state.stage = snap.stage || "suc"; document.body.removeChild(bar); render(); markDirty(); toast("Autosaved work restored."); } }),
        h("button", { class: "btn sm", text: "Discard", onClick: function () { try { localStorage.removeItem(AUTOSAVE_KEY); } catch (e) {} document.body.removeChild(bar); } })
      ]);
      document.body.appendChild(bar);
    }

    // The header badge: the suite version, then the alignment note.
    (function () {
      var badge = $("stage-badge");
      if (!badge) return;
      badge.textContent = VERSION.label + ", 62443-3-2-aligned";
      badge.title = VERSION.product + " version " + VERSION.number;
    })();

    setupThemeToggle();
    render();
    updateSaveButton();
    offerRestore();

    // ---------- Tour mode boot ----------
    // Load the completed demo project through the normal load path so every
    // guard and normaliser runs. The boot project is empty, so no confirm
    // fires; autosave is inert (see TOUR_MODE guards above).
    // The single-file build carries the demo inline (window.SPT_TOUR_PROJECT is
    // already set); the folder app loads it only when the tour is opened.
    if (TOUR_MODE && window.SPT_TOUR_PROJECT) {
      loadProjectText(JSON.stringify(window.SPT_TOUR_PROJECT));
    } else if (TOUR_MODE) {
      var tourScript = document.createElement("script");
      tourScript.src = "data/tour-project.js";
      tourScript.onload = function () {
        if (window.SPT_TOUR_PROJECT) loadProjectText(JSON.stringify(window.SPT_TOUR_PROJECT));
        else toast("Tour data missing (data/tour-project.js).", "err");
      };
      tourScript.onerror = function () { toast("Tour data (data/tour-project.js) failed to load.", "err"); };
      document.head.appendChild(tourScript);
    }

    // Exposed for the headless test page only.
    window.RiskTool = {
      state: state,
      suggestZone: suggestZone, suggestConduit: suggestConduit,
      riskFor: riskFor, threatRisk: threatRisk, exceedsTolerable: exceedsTolerable, threatDisposition: threatDisposition, residualRisk: residualRisk,
      buildRiskContext: buildRiskContext, exportProblems: exportProblems,
      emptyZone: emptyZone, emptyConduit: emptyConduit, emptyThreat: emptyThreat,
      loadProjectText: loadProjectText, projectHasContent: projectHasContent,
      confirmRemove: confirmRemove, FR_IDS: FR_IDS,
      touched: touched, isDirty: function () { return dirty; }, flushAutosave: flushAutosave,
      downloadWordReport: downloadWordReport, downloadExcelReport: downloadExcelReport,
      offerRestore: offerRestore, AUTOSAVE_KEY: AUTOSAVE_KEY,
      saveProject: saveProject, forgetProjectFile: forgetProjectFile,
      supportsFilePickers: supportsFilePickers,
      render: render, toast: toast
    };
  }());
  </script>
  <!-- Report deliverables: Word (patched docx.umd.js) + Excel (ExcelJS) via
       js/exports.js. Loaded after the app so window.RiskTool exists; the app
       degrades gracefully (toast) if these files are missing. -->
  <script src="vendor/docx.umd.js"></script>
  <script src="vendor/exceljs.min.js"></script>
  <script src="js/logo.js"></script>
  <script src="js/hero-asset.js"></script>
  <script src="js/report-sections.js"></script>
  <script src="js/exports.js"></script>
  <!-- Peer review of the reports: packs and review files (contracts/review-*.json). -->
  <script src="data/review-pack.js"></script>
  <script src="data/review-file.js"></script>
  <script src="js/docx-blocks.js"></script>
  <script src="js/review-core.js"></script>
  <script src="js/review-author.js"></script>
  <script src="js/report-page.js"></script>
  <script src="js/review.js"></script>
</body>
