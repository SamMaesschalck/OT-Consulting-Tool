<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OT Cyber Document Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <!-- An imported Word file is someone else's file. The page loads nothing from
       anywhere but itself: its own scripts and styles (inline in the single-file
       build), and pictures only from the page, embedded, or as object URLs of the
       document's own pictures (blob:). It evaluates no strings. There is no
       connect-src, so fetch() of anything, a blob: or data: URL included, is
       refused: bytes are read with Blob.arrayBuffer(), FileReader or atob. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'" />
  <link rel="stylesheet" href="css/spt-theme.css" />
  <link rel="stylesheet" href="css/documents.css" />
  <link rel="stylesheet" href="css/editor.css" />
  <link rel="stylesheet" href="css/tables.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/doc-preview.css" />
  <!-- Apply the saved (or system) colour theme before first paint to avoid a
       flash. Shares the "ot-theme" key with the other tools. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("ot-theme");
        if (t !== "dark" && t !== "light") {
          t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- The elements with ids are fixed (docs/document-tool-design.md 5.1); everything
       else is built by script inside them. One script or stylesheet per line: the
       single-file build (packaging/single-html) reads this page line by line. -->
  <div class="app">
    <div id="app-header" class="header">
      <div class="brand">
        <span class="brand-logo"><img src="data/AVEVASelect-LogoLockup-Landscape-Positive.png" alt="SolutionsPT - AVEVA Select UK &amp; Ireland" /></span>
        <span class="sub">OT Cyber Document Tool <span id="version-badge" class="stage-badge"></span></span>
      </div>
      <span id="save-state" class="engagement-summary"></span>
      <span id="autosave-note" class="engagement-summary"></span>
      <div class="spacer"></div>
      <div class="header-actions no-print">
        <button id="btn-theme" class="btn ghost" title="Toggle dark mode" aria-label="Toggle dark mode"></button>
        <button id="btn-new" class="btn ghost" title="Start a new document">New</button>
        <button id="btn-load" class="btn ghost" title="Open a document file, or a Word file to bring into the template">Load</button>
        <button id="btn-save" class="btn ghost" title="Save your document file (Shift+click: Save as)">Save</button>
        <input id="file-input" type="file" accept="application/json,.json,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.docx" class="hidden" />
      </div>
    </div>
    <div id="sidebar" class="sidebar no-print">
      <div id="nav"></div>
      <div id="outline"></div>
    </div>
    <!-- Two views share the main area, one shown at a time. Every page but Edit
         is drawn into #main and may empty it. The editor has its own view, so a
         large document's blocks are built once and survive a visit to another
         page. #notices sits above both and belongs to the shell (app.js): the
         tour's note, unsaved work found in this browser, pictures that could
         not be restored. A page can then empty #main without losing them. -->
    <div id="stage">
      <div id="notices" class="no-print"></div>
      <div id="main" class="main"></div>
      <div id="edit-view" class="main hidden">
        <div id="toolbar" role="toolbar" aria-label="Formatting"></div>
        <div id="paper" tabindex="0"></div>
      </div>
    </div>
  </div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <div id="modal" class="hidden"></div>

  <script src="js/version.js"></script>
  <script src="js/product.js"></script>
  <script src="js/host-bridge.js"></script>
  <script src="js/logo.js"></script>
  <script src="js/hero-asset.js"></script>
  <script src="vendor/docx.umd.js"></script>
  <script src="js/zip-io.js"></script>
  <script src="js/docx-graft.js"></script>
  <script src="js/house-docx.js"></script>
  <script src="js/docx-import.js"></script>
  <script src="data/document.js"></script>
  <script src="data/licence.js"></script>
  <script src="js/model.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/pictures.js"></script>
  <script src="js/doc-preview.js"></script>
  <script src="js/render.js"></script>
  <script src="js/history.js"></script>
  <script src="js/tables.js"></script>
  <script src="js/paste.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/export.js"></script>
  <script src="js/import-flow.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
