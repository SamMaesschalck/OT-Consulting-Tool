<html lang="en"><head><meta charset="utf-8"/><title>Document tool: fixes to the template and the writer</title>
<!-- For step 10's screen cover (once test-doc-fix-r2-cover.html). -->
<link rel="stylesheet" href="../css/spt-theme.css" />
<link rel="stylesheet" href="../css/editor.css" />
<link rel="stylesheet" href="../css/pages.css" />

<body>
<pre id="out">running...</pre>
<div id="stage" style="position:absolute; left:0; top:0;"></div>
<!--
  Regression tests for the review of the Word template (shared/house-docx.js)
  and the export (js/export.js). Each step is one finding, built into a real
  Word file with the real library, zip reader and graft pass, and read back
  from the XML:

    1. the cover is two rows of exact height that cannot split, so a wrapped
       line cannot push it onto a second page; text too long to fit is said
       at export;
    2. heading numbers never hold a nought when a level is skipped;
    3. the footer's left cell follows the classification;
    4. the cover's strip leaves out an empty date and an empty author;
    5. the contents list has no line for a heading with no words, as the
       preview has none;
    6. the file's properties never say "Un-named";
    7. characters XML cannot hold are left out wherever text is written;
    8. a picture taller than the page is made to fit it, and is listed;
    9. a numbered list that opens below its top level is written so that
       Word prints the numbers the screen shows;
   10. (second review round, once test-doc-fix-r2-cover.html) the cover strip
       keeps each label with its value. With a long author the strip wrapped
       between CLASSIFICATION and its value (seen in Word). Now a pair that
       fits on a line is one unit (no-break spaces and hyphens), a pair too
       long for a line has a line of its own and wraps inside its value with
       the label held to it, and the normal strip prints as before. The
       screen's cover wraps its pairs the same way, and the cover still fits
       its page;
   11. a short document's Word file prints the issued date when one is given,
       otherwise the date (the screen's line is test-doc-fix-pages.html's).

  What only Word can show (the cover on one page, a tall picture on its page,
  the list numbers Word prints) was read back from Word when these fixes were
  made; the XML that produced those results is what is pinned here.
-->
<script>
// A script that fails to load or throws is a failure, not a page that says "running" for ever.
window.addEventListener("error", function (e) { document.getElementById("out").textContent = "FAIL the page threw: " + (e.message || (e.target && e.target.src) || "a script did not load") + "\n\n1 FAILED"; }, true);
</script>
<script src="../js/version.js"></script>
<script src="../js/product.js"></script>
<script src="../js/logo.js"></script>
<script src="../js/hero-asset.js"></script>
<script src="../vendor/docx.umd.js"></script>
<script src="../js/zip-io.js"></script>
<script src="../js/docx-graft.js"></script>
<script src="../js/house-docx.js"></script>
<script src="../data/document.js"></script>
<script src="../js/model.js"></script>
<script src="../js/doc-preview.js"></script>
<script src="../js/render.js"></script>
<script src="../js/export.js"></script>
<script>
(function () {
  var lines = [], fail = 0;
  function ok(c, n, d) { lines.push((c ? "PASS " : "FAIL ") + n + (!c && d ? " - " + d : "")); if (!c) fail++; }
  function finish() {
    alive = false;
    lines.push("", fail === 0 ? "ALL TESTS PASSED" : fail + " FAILED");
    document.getElementById("out").textContent = lines.join("\n");
  }
  // Packing runs off the main thread, and headless Edge's virtual clock runs
  // out the moment the page has nothing queued, which under load dumped a
  // page part way through. A message bounced to ourselves keeps a task
  // queued, without moving the clock, until the tests finish (as
  // test-doc-zip.html).
  var alive = true, bounce = new MessageChannel();
  bounce.port1.onmessage = function () { if (alive) bounce.port2.postMessage(0); };
  bounce.port2.postMessage(0);
  var A = window.App, HD = A.HouseDocx, Zip = A.ZipIO;

  // ---- helpers ----
  function unzip(blob) {
    return Zip.read(blob).then(function (list) {
      var map = {};
      list.forEach(function (x) { map[x.name] = { name: x.name, bytes: x.bytes, text: /\.(xml|rels)$/.test(x.name) && x.bytes ? new TextDecoder().decode(x.bytes) : "" }; });
      return map;
    });
  }
  function text(z, name) { return (z[name] && z[name].text) || ""; }
  function wellFormed(z) {
    return Object.keys(z).filter(function (n) { return z[n].text && new DOMParser().parseFromString(z[n].text, "application/xml").getElementsByTagName("parsererror").length > 0; });
  }
  function build(p, status) {
    return HD.buildDocument(p, { issueStatus: status || "draft" }).then(function (r) {
      return unzip(r.blob).then(function (z) { return { z: z, doc: text(z, "word/document.xml"), fitted: r.fitted, blob: r.blob }; });
    });
  }
  function coverXml(doc) { return doc.slice(doc.indexOf("<w:body>"), doc.indexOf("</w:sectPr>") + 11); }
  // The cover strip holds each label to its value with no-break spaces and
  // hyphens (step 10 pins those); here they read as plain.
  function texts(xml) { return (xml.match(/<w:t [^>]*>[^<]*<\/w:t>|<w:t>[^<]*<\/w:t>/g) || []).map(function (t) { return t.replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/\u00a0/g, " ").replace(/\u2011/g, "-"); }); }
  function paras(xml) { return xml.match(/<w:p>[\s\S]*?<\/w:p>|<w:p\/>/g) || []; }
  function paraWith(xml, needle) { return paras(xml).filter(function (p) { return p.indexOf(">" + needle + "<") !== -1; })[0] || ""; }
  // The last paragraph holding the words: the heading itself, not its line in the contents list.
  function lastParaWith(xml, needle) { return paras(xml).filter(function (p) { return p.indexOf(needle + "<") !== -1; }).pop() || ""; }
  // A typed heading number is followed by an em space; a plain one here.
  function plain(s) { return String(s).replace(/\s/g, " "); }
  function footers(z) { return Object.keys(z).filter(function (n) { return /^word\/footer\d+\.xml$/.test(n); }).sort(); }
  function footerLeftOf(z) {
    return footers(z).map(function (n) { return texts((text(z, n).match(/<w:tc>[\s\S]*?<\/w:tc>/g) || [""])[0]).join(""); });
  }
  function numIdOf(p) { return (p.match(/<w:numId w:val="(\d+)"\/>/) || [])[1]; }
  function numOf(nx, numId) { return (nx.match(new RegExp('<w:num w:numId="' + numId + '"[^>]*>[\\s\\S]*?</w:num>')) || [""])[0]; }
  function absIdOf(num) { return (num.match(/<w:abstractNumId w:val="(\d+)"\/>/) || [])[1]; }
  // "0:1,1:1,2:1": the start each level of a numbering instance is given.
  function startsOf(num) {
    return (num.match(/<w:lvlOverride w:ilvl="\d"><w:startOverride w:val="\d+"\/><\/w:lvlOverride>/g) || []).map(function (m) {
      return m.match(/ilvl="(\d)"/)[1] + ":" + m.match(/startOverride w:val="(\d+)"/)[1];
    }).join(",");
  }

  var seq = 0;
  function id() { seq += 1; return "b" + seq; }
  function para(runs, extra) { return Object.assign({ id: id(), type: "paragraph", runs: typeof runs === "string" ? [{ t: runs }] : runs }, extra || {}); }
  function head(level, t, extra) { return Object.assign({ id: id(), type: "heading", level: level, runs: typeof t === "string" ? [{ t: t }] : t }, extra || {}); }
  function item(level, t, extra) { return Object.assign({ id: id(), type: "list", list: "number", level: level, runs: [{ t: t }] }, extra || {}); }
  var INFO = { title: "Network segmentation proposal", docType: "Proposal", client: "Northfield Water", site: "Ashby treatment works", reference: "OPP-10234",
    revision: "1.2", issuedDate: "2026-11-11", author: "A. Consultant", classification: "Confidential" };
  function project(blocks, over) {
    var p = { schema: "spt-document/1.0", kind: "report", info: Object.assign({}, INFO), options: {}, footnotes: {}, media: {}, parts: {},
      blocks: blocks || [head(1, "Summary"), para("Body text.")] };
    over = over || {};
    Object.keys(over).forEach(function (k) { if (k === "info") p.info = Object.assign(p.info, over.info); else p[k] = over[k]; });
    return p;
  }
  // A real PNG of a given size, drawn here.
  function png(w, h) {
    var c = document.createElement("canvas"); c.width = w; c.height = h;
    var g = c.getContext("2d"); g.fillStyle = "#DCE9F3"; g.fillRect(0, 0, w, h); g.fillStyle = "#173267"; g.fillRect(0, 0, w, 4);
    return new Promise(function (res) { c.toBlob(function (b) { res(b); }, "image/png"); });
  }

  var chain = Promise.resolve();
  // Progress is written after each step, as a failure until the last one has
  // run: a page cut short by the time budget must not read as a short pass.
  // A step that throws is one failure, and the steps after it still run: each
  // is a finding of its own.
  var stepNo = 0;
  function step(fn) {
    var no = ++stepNo;
    chain = chain.then(fn).then(null, function (e) { ok(false, "step " + no + " threw: " + (e && e.message), e && e.stack); })
      .then(function () { document.getElementById("out").textContent = lines.join("\n") + "\nFAIL the page did not finish: re-run it alone with a larger time budget"; });
  }

  // ---- 1. the cover cannot spill onto a second page ----
  var LONG_AUTHOR = "Alexandra Featherstonehaugh and Bartholomew Winterbottom";
  var TITLE_160 = "Operational technology remote access, network segmentation and security monitoring improvement programme for the northern region water treatment works estate 2027";
  function coverChecks(r, label, isDraft) {
    var cov = coverXml(r.doc);
    var rows = cov.match(/<w:tr><w:trPr><w:cantSplit\/><w:trHeight w:val="\d+" w:hRule="exact"\/><\/w:trPr>/g) || [];
    var heights = rows.map(function (x) { return +x.match(/w:val="(\d+)"/)[1]; });
    ok(rows.length === 2 && (cov.match(/<w:tr>/g) || []).length === 3, label + ": the cover table is two rows of exact height that cannot split (the third row is the rule under the document type)", String(rows.length) + "/" + (cov.match(/<w:tr>/g) || []).length);
    ok(heights.length === 2 && heights[0] === HD.COVER.topRow && heights[1] === HD.COVER.footRow && heights[0] + heights[1] <= 15900,
       label + ": the two heights are within what Word was seen to keep on one page (about 16000 twips together)", heights.join("+"));
    ok(!/w:line="\d{4,}" w:lineRule="exact"/.test(cov), label + ": no spacer paragraph pushes the strip down", (cov.match(/w:line="\d{4,}"/g) || []).join(","));
    var at = cov.indexOf(rows[1] || "\u0000"), top = cov.slice(0, at), foot = cov.slice(at, cov.lastIndexOf("</w:tbl>"));
    var tt = texts(top), ft = texts(foot);
    ok(at > 0 && tt.indexOf("ISSUE   ") === -1 && ft[0] === "ISSUE   " && ft.indexOf(HD.COMPANY.addressLine) !== -1 && ft.indexOf(HD.COMPANY.contactLine) === ft.length - 1,
       label + ": the strip and the two address lines are the second row, and nothing else is", ft.join("|"));
    ok(/<w:vAlign w:val="bottom"\/>/.test(foot.slice(0, foot.indexOf("<w:p>"))), label + ": set against the bottom of it, so a strip that wraps grows upwards");
    ok(tt.indexOf("OPP-10234") !== -1 && tt.indexOf("Northfield Water") !== -1 && /<w:drawing>/.test(top), label + ": the title block, the client, the site and the reference are the first row", tt.join("|"));
    var after = cov.slice(cov.lastIndexOf("</w:tbl>"));
    ok((after.match(/<w:p>/g) || []).length <= 2 && (isDraft ? /string="DRAFT"/.test(after) && /fillcolor="#FFFFFF"/.test(after) : !/string="DRAFT"/.test(cov)),
       label + ": the paragraph after the table " + (isDraft ? "anchors the draft watermark, so it stays on the cover" : "carries no watermark on a final"));
  }
  step(function () {
    var claimed = project(null, { info: { author: LONG_AUTHOR, classification: "Commercial in confidence" } });
    return build(claimed, "draft").then(function (r) {
      ok(wellFormed(r.z).length === 0, "cover, long author and classification: every XML part parses", wellFormed(r.z).join(", "));
      coverChecks(r, "long author and classification, draft", true);
      return build(claimed, "final");
    }).then(function (r) {
      coverChecks(r, "the same as a final", false);
      return build(project(null, { info: { title: TITLE_160 } }), "draft");
    }).then(function (r) {
      coverChecks(r, "a title of 160 characters", true);
      ok(texts(coverXml(r.doc)).filter(function (t) { return TITLE_160.indexOf(t) !== -1 && t.length > 30; }).length === 3, "and its three lines are all there");
      return build(project(null, { info: { coverTitleLines: ["Remote access", "and monitoring", "improvement plan"] } }), "draft");
    }).then(function (r) {
      coverChecks(r, "three lines at the largest size", true);
      // What fits and what does not.
      ok(HD.coverFits(project()) && HD.coverFits(claimed) && HD.coverFits(project(null, { info: { title: TITLE_160 } })) && HD.coverFits({ info: {} }),
         "coverFits: an ordinary cover, the long author and the 160 character title all fit");
      var huge = new Array(60).join("an improvement programme ");
      var room = HD.coverRoom(HD.coverInput(project(null, { info: { coverTitleLines: [huge, huge, huge] } })));
      ok(room.fits === false && room.top === false && room.foot === true, "coverFits: a title of some thousands of characters does not fit the first row", JSON.stringify(room));
      room = HD.coverRoom(HD.coverInput(project(null, { info: { author: new Array(120).join("A. Consultant and ") } })));
      ok(room.fits === false && room.top === true && room.foot === false, "coverFits: an author line of some thousands of characters does not fit the second", JSON.stringify(room));
    });
  });
  // The export says when the cover's text is cut off (js/export.js).
  step(function () {
    var calls = { toast: [], down: [] };
    A.DocApp = { state: { doc: null }, toast: function (t, k) { calls.toast.push([t, k]); }, busy: function () {} };
    A.DocStorage = A.DocStorage || {};
    A.DocStorage.download = function (blob, name) { calls.down.push(name); };   // a download hangs a headless page
    var huge = new Array(60).join("an improvement programme ");
    A.DocApp.state.doc = project(null, { info: { coverTitleLines: [huge, huge, huge] } });
    return A.DocExport.word("draft").then(function (res) {
      ok(res && res.coverCut === true && calls.down.length === 1 && calls.toast.length === 1 && calls.toast[0][1] === "warn" &&
         /The cover has more text than its page holds, so some of it is cut off\. Shorten the title or the other cover lines\.$/.test(calls.toast[0][0]),
         "export: a cover with far too much text is exported with a warning that says what to do", JSON.stringify(calls.toast));
      calls.toast = [];
      A.DocApp.state.doc = project();
      return A.DocExport.word("draft");
    }).then(function (res) {
      ok(res && res.coverCut === false && calls.toast.length === 1 && calls.toast[0][1] === undefined && /^Exported Northfield-Water-Network-segmentation-proposal-1\.2-draft\.docx\.$/.test(calls.toast[0][0]),
         "export: an ordinary document is exported with no warning", JSON.stringify(calls.toast));
      calls.toast = [];
      A.DocApp.state.doc = project(null, { kind: "short", info: { coverTitleLines: [huge, huge, huge] } });
      return A.DocExport.word("draft");
    }).then(function (res) {
      ok(res && res.coverCut === false && calls.toast[0][1] === undefined, "export: a short document has no cover, so nothing is said about one");
    });
  });

  // ---- 2. heading numbers when a level is skipped ----
  step(function () {
    function nums(levels) { var hs = levels.map(function (l) { return head(l, "h"); }), n = HD.headingNumbers(hs); return hs.map(function (h) { return n[h.id]; }); }
    ok(nums([2, 1, 3, 1, 2]).join(" ") === "1 2 2.1 3 3.1", "heading numbers: a level 2 heading before any level 1 is 1, and a level 3 directly under a level 1 is 2.1", nums([2, 1, 3, 1, 2]).join(" "));
    ok(nums([1, 3, 2]).join(" ") === "1 1.1 1.2", "a level 3 then a level 2 under one level 1 are 1.1 and 1.2", nums([1, 3, 2]).join(" "));
    ok(nums([3, 3, 2, 3, 1]).join(" ") === "1 2 3 3.1 4", "headings that only ever go up a level count on at the top", nums([3, 3, 2, 3, 1]).join(" "));
    ok(nums([1, 2, 3, 2, 1, 2, 3, 3]).join(" ") === "1 1.1 1.1.1 1.2 2 2.1 2.1.1 2.1.2", "a document whose levels do not skip is numbered as before", nums([1, 2, 3, 2, 1, 2, 3, 3]).join(" "));
    var every = [[2, 1, 3, 1, 2], [1, 3, 2], [3, 2, 1], [3, 1, 3, 2, 2, 3], [2, 2, 3, 1, 3]].map(nums).reduce(function (a, b) { return a.concat(b); }, []);
    ok(every.every(function (n) { return !/(^|\.)0(\.|$)/.test(n); }), "no number holds a nought", every.join(" "));
    var blocks = [head(2, "Background"), para("Text."), head(1, "Scope"), head(3, "Detail"), head(1, "Costs")];
    return build(project(blocks, { options: { contents: true, numberHeadings: true } })).then(function (r) {
      var at = r.doc.indexOf(">Contents<"), list = r.doc.slice(at, r.doc.indexOf("<w:bookmarkStart"));
      var links = (list.match(/<w:hyperlink [^>]*>[\s\S]*?<\/w:hyperlink>/g) || []).map(function (l) { return plain(texts(l).join("")); });
      ok(links.join("|") === "1 Background|2 Scope|3 Costs", "the contents list of a report whose first heading is level 2 prints 1, 2, 3", links.join("|"));
      var hDetail = lastParaWith(r.doc, "Detail"), hBack = lastParaWith(r.doc, "Background");
      ok(plain(texts(hDetail).join("")) === "2.1 Detail" && plain(texts(hBack).join("")) === "1 Background", "and so do the headings", texts(hDetail).join("") + " / " + texts(hBack).join(""));
      ok(/<w:pStyle w:val="Heading2"\/>/.test(hBack) && /<w:pStyle w:val="Heading3"\/>/.test(hDetail), "each still in the style of its own level", hBack.slice(0, 200));
      ok(!/>0\.1\s|>1\.0\.1\s/.test(r.doc), "0.1 and 1.0.1 are printed nowhere");
    });
  });

  // ---- 3. the footer follows the classification ----
  step(function () {
    ok(HD.footerLeft("") === HD.COMPANY.footerLeft && HD.footerLeft(undefined) === HD.COMPANY.footerLeft && HD.footerLeft("Confidential") === "Confidential · © SolutionsPT Ltd" &&
       HD.footerLeft("  Commercial in  confidence ") === "Commercial in confidence · © SolutionsPT Ltd", "footerLeft: the classification then the company; Confidential when there is none");
    return build(project(null, { info: { classification: "Commercial in confidence" } })).then(function (r) {
      var left = footerLeftOf(r.z);
      ok(left.length >= 1 && left.every(function (t) { return t === "Commercial in confidence · © SolutionsPT Ltd"; }), "a report classified Commercial in confidence says so in every footer", left.join("|"));
      ok(texts(coverXml(r.doc)).indexOf("Commercial in confidence") !== -1 && /Commercial in confidence/.test(paraWith(r.doc, "Commercial in confidence")), "as on its cover and in document control");
      return Promise.all([build(project(null, { info: { classification: "" } })), build(project(null, { info: { classification: "Confidential" } }))]);
    }).then(function (rs) {
      ok(rs.every(function (r) { return footerLeftOf(r.z).every(function (t) { return t === "Confidential · © SolutionsPT Ltd"; }); }),
         "with no classification, or Confidential, the footer is the assessment's to the letter", footerLeftOf(rs[0].z).join("|"));
      ok(text(rs[0].z, footers(rs[0].z)[0]) === text(rs[1].z, footers(rs[1].z)[0]), "the two footers are the same XML");
      return build(project(null, { kind: "short", info: { classification: "Public" } }), "final");
    }).then(function (r) {
      var all = footers(r.z).map(function (n) { return text(r.z, n); }).join("\n");
      ok(/>Public · © SolutionsPT Ltd</.test(all) && !/Confidential/.test(all) && !/Confidential/.test(r.doc), "a short document classified Public says Public in its footer and Confidential nowhere", footerLeftOf(r.z).join("|"));
    });
  });

  // ---- 4. the strip leaves out what is empty ----
  step(function () {
    return build(project(null, { info: { author: "", date: "", issuedDate: "", revision: "" } })).then(function (r) {
      var ct = texts(coverXml(r.doc)), at = ct.indexOf("ISSUE   ");
      ok(at !== -1 && ct.slice(at, at + 4).join("|") === "ISSUE   |0.1|        CLASSIFICATION   |Confidential", "with no author and no date the strip is the issue and the classification", ct.slice(at, at + 5).join("|"));
      ok(!ct.some(function (t) { return /AUTHOR/.test(t); }) && ct[at + 1].indexOf("·") === -1, "no AUTHOR label with nothing after it, and no dot after the revision");
      return build(project(null, { info: { author: "", issuedDate: "", date: "2026-11-12" } }));
    }).then(function (r) {
      var ct = texts(coverXml(r.doc)), at = ct.indexOf("ISSUE   ");
      ok(ct.slice(at, at + 4).join("|") === "ISSUE   |1.2  ·  2026-11-12|        CLASSIFICATION   |Confidential", "a date with no author prints the date", ct.slice(at, at + 4).join("|"));
      return build(project(null, { info: { issuedDate: "", date: "" } }));
    }).then(function (r) {
      var ct = texts(coverXml(r.doc)), at = ct.indexOf("ISSUE   ");
      ok(ct.slice(at, at + 6).join("|") === "ISSUE   |1.2|        AUTHOR   |A. Consultant|        CLASSIFICATION   |Confidential", "an author with no date prints the author", ct.slice(at, at + 6).join("|"));
      return build(project());
    }).then(function (r) {
      var ct = texts(coverXml(r.doc)), at = ct.indexOf("ISSUE   ");
      ok(ct.slice(at, at + 6).join("|") === "ISSUE   |1.2  ·  2026-11-11|        AUTHOR   |A. Consultant|        CLASSIFICATION   |Confidential", "with every value given the strip is the assessment's", ct.slice(at, at + 6).join("|"));
    });
  });

  // ---- 5. the contents list and a heading with no words ----
  step(function () {
    var M = A.DocModel, R = A.DocRender;
    function doc(numbered) {
      var d = M.create("report");
      d.info.title = "Listing test";
      d.options.contents = true; d.options.numberHeadings = numbered;
      d.footnotes = { f1: { runs: [{ t: "A note." }] } };
      d.blocks = [head(1, "Scope"), head(1, [], { id: "empty1" }), head(2, [{ t: "   " }], { id: "blank2" }), head(1, [{ fn: "f1" }], { id: "noteonly" }), head(2, "After"), para("Text.")];
      return M.normalise(d);
    }
    function wordLines(r) {
      var at = r.doc.indexOf(">Contents<"), list = r.doc.slice(at, r.doc.indexOf('<w:br w:type="page"/>', at));
      // `list` opens inside the Contents heading, so its whole paragraphs are the lines.
      return { xml: list, lines: paras(list).map(function (p) { return plain(texts(p).join("")); }) };
    }
    function screenLines(d) { return Array.prototype.map.call(R.contentsEl(d).querySelectorAll(".contents-line"), function (n) { return plain(n.textContent); }); }
    var d1 = doc(true), d2 = doc(false);
    var wordless = d1.blocks.filter(function (b) { return b.type === "heading" && !(b.runs || []).some(function (r) { return r.t && r.t.trim(); }); });
    var after = HD.headingNumbers(d1.blocks)[d1.blocks.filter(function (b) { return b.type === "heading" && b.level === 2 && (b.runs || []).some(function (r) { return r.t === "After"; }); })[0].id];
    return build(d1).then(function (r) {
      var w = wordLines(r);

      var rs = stripRuns(r.doc), at = -1;
      rs.forEach(function (x, i) { if (/CLASSIFICATION/.test(x.text)) at = i; });
      var lab = rs[at] || {}, val = rs[at + 1] || {};
      ok(lab.br === true && lab.text === "CLASSIFICATION" + NBSP + NBSP + NBSP, "10 too long: it starts a line of its own, with no spaces before its label", JSON.stringify(lab));
      ok(val.text === LONG_CLASS, "10 too long: its value keeps ordinary spaces, so it wraps inside itself", JSON.stringify(val.text));
      ok(HD.coverFits(p), "10 too long: the cover still fits its page");
      var some = stripProject({ author: LONG_AUTHOR, classification: new Array(15).join("not for onward distribution ") });
      var lots = stripProject({ author: LONG_AUTHOR, classification: new Array(50).join("not for onward distribution ") });
      ok(HD.coverRoom(HD.coverInput(some)).foot === true && HD.coverRoom(HD.coverInput(lots)).foot === false,
         "10 too long: the estimate of the strip's height still says when a pair of many lines no longer fits", JSON.stringify(HD.coverRoom(HD.coverInput(lots))));
    });
  });
  // the screen: pairs are units, laid out as Word lays them
  step(function () {
    var stage = document.getElementById("stage");
    function draw(over) { stage.textContent = ""; var el = R2.coverEl(stripProject(over)); stage.appendChild(el); return el; }
    var el = draw({});
    var pairs = el.querySelectorAll(".cover-strip > .cover-pair");
    ok(pairs.length === 3 && Array.prototype.every.call(pairs, function (q) { return q.children.length === 2 && q.children[0].className === "cover-k" && q.children[1].className === "cover-v"; }),
       "10 screen: the strip is three label and value pairs, each one unit", el.querySelector(".cover-strip").innerHTML.slice(0, 200));
    var tops = Array.prototype.map.call(el.querySelectorAll(".cover-strip .cover-k, .cover-strip .cover-v"), function (n) { return Math.round(n.getBoundingClientRect().bottom); });
    ok(tops.length === 6 && Math.max.apply(null, tops) - Math.min.apply(null, tops) <= 4, "10 screen: the normal strip is on one line", tops.join());
    var stripH = el.querySelector(".cover-strip").getBoundingClientRect().height;
    ok(stripH > 10 && stripH < 20, "10 screen: and one line high, as before", String(stripH));
    [["long", { client: "Northfield and District Water and Wastewater Services Joint Operating Company Limited", author: LONG_AUTHOR, classification: "Official sensitive, commercial in confidence, not for onward distribution" }],
     ["too long", { author: LONG_AUTHOR, classification: LONG_CLASS }]].forEach(function (c) {
      var e = draw(c[1]);
      var parted = Array.prototype.filter.call(e.querySelectorAll(".cover-strip .cover-k"), function (k) {
        var v = k.nextElementSibling, rc = v && v.getClientRects()[0];
        return !rc || Math.abs(rc.bottom - k.getBoundingClientRect().bottom) > 4;
      }).map(function (k) { return k.textContent; });
      ok(parted.length === 0, "10 screen, " + c[0] + ": every label is on the line where its value starts", parted.join());
    });
    stage.textContent = "";
  });

  // ---- 11. a short document's date in the Word file ----
  step(function () {
    var both = stripProject({ issuedDate: "12 November 2026" }, "short"), dateOnly = stripProject({ issuedDate: "" }, "short"), blank = stripProject({ issuedDate: "   " }, "short");
    ok(HD.shortHeadLine(dateOnly) === "Northfield Water · 1.2 · 2026-11-11" && HD.shortHeadLine(blank) === HD.shortHeadLine(dateOnly), "11 short: with no issued date, or only spaces, the line gives the date", HD.shortHeadLine(blank));
    return build(both).then(function (r) {
      ok(r.doc.indexOf(">Northfield Water · 1.2 · 12 November 2026<") !== -1 && r.doc.indexOf("· 2026-11-11<") === -1, "11 short: the Word file prints the issued date and not the date");
      return build(dateOnly);
    }).then(function (r) {
      ok(r.doc.indexOf(">Northfield Water · 1.2 · 2026-11-11<") !== -1, "11 short: and the date when there is no issued date");
    });
  });

  chain.then(finish, function (e) { ok(false, "threw: " + (e && e.message) + "\n" + (e && e.stack)); finish(); });
})();
</script>
</body></html>
