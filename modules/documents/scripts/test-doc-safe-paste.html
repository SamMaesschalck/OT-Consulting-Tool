<script>
(function () {
  var lines = [], fail = 0;
  function ok(c, n, d) { lines.push((c ? "PASS " : "FAIL ") + n + (!c && d ? " - " + d : "")); if (!c) fail++; }
  function finish() {
    lines.push("", fail === 0 ? "ALL TESTS PASSED" : fail + " FAILED");
    document.getElementById("out").textContent = lines.join("\n");
  }
  var violations = [], errors = [];
  document.addEventListener("securitypolicyviolation", function (e) { violations.push(e.violatedDirective + " " + e.blockedURI); });
  window.addEventListener("error", function (e) { errors.push(e.message); });
  window.addEventListener("unhandledrejection", function (e) { errors.push("rejection: " + (e.reason && e.reason.message || e.reason)); });

  var App = window.App, M = App.DocModel, P = App.DocPaste;
  var PNG = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==";
  function utf8(b64) {
    var bin = atob(b64.replace(/\s+/g, "")), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(u);
  }
  var WORD = utf8(FIX.wordFull), WORD_FILTERED = utf8(FIX.wordFiltered), EXCEL = document.getElementById("excel-html").textContent;

  // ---- the stand-ins ----------------------------------------------------
  var allow = true, nope = false, asked = [], stored = [];
  App.DocApp = { state: { doc: null }, canAdd: function (bytes) { asked.push(bytes); return allow; } };
  var realFromFile = App.DocPictures.fromFile;
  function fakeFromFile(file) {
    stored.push(file);
    if (nope || file.type === "image/x-nope") return Promise.reject(new Error("This type of picture cannot be used."));
    return Promise.resolve({ blob: file, type: file.type, width: 1200, height: 600, name: file.name });
  }
  App.DocPictures.fromFile = fakeFromFile;
  function clip(map, files) {
    return { getData: function (type) { return (map && map[type]) || ""; }, files: files || [] };
  }
  function file(type, name, size) { return new File([new Uint8Array(size || 12)], name || "shot.png", { type: type || "image/png" }); }
  function newDoc() { var d = M.create("report"); d.blocks = []; return d; }
  // What the editor does with a result: the new pictures and parts go into
  // the document with the blocks.
  function land(d, r) {
    ["media", "parts"].forEach(function (g) { Object.keys(r[g]).forEach(function (k) { d[g] = d[g] || {}; d[g][k] = r[g][k]; }); });
    return r;
  }

  function all(blocks) {
    var out = [];
    (blocks || []).forEach(function walk(b) {
      out.push(b);
      if (b.type === "table") b.rows.forEach(function (r) { r.cells.forEach(function (c) { c.blocks.forEach(walk); }); });
    });
    return out;
  }
  function txt(b) { return b.type === "prompt" ? b.text : (b.runs || []).map(function (r) { return r.t; }).join(""); }
  function shape(blocks) {
    return blocks.map(function (b) {
      if (b.type === "heading") return "h" + b.level + ":" + txt(b);
      if (b.type === "list") return (b.list === "number" ? "#" : "*") + b.level + (b.restart ? "!" : "") + ":" + txt(b);
      if (b.type === "table") return "table[" + b.rows.map(function (r) { return r.cells.map(function (c) { return (c.span > 1 ? "<" + c.span + ">" : "") + (c.rowSpan > 1 ? "^" + c.rowSpan : "") + shape(c.blocks).join("+"); }).join("|"); }).join(" / ") + "]";
      if (b.type === "paragraph") return "p:" + txt(b);
      if (b.type === "prompt") return "prompt:" + b.text;
      return b.type;
    });
  }
  function run(b, text) { return (b.runs || []).filter(function (r) { return r.t === text; })[0] || {}; }
  function flags(r) { return Object.keys(r).filter(function (k) { return k !== "t"; }).sort().join(","); }
  function whole(t) {
    var g = M.table.grid(t);
    return t.cols.length > 0 && g.length === t.rows.length && g.every(function (row) { return row.length === t.cols.length && row.every(function (x) { return !!x; }); }) &&
      t.rows.every(function (r) { return r.cells.every(function (c) { return c.blocks.length > 0; }); });
  }
  function uniqueIds(blocks) {
    var ids = all(blocks).map(function (b) { return b.id; }), seen = {};
    return ids.every(function (id) { var fresh = /^b\d+$/.test(id) && !seen[id]; seen[id] = 1; return fresh; });
  }
  function nest(n, open, close, inner) { return new Array(n + 1).join(open) + inner + new Array(n + 1).join(close); }
  var pageNodes = document.querySelectorAll("*").length;

  var doc = newDoc();
  var chain = Promise.resolve();
  function step(name, fn) {
    chain = chain.then(fn).catch(function (e) { ok(false, name + ": ran without an error", (e && e.stack) || String(e)); });
  }

  // ---- hostile HTML ------------------------------------------------------
  step("scripts", function () {
    var html = '<p>Hello<script>window.__pwned = 1;<\/script> world</p><script>window.__pwned = 2;<\/script>' +
      '<img src="x" onerror="window.__pwned = 3"><img src="http://127.0.0.1:9/pixel.png" onload="window.__pwned = 4">' +
      '<svg xmlns="http://www.w3.org/2000/svg" onload="window.__pwned = 5"><script>window.__pwned = 6;<\/script><text>svg words</text><a href="javascript:window.__pwned = 7">x</a></svg>' +
      '<iframe src="javascript:parent.__pwned = 8"></iframe><iframe srcdoc="&lt;script&gt;parent.__pwned = 9&lt;/script&gt;"></iframe>' +
      '<object data="http://127.0.0.1:9/o.swf">object words</object><embed src="http://127.0.0.1:9/e.swf">' +
      '<style>p { background: url(http://127.0.0.1:9/s.png); } @import "http://127.0.0.1:9/a.css";</style><link rel="stylesheet" href="http://127.0.0.1:9/b.css">' +
      '<video src="http://127.0.0.1:9/v.mp4" onerror="window.__pwned = 10"><source src="x" onerror="window.__pwned = 11">video words</video>' +
      '<math><mtext>math words</mtext></math><template><p>template words</p></template><noscript><p>noscript words</p></noscript>' +
      '<form action="http://127.0.0.1:9/post"><input value="secret value" autofocus onfocus="window.__pwned = 12"><textarea>secret area</textarea><select><option>secret option</option></select><button>secret button</button><p>in a form</p></form>' +
      '<p onclick="window.__pwned = 13" onmouseover="window.__pwned = 14" style="background:url(javascript:window.__pwned=15)">Clicked</p>' +
      '<details open ontoggle="window.__pwned = 16"><summary>Summary</summary>Detail</details>' +
      '<marquee onstart="window.__pwned = 17">Marquee</marquee><body onload="window.__pwned = 18"><meta http-equiv="refresh" content="0;url=http://127.0.0.1:9/">' +
      '<base href="http://127.0.0.1:9/"><p>After base <a href="relative.html">relative</a></p>';
    return P.fromHtml(html, doc).then(function (r) {
      var s = shape(r.blocks).join(" ; "), json = JSON.stringify(r);
      ok(s === "p:Hello world ; p:in a form ; p:Clicked ; p:Summary ; p:Detail ; p:Marquee ; p:After base relative", "hostile HTML leaves only its ordinary text", s);
      ok(!/pwned|onerror|onclick|onload|javascript|secret|svg words|object words|video words|math words|template words|noscript words|127\.0\.0\.1/.test(json), "no script, event attribute, form value, address or embedded content reaches the blocks", json.slice(0, 300));
      ok(r.skippedPictures === 2 && /^2 pictures could not be pasted\. Insert them from a file/.test(r.message), "the two pictures that were only addresses are counted, and never fetched", r.skippedPictures + " " + r.message);
      ok(all(r.blocks).every(function (b) { return (b.runs || []).every(function (x) { return !x.link; }); }), "a relative link keeps its words and loses its address");
      ok(stored.length === 0, "nothing was handed to the picture store");
    });
  });

  step("links", function () {
    var bad = ['javascript:alert(1)', 'JaVaScRiPt:alert(1)', 'java\tscript:alert(1)', 'java\nscript:alert(1)', ' javascript:alert(1)', '\u0001javascript:alert(1)',
      'data:text/html,<script>alert(1)<\/script>', 'vbscript:msgbox(1)', 'file:///C:/Windows/win.ini', '//evil.example/x', 'http://', 'https:evil', 'ftp://example.org/', 'blob:null/1',
      'mailto:', 'about:blank', '#top', 'https://example.org/a b', 'https://example.org/' + new Array(3000).join("a")];
    var good = ['https://example.org/a?b=1&c=2#d', 'http://example.org', '  https://example.org/trim  ', 'mailto:someone@example.org', 'HTTPS://EXAMPLE.ORG/UP'];
    var html = bad.concat(good).map(function (u, i) { var a = document.createElement("a"); a.setAttribute("href", u); a.textContent = "link" + i; return "<p>" + a.outerHTML + "</p>"; }).join("");
    return P.fromHtml(html, doc).then(function (r) {
      var links = r.blocks.map(function (b) { return b.runs[0].link || ""; });
      var leaked = links.slice(0, bad.length).filter(Boolean);
      ok(r.blocks.length === bad.length + good.length && leaked.length === 0, "an address that is not plainly http, https or mailto is dropped, and its words kept (" + bad.length + " tried)", leaked.join(" | "));
      ok(links.slice(bad.length).join(" ") === "https://example.org/a?b=1&c=2#d http://example.org https://example.org/trim mailto:someone@example.org HTTPS://EXAMPLE.ORG/UP", "http, https and mailto addresses are kept", links.slice(bad.length).join(" "));
    });
  });

  step("office comments", function () {
    var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office"><head><!--[if gte mso 9]><xml><o:OfficeDocumentSettings><o:Secret>settings words</o:Secret></o:OfficeDocumentSettings></xml><![endif]-->' +
      '<style><!-- p.MsoNormal {margin:0cm; behavior:url(#default#VML);} --></style></head><body>' +
      '<!--[if gte mso 9]><xml><w:WordDocument><w:View>comment words</w:View></w:WordDocument></xml><![endif]-->' +
      '<p class=MsoNormal>Real <span style="mso-spacerun:yes">&nbsp;&nbsp; </span>text<o:p></o:p></p>' +
      '<p class=MsoNormal><o:p>&nbsp;</o:p></p>' +
      '<!--[if gte vml 1]><v:shape id="_x0000_i1025" type="#_x0000_t75"><v:imagedata src="file:///C:/Users/x/AppData/Local/Temp/msohtmlclip1/01/clip_image001.png" o:title="vml words"/></v:shape><![endif]-->' +
      '<![if !vml]><img width=200 height=100 src="file:///C:/Users/x/AppData/Local/Temp/msohtmlclip1/01/clip_image001.png" v:shapes="_x0000_i1025"><![endif]>' +
      '<!--[if !mso]><p>not for Office, and not for us</p><![endif]--><p class=MsoNormal>Tab<span style="mso-tab-count:1">&nbsp;&nbsp;&nbsp; </span>stop</p></body></html>';
    return P.fromHtml(html, doc).then(function (r) {
      var s = shape(r.blocks).join(" ; ");
      ok(s === "p:Real text ; p:Tab\tstop", "Office conditional comments, o:p marks and VML are dropped; an empty paragraph too", JSON.stringify(s));
      ok(r.skippedPictures === 1 && /^1 picture could not be pasted\. Insert it from a file/.test(r.message), "a picture Word left as a file path is counted once", r.skippedPictures + " " + r.message);
    });
  });

  step("depth", function () {
    var tables = nest(300, "<table><tr><td>", "</td></tr></table>", "<p>deep table words</p><script>window.__pwned = 20;<\/script>");
    var divs = nest(5000, "<div>", "</div>", "<b>deep div words</b>");
    var bolds = nest(3000, "<b><i>", "</i></b>", "deep bold words");
    var lists = nest(400, "<ul><li>", "</li></ul>", "deep list words");
    return P.fromHtml(tables, doc).then(function (r) {
      var words = all(r.blocks).map(txt).join(" ");
      ok(/deep table words/.test(words) && !/pwned/.test(JSON.stringify(r)) && all(r.blocks).length < 20, "tables nested 300 deep are read without running out of stack, and keep their text", all(r.blocks).length + " blocks");
      ok(all(r.blocks).filter(function (b) { return b.type === "table"; }).every(whole), "and leave no table inside a table");
      return P.fromHtml(divs + "<p>" + bolds + "</p>" + lists, doc);
    }).then(function (r) {
      var words = all(r.blocks).map(txt).join(" ");
      ok(/deep div words/.test(words) && /deep bold words/.test(words) && /deep list words/.test(words), "so are 5,000 nested divs, 3,000 nested formats and 400 nested lists", words.slice(0, 120));
      ok(all(r.blocks).every(function (b) { return b.type !== "list" || (b.level >= 0 && b.level <= 2); }), "a list nested deeper than three levels stops at the third");
    });
  });

  step("size", function () {
    var mega = new Array(200001).join("word ");
    var before = doc.nextId;
    return P.fromHtml("<p>" + mega + "</p><p>end</p>", doc).then(function (r) {
      ok(r.blocks.length === 2 && txt(r.blocks[0]).length === mega.length - 1 && r.blocks[0].runs.length === 1 && doc.nextId === before + 2, "a megabyte of text in one paragraph is one paragraph of one run", r.blocks.length + " " + txt(r.blocks[0]).length);
      var big = "<p>" + new Array(5 * 1024 * 1024 / 16 + 2).join("sixteen letters ") + "</p>";
      return P.read(clip({ "text/html": big, "text/plain": "the plain version" }), doc).then(function (r2) {
        ok(big.length > P.LIMITS.htmlChars && r2.source === "text" && shape(r2.blocks).join() === "p:the plain version", "HTML over 5 MB is pasted as its plain text", r2.source + " " + big.length);
      });
    }).then(function () {
      var r = P.fromText(new Array(200001).join("word "), doc);
      ok(r.blocks.length === 1 && txt(r.blocks[0]).length === 999999, "a megabyte of plain text is one paragraph");
    });
  });

  step("pictures in HTML", function () {
    stored = []; asked = [];
    var svg = btoa('<svg xmlns="http://www.w3.org/2000/svg" onload="window.__pwned = 30"><script>window.__pwned = 31<\/script></svg>');
    var html = '<p>Before</p><img alt="A  real\npicture" width="300" height="150" src="data:image/png;base64,' + PNG + '">' +
      '<img src="data:image/svg+xml;base64,' + svg + '"><img src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 onload=%22window.__pwned=32%22/%3E">' +
      '<img src="data:text/html;base64,' + btoa("<script>window.__pwned = 33<\/script>") + '"><img src="data:image/png;base64,!!!not base64!!!">' +
      '<img src="data:image/png,notbase64"><img src="blob:null/1234"><img src="cid:image001.png@01D"><img src="//evil.example/a.png"><img src="x.gif" width="1" height="1"><p>After</p>';
    return P.fromHtml(html, doc).then(function (r) {
      var pic = r.blocks[1] || {};
      ok(shape(r.blocks).join(" ; ") === "p:Before ; picture ; p:After", "a picture carried in the HTML itself becomes a picture block between the paragraphs", shape(r.blocks).join(" ; "));
      ok(stored.length === 1 && stored[0].type === "image/png" && stored[0].size === 70, "only a raster picture that decodes is handed to the picture store, as bytes", stored.map(function (f) { return f.type + ":" + f.size; }).join());
      ok(/^m[0-9]+$/.test(pic.media) && r.media[pic.media].blob === stored[0] && r.media[pic.media].source === "insert" && r.media[pic.media].type === "image/png" && !(doc.media || {})[pic.media] && Object.keys(r.media).length === 1, "its bytes are in the result under a new key, in the memory form, for the editor to store with the blocks");
      ok(pic.width === 300 && pic.height === 150 && pic.alt === "A real picture", "it takes the size the HTML asked for, and its alternative text", pic.width + "x" + pic.height + " " + pic.alt);
      ok(r.skippedPictures === 8 && asked.length >= 1, "SVG, non-picture data, broken data and addresses are counted and skipped (a 1 px spacer is not)", String(r.skippedPictures));
      return P.fromHtml('<img src="data:image/jpeg;base64,' + PNG + '">', doc);
    }).then(function (r) {
      var pic = r.blocks[0];
      ok(pic.width === 601 && pic.height === 301 && !r.inlineRuns, "a picture wider than the page is brought down to the page width, in proportion", pic.width + "x" + pic.height);
      var was = P.LIMITS.pictureBytes; P.LIMITS.pictureBytes = 40; stored = [];
      return P.fromHtml('<p>x</p><img src="data:image/png;base64,' + PNG + '">', doc).then(function (r2) {
        P.LIMITS.pictureBytes = was;
        ok(shape(r2.blocks).join() === "p:x" && r2.skippedPictures === 1 && stored.length === 0, "a data: picture over the size limit is dropped before it is decoded");
      });
    }).then(function () {
      allow = false; stored = [];
      return P.fromHtml('<p>kept text</p><img src="data:image/png;base64,' + PNG + '"><img src="data:image/png;base64,' + PNG + '">', doc);
    }).then(function (r) {
      allow = true;
      ok(!r.refused && shape(r.blocks).join() === "p:kept text" && stored.length === 1 && Object.keys(r.media).length === 0 && r.skippedPictures === 0 && !r.message, "when the document is at its size limit the pictures are left out and the text still arrives (the shell has said why)", JSON.stringify(shape(r.blocks)) + stored.length + r.message);
      allow = false;
      return P.fromHtml('<img src="data:image/png;base64,' + PNG + '"><img src="data:image/png;base64,' + PNG + '">', doc);
    }).then(function (r) {
      allow = true;
      ok(r.refused === true && r.blocks.length === 0 && !r.message, "and a paste the limit leaves nothing of says it was refused");
      asked = [];
      return P.fromHtml('<img src="data:image/png;base64,' + PNG + '"><img src="data:image/png;base64,' + PNG + '"><img src="data:image/png;base64,' + PNG + '">', doc);
    }).then(function (r) {
      ok(asked.join() === "70,140,210" && Object.keys(r.media).length === 3, "the limit is asked for the paste so far, picture by picture", asked.join());
      nope = true;
      return P.fromHtml('<table><tr><td><img src="data:image/png;base64,' + PNG + '"><img src="http://127.0.0.1:9/a.png"></td><td>b</td></tr></table>', doc);
    }).then(function (r) {
      nope = false;
      ok(r.blocks.length === 1 && whole(r.blocks[0]) && shape(r.blocks)[0] === "table[p:|p:b]" && r.skippedPictures === 2, "a cell whose only picture the store refused is left as an empty cell, not a broken one", JSON.stringify(shape(r.blocks)));
    });
  });

  step("real picture store", function () {
    // Once through the tool's own picture store, so the join is proven too.
    App.DocPictures.fromFile = realFromFile;
    var timeout = new Promise(function (res) { setTimeout(function () { res("timeout"); }, 20000); });
    return Promise.race([P.fromHtml('<img src="data:image/png;base64,' + PNG + '">', doc), timeout]).then(function (r) {
      App.DocPictures.fromFile = fakeFromFile;
      var pic = r && r.blocks && r.blocks[0];
      ok(!!pic && pic.type === "picture" && pic.width === 1 && pic.height === 1 && r.media[pic.media].type === "image/png" && r.media[pic.media].blob.size > 0,
        "a pasted PNG goes through App.DocPictures.fromFile into the document", r === "timeout" ? "timed out" : JSON.stringify(r && r.blocks) + " " + (r && r.message));
    });
  });

  step("hidden and odd", function () {
    var html = '<p>Seen<span style="display:none"> hidden one</span><span style="visibility: hidden"> hidden two</span></p><p hidden>hidden three</p>' +
      '<div style="mso-hide:all">hidden four</div><p>a\uE000KEPT:b1\uE000b\u200Bc\uFEFFd\u0000e\u0007f</p>' +
      '<p>   spaced \n\n   out   <b>  bold  </b>   end   </p><p>&nbsp;</p><p>   </p><div></div>';
    return P.fromHtml(html, doc).then(function (r) {
      var s = shape(r.blocks).join(" ; ");
      ok(s === "p:Seen ; p:aKEPT:b1bcdef ; p:spaced out bold end", "hidden content is not pasted; control characters and the writer's own marker character are taken out; white space collapses", JSON.stringify(s));
    });
  });

  step("absurd tables", function () {
    var html = '<table><tr><td colspan="100000" rowspan="100000">a</td><td colspan="-3" rowspan="x">b</td></tr><tr><td>c</td><td>d</td><td>e</td></tr><tr></tr><tr><td rowspan="0">f</td></tr></table>';
    return P.fromHtml(html, doc).then(function (r) {
      ok(shape(r.blocks).join() === "p:a,p:b,p:c,p:d,p:e,p:f", "spans that leave no table Word could hold give the cells' text as paragraphs", JSON.stringify(shape(r.blocks)).slice(0, 200));
      return P.fromHtml('<table><tr><td rowspan="100000">a</td><td colspan="2">b</td></tr><tr><td colspan="100000">c</td></tr><tr><td>d</td></tr></table>', doc);
    }).then(function (r) {
      var t = r.blocks[0];
      ok(r.blocks.length === 1 && t.type === "table" && whole(t) && t.cols.length === 63 && t.rows[0].cells[0].rowSpan === 3 && t.rows[1].cells[0].span === 62, "impossible spans are cut back to a table whose every position is covered once", t.type + " " + (t.cols || []).length);
      var wide = "<table><tr>" + new Array(81).join("<td>c</td>") + "</tr><tr><td>second</td></tr></table>";
      return P.fromHtml(wide, doc);
    }).then(function (r) {
      ok(r.blocks.length === 81 && r.blocks.every(function (b) { return b.type === "paragraph"; }), "a table wider than Word allows arrives as paragraphs", String(r.blocks.length));
      var rows = new Array(3001).join('<tr><td rowspan="99999">r</td><td>x</td></tr>');
      return P.fromHtml("<table>" + rows + "</table>", doc);
    }).then(function (r) {
      ok(r.blocks.length === 6000 && r.blocks.every(function (b) { return b.type === "paragraph"; }), "3,000 rows of overlapping row spans are read without hanging, and leave no broken table", String(r.blocks.length));
    });
  });

  // ---- ordinary web HTML -------------------------------------------------

      ok(ref.fn !== old.fn && A.footnotes[ref.fn].runs[0].t === "Costs are budgetary." && r.footnotes[ref.fn] === A.footnotes[ref.fn] && A.footnotes[old.fn].runs[0].t === "Costs are budgetary.", "a pasted footnote reference has a footnote of its own, with the same words");
      ok(r.blocks[0].land === true && r.blocks[5].caption === "Current network" && r.blocks[5].alt === "Diagram" && r.blocks[7].caption === "Zones", "captions, alternative text and the landscape flag are kept");
      ok(JSON.stringify(all(A.blocks).map(function (b) { return b.id; })) === JSON.stringify(before.ids), "the copied blocks themselves are untouched");
      return P.read(clip(payload), A);
    }).then(function (r) {
      ok(r.blocks.length === 9 && uniqueIds(r.blocks), "and can be pasted again");
      var one = P.copyPayload(A, [{ id: "bx", type: "paragraph", runs: [{ t: "part of " }, { t: "a line", i: true }] }]);
      return P.read(clip(one), A);
    }).then(function (r) {
      ok(r.blocks.length === 1 && r.inlineRuns && r.inlineRuns.length === 2 && r.inlineRuns[1].i, "one copied paragraph is also offered as runs, to go in at the caret");
      payload = P.copyPayload(A, A.blocks);
    });
  });

  step("paste in another document", function () {
    var B = newDoc();
    B.nextId = 500;
    B.footnotes = { f1: { runs: [{ t: "B's own note" }] } };
    asked = [];
    return P.read(clip(payload), B).then(function (r) {
      ok(r.source === "blocks" && shape(r.blocks).join(" ; ") === shape(A.blocks).join(" ; ") && uniqueIds(r.blocks), "the blocks arrive in another document open in this page");
      ok(asked.join() === "85", "the document's size limit is asked once, for every byte the blocks bring (3 pictures, 2 parts and the theme)", asked.join());
      ok(media(B).length === 0 && parts(B).length === 0, "the document's pictures and parts are not touched until the paste lands");
      land(B, r);
      var p = r.blocks[5], k = r.blocks[6], c = r.blocks[7].rows[1].cells[0].blocks[0];
      ok(media(B).length === 3 && B.media[p.media].blob === A.media[pic.media].blob && B.media[p.media].name === "net.png" && B.media[c.media].blob.size === 5 && B.media[k.preview].blob.size === 7 && Object.keys(r.media).sort().join() === media(B).sort().join(),
        "the result holds the pictures under new keys, with the same bytes");
      var chart = B.parts[k.rels[0].part], style = chart && B.parts[chart.rels[0].part];
      ok(parts(B).length === 3 && chart && chart.blob.size === 20 && chart.name === "word/charts/chart 1&.xml" && style && style.blob.size === 3 && chart.rels[0].id === "rId1" && chart.rels[1].external === "https://example.org/data.xlsx" && Object.keys(r.parts).length === 3,
        "the drawing's parts come too, each with its own relationships pointing at the new keys", JSON.stringify(B.parts));
      ok(k.rels[0].id !== kept.rels[0].id && /^sptK\d+$/.test(k.rels[0].id) && k.rels[1].external === "https://example.org/more" && k.xml.indexOf('"' + k.rels[0].id + '"') > 0 && k.xml.indexOf('"' + k.rels[1].id + '"') > 0 && k.xml.indexOf(kept.rels[0].id) === -1 && k.xml.length === kept.xml.replace(kept.rels[0].id, k.rels[0].id).replace(kept.rels[1].id, k.rels[1].id).length,
        "its relationship ids are new in this document, in its XML too, and nothing else in the XML changed", k.xml);
      ok(B.theme && B.parts[B.theme].blob.size === 40 && B.parts[B.theme].name === "word/theme/theme1.xml", "a document with no theme adopts the pasted drawing's theme");
      var ref = r.blocks[1].runs.filter(function (x) { return x.fn; })[0];
      ok(ref.fn !== "f1" && B.footnotes[ref.fn].runs[0].t === "Costs are budgetary." && B.footnotes.f1.runs[0].t === "B's own note", "the footnote's words come from the copy, never from a note that happens to share its key here");
      ok(media(A).length === 3 && parts(A).length === 3 && A.theme, "the document copied from is unchanged");

      // A document whose next ids are exactly the drawing's old ones, shifted
      // by one: the first new id is the second relationship's old id.
      var used = Number(k.rels[0].id.replace("sptK", "")) - 500, second = Number(kept.rels[1].id.replace("sptK", ""));
      var X = newDoc(); X.nextId = second - used;
      var C = newDoc();
      C.theme = M.addPart(C, new Blob([new Uint8Array(9)]), { name: "word/theme/theme1.xml", contentType: "x", rels: [] });
      var own = C.theme;
      return P.read(clip(payload), X).then(function (rx) {
        var kx = rx.blocks[6];
        ok(second - used > 1 && kx.rels[0].id === kept.rels[1].id && kx.rels[1].id !== kx.rels[0].id && kx.xml.split('"' + kx.rels[0].id + '"').length === 2 && kx.xml.split('"' + kx.rels[1].id + '"').length === 2 && kx.xml.indexOf('r:id="' + kx.rels[0].id + '"/><a:hlinkClick') > 0,
          "a new relationship id that is another relationship's old id is still swapped one for one", kx.xml + " " + JSON.stringify(kx.rels) + " " + (second - used));
        return P.read(clip(payload), C);
      }).then(function (r2) {
        land(C, r2);
        ok(C.theme === own && parts(C).length === 3 && C.parts[C.theme].blob.size === 9, "a document that has a theme keeps it, and the pasted theme is not stored");
        allow = false;
        var D = newDoc();
        return P.read(clip(payload), D).then(function (r3) {
          allow = true;
          ok(r3.refused === true && r3.blocks.length === 0 && media(D).length === 0 && parts(D).length === 0 && !D.theme, "at the size limit the whole paste is refused and nothing is stored");
        });
      });
    });
  });

  step("a copy too large to carry", function () {
    var was = P.LIMITS.ownBytes; P.LIMITS.ownBytes = 50;
    var big = P.copyPayload(A, A.blocks);
    P.LIMITS.ownBytes = was;
    var n = media(A).length;
    return P.read(clip(big), A).then(function (r) {
      ok(shape(r.blocks).join(" ; ") === shape(A.blocks).join(" ; ") && media(A).length === n && r.skippedPictures === 0, "over 20 MB a paste into the same document is still whole: it needs no bytes");
      var E = newDoc(); asked = [];
      return P.read(clip(big), E).then(function (r2) {
        var s = shape(r2.blocks);
        ok(s[5] === "prompt:A picture was not pasted here. Insert it from a file." && /^prompt:A drawing was not pasted here\./.test(s[6]) && s[1] === shape(A.blocks)[1], "into another document the text arrives and each picture and drawing is a red prompt in its place", JSON.stringify(s.slice(5, 7)));
        var cell = r2.blocks[7].rows[1].cells[0].blocks[0];
        ok(cell.type === "paragraph" && cell.runs[0].red === true && whole(r2.blocks[7]), "in a table cell, where a prompt block cannot go, it is red text");
        ok(r2.skippedPictures === 3 && /too large/.test(r2.message) && media(E).length === 0 && parts(E).length === 0 && asked.length === 0 && !E.theme, "it says why, and stores nothing", r2.message);
      });
    });
  });

  step("another window", function () {
    payload = P.copyPayload(A, A.blocks);
    // What another window of the tool has: the clipboard, and nothing else.
    P.forget();
    var F = newDoc();
    return P.read(clip(payload), F).then(function (r) {
      var s = shape(r.blocks), want = shape(A.blocks);
      ok(r.source === "blocks" && s.length === 9 && [0, 1, 2, 3, 4, 8].every(function (i) { return s[i] === want[i]; }) && uniqueIds(r.blocks), "copied in another window, the text blocks still paste as blocks", JSON.stringify(s));
      ok(/^prompt:A picture/.test(s[5]) && /^prompt:A drawing/.test(s[6]) && r.skippedPictures === 3 && /another window/.test(r.message) && media(F).length === 0, "pictures and drawings, whose bytes a copy cannot carry, are red prompts, and the page says so", r.message);
      var p = r.blocks[1], ref = p.runs.filter(function (x) { return x.fn; })[0];
      ok(run(p, "options").b && run(p, "options").link === "https://example.org/x?a=1&b=2" && ref && F.footnotes[ref.fn].runs[0].t === "Costs are budgetary." && r.blocks[0].land === true && r.blocks[7].caption === "Zones", "formatting, links, the footnote, the caption and the landscape flag come with them");
    });
  });

  step("hostile blocks", function () {
    var G = newDoc();
    G.footnotes = { f1: { runs: [{ t: "G's own note" }] } };
    var evil = { format: "spt-doc-blocks/1", token: "not-ours", docId: G.id, footnotes: { f1: { runs: [{ t: "note " }, { t: "x", fn: "f1" }, { t: "y", link: "javascript:alert(1)", evil: 1 }] } }, blocks: [
      { id: "blk\"><img src=x onerror=alert(1)>", type: "paragraph", align: "sideways", evil: { a: 1 }, __proto__: { polluted: 1 },
        runs: [{ t: "hi", link: "javascript:alert(1)", b: "yes", i: 1, u: true, sup: true, sub: true, evil: {} }, { t: 7 }, null, "str", { t: "\uE000KEPT:b1\uE000", red: true }, { t: "", fn: "f1" }, { t: "", fn: "nope" }, { t: "", fn: "__proto__" }] },
      { type: "kept", kind: "chart", xml: "<w:r><w:t>injected</w:t></w:r>", rels: [{ id: "sptK1", type: "t", external: "http://127.0.0.1:9/" }], preview: "m1" },
      { type: "picture", media: "m1", width: 1e9, height: -5 },
      { type: "table", header: 7, cols: "wide", caption: { toString: function () { return "x"; } }, rows: [
        { cells: [{ span: 1e9, rowSpan: -4, blocks: [{ type: "table", cols: [1], rows: [{ cells: [{ blocks: [] }] }] }, { type: "heading", level: 1, runs: [{ t: "in cell" }] }, { type: "pageBreak" }, { type: "prompt", text: "cell prompt" }] }, { blocks: "nope" }] },
        { cells: [null, 5, { blocks: [{ type: "list", list: "weird", level: 99, restart: "yes", runs: [{ t: "item" }] }] }] }, "row", { cells: "cells" }] },
      { type: "heading", level: 99, runs: "nope" }, { type: "list", list: "number", level: -3, restart: true, "continue": true, runs: [{ t: "n" }] },
      { type: "weird", runs: [{ t: "unknown" }] }, null, 7, "text", [], { type: "pageBreak", land: true }, { type: "prompt", text: 12 }, { type: "table", rows: [] }
    ] };
    return P.read(clip({ "application/x-spt-doc-blocks": JSON.stringify(evil), "text/plain": "never used" }), G).then(function (r) {
      var s = shape(r.blocks), json = JSON.stringify(r.blocks);
      var t = r.blocks[3] || {}, rest = s.slice(0, 3).concat(s.slice(4)).join(" ; ");
      ok(r.source === "blocks" && rest === "p:hiKEPT:b1 ; prompt:A drawing was not pasted here. Load the Word file it came from to bring it across. ; prompt:A picture was not pasted here. Insert it from a file. ; h3: ; #0!:n ; pageBreak ; prompt:",
        "clipboard blocks this page did not write are rebuilt from known fields only", s.join(" ; ").slice(0, 400));
      ok(!/javascript|onerror|injected|127\.0\.0\.1|evil|polluted|sideways|sptK|"m1"|\\uE000/.test(json) && ({}).polluted === undefined, "no address, markup, kept XML, relationship or unknown field survives", json.slice(0, 400));
      var first = r.blocks[0].runs[0], cells = all([t]).map(txt).join("|").replace(/\|+/g, "|").replace(/\|$/, "");
      ok(flags(first) === "sup,u" && uniqueIds(r.blocks), "flags must be true to count, and never both raised and lowered", flags(first));
      ok(t.type === "table" && whole(t) && t.header === 1 && t.cols.length === 63 && t.cols.every(function (n) { return n === 1; }) && !("caption" in t) && cells === "|in cell|cell prompt|item" && all([t]).every(function (b) { return b === t || b.type === "paragraph" || b.type === "list"; }),
        "its table is made sound: spans cut back, a table and a page break in a cell dropped, a heading and a prompt there made paragraphs", t.type + " " + (t.cols || []).length + " " + cells);
      var ref = r.blocks[0].runs.filter(function (x) { return x.fn; });
      ok(ref.length === 1 && ref[0].fn !== "f1" && JSON.stringify(G.footnotes[ref[0].fn].runs) === '[{"t":"note "},{"t":"y"}]' && G.footnotes.f1.runs[0].t === "G's own note", "a footnote is rebuilt the same way, cannot hold a footnote, and never touches a note of this document", JSON.stringify(G.footnotes));
      ok(r.skippedPictures === 2 && Object.keys(G.media || {}).length === 0 && Object.keys(G.parts || {}).length === 0, "and nothing is stored");
      return P.read(clip({ "application/x-spt-doc-blocks": "{not json", "text/html": "<p>from html</p>", "text/plain": "from text" }), G);
    }).then(function (r) {
      ok(r.source === "html" && shape(r.blocks).join() === "p:from html", "clipboard data of our type that is not JSON is passed over for the HTML");
      return P.read(clip({ "application/x-spt-doc-blocks": JSON.stringify({ format: "something-else/9", blocks: [{ type: "paragraph", runs: [{ t: "no" }] }] }), "text/plain": "from text" }), G);
    }).then(function (r) {
      ok(r.source === "text" && shape(r.blocks).join() === "p:from text", "so is JSON in a format this version does not know");
    });
  });

  // ---- nothing ran, nothing loaded, nothing was added to the page -----------
  step("aftermath", function () {
    return new Promise(function (res) { setTimeout(res, 1500); }).then(function () {
      ok(window.__pwned === undefined, "no pasted script or event handler ever ran", String(window.__pwned));
      ok(violations.length === 0, "nothing tried to load or run against the page's policy", violations.join(" | "));
      ok(document.querySelectorAll("*").length === pageNodes, "nothing from any paste was put into the page", document.querySelectorAll("*").length + " elements, was " + pageNodes);
      ok(errors.length === 0, "no script error or unhandled rejection", errors.join(" | "));
    });
  });

  chain.then(finish, finish);
})();
