<html lang="en"><head><meta charset="utf-8"/><title>Document tool: toolbar height</title>
<link rel="stylesheet" href="../css/spt-theme.css" />
<link rel="stylesheet" href="../css/documents.css" />
<link rel="stylesheet" href="../css/editor.css" />
<link rel="stylesheet" href="../css/tables.css" />
</head>
<body style="margin:0">
<!--
  The toolbar keeps one height whatever the caret is in. The row for a table's
  or a picture's controls is always there and one line high (a quiet hint when
  there is nothing to show; controls wider than the view scroll sideways), so
  the page never moves under the pointer between the two clicks of a
  double-click, even at the top of a document or in one too short to scroll.
  Needs --allow-file-access-from-files (tools/run-tests.ps1 passes it).
-->
<div id="frame" style="display:flex;width:1200px;height:640px">
  <div id="sidebar" style="flex:none;width:260px;overflow-y:auto"><div id="nav"><button type="button" id="nav-edit">Edit</button></div><div id="outline"></div></div>
  <div id="edit-view" class="main" style="flex:1;min-width:0"><div id="toolbar" role="toolbar" aria-label="Formatting"></div><div id="paper" tabindex="0"></div></div>
</div>
<div id="live" aria-live="polite"></div>
<div id="toast"></div>
<pre id="out">running...</pre>
<script src="../js/version.js"></script>
<script src="../js/product.js"></script>
<script src="../vendor/docx.umd.js"></script>
<script src="../js/zip-io.js"></script>
<script src="../js/docx-graft.js"></script>
<script src="../js/house-docx.js"></script>
<script src="../js/model.js"></script>
<script src="../js/render.js"></script>
<script src="../js/history.js"></script>
<script src="../js/tables.js"></script>
<script src="../js/paste.js"></script>
<script src="../js/editor.js"></script>
<script>
(function () {
  var lines = [], fail = 0;
  function ok(c, n, d) { lines.push((c ? "PASS " : "FAIL ") + n + (!c && d !== undefined ? " - " + d : "")); if (!c) fail++; }
  function finish() {
    alive = false;
    lines.push("", fail === 0 ? "ALL TESTS PASSED" : fail + " FAILED");
    document.getElementById("out").textContent = lines.join("\n");
  }
  // Keeps a task queued so headless Edge's virtual clock does not end the page early.
  var alive = true, bounce = new MessageChannel();
  bounce.port1.onmessage = function () { if (alive) bounce.port2.postMessage(0); };
  bounce.port2.postMessage(0);
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  var errors = [];
  window.addEventListener("error", function (e) { errors.push(e.message); });
  window.addEventListener("unhandledrejection", function (e) { errors.push("rejected: " + (e.reason && e.reason.message)); });

  var App = window.App, M = App.DocModel, R = App.DocRender, H = App.DocHistory, E = App.DocEditor, T = E.__test;
  function $(id) { return document.getElementById(id); }

  // ---- the stand-in for the shell ----
  App.DocApp = {
    state: { doc: null, page: "edit", dirty: false, tour: false, recovered: false },
    go: function () {}, markClean: function () {}, busy: function () {}, setDoc: function () { return Promise.resolve(true); },
    touched: function () {}, canAdd: function () { return true; },
    toast: function (text) { $("toast").textContent = String(text); },
    confirmBox: function () { return Promise.resolve(true); },
    say: function (text) { $("live").textContent = String(text); },
    h: R.h
  };
  App.DocPictures = {
    ACCEPT: "image/png",
    fromFile: function (file) { return Promise.resolve({ blob: file, type: "image/png", width: 100, height: 50, name: file.name || "picture.png" }); }
  };
  var PNG = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==";
  function png() {
    var bin = atob(PNG), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return new File([u], "100x50.png", { type: "image/png" });
  }

  var doc;
  function open(blocks) {
    E.unmount();
    doc = M.normalise({ schema: M.SCHEMA, kind: "report", info: { title: "Test document" }, blocks: blocks, footnotes: {}, media: {}, parts: {} });
    App.DocApp.state.doc = doc;
    H.clear();
    $("edit-view").scrollTop = 0; $("edit-view").scrollLeft = 0;
    E.mount($("edit-view"));
    return doc;
  }
  function P(id, text) { return { id: id, type: "paragraph", runs: text ? [{ t: text }] : [] }; }
  function Hd(id, level, text) { return { id: id, type: "heading", level: level, runs: [{ t: text }] }; }
  function el(id) { return T.el(id); }
  function tel(id) { return T.text(id); }
  function sel() { return E.selection(); }
  function end(id) { T.selectText(id, R.textLength(tel(id))); }
  function theTable() { return doc.blocks.filter(function (b) { return b.type === "table"; })[0]; }
  function cellIds(t) {
    var out = [];
    t.rows.forEach(function (row) { row.cells.forEach(function (c) { out.push(c.blocks[0].id); }); });
    return out;
  }
  function pointer(type, target, x, y) {
    var e = new PointerEvent(type, { bubbles: true, cancelable: true, button: 0, buttons: type === "pointerup" ? 0 : 1, clientX: x, clientY: y, pointerId: 1, isPrimary: true });
    target.dispatchEvent(e);
    return e;
  }
  // What the browser does itself on a press in editable text.
  function browserCaret(node) {
    node.focus();
    var r = document.createRange();
    r.selectNodeContents(node); r.collapse(true);
    var s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  function key(node, name) {
    var e = new KeyboardEvent("keydown", { key: name, code: name, bubbles: true, cancelable: true });
    node.dispatchEvent(e);
    return e;
  }
  // A whole click as the pointer gives it: press, the browser's caret, release.
  async function clickAt(node, x, y) {
    pointer("pointerdown", node, x, y);
    browserCaret(node);
    await wait(20);
    pointer("pointerup", node, x, y);
    await wait(20);
  }
  async function section(name, fn) {
    try { await fn(); } catch (err) { ok(false, name + ": threw", (err && err.stack) || String(err)); }
  }
  function ctx() { return $("toolbar").querySelector(".tb-context"); }
  // The paper's top as it would be unscrolled: a selection scrolled into view
  // is not the toolbar moving it. Sections 2 and 3 check the scroll is 0 too.
  function heights() {
    var v = $("edit-view");
    return { bar: $("toolbar").offsetHeight, row: ctx().offsetHeight, top: Math.round(($("paper").getBoundingClientRect().top - v.getBoundingClientRect().top + v.scrollTop) * 100) / 100 };
  }
  function same(a, b) { return a.bar === b.bar && a.row === b.row && Math.abs(a.top - b.top) < 0.5; }
  function said(a) { return "toolbar " + a.bar + " row " + a.row + " paper " + a.top; }

  (async function () {
    var view = $("edit-view"), bar = $("toolbar"), paper = $("paper");

    // ---- 1: one height whatever the caret is in ----
    await section("1", async function () {
      open([Hd("b1", 1, "Summary"), P("b2", "The paragraph under the table."), P("b3", "End.")]);
      end("b1");
      E.run("insertTable");
      var ids = cellIds(theTable());
      var pic = await E.insertPictureFile(png(), "b2");
      end("b2"); T.flush(); await wait(20);
      var inText = heights();
      var hint = ctx().querySelector(".tb-hint");
      ok(!!ctx() && !!hint && !ctx().querySelector("button, input"), "1 with the caret in text the controls row is there and holds only a hint", ctx() && ctx().innerHTML.slice(0, 120));
      ok(hint && /table/.test(hint.textContent) && /picture/.test(hint.textContent) && !/[–—]/.test(hint.textContent) && !/[A-Z]{2}/.test(hint.textContent) && getComputedStyle(hint).textTransform === "none", "1 the hint is plain sentence case with no dashes", hint && hint.textContent);
      ok(inText.row > 30, "1 the row has room for a control", said(inText));

      T.selectText(ids[4], 0); T.flush(); await wait(20);
      var inTable = heights();
      ok(!!bar.querySelector(".tbl-controls") && !ctx().querySelector(".tb-hint"), "1 setup: the caret in a table cell shows the table's controls");
      ok(same(inText, inTable), "1 the toolbar and the paper are where they were with the caret in a table", said(inText) + " -> " + said(inTable));

      E.selectBlocks([pic]); T.flush(); await wait(20);
      var onPic = heights();
      ok(!!bar.querySelector('[aria-label="Picture"]'), "1 setup: a selected picture shows its controls");
      ok(same(inText, onPic), "1 and with a picture selected", said(inText) + " -> " + said(onPic));

      E.selectBlocks(["b3"]); T.flush(); await wait(20);
      var blocks = heights();
      ok(!!bar.querySelector('[aria-label="Selected blocks"]') && same(inText, blocks), "1 and with a paragraph selected as a block", said(inText) + " -> " + said(blocks));

      T.selectText(ids[0], 0); T.flush();
      E.selectBlocks([theTable().id]); T.flush(); await wait(20);
      ok(same(inText, heights()), "1 and with the whole table selected (its controls and the block buttons together)", said(heights()));

      end("b3"); T.flush(); await wait(20);
      ok(same(inText, heights()) && !!ctx().querySelector(".tb-hint"), "1 and back in text, with the hint again", said(heights()));
      var controls = ctx().querySelectorAll("button");
      ok(controls.length === 0, "1 none of the old controls is left behind", String(controls.length));
    });

    // ---- 2: a short document that cannot scroll ----
    await section("2", async function () {
      open([Hd("b1", 1, "Summary"), P("b2", "The paragraph under the table, long enough to read.")]);
      end("b1");
      E.run("insertTable");
      var ids = cellIds(theTable());
      end("b2"); T.flush();
      view.scrollTop = 0;
      await wait(20);
      ok(view.scrollHeight <= view.clientHeight + 1 && !bar.querySelector(".tbl-controls"), "2 setup: a heading, a table and a paragraph, too short to scroll", view.scrollHeight + " / " + view.clientHeight);
      var before = heights();
      var cell = tel(ids[4]), box = cell.getBoundingClientRect(), x = Math.round(box.left + 20), y = Math.round(box.top + box.height / 2);
      var under = document.elementFromPoint(x, y);
      ok(!!under && el(ids[4]).contains(under), "2 setup: the pointer is over a cell", under && under.outerHTML.slice(0, 60));
      await clickAt(under, x, y);
      ok(sel() && sel().type === "text" && sel().id === ids[4] && !!bar.querySelector(".tbl-controls"), "2 the click puts the caret in the cell and the table's controls appear", JSON.stringify(sel()));
      var after = heights();
      ok(same(before, after), "2 the paper's top does not move when the caret enters the table", said(before) + " -> " + said(after));
      ok(view.scrollTop === 0, "2 and nothing was scrolled to make up for it", String(view.scrollTop));
      var again = document.elementFromPoint(x, y);
      ok(!!again && el(ids[4]).contains(again), "2 so the second click of a double-click lands in the same cell", again && again.outerHTML.slice(0, 60));

      var pb = tel("b2").getBoundingClientRect(), px = Math.round(pb.left + 30), py = Math.round(pb.top + 8);
      var pu = document.elementFromPoint(px, py);
      await clickAt(pu, px, py);
      ok(sel() && sel().type === "text" && sel().id === "b2" && !bar.querySelector(".tbl-controls"), "2 a click in the paragraph takes the caret out and the controls go", JSON.stringify(sel()));
      ok(same(before, heights()), "2 the paper stays put on the way out too", said(before) + " -> " + said(heights()));
      var pu2 = document.elementFromPoint(px, py);
      ok(!!pu2 && el("b2").contains(pu2), "2 and the paragraph is still under the pointer", pu2 && pu2.outerHTML.slice(0, 60));
    });

    // ---- 3: the top of a long document ----
    await section("3", async function () {
      var more = [];
      for (var i = 0; i < 30; i++) more.push(P("x" + i, "Filler paragraph " + i + ". The works are planned in three stages, each with its own outage window."));
      open([Hd("b1", 1, "Summary"), P("b2", "The paragraph under the table.")].concat(more));
      end("b1");
      E.run("insertTable");
      var ids = cellIds(theTable());
      T.selectText(ids[4], 0); T.flush();
      view.scrollTop = 0;
      await wait(20);
      ok(view.scrollHeight > view.clientHeight && !!bar.querySelector(".tbl-controls"), "3 setup: a long document at the top, caret in a cell");
      var before = heights();
      var pb = tel("b2").getBoundingClientRect(), px = Math.round(pb.left + 30), py = Math.round(pb.top + 8);
      await clickAt(document.elementFromPoint(px, py), px, py);
      ok(sel() && sel().id === "b2" && same(before, heights()) && view.scrollTop === 0, "3 leaving the table at the top of the view moves neither the paper nor the scroll", said(before) + " -> " + said(heights()) + " scrollTop " + view.scrollTop);
      var u = document.elementFromPoint(px, py);
      ok(!!u && el("b2").contains(u), "3 the paragraph clicked is still under the pointer", u && u.outerHTML.slice(0, 60));

      // further down: a control of the toolbar taking the keyboard scrolls nothing
      T.selectText(ids[4], 0); T.flush();
      view.scrollTop = 400;
      // Let the page settle first. The blocks newly near the view are laid out
      // (content-visibility) on the next frame, in place of the estimated
      // heights that stood in for them, and the browser's scroll anchoring
      // then moves scrollTop a few pixels to keep the text on screen still.
      // Without frames that happens inside whatever forces the next update,
      // here the focus below, and reads as the focus scrolling the page.
      await Promise.race([new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); }), wait(500)]);
      await wait(20);
      var at = view.scrollTop, row = ctx().querySelectorAll("button, input"), lastCtl = row[row.length - 1];
      lastCtl.focus();
      await wait(20);
      ok(document.activeElement === lastCtl && view.scrollTop === at, "3 the keyboard on the last table control leaves the page where it was", at + " -> " + view.scrollTop);
      key(lastCtl, "Escape");

      // a block put in view is not left under the pinned toolbar
      view.scrollTop = 600;
      await wait(20);
      var above = null, vb = view.getBoundingClientRect(), tb = bar.getBoundingClientRect().bottom;
      for (var j = 0; j < 30 && !above; j++) { var r = el("x" + j).getBoundingClientRect(); if (r.top < tb && r.bottom > vb.top) above = "x" + j; }
      ok(!!above, "3 setup: a paragraph sits under the toolbar", String(above));
      E.focusBlock(above, { at: "end" });
      await wait(20);
      var ab = el(above).getBoundingClientRect();
      ok(ab.top >= bar.getBoundingClientRect().bottom - 1, "3 the caret put in it scrolls it out from under the toolbar", Math.round(ab.top) + " vs " + Math.round(bar.getBoundingClientRect().bottom));
    });

    // ---- 4: a narrow view ----
    await section("4", async function () {
      $("frame").style.width = "900px";
      open([P("b1", "Text."), P("b2", "End.")]);
      end("b1");
      var pic = await E.insertPictureFile(png());
      end("b2");
      E.run("insertTable");
      var ids = cellIds(theTable());
      end("b1"); T.flush(); await wait(20);
      var inText = heights(), mainH = bar.querySelector(".tb-main").offsetHeight;
      T.selectText(ids[0], 0); T.flush(); await wait(20);
      var row = ctx(), inTable = heights();
      ok(same(inText, inTable), "4 at 900 px the toolbar keeps its height with the caret in a table", said(inText) + " -> " + said(inTable));
      ok(row.scrollWidth > row.clientWidth, "4 the table's controls are wider than the view, so the row scrolls sideways", row.scrollWidth + " / " + row.clientWidth);
      var tops = Array.prototype.map.call(row.querySelectorAll("button, input"), function (c) { return Math.round(c.getBoundingClientRect().top); });
      ok(tops.length > 5 && tops.every(function (t) { return Math.abs(t - tops[0]) <= 3; }), "4 they stay on one line", tops.join(","));
      ok(bar.querySelector(".tb-main").offsetHeight === mainH, "4 the formatting buttons above are not pushed about", mainH + " -> " + bar.querySelector(".tb-main").offsetHeight);

      // the keyboard reaches a control out of sight, and it scrolls into view
      var all = Array.prototype.slice.call(row.querySelectorAll("button, input"));
      var last = all[all.length - 1];
      bar.querySelector(".tb-type").focus();
      key(bar.querySelector(".tb-type"), "End");
      ok(document.activeElement === last, "4 End in the toolbar goes to the table's last control", document.activeElement && (document.activeElement.className || document.activeElement.tagName));
      await wait(20);
      var rb = row.getBoundingClientRect(), lb = last.getBoundingClientRect();
      ok(row.scrollLeft > 0 && lb.left >= rb.left - 1 && lb.right <= rb.right + 1, "4 and the row scrolls to show it", "scrollLeft " + row.scrollLeft + " control " + Math.round(lb.left) + ".." + Math.round(lb.right) + " row " + Math.round(rb.left) + ".." + Math.round(rb.right));
      key(last, "Escape");

      // a control used where the row is scrolled: the redraw keeps the place
      row.scrollLeft = 200;
      var header = row.querySelector('[data-act="header"]');
      header.click();
      await wait(20);
      ok(ctx().querySelector(".tbl-controls") && ctx().scrollLeft === 200, "4 a table button pressed with the row scrolled leaves it scrolled where it was", String(ctx().scrollLeft));
      // and the mouse wheel scrolls it sideways
      ctx().scrollLeft = 0;
      var wheel = new WheelEvent("wheel", { deltaY: 120, bubbles: true, cancelable: true });
      ctx().dispatchEvent(wheel);
      ok(wheel.defaultPrevented && ctx().scrollLeft > 0, "4 the mouse wheel over the row scrolls it sideways", String(ctx().scrollLeft));

      // the picture's controls: one height, and arrow keys walk them all
      E.selectBlocks([pic]); T.flush(); await wait(20);
      ok(same(inText, heights()) && ctx().scrollLeft === 0, "4 a selected picture keeps the same height, its row starting at the left", said(heights()) + " scrollLeft " + ctx().scrollLeft);
      var controls = Array.prototype.filter.call(bar.querySelectorAll("button, select, input:not([type=file])"), function (c) { return !c.disabled; });
      controls[0].focus();
      var seen = [];
      for (var i = 0; i < controls.length; i++) { key(document.activeElement, "ArrowRight"); seen.push(document.activeElement); }
      var missed = controls.filter(function (c) { return seen.indexOf(c) === -1; });
      ok(missed.length === 0 && seen[seen.length - 1] === controls[0], "4 Arrow Right still walks every control with a picture selected, and wraps", "missed " + missed.length);
      var alt = ctx().querySelector(".tb-alt");
      alt.focus(); await wait(20);
      var ab = alt.getBoundingClientRect(), rb2 = ctx().getBoundingClientRect();
      ok(ab.left >= rb2.left - 1 && ab.right <= rb2.right + 1, "4 the alternative text field scrolls into view when it has the keyboard", Math.round(ab.left) + ".." + Math.round(ab.right) + " in " + Math.round(rb2.left) + ".." + Math.round(rb2.right));
      key(alt, "Escape");
      $("frame").style.width = "1200px";
    });

    // ---- 5: the dark theme ----
    await section("5", async function () {
      open([P("b1", "Text.")]);
      end("b1"); T.flush();
      var root = document.documentElement, hint = ctx().querySelector(".tb-hint");
      var light = getComputedStyle(hint).color, lightBar = heights();
      root.setAttribute("data-theme", "dark");
      await wait(20);
      var dark = getComputedStyle(hint).color, muted = getComputedStyle(root).getPropertyValue("--text-muted").trim();
      ok(dark !== light && muted !== "", "5 the hint takes the theme's muted text colour in the dark theme", light + " / " + dark);
      ok(same(lightBar, heights()), "5 and the toolbar is the same height in both themes", said(lightBar) + " -> " + said(heights()));
      root.removeAttribute("data-theme");
    });

    ok(errors.length === 0, "no script errors", errors.join(" | "));
    finish();
  })();
})();
</script>
</body></html>
