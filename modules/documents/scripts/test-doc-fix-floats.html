<!--
  Floating drawings, from a Word file to the export (review findings 1 to 4
  and 37). A floating drawing is placed by its anchor, measured from the
  paragraph that holds it, so the paragraph is what has to survive:

    - a diagram drawn as loose shapes over blank lines travels as one block,
      every anchor in its own paragraph and every blank line with it, each with
      the font size and spacing it had in the source;
    - shapes anchored in one paragraph stay in one paragraph;
    - a drawing anchored in a paragraph of text is written into that
      paragraph again, not into a new one after it;
    - the import report names every floating drawing;
    - a text box made smaller to fit has its words made smaller with it;
    - no fixture holds a floating drawing far from its paragraph.

  The source is fx-float.docx, made by Word (make-fixtures.ps1), and files built
  here for the cases it does not hold. What Word makes of the export is the
  Word check's business (tools/word-open-check.ps1); this page reads the XML.
-->

    return imp(body).then(function (r) {
      var bl = r.project.blocks;
      eq(brief(bl), ["p:Intro.", "kept shape floating", "p:The drawing hangs ", "kept other floating", "p:Text after the roo", "kept shape floating", "p:A wrapped box make", "p:Last.", "kept textbox", "p:Done."],
        "import: blank lines under a drawing that lies over them are kept as its room; after a wrapped box, or an in-line one, a blank line is a blank line");
      eq([bl[3].description, bl[3].rels.length, (bl[3].xml.match(/<w:p[ >]/g) || []).length], ["Blank lines that left room for a drawing, 2.7 cm", 0, 3], "import: the room says what it is and holds three paragraphs and no drawing");
      eq([entry(r.report, "floating-drawings").count, entry(r.report, "floating-drawings").blockIds], [2, [bl[1].id, bl[5].id]], "report: two floating drawings; the room and the in-line box are not counted as one");
      return exported(r.project).then(function (out) {
        var ex = bodyParas(out.dom), a = indexOfText(ex, "The drawing hangs"), b = indexOfText(ex, "Text after the room");
        eq([ex[a].anchors.length, b - a - 1, ex.slice(a + 1, b).every(function (x) { return x.text === "" && x.fmt.spacing === "before=0 after=200 line=276 lineRule=auto"; })], [1, 3, true],
          "export: the drawing is in its paragraph of text and the three blank lines follow it at their own height");
      });
    });
  });

  test("no floats", function () {
    return imp(P("One.") + P("") + P("") + PX(shape({ name: "In line", inline: true })) + P("") + P("Two.")).then(function (r) {
      eq([brief(r.project.blocks), !!entry(r.report, "floating-drawings")], [["p:One.", "kept textbox", "p:Two."], false], "a file with no floating drawing: no floating-drawings entry, and its blank lines are not carried");
    });
  });

  // ---- 4. where there is no text to hold the anchor ----
  test("writer", function () {
    return I.read(fixture("fx-art"), { name: "fx-art.docx" }).then(function (r) {
      var doc = M.normalise(r.project);
      var shapes = doc.blocks.filter(function (b) { return b.type === "kept" && b.floating && b.kind === "group"; })[0];
      var box = doc.blocks.filter(function (b) { return b.type === "kept" && b.floating && b.kind === "textbox"; })[0];
      var chart = doc.blocks.filter(function (b) { return b.type === "kept" && b.kind === "chart"; })[0];
      ok(!!shapes && !!box && !!chart && /^<w:r[ >]/.test(shapes.xml) && (shapes.xml.match(/<wp:anchor\b/g) || []).length === 2, "fx-art: the two shapes anchored in one paragraph of text are one block of two runs");
      var i = doc.blocks.indexOf(shapes);
      ok(textOf(doc.blocks[i + 1]).indexOf("Two shapes with words in them") === 0, "fx-art: and it comes before that paragraph");
      var t = M.make.table(doc, 1, 2);
      t.rows[0].cells[0].blocks[0].runs = [{ t: "A cell" }];
      doc.blocks = [M.make.heading(doc, 1, "Alone"), box, t, shapes, M.make.paragraph(doc, "The shapes belong to this text."), chart];
      return exported(doc).then(function (out) {
        var ex = bodyParas(out.dom), alone = ex[indexOfText(ex, "Alone") + 1];
        eq([alone.anchors.length, alone.text, alone.fmt.spacing, alone.fmt.jc, alone.fmt.keepNext], [1, "", "before=0 after=0 line=20 lineRule=exact", "", true],
          "export: a floating drawing with no text after it gets a paragraph of no height, not centred, that stays with what follows");
        var text = ex[indexOfText(ex, "The shapes belong")];
        ok(text && text.anchors.length === 2, "export: one with text after it is anchored in that text");
        var last = ex.filter(function (x) { return x.el.getElementsByTagNameNS("http://schemas.openxmlformats.org/drawingml/2006/chart", "chart").length > 0; })[0];
        eq(last && [last.fmt.jc, last.fmt.spacing], ["center", ""], "export: an in-line chart still has its centred paragraph with the template's own spacing");
      });
    });
  });

  // ---- 5. fixtures: every floating drawing is near its paragraph, and stays there ----
  ["fx-float", "fx-art", "fx-theme"].forEach(function (name) {
    test(name + " anchors", function () {
      var src;
      return documentXml(fixture(name)).then(function (xml) {
        src = bodyParas(parse(xml));
        var far = [];
        xml.replace(/<wp:positionV relativeFrom="paragraph"><wp:posOffset>(-?\d+)<\/wp:posOffset>/g, function (m, v) { if (+v < 0 || +v > 1800000) far.push(v); return m; });
        ok(far.length === 0 && /<wp:anchor\b/.test(xml), name + ": every floating drawing measured from its paragraph is within 5 cm below its top", far.join(", "));
        return I.read(fixture(name), { name: name + ".docx" });
      }).then(function (r) { return exported(r.project); }).then(function (out) {
        var ex = bodyParas(out.dom), bad = [], n = 0;
        src.forEach(function (sp) {
          // A floating plain picture becomes a picture in line (reported as floating-pictures); the rest are kept.
          var kept = sp.anchors.filter(function (a) { return !/^Picture /.test(a.name); });
          if (!kept.length || !sp.text) return;
          var ep = ex[indexOfText(ex, sp.text.slice(0, 30))];
          n += kept.length;
          if (!ep || JSON.stringify(ep.anchors) !== JSON.stringify(kept)) bad.push(sp.text.slice(0, 30) + ": " + JSON.stringify(ep && ep.anchors) + " against " + JSON.stringify(kept));
        });
        ok(n > 0 && bad.length === 0, name + ": each drawing anchored in a paragraph of text is anchored in that paragraph in the export, with the same offsets, size and wrap (" + n + ")", bad.join(" | "));
      });
    });
  });

  // ---- 6. a text box made smaller: its words go with it ----
  test("scaleXml", function () {
    var box = shape({ name: "Wide box", inline: true, w: 5588000, h: 762000, words: "START and many more words END" });
    var half = G.scaleXml(box, 0.5), d = parse("<x" + NS + ">" + half + "</x>");
    ok(d.getElementsByTagName("parsererror").length === 0, "scaleXml: the result parses");
    var ext = d.getElementsByTagNameNS(WP, "extent")[0];
    eq([ext.getAttribute("cx"), ext.getAttribute("cy")], ["2794000", "381000"], "scaleXml: the frame is halved");
    var sizes = [].map.call(d.getElementsByTagNameNS(W, "sz"), function (e) { return e.getAttributeNS(W, "val"); });
    var sizesCs = [].map.call(d.getElementsByTagNameNS(W, "szCs"), function (e) { return e.getAttributeNS(W, "val"); });
    eq([sizes, sizesCs], [["12", "12"], ["12", "12"]], "scaleXml: the font size of the words is halved, in the drawing and in its older copy");
    var sp = d.getElementsByTagNameNS(W, "spacing")[0];
    eq([sp.getAttributeNS(W, "after"), sp.getAttributeNS(W, "line")], ["80", "120"], "scaleXml: the spacing after a paragraph and a fixed line height are halved");
    var bp = d.getElementsByTagNameNS("http://schemas.microsoft.com/office/word/2010/wordprocessingShape", "bodyPr")[0];
    eq(["lIns", "tIns", "rIns", "bIns"].map(function (k) { return bp.getAttribute(k); }), ["45720", "22860", "45720", "22860"], "scaleXml: the margin between the frame and the words is halved");
    var bare = G.scaleXml(box.replace(' lIns="91440" tIns="45720" rIns="91440" bIns="45720"', ""), 0.5);
    ok(/<wps:bodyPr rot="0" anchor="t" lIns="45720" tIns="22860" rIns="45720" bIns="22860">/.test(bare), "scaleXml: a shape that names no margins is given Word's own, halved", (/<wps:bodyPr[^>]*>/.exec(bare) || [""])[0]);
    var auto = G.scaleXml(box.replace('w:line="240" w:lineRule="exact"', 'w:line="276" w:lineRule="auto"'), 0.5);
    ok(/w:after="80" w:line="276" w:lineRule="auto"/.test(auto), "scaleXml: a line height given in lines is left alone, since it follows the font");
    ok(/<w:sz w:val="8"\/>/.test(G.scaleXml(box, 0.1)), "scaleXml: words are never made smaller than 4 pt");
    eq(G.scaleXml(box, 1), box, "scaleXml: a factor of one changes nothing");

    var group = '<w:r xmlns:w="' + W + '"><w:drawing><wp:inline xmlns:wp="' + WP + '"><wp:extent cx="4000000" cy="2000000"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData>' +
      '<wpg:wgp xmlns:wpg="http://schemas.microsoft.com/office/word/2010/wordprocessingGroup" xmlns:wps="http://schemas.microsoft.com/office/word/2010/wordprocessingShape"><wpg:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="4000000" cy="2000000"/><a:chOff x="0" y="0"/><a:chExt cx="4000000" cy="2000000"/></a:xfrm></wpg:grpSpPr>' +
      '<wps:wsp><wps:spPr><a:xfrm><a:off x="100" y="100"/><a:ext cx="2000000" cy="1000000"/></a:xfrm></wps:spPr><wps:txbx><w:txbxContent><w:p><w:r><w:rPr><w:sz w:val="24"/><w:szCs w:val="24"/></w:rPr><w:t>In the group</w:t></w:r></w:p></w:txbxContent></wps:txbx><wps:bodyPr lIns="91440"/></wps:wsp>' +
      '</wpg:wgp></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>';
    var g2 = G.scaleXml(group, 0.5);
    ok(/<wpg:grpSpPr><a:xfrm><a:off x="0" y="0"\/><a:ext cx="2000000" cy="1000000"\/><a:chOff x="0" y="0"\/><a:chExt cx="4000000" cy="2000000"\/>/.test(g2) && /<a:off x="100" y="100"\/><a:ext cx="2000000" cy="1000000"\/><\/a:xfrm><\/wps:spPr>/.test(g2),
      "scaleXml: a group's own frame is halved and its children's places, measured in the group's own units, are left alone");
    ok(/<w:sz w:val="12"\/><w:szCs w:val="12"\/>/.test(g2) && /<wps:bodyPr lIns="45720"/.test(g2), "scaleXml: the words of a text box inside a group, and its margins, are halved with it");

    var chart = '<w:r xmlns:w="' + W + '"><w:drawing><wp:inline xmlns:wp="' + WP + '"><wp:extent cx="6858000" cy="2540000"/><wp:docPr id="4" name="Chart 1"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/chart"><c:chart xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:id="sptK1"/></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>';
    eq(G.scaleXml(chart, 0.5), chart.replace('cx="6858000" cy="2540000"', 'cx="3429000" cy="1270000"'), "scaleXml: a chart is the same but for its frame");
  });

  test("scaled in a cell", function () {
    return imp(P("A wide text box follows.") + PX(shape({ name: "Wide box", inline: true, w: 5588000, h: 762000, words: "START and many more words END" })) + P("End.")).then(function (r) {
      var doc = M.normalise(r.project), box = doc.blocks.filter(function (b) { return b.type === "kept"; })[0];
      eq([box.kind, box.floating, box.width], ["textbox", false, 587], "a wide in-line text box is kept");
      var t = M.make.table(doc, 1, 3);
      t.rows[0].cells[1].blocks = [box];
      doc.blocks = [M.make.paragraph(doc, "In a cell."), t];
      return exported(doc).then(function (out) {
        var ext = out.dom.getElementsByTagNameNS(WP, "extent"), wide = null;
        for (var i = 0; i < ext.length; i++) if (ext[i].parentNode.getElementsByTagNameNS(WP, "docPr")[0].getAttribute("name") === "Wide box") wide = ext[i];
        var factor = wide ? +wide.getAttribute("cx") / 5588000 : 0;
        ok(out.fitted.indexOf(box.id) >= 0 && factor > 0.2 && factor < 0.45, "export: in a narrow cell it is made smaller and named among the fitted", String(factor));
        var inBox = wide.parentNode.getElementsByTagNameNS(W, "txbxContent")[0], sz = inBox.getElementsByTagNameNS(W, "sz")[0].getAttributeNS(W, "val");
        ok(Math.abs(+sz - 24 * factor) <= 0.5 && /START and many more words END/.test(inBox.textContent), "export: its words are all there and smaller by the same factor (24 half-points to " + sz + ")", sz + " against " + (24 * factor));
      });
    });
  });

  // ---- 7. the graft: whole paragraphs take the token's paragraph, or nothing is written ----
  test("graft", function () {
    return I.read(fixture("fx-float"), { name: "fx-float.docx" }).then(function (r) {
      var doc = M.normalise(r.project), diagram = doc.blocks.filter(function (b) { return b.type === "kept" && b.kind === "group"; })[0];
      ok(/^<w:p[ >]/.test(diagram.xml) && diagram.floating === true, "the diagram survives the model's own tidying as whole paragraphs");
      return M.toFile(doc).then(function (blob) { return blob.text(); }).then(function (text) {
        var loaded = M.fromText(text), again = loaded.blocks.filter(function (b) { return b.type === "kept" && b.kind === "group"; })[0];
        ok(!!again && again.xml === diagram.xml, "and a save and a load");
        // In a table cell the paragraphs go into the cell.
        var t = M.make.table(loaded, 1, 1);
        t.rows[0].cells[0].blocks = [again];
        loaded.blocks = [M.make.paragraph(loaded, "A diagram in a cell."), t];
        return exported(loaded);
      }).then(function (out) {
        var cell = out.dom.getElementsByTagNameNS(W, "tc"), found = null;
        for (var i = 0; i < cell.length; i++) if (cell[i].getElementsByTagNameNS(WP, "anchor").length === 9) found = cell[i];
        var direct = found ? [].filter.call(found.children, function (c) { return c.localName === "p"; }) : [];
        ok(!!found && direct.length >= 14 && out.xml.indexOf("") < 0, "moved into a table cell, its paragraphs are the cell's paragraphs", String(direct.length));
      });
    });
  });

  chain.then(finish);
})();
</script>
</body></html>
