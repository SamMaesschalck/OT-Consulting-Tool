<!--
  App.DocxGraft (shared/docx-graft.js, docs/document-tool-design.md 4.2) on
  hand-built plans and files packed by the vendored docx library: the token's
  run becomes the original XML, byte for byte; carried parts, their names,
  relationships and content types; escaping; ids made unique; unshare, the
  rule that makes copies safe; the theme; scaleXml; media renamed and typed;
  what is added to the root. That Word opens the result is proven outside
  this page (tools/word-open-check.ps1): a headless page cannot ask Word.
-->
<script src="../vendor/docx.umd.js"></script>
<script src="../js/zip-io.js"></script>
<script src="../js/docx-graft.js"></script>
<script>
(function () {
  var lines = [], fail = 0;
  function ok(c, n, d) { lines.push((c ? "PASS " : "FAIL ") + n + (!c && d ? " - " + d : "")); if (!c) fail++; }
  function finish() {
    alive = false;
    lines.push("", fail === 0 ? "ALL TESTS PASSED" : fail + " FAILED");
    document.getElementById("out").textContent = lines.join("\n");
  }
  // Inflating and deflating run off the main thread, and headless Edge's
  // virtual clock runs out the moment the page has nothing queued, which dumps
  // the page half way through. A message bounced to ourselves keeps a task
  // queued, without moving the clock, until the tests finish.
  var alive = true, bounce = new MessageChannel();
  bounce.port1.onmessage = function () { if (alive) bounce.port2.postMessage(0); };
  bounce.port2.postMessage(0);

  var Zip = window.App.ZipIO, G = window.App.DocxGraft, D = window.docx;

  // ---- namespaces and relationship types ----------------------------------
  var W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  var WP = "http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing";
  var A = "http://schemas.openxmlformats.org/drawingml/2006/main";
  var R = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  var PIC = "http://schemas.openxmlformats.org/drawingml/2006/picture";
  var REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships/";
  var T = {
    image: REL + "image", chart: REL + "chart", pkg: REL + "package", ole: REL + "oleObject", link: REL + "hyperlink",
    dm: REL + "diagramData", lo: REL + "diagramLayout", qs: REL + "diagramQuickStyle", cs: REL + "diagramColors",
    dsp: "http://schemas.microsoft.com/office/2007/relationships/diagramDrawing",
    chartStyle: "http://schemas.microsoft.com/office/2011/relationships/chartStyle",
    chartColors: "http://schemas.microsoft.com/office/2011/relationships/chartColorStyle"
  };
  var CT = {
    png: "image/png", emf: "image/x-emf", xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
    chart: "application/vnd.openxmlformats-officedocument.drawingml.chart+xml",
    chartStyle: "application/vnd.ms-office.chartstyle+xml", chartColors: "application/vnd.ms-office.chartcolorstyle+xml",
    dm: "application/vnd.openxmlformats-officedocument.drawingml.diagramData+xml",
    lo: "application/vnd.openxmlformats-officedocument.drawingml.diagramLayout+xml",
    qs: "application/vnd.openxmlformats-officedocument.drawingml.diagramStyle+xml",
    cs: "application/vnd.openxmlformats-officedocument.drawingml.diagramColors+xml",
    dsp: "application/vnd.ms-office.drawingml.diagramDrawing+xml",
    theme: "application/vnd.openxmlformats-officedocument.theme+xml"
  };

  // ---- kept XML, written as XMLSerializer writes it: every namespace declared where it is first used ----
  function picXml(relId, linkId) {
    return '<w:r xmlns:w="' + W + '"><w:rPr><w:noProof/></w:rPr><w:drawing><wp:inline xmlns:wp="' + WP + '" distT="0" distB="0" distL="0" distR="0">' +
      '<wp:extent cx="1905000" cy="1143000"/><wp:docPr id="7" name="Picture 7" descr="a &amp; b &lt;c&gt;">' +
      (linkId ? '<a:hlinkClick xmlns:a="' + A + '" xmlns:r="' + R + '" r:id="' + linkId + '"/>' : "") + '</wp:docPr>' +
      '<a:graphic xmlns:a="' + A + '"><a:graphicData uri="' + PIC + '"><pic:pic xmlns:pic="' + PIC + '"><pic:nvPicPr><pic:cNvPr id="0" name="x"/><pic:cNvPicPr/></pic:nvPicPr>' +
      '<pic:blipFill><a:blip xmlns:r="' + R + '" r:embed="' + relId + '"><a:extLst><a:ext uri="{28A0092B-C50C-407E-A947-70E740481C1C}"/></a:extLst></a:blip><a:srcRect l="10000"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>' +
      '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="1905000" cy="1143000"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>';
  }
  var CHART_XML = '<w:r xmlns:w="' + W + '"><w:drawing><wp:inline xmlns:wp="' + WP + '" distT="0" distB="0" distL="0" distR="0"><wp:extent cx="5486400" cy="3200400"/>' +
    '<wp:docPr id="7" name="Chart 7"/><wp:cNvGraphicFramePr/><a:graphic xmlns:a="' + A + '"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/chart">' +
    '<c:chart xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:r="' + R + '" r:id="sptK2"/></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>';
  var SMART_XML = '<w:r xmlns:w="' + W + '"><w:drawing><wp:inline xmlns:wp="' + WP + '" distT="0" distB="0" distL="0" distR="0"><wp:extent cx="5486400" cy="3200400"/>' +
    '<wp:docPr id="7" name="Diagram 6"/><wp:cNvGraphicFramePr/><a:graphic xmlns:a="' + A + '"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/diagram">' +
    '<dgm:relIds xmlns:dgm="http://schemas.openxmlformats.org/drawingml/2006/diagram" xmlns:r="' + R + '" r:dm="sptK3" r:lo="sptK4" r:qs="sptK5" r:cs="sptK6"/></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>';
  var OLE_XML = '<w:r xmlns:w="' + W + '"><w:object w:dxaOrig="6918" w:dyaOrig="3065"><v:shapetype xmlns:v="urn:schemas-microsoft-com:vml" id="_x0000_t75" coordsize="21600,21600" xmlns:o="urn:schemas-microsoft-com:office:office" o:spt="75" filled="f" stroked="f"><v:stroke joinstyle="miter"/></v:shapetype>' +
    '<v:shape xmlns:v="urn:schemas-microsoft-com:vml" id="_x0000_i1027" type="#_x0000_t75" style="width:346pt;height:153.5pt" xmlns:o="urn:schemas-microsoft-com:office:office" o:ole=""><v:imagedata xmlns:r="' + R + '" r:id="sptK8" o:title=""/></v:shape>' +
    '<o:OLEObject xmlns:o="urn:schemas-microsoft-com:office:office" Type="Embed" ProgID="Excel.Sheet.12" ShapeID="_x0000_i1027" DrawAspect="Content" ObjectID="_1855919606" xmlns:r="' + R + '" r:id="sptK9"/></w:object></w:r>';
  // A text box with a picture fill: the DrawingML choice and the VML fallback, as Word writes one.
  var BOX_XML = '<w:r xmlns:w="' + W + '"><mc:AlternateContent xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006"><mc:Choice Requires="wps"><w:drawing>' +
    '<wp:anchor xmlns:wp="' + WP + '" distT="0" distB="0" distL="114300" distR="114300" simplePos="0" relativeHeight="251659264" behindDoc="0" locked="0" layoutInCell="1" allowOverlap="1" xmlns:wp14="http://schemas.microsoft.com/office/word/2010/wordprocessingDrawing" wp14:anchorId="1A2B3C4D">' +
    '<wp:simplePos x="0" y="0"/><wp:positionH relativeFrom="column"><wp:posOffset>100</wp:posOffset></wp:positionH><wp:positionV relativeFrom="paragraph"><wp:posOffset>100</wp:posOffset></wp:positionV>' +
    '<wp:extent cx="2794000" cy="508000"/><wp:wrapTopAndBottom/><wp:docPr id="7" name="Text Box 5"/><wp:cNvGraphicFramePr/><a:graphic xmlns:a="' + A + '"><a:graphicData uri="http://schemas.microsoft.com/office/word/2010/wordprocessingShape">' +
    '<wps:wsp xmlns:wps="http://schemas.microsoft.com/office/word/2010/wordprocessingShape"><wps:cNvSpPr txBox="1"/><wps:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="2794000" cy="508000"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom>' +
    '<a:blipFill><a:blip xmlns:r="' + R + '" r:embed="sptK10"/><a:stretch><a:fillRect/></a:stretch></a:blipFill></wps:spPr><wps:txbx><w:txbxContent><w:p><w:r><w:t>Words in a box, "sptK10" in quotes</w:t></w:r></w:p></w:txbxContent></wps:txbx><wps:bodyPr/></wps:wsp>' +
    '</a:graphicData></a:graphic></wp:anchor></w:drawing></mc:Choice><mc:Fallback><w:pict><v:shape xmlns:v="urn:schemas-microsoft-com:vml" id="_x0000_s1026" xmlns:o="urn:schemas-microsoft-com:office:office" o:spid="_x0000_s1026" type="#_x0000_t202" style="position:absolute;width:220pt;height:40pt">' +
    '<v:fill xmlns:r="' + R + '" r:id="sptK10" type="frame"/><v:textbox><w:txbxContent><w:p><w:r><w:t>Words in a box</w:t></w:r></w:p></w:txbxContent></v:textbox></v:shape></w:pict></mc:Fallback></mc:AlternateContent></w:r>';
  var MATH_XML = '<m:oMath xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math"><m:r><m:t>a+b</m:t></m:r></m:oMath>';

  var DATA_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><dgm:dataModel xmlns:dgm="http://schemas.openxmlformats.org/drawingml/2006/diagram" xmlns:a="' + A + '"><dgm:ptLst/><dgm:extLst>' +
    '<a:ext uri="http://schemas.microsoft.com/office/drawing/2008/diagram"><dsp:dataModelExt xmlns:dsp="http://schemas.microsoft.com/office/drawing/2008/diagram" relId="sptK7" minVer="http://schemas.openxmlformats.org/drawingml/2006/diagram"/></a:ext></dgm:extLst></dgm:dataModel>';
  var THEME_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><a:theme xmlns:a="' + A + '" name="Source theme"><a:themeElements/></a:theme>';

  function blobOf(text, type) { return new Blob([typeof text === "string" ? Zip.bytesOf(text) : text], { type: type || "" }); }
  function part(name, type, content, rels) { return { name: name, contentType: type, blob: blobOf(content, type), rels: rels || [] }; }

  // The parts a real import would store, with the awkward source names real files have.
  function allParts() {
    return {
      p1: part("word/media/my pic & more.PNG", CT.png, new Uint8Array([137, 80, 78, 71, 1, 2, 3, 4])),
      p2: part("word/charts/chart1.xml", CT.chart, "<c:chartSpace/>", [
        { id: "rId1", type: T.pkg, part: "p3" }, { id: "rId2", type: T.chartStyle, part: "p4" }, { id: "rId3", type: T.chartColors, part: "p5" }]),
      p3: part("word/embeddings/Microsoft_Excel_Worksheet.xlsx", CT.xlsx, new Uint8Array([80, 75, 3, 4, 9, 9])),
      p4: part("word/charts/style1.xml", CT.chartStyle, "<cs:chartStyle/>"),
      p5: part("word/charts/colors1.xml", CT.chartColors, "<cs:colorStyle/>"),
      p6: part("word/diagrams/data1.xml", CT.dm, DATA_XML),
      p7: part("word/diagrams/layout1.xml", CT.lo, "<dgm:layoutDef/>"),
      p8: part("word/diagrams/quickStyle1.xml", CT.qs, "<dgm:styleDef/>"),
      p9: part("word/diagrams/colors1.xml", CT.cs, "<dgm:colorsDef/>"),
      p10: part("word/diagrams/drawing1.xml", CT.dsp, "<dsp:drawing/>", [{ id: "rId1", type: T.image, part: "p16" }]),
      p11: part("word/media/image3.emf", CT.emf, new Uint8Array([1, 0, 0, 0, 5, 5, 5])),
      p12: part("word/embeddings/Microsoft_Excel_Worksheet1.xlsx", CT.xlsx, new Uint8Array([80, 75, 3, 4, 7, 7])),
      p13: part("word/theme/theme1.xml", CT.theme, THEME_XML, [{ id: "rId1", type: T.image, part: "p14" }]),
      p14: part("word/media/no extension", "image/jpeg", new Uint8Array([255, 216, 255, 1])),
      p15: part("word/media/\u56FE.\u00E9m\u00F8", "application/x-thing", new Uint8Array([4, 4])),
      p16: part("word/media/image9.png", CT.png, new Uint8Array([137, 80, 78, 71, 9]))
    };
  }
  var RELS = {
    pic: [{ id: "sptK1", type: T.image, part: "p1" }],
    chart: [{ id: "sptK2", type: T.chart, part: "p2" }],
    smart: [{ id: "sptK3", type: T.dm, part: "p6" }, { id: "sptK4", type: T.lo, part: "p7" }, { id: "sptK5", type: T.qs, part: "p8" },
      { id: "sptK6", type: T.cs, part: "p9" }, { id: "sptK7", type: T.dsp, part: "p10" }],
    ole: [{ id: "sptK8", type: T.image, part: "p11" }, { id: "sptK9", type: T.pkg, part: "p12" }],
    box: [{ id: "sptK10", type: T.image, part: "p1" }]
  };
  function entry(blockId, kind, xml, rels, extra) {
    var e = { token: G.token(blockId), blockId: blockId, kind: kind, xml: xml, rels: rels };
    if (extra) Object.keys(extra).forEach(function (k) { e[k] = extra[k]; });
    return e;
  }

  // ---- a host file from the library, in the house shape -------------------
  function importedXml(xml) { var c = D.ImportedXmlComponent.fromXmlString(xml); return (c && !c.rootKey && c.root && c.root[0]) || c; }
  var WATERMARK = '<w:r><w:rPr><w:noProof/></w:rPr><w:pict><v:shape id="DraftWatermark1" o:spid="_x0000_s2049" type="#_x0000_t136" style="position:absolute;margin-left:0;margin-top:0;width:440pt;height:146pt;rotation:315" o:allowincell="f" fillcolor="#B8C2CE" stroked="f"><v:fill opacity=".45"/><v:textpath style="font-family:&quot;Segoe UI&quot;;font-size:1pt" string="DRAFT"/></v:shape></w:pict></w:r>';
  var TINY_PNG = (function () { var s = atob("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=="), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; })();
  function P(kids, o) { var a = { children: kids }; if (o) Object.keys(o).forEach(function (k) { a[k] = o[k]; }); return new D.Paragraph(a); }
  function Rn(t, o) { var a = { text: t }; if (o) Object.keys(o).forEach(function (k) { a[k] = o[k]; }); return new D.TextRun(a); }
  // `ids` are block ids to type tokens for; `opts.styled` types them in formatted runs; `opts.extra` are more paragraphs.
  function host(ids, opts) {
    opts = opts || {};
    var hp = P([Rn("Header")]); hp.root.push(importedXml(WATERMARK));
    var kids = [P([Rn("Kept objects")], { heading: D.HeadingLevel.HEADING_1 })];
    ids.forEach(function (id) {
      kids.push(P([Rn("Before " + id)]));
      kids.push(P([Rn(G.token(id), opts.styled ? { bold: true, color: "FF0000", size: 30 } : null)], { alignment: D.AlignmentType.CENTER }));
    });
    (opts.extra || []).forEach(function (x) { kids.push(x); });
    kids.push(P([Rn("After the objects.")]));
    return D.Packer.toBlob(new D.Document({
      creator: "Test", title: "Graft test",
      sections: [{ headers: { default: new D.Header({ children: [hp] }) }, children: kids }]
    }));
  }
  function unzip(blob) {
    return Zip.read(blob).then(function (files) {
      var by = {}; files.forEach(function (f) { by[f.name] = f; });
      return { files: files, by: by, text: function (n) { return by[n] ? Zip.text(by[n]) : null; }, names: files.map(function (f) { return f.name; }) };
    });
  }
  function parse(xml) { return new DOMParser().parseFromString(xml, "application/xml"); }
  function wellFormed(xml) { return !!xml && parse(xml).getElementsByTagName("parsererror").length === 0; }
  function relsIn(xml) {
    return Array.prototype.map.call(parse(xml).getElementsByTagName("Relationship"), function (r) {
      return { id: r.getAttribute("Id"), type: r.getAttribute("Type"), target: r.getAttribute("Target"), mode: r.getAttribute("TargetMode") };
    });
  }
  function relById(xml, id) { return relsIn(xml).filter(function (r) { return r.id === id; }); }
  function overridesIn(xml) {
    var out = {};
    Array.prototype.forEach.call(parse(xml).getElementsByTagName("Override"), function (o) { out[o.getAttribute("PartName")] = o.getAttribute("ContentType"); });
    return out;
  }
  function count(hay, needle) { return hay.split(needle).length - 1; }
  function same(a, b) { if (!a || !b || a.length !== b.length) return false; for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; }
  function bytesOf(blob) { return blob.arrayBuffer().then(function (b) { return new Uint8Array(b); }); }
  function rejects(promise, test, name) {
    return promise.then(function () { ok(false, name, "it was accepted"); }, function (e) { ok(test(e), name, e && e.message); });
  }
  function uniq(list) { var s = {}; return list.every(function (x) { if (s[x]) return false; s[x] = true; return true; }); }
  function keysOf(plan, e) {
    var seen = {}, out = [];
    (function walk(rels) { (rels || []).forEach(function (r) { if (r.part && !seen[r.part] && plan.parts[r.part]) { seen[r.part] = true; out.push(r.part); walk(plan.parts[r.part].rels); } }); })(e.rels);
    return out;
  }

  Promise.resolve().then(function () {
    // ---- the small functions ----------------------------------------------
    ok(G.token("b12") === "\uE000KEPT:b12\uE000", "the token is U+E000, KEPT:, the block id, U+E000");
    ok(G.escapeAttr('a&b<c>d"e') === "a&amp;b&lt;c&gt;d&quot;e", "escapeAttr escapes &, <, > and \"");
    ok(G.escapeAttr(null) === "" && G.escapeAttr(7) === "7", "escapeAttr takes nothing and numbers");
    ok(G.needsGraft(null) === false && G.needsGraft({ kept: [], parts: {}, media: [] }) === false, "an empty plan needs no graft");
    ok(G.needsGraft({ kept: [entry("b1", "equation", MATH_XML, [])], parts: {} }) === true, "a plan with a kept object needs one");
    ok(G.needsGraft({ kept: [], media: [{ fileName: "x.png", ext: "emf", contentType: CT.emf }] }) === true, "a plan with media to rename needs one");
    var err = new G.SharedPartError("m", ["b1", "b2"]);
    ok(err instanceof Error && err instanceof G.SharedPartError && err.name === "SharedPartError" && err.message === "m" && err.blockIds.join() === "b1,b2",
      "SharedPartError is an Error that names the blocks");
    return host([]);
  }).then(function (packed) {
    return G.apply(packed, { kept: [], parts: {}, media: [] }).then(function (out) {
      ok(out === packed, "with nothing to do, apply hands back the very Blob the library packed");
    });
  }).then(function () {

    // ---- placing: one of everything ---------------------------------------
    var plan = {
      kept: [
        entry("b1", "picture", picXml("sptK1", "sptK11"), RELS.pic.concat([{ id: "sptK11", type: T.link, external: "https://example.com/?a=1&b=2\"<x>" }])),
        entry("b2", "chart", CHART_XML, RELS.chart),
        entry("b3", "smartart", SMART_XML, RELS.smart),
        entry("b4", "ole", OLE_XML, RELS.ole),
        entry("b5", "textbox", BOX_XML, RELS.box),
        entry("b6", "equation", MATH_XML, [])
      ],
      parts: allParts(), theme: "p13", media: []
    };
    var frozen = JSON.stringify(plan.kept);
    var extra = [P([new D.ImageRun({ data: TINY_PNG, transformation: { width: 20, height: 20 } })])];
    return host(["b1", "b2", "b3", "b4", "b5", "b6"], { extra: extra }).then(function (packed) {
      return G.apply(packed, plan).then(function (out) {
        ok(out instanceof Blob && out !== packed, "apply gives a new Blob");
        ok(out.type === packed.type && /wordprocessingml/.test(out.type), "of the Word document type the library gave");
        ok(JSON.stringify(plan.kept) === frozen && Object.keys(plan.parts).length === 16, "the plan it was given is not changed");
        return Promise.all([unzip(packed), unzip(out)]);
      });
    }).then(function (both) {
      var before = both[0], z = both[1], doc = z.text("word/document.xml"), rels = z.text("word/_rels/document.xml.rels"), types = z.text("[Content_Types].xml");
      ok(z.names[0] === "[Content_Types].xml", "[Content_Types].xml is the first entry");
      ok(!z.names.some(function (n) { return /\/$/.test(n); }), "no directory entries");
      ok(doc.indexOf("\uE000") === -1 && doc.indexOf("KEPT:") === -1, "every token is gone");
      ok(count(before.text("word/document.xml"), "\uE000KEPT:") === 6, "(the packed file held six)");
      // The first entry's docPr id and the object's ids are renumbered; everything else must be the stored text.
      var chartPlaced = CHART_XML.replace('<wp:docPr id="7"', '<wp:docPr id="X"');
      ok(doc.replace(/(<wp:docPr id=")\d+/g, "$1X").indexOf(chartPlaced) !== -1, "the chart's XML is in the document byte for byte (bar the drawing id)");
      ok(doc.indexOf(MATH_XML) !== -1, "an equation, which is not a run, is placed byte for byte");
      ok(doc.indexOf("<w:p><w:pPr><w:jc w:val=\"center\"/></w:pPr>" + MATH_XML + "</w:p>") !== -1, "it takes the place of the whole run, inside the writer's paragraph", doc.substr(doc.indexOf(MATH_XML) - 60, 60));
      ok(doc.indexOf('descr="a &amp; b &lt;c&gt;"') !== -1, "escaped text inside the kept XML stays escaped");
      ok(doc.indexOf('Words in a box, "sptK10" in quotes') !== -1, "text inside a text box is untouched");
      ok(wellFormed(doc), "word/document.xml is well formed");
      ok(doc.indexOf("Before b1") < doc.indexOf('name="Picture 7"') && doc.indexOf('name="Picture 7"') < doc.indexOf("Before b2") &&
        doc.indexOf("Before b2") < doc.indexOf('name="Chart 7"') && doc.indexOf('name="Chart 7"') < doc.indexOf("Before b3"), "each object sits where its token was");
      ok(doc.indexOf("After the objects.") !== -1 && doc.indexOf("Kept objects") !== -1, "the rest of the document is still there");

      // Parts and their names.
      var kept = z.names.filter(function (n) { return /^word\/kept\//.test(n); }).sort();
      ok(z.by["word/kept/p1.png"] && same(z.by["word/kept/p1.png"].bytes, new Uint8Array([137, 80, 78, 71, 1, 2, 3, 4])),
