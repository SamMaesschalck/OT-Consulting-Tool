<html lang="en"><head><meta charset="utf-8"/><title>Document tool: what an import says about links, fields, captions and lost drawings</title></head>
<body>
<pre id="out">running...</pre>
<!--
  Reading a Word file (review findings 24 to 26, 28 to 34, 39, 53 and 57). Nothing
  from the file is dropped or altered without a true line in the import report:

    - fields that have no result (LISTNUM, AUTONUM, EQ, SYMBOL, MACROBUTTON);
    - a drawing, picture or footnote that is left out is not reported as kept;
    - a link inside a kept drawing or text box follows the rule for links in the
      text, and what a kept object still fetches from outside is said;
    - a numbered item with extra indent keeps its number;
    - a list of figures is not the contents list;
    - a link on a picture, and what is counted as a link brought across;
    - a caption with a footnote or a link, and which block a caption belongs to;
    - a link to a file, with the paragraph it was in;
    - a table inside a footnote.

  Every file is built here, shaped the way Word writes it, and read by the real
  reader; the export is the real writer's.
-->
<script src="../js/version.js"></script>
<script src="../js/product.js"></script>
<script src="../js/logo.js"></script>
<script src="../js/hero-asset.js"></script>
<script src="../vendor/docx.umd.js"></script>
<script src="../js/zip-io.js"></script>
<script src="../js/docx-graft.js"></script>
<script src="../js/house-docx.js"></script>
<script src="../js/docx-import.js"></script>
<script src="../data/document.js"></script>
<script src="../js/model.js"></script>
<script src="../js/import-flow.js"></script>
<script>
(function () {
  var lines = [], fail = 0;
  function ok(c, n, d) { lines.push((c ? "PASS " : "FAIL ") + n + (!c && d ? " - " + d : "")); if (!c) fail++; }
  function eq(a, b, n) { var x = JSON.stringify(a), y = JSON.stringify(b); ok(x === y, n, "got " + x + " wanted " + y); }
  function finish() {
    alive = false;
    lines.push("", fail === 0 ? "ALL TESTS PASSED" : fail + " FAILED");
    document.getElementById("out").textContent = lines.join("\n");
  }
  // Unzipping runs off the main thread, and headless Edge's virtual clock runs
  // out the moment the page has nothing queued. A message bounced to ourselves
  // keeps a task queued, without moving the clock, until the tests finish.
  var alive = true, bounce = new MessageChannel();
  bounce.port1.onmessage = function () { if (alive) bounce.port2.postMessage(0); };
  bounce.port2.postMessage(0);

  var App = window.App, I = App.DocxImport, H = App.HouseDocx, Zip = App.ZipIO, F = App.DocImportFlow;
  var W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  var MC = "http://schemas.openxmlformats.org/markup-compatibility/2006";
  var WP = "http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing";
  var DML = "http://schemas.openxmlformats.org/drawingml/2006/main";
  var RNS = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  var REL = RNS + "/";
  var NS = ' xmlns:w="' + W + '" xmlns:r="' + RNS + '" xmlns:mc="' + MC + '"' +
    ' xmlns:wp="' + WP + '" xmlns:wps="http://schemas.microsoft.com/office/word/2010/wordprocessingShape"' +
    ' xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w14="http://schemas.microsoft.com/office/word/2010/wordml" mc:Ignorable="w14"';
  var HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';

  // ---- WordprocessingML, briefly ----
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function R(text, rPr) { return '<w:r>' + (rPr ? '<w:rPr>' + rPr + '</w:rPr>' : '') + '<w:t xml:space="preserve">' + esc(text) + '</w:t></w:r>'; }
  function PX(inner, pPr) { return '<w:p>' + (pPr ? '<w:pPr>' + pPr + '</w:pPr>' : '') + inner + '</w:p>'; }
  function P(text, pPr, rPr) { return PX(R(text, rPr), pPr); }
  function S(id) { return '<w:pStyle w:val="' + id + '"/>'; }
  function NUM(id, lvl) { return '<w:numPr><w:ilvl w:val="' + (lvl || 0) + '"/><w:numId w:val="' + id + '"/></w:numPr>'; }
  function STYLE(id, name, o) {
    o = o || {};
    return '<w:style w:type="' + (o.type || "paragraph") + '"' + (o.dflt ? ' w:default="1"' : '') + ' w:styleId="' + id + '"><w:name w:val="' + name + '"/>' +
      (o.based ? '<w:basedOn w:val="' + o.based + '"/>' : '') + (o.pPr ? '<w:pPr>' + o.pPr + '</w:pPr>' : '') + (o.rPr ? '<w:rPr>' + o.rPr + '</w:rPr>' : '') + '</w:style>';
  }
  function STYLES(list) {
    return HEAD + '<w:styles' + NS + '>' + STYLE("Normal", "Normal", { dflt: true }) + STYLE("Heading1", "heading 1", { pPr: '<w:outlineLvl w:val="0"/>' }) +
      STYLE("Caption", "caption") + STYLE("TOF", "table of figures") + STYLE("TOC1", "toc 1") + (list || []).join("") + '</w:styles>';
  }
  function TC(inner) { return '<w:tc>' + (inner.charAt(0) === "<" ? inner : P(inner)) + '</w:tc>'; }
  function TR(cells) { return '<w:tr>' + cells.join("") + '</w:tr>'; }
  function T(rows, grid) { return '<w:tbl><w:tblPr/><w:tblGrid>' + grid.map(function (w) { return '<w:gridCol w:w="' + w + '"/>'; }).join("") + '</w:tblGrid>' + rows.join("") + '</w:tbl>'; }
  var TABLE = T([TR([TC("Zone"), TC("Ports")]), TR([TC("A"), TC("3")])], [3000, 3000]);
  function FLD(type) { return '<w:r><w:fldChar w:fldCharType="' + type + '"/></w:r>'; }
  function INSTR(code) { return '<w:r><w:instrText xml:space="preserve">' + esc(code) + '</w:instrText></w:r>'; }
  function FIELD(code, result) { return FLD("begin") + INSTR(code) + FLD("separate") + (result || "") + FLD("end"); }
  // A field with no result part: Word writes begin, the code, end.
  function CODE(code) { return FLD("begin") + INSTR(code) + FLD("end"); }
  function LINK(rid, inner) { return '<w:hyperlink r:id="' + rid + '">' + inner + '</w:hyperlink>'; }
  function FNREF(id) { return '<w:r><w:footnoteReference w:id="' + id + '"/></w:r>'; }
  function LVL(i, fmt, txt, left) {
    return '<w:lvl w:ilvl="' + i + '"><w:start w:val="1"/><w:numFmt w:val="' + fmt + '"/><w:lvlText w:val="' + txt + '"/><w:pPr><w:ind w:left="' + left + '" w:hanging="360"/></w:pPr></w:lvl>';
  }
  function NUMBERING(abstracts, nums) {
    return HEAD + '<w:numbering' + NS + '>' + abstracts.map(function (a, i) { return '<w:abstractNum w:abstractNumId="' + i + '">' + a + '</w:abstractNum>'; }).join("") +
      nums.map(function (abs, i) { return '<w:num w:numId="' + (i + 1) + '"><w:abstractNumId w:val="' + abs + '"/></w:num>'; }).join("") + '</w:numbering>';
  }
  function FOOTNOTES(notes) {
    return HEAD + '<w:footnotes' + NS + '>' + notes.map(function (n) { return '<w:footnote w:id="' + n[0] + '">' + n[1] + '</w:footnote>'; }).join("") + '</w:footnotes>';
  }
  var FNMARK = '<w:r><w:footnoteRef/></w:r>';

  // ---- pictures and drawings ----
  // A real picture, one pixel square, so the writer can print it.
  var PNG = (function () {
    var s = atob("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=="), u = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    return u;
  })();
  var docPr = 0;
  function FRAME(data, o) {
    o = o || {};
    var click = o.click ? '<a:hlinkClick xmlns:a="' + DML + '" r:id="' + o.click + '"/>' : '';
    return '<w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="952500" cy="476250"/><wp:docPr id="' + (++docPr) + '" name="' + esc(o.name || "Object " + docPr) + '">' + click + '</wp:docPr>' +
      '<wp:cNvGraphicFramePr/><a:graphic xmlns:a="' + DML + '">' + data + '</a:graphic></wp:inline></w:drawing>';
  }
  // A picture as Word writes one. o: { name, click (a link on the picture: a relationship id), crop }
  function PIC(rid, o) {
    o = o || {};
    return '<w:r>' + FRAME('<a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">' +
      '<pic:nvPicPr><pic:cNvPr id="0" name="Picture">' + (o.click ? '<a:hlinkClick r:id="' + o.click + '"/>' : '') + '</pic:cNvPr><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="' + rid + '"/>' +
      (o.crop ? '<a:srcRect l="12000"/>' : '') + '<a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="952500" cy="476250"/></a:xfrm>' +
      '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData>', o) + '</w:r>';
  }
  function CHART(rid, name) {
    return '<w:r>' + FRAME('<a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/chart"><c:chart xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" r:id="' + rid + '"/></a:graphicData>', { name: name }) + '</w:r>';
  }
  // A text box as Word writes one: DrawingML with a VML copy of the same words beside it.
  // o: { name, click (a link on the box), href (an address on the VML shape), vml (words of the VML copy only) }
  function BOX(inner, o) {
    o = o || {};
    return '<w:r><mc:AlternateContent><mc:Choice Requires="wps">' + FRAME('<a:graphicData uri="http://schemas.microsoft.com/office/word/2010/wordprocessingShape"><wps:wsp><wps:cNvSpPr txBox="1"/>' +
      '<wps:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="952500" cy="476250"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></wps:spPr><wps:txbx><w:txbxContent>' + inner + '</w:txbxContent></wps:txbx><wps:bodyPr/></wps:wsp></a:graphicData>', o) +
      '</mc:Choice><mc:Fallback><w:pict><v:rect id="box' + docPr + '"' + (o.href ? ' href="' + esc(o.href) + '"' : '') + ' style="width:75pt;height:37pt"><v:textbox><w:txbxContent>' + inner + (o.vml || "") + '</w:txbxContent></v:textbox></v:rect></w:pict></mc:Fallback></mc:AlternateContent></w:r>';
  }

  // A package. o: { body, styles, numbering, footnotes, rels: [[id, kind, target, external]], files: { name: text or bytes } }
  function make(o) {
    var CT = "application/vnd.openxmlformats-officedocument.wordprocessingml.";
    var rels = '<Relationship Id="rIdS" Type="' + REL + 'styles" Target="styles.xml"/>', types = '<Override PartName="/word/styles.xml" ContentType="' + CT + 'styles+xml"/>';
    var files = [{ name: "word/styles.xml", bytes: Zip.bytesOf(o.styles || STYLES()) }];
    if (o.numbering) {
      rels += '<Relationship Id="rIdN" Type="' + REL + 'numbering" Target="numbering.xml"/>';
      types += '<Override PartName="/word/numbering.xml" ContentType="' + CT + 'numbering+xml"/>';
      files.push({ name: "word/numbering.xml", bytes: Zip.bytesOf(o.numbering) });
    }
    if (o.footnotes) {
      rels += '<Relationship Id="rIdFn" Type="' + REL + 'footnotes" Target="footnotes.xml"/>';
      types += '<Override PartName="/word/footnotes.xml" ContentType="' + CT + 'footnotes+xml"/>';
      files.push({ name: "word/footnotes.xml", bytes: Zip.bytesOf(o.footnotes) });
    }
    for (var n in (o.files || {})) files.push({ name: n, bytes: typeof o.files[n] === "string" ? Zip.bytesOf(o.files[n]) : o.files[n] });
    (o.rels || []).forEach(function (r) { rels += '<Relationship Id="' + r[0] + '" Type="' + REL + r[1] + '" Target="' + esc(r[2]) + '"' + (r[3] ? ' TargetMode="External"' : '') + '/>'; });
    return Zip.write([
      { name: "[Content_Types].xml", bytes: Zip.bytesOf(HEAD + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' +
        '<Default Extension="png" ContentType="image/png"/><Default Extension="xlsx" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"/>' +
        '<Override PartName="/word/document.xml" ContentType="' + CT + 'document.main+xml"/>' + types + '</Types>') },
      { name: "_rels/.rels", bytes: Zip.bytesOf(HEAD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="' + REL + 'officeDocument" Target="word/document.xml"/></Relationships>') },
      { name: "word/document.xml", bytes: Zip.bytesOf(HEAD + '<w:document' + NS + '><w:body>' + o.body + '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/></w:sectPr></w:body></w:document>') },
      { name: "word/_rels/document.xml.rels", bytes: Zip.bytesOf(HEAD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + rels + '</Relationships>') }
    ].concat(files));
  }
  function RELS(rels) {
    return HEAD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      rels.map(function (r) { return '<Relationship Id="' + r[0] + '" Type="' + REL + r[1] + '" Target="' + esc(r[2]) + '"' + (r[3] ? ' TargetMode="External"' : '') + '/>'; }).join("") + '</Relationships>';
  }
  function imp(o) { return make(o).then(function (blob) { return I.read(blob, { name: "made.docx" }); }); }

  // ---- reading the result ----
  function text(b) { return b.runs ? b.runs.map(function (r) { return r.t; }).join("") : (b.text || ""); }
  function brief(blocks) {
    return blocks.map(function (b) {
      var tag = b.type === "heading" ? "h" + b.level : b.type === "list" ? (b.list === "bullet" ? "*" : "#") + b.level + (b.restart ? "r" : "") + (b["continue"] ? "c" : "")
        : b.type === "paragraph" ? "p" : b.type === "kept" ? "kept " + b.kind : b.type;
      return tag + (b.type !== "kept" && text(b) ? ":" + text(b) : "") + (b.caption ? " [" + b.caption + "]" : "");
    });
  }
  function entry(report, code) {
    var found = null;
    ["toCheck", "changed", "notCarried"].forEach(function (l) { report[l].forEach(function (e) { if (e.code === code) found = e; }); });
    return found;
  }
  function count(report, code) { var e = entry(report, code); return e ? e.count : 0; }
  function codes(report) { return report.notCarried.concat(report.changed).map(function (e) { return e.code; }).filter(function (c) { return c !== "formatting"; }); }
  function byText(blocks, t) { for (var i = 0; i < blocks.length; i++) if (text(blocks[i]) === t) return blocks[i]; return null; }
  function ofType(blocks, type) { return blocks.filter(function (b) { return b.type === type; }); }
  function markers(blocks) {
    var n = H.listNumbers(blocks);
    return ofType(blocks, "list").map(function (b) { return n[b.id].marker; }).join(" ");
  }
  // The exported Word file: { doc, rels (every relationships part, joined), notes }.
  function exported(project) {
    return H.buildDocument(project, { issueStatus: "draft" }).then(function (res) { return Zip.read(res.blob); }).then(function (files) {
      var out = { doc: "", rels: "", notes: "" };
      files.forEach(function (f) {
        if (f.name === "word/document.xml") out.doc = Zip.text(f);
        else if (f.name === "word/footnotes.xml") out.notes = Zip.text(f);
        else if (/\.rels$/.test(f.name)) out.rels += Zip.text(f);
      });
      return out;
    });
  }
  function external(rels) { return (rels.match(/<Relationship [^>]*TargetMode="External"[^>]*>/g) || []).map(function (r) { return /Target="([^"]*)"/.exec(r)[1].replace(/&amp;/g, "&"); }).sort(); }
  function plainWords(s) { return !/[\u2013\u2014]/.test(s) && !/\b[A-Z]{4,}\b/.test(s) && !/the tool/i.test(s) && /\.$/.test(s); }

  var chain = Promise.resolve();
  function test(name, fn) {
    chain = chain.then(fn).then(null, function (e) { ok(false, name + ": it ran", (e && (e.cause ? e.cause.stack || e.cause.message : e.stack || e.message)) || String(e)); });
  }

  // ---- 24. fields with no result part ----
  test("fields with no result", function () {
    return imp({ body:
      PX(R("The supplier shall, under clause ") + CODE(" LISTNUM ") + R(", comply.")) +
      PX(CODE(" AUTONUM ") + R(" First clause")) +
      PX(R("Ratio ") + CODE(" EQ \\f(1,2) ") + R(" of the load")) +
      PX(R("Temp 20") + CODE(" SYMBOL 176 \\a ") + R("C, mark ") + CODE(" SYMBOL 153 ") + R(", at most ") + CODE(' SYMBOL 0x2264 \\u ') + R(" 5, varies ") + CODE(' SYMBOL 181 \\f "Symbol" \\s 11 ') +
        R(", odd ") + CODE(' SYMBOL 61 \\f "Wingdings 3" ') + R(".")) +
      PX(R("Site: ") + CODE(" MACROBUTTON NoMacro [Click and type the site name] ") + R(" (end)")) +
      PX(R("Indexed") + CODE(' XE "Index entry" ') + R(" word, simple ") + '<w:fldSimple w:instr=" LISTNUM  LegalDefault "/>' + R(" field")) +
      PX(R("Dated ") + FIELD(' DATE \\@ "d MMM" ', R("1 Jan"))) +
      PX(FLD("begin") + INSTR(' TOC \\o "1-3" ') + FLD("separate") + R("Scope 2 ") + CODE(" LISTNUM ") + CODE(" SYMBOL 176 ") + FLD("end")) +
      P("After")
    }).then(function (r) {
      var b = r.project.blocks, e = entry(r.report, "fields-no-text");
      eq(b.map(text), ["The supplier shall, under clause , comply.", " First clause", "Ratio  of the load", "Temp 20\u00B0C, mark \u2122, at most \u2264 5, varies \u221D, odd \u25A1.",
        "Site: [Click and type the site name] (end)", "Indexed word, simple  field", "Dated 1 Jan", "After"],
        "24 a SYMBOL field is the character it names (Windows places, Unicode, a symbol font; an unmatched one is a box) and a MACROBUTTON field the prompt it displays");
      ok(!!e && r.report.notCarried.indexOf(e) >= 0 && I.CODES.notCarried.indexOf("fields-no-text") >= 0, "24 a field with nothing to keep has a line of its own in the not carried list", JSON.stringify(codes(r.report)));
      eq(e && [e.count, e.examples], [4, ["LISTNUM", "AUTONUM", "EQ \\f(1,2)", "LISTNUM LegalDefault"]],
        "24 an automatic number and an old equation are each counted and quoted by their code; an index mark showed nothing, and nothing is counted inside a contents list that is left out");
      eq(e && e.blockIds, [b[0].id, b[1].id, b[2].id, b[5].id], "24 the line points at the paragraphs the fields were in");
      eq([count(r.report, "fields"), count(r.report, "symbols")], [7, 1], "24 the fields that became text are counted as fields kept as text (five symbols, a prompt, a date), not the ones that left nothing; the box is counted");
      var s = F.sentence(e);
      ok(/^4 fields that Word works out as it prints .* had no text to keep\. Type in what they showed\.$/.test(s) && plainWords(s) && /^1 field that .* Type in what it showed\.$/.test(F.sentence({ code: "fields-no-text", count: 1 })),
        "24 the sentence reads properly for one and for many", s);
    });
  });

  // ---- 25. what is left out is not reported as kept ----
  test("left out is not kept", function () {
    var THEME = '<a:theme xmlns:a="' + DML + '" name="T"><a:themeElements/></a:theme>';
    return imp({
      rels: [["rIdChart", "chart", "charts/chart1.xml"], ["rIdGone", "image", "media/gone.png"], ["rIdT", "theme", "theme/theme1.xml"]],
      files: { "word/charts/chart1.xml": '<c:chartSpace xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart"/>',
        "word/charts/_rels/chart1.xml.rels": RELS([["rId1", "package", "../embeddings/Gone.xlsx"]]),
        "word/theme/theme1.xml": THEME, "word/theme/_rels/theme1.xml.rels": RELS([["rId1", "image", "../media/themegone.png"]]) },
      body: P("Before") + PX(CHART("rIdChart", "Chart 1")) + PX(PIC("rIdGone", { name: "Pic A" })) + PX(R("A note") + FNREF(7)) + PX(PIC("rIdGone", { name: "Pic B", crop: true })) + P("After")
    }).then(function (r) {
      var p = r.project, b = p.blocks, lost = entry(r.report, "objects-lost"), stays = entry(r.report, "unreadable-part"), fn = entry(r.report, "notes-missing"), th = entry(r.report, "theme-missing");
      eq(brief(b), ["p:Before", "p:A note", "kept picture", "p:After"], "25 a chart that has lost its workbook and a picture that has lost its image leave no block; a kept picture stays");
      eq(lost && [lost.count, lost.examples, lost.blockIds], [2, ["Chart 1", "Pic A"], undefined], "25 the two that were left out are listed as lost, by name, and point at no block");
      ok(lost && r.report.notCarried.indexOf(lost) >= 0 && !/kept/.test(F.sentence(lost)) && /^2 pictures or drawings could not be brought across because part of them is missing from the Word file\.$/.test(F.sentence(lost)) && plainWords(F.sentence(lost)),
        "25 their sentence does not say they were kept", lost && F.sentence(lost));
      eq(stays && [stays.count, stays.examples, stays.blockIds], [1, ["Pic B"], [b[2].id]], "25 only the drawing that stayed is reported as kept but to be checked, with its block");
      eq(fn && [fn.count, fn.blockIds], [1, [b[1].id]], "25 a reference to a note that is not there is a line of its own, with its paragraph");
      ok(fn && !/drawing|kept/.test(F.sentence(fn)) && /^1 footnote or endnote reference pointed at a note that is not in the Word file and was removed\.$/.test(F.sentence(fn)), "25 and it is not called a drawing that was kept", fn && F.sentence(fn));
      ok(th && !("theme" in p) && !/drawing refers|was kept/.test(F.sentence(th)) && plainWords(F.sentence(th)), "25 a theme that could not be read has its own line", JSON.stringify(codes(r.report)));
      // Whatever the report says was kept must be there to look at.
      var ids = {}, wrong = [];
      b.forEach(function (x) { ids[x.id] = true; });
      r.report.notCarried.forEach(function (e) {
        if (/kept, but may not look right/.test(F.sentence(e)) && !((e.blockIds || []).length === e.count && e.blockIds.every(function (id) { return ids[id]; }))) wrong.push(e.code);
      });
      eq(wrong, [], "25 every line that says a drawing was kept points at a block that exists");
      ok(F.sentence({ code: "objects-lost", count: 1 }) === "1 picture or drawing could not be brought across because part of it is missing from the Word file.", "25 the sentence reads properly for one");
    });
  });

  // ---- 26, 53. links and linked content inside a kept object ----
  test("links inside kept objects", function () {
    var HTA = "file://///fileserver.example/share/drawing.hta";
    var words = PX(R("Open ") + LINK("rIdFile", R("the drawing")) + R(" or ") + LINK("rIdWeb", R("the site")) + R(", see ") + FIELD(' HYPERLINK "C:\\\\tools\\\\run.exe" ', R("the runner")) +
      R(" and ") + FIELD(' HYPERLINK "https://example.org/field" ', R("the page")) + R(" on page ") + FIELD(" PAGE ", R("3")));
    var fetched = PX(R("Logo: ") + FLD("begin") + INSTR(' INCLUDEPICTURE "http://tracker.example/pixel.png" \\d ') + FLD("separate") +
      '<w:r><w:pict><v:shape id="inc1" style="width:10pt;height:10pt"><v:imagedata r:id="rIdRemote"/></v:shape></w:pict></w:r>' + FLD("end") + R(" then ") + '<w:fldSimple w:instr=" INCLUDETEXT &quot;\\\\\\\\host\\\\share\\\\a.docx&quot; ">' + R("included words") + '</w:fldSimple>');
    return imp({
      rels: [["rIdFile", "hyperlink", HTA, true], ["rIdWeb", "hyperlink", "https://example.org/", true], ["rIdJs", "hyperlink", "javascript:alert(1)", true],
        ["rIdRemote", "image", "http://tracker.example/pixel.png", true], ["rIdChart", "chart", "charts/chart1.xml"]],
      files: { "word/charts/chart1.xml": '<c:chartSpace xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart"/>',
        "word/charts/_rels/chart1.xml.rels": RELS([["rId1", "hyperlink", "file:///C:/Windows/System32/calc.exe", true], ["rId2", "hyperlink", "https://example.org/chart", true],
          ["rId3", "oleObject", "file:///\\\\host\\share\\Book1.xlsx", true]]) },
      body: P("Body ") + PX(R("See ") + LINK("rIdFile", R("the body link"))) +
        PX(BOX(words, { name: "Link box", click: "rIdJs", href: "javascript:alert(2)" })) + PX(BOX(fetched, { name: "Fetch box" })) + PX(CHART("rIdChart", "Chart 9")) +
        PX(BOX(P("Plain words"), { name: "Quiet box" }))
    }).then(function (r) {
      var p = r.project, k = ofType(p.blocks, "kept"), box = k[0], inc = k[1], chart = k[2];
      function outside(blk) { return blk.rels.filter(function (x) { return x.external; }).map(function (x) { return x.external; }).sort(); }
      eq(brief(p.blocks), ["p:Body ", "p:See the body link", "kept textbox", "kept textbox", "kept chart", "kept textbox"], "26 the drawings are all kept");
      eq(outside(box), ["https://example.org/"], "26 of the links in a kept text box only the one to a web address keeps its relationship");
      ok(!/hlinkClick/.test(box.xml) && !/ href=/.test(box.xml) && (box.xml.match(/<w:hyperlink /g) || []).length === 2 && /the drawing/.test(box.xml) && /the runner/.test(box.xml) && /the site/.test(box.xml),
        "26 a click action to a script and a file link are taken off, in both versions of the box; the words of each stay, and the web link is still a link", box.xml.slice(0, 900));
      ok(!/run\.exe/.test(box.xml) && /example\.org\/field/.test(box.xml) && / PAGE /.test(box.xml) && /the page/.test(box.xml),
        "53 a HYPERLINK field to a program is turned into its words; one to a web address and a page number field are left as they are");
      var lk = entry(r.report, "links-in-drawings");
      eq(lk && [lk.count, lk.blockIds, lk.examples], [4, [box.id, chart.id], ["Link box", "Chart 9"]],
        "26 each link taken off is counted once (not once for each version of the box), with the drawing it was in: a file link, a click action (an address on the shape in the VML version), a field, and one in the chart's own part");
      ok(lk && r.report.notCarried.indexOf(lk) >= 0 && /^4 links inside a drawing or a text box pointed somewhere other than a web or email address and were removed\. The words and shapes were kept\.$/.test(F.sentence(lk)) && plainWords(F.sentence(lk)),
        "26 the sentence says what happened", lk && F.sentence(lk));
      eq([count(r.report, "other-links"), r.report.carried.links], [1, 0], "26 the link in the body is still reported as before, and no link in a drawing is counted as a link brought across in the text");
      ok(!/INCLUDEPICTURE|INCLUDETEXT/.test(inc.xml) && !/fldSimple/.test(inc.xml) && /included words/.test(inc.xml) && !/imagedata/.test(inc.xml),
        "53 fields that fetch when the file is opened are turned into what they showed; the picture INCLUDEPICTURE fetched is not kept (Word would fetch it)", inc.xml.slice(0, 600));
      var pics = entry(r.report, "linked-pictures"), fields = entry(r.report, "fields");
      eq(pics && [pics.count, pics.examples, pics.blockIds], [1, ["http://tracker.example/pixel.png"], [inc.id]], "53 the picture that was fetched from outside is reported as a linked picture left out, with its address and its block");
      ok(pics && r.report.notCarried.indexOf(pics) >= 0, "53 under not carried over");
      eq(fields && [fields.count, fields.blockIds], [2, [inc.id]], "53 the two fields are counted as fields kept as what they showed");
      eq(p.parts[chart.rels[0].part].rels.map(function (x) { return x.external; }), ["about:blank", "https://example.org/chart"],
        "26 in a carried part a link that is not to a web address keeps its id and points at an empty page; a web link is kept; the workbook a chart is linked to is not carried");
      var lo = entry(r.report, "linked-objects");
      eq(lo && [lo.count, lo.examples, lo.blockIds], [1, ["file:///\\\\host\\share\\Book1.xlsx"], [chart.id]], "53 what a kept object was linked to outside the file is said, with the address");
      ok(lo && r.report.notCarried.indexOf(lo) >= 0 && plainWords(F.sentence(lo)) && /^A link from a chart or an object to a file outside the document was left out\b/.test(F.sentence(lo)), "53 in a sentence", lo && F.sentence(lo));
      eq(k[3].rels, [], "26 a text box with no links is untouched");
      return exported(p).then(function (x) {
        eq(external(x.rels).filter(function (t) { return !/^https:\/\/(www\.)?solutionspt\./.test(t); }),
          ["about:blank", "https://example.org/", "https://example.org/chart"],
          "26 the exported Word file's relationships hold the web links, and nothing else from the source");
        ok(!/javascript:|\.hta|calc\.exe|run\.exe/.test(x.rels + x.doc) && !/INCLUDEPICTURE|INCLUDETEXT/.test(x.doc) && /the drawing/.test(x.doc) && /included words/.test(x.doc),
          "26 no script, file or program address and no fetching field reaches the Word file; the words do");
      });
    });
  });

  // ---- 28. numbered items with extra indent ----
  var LISTS = NUMBERING([LVL(0, "decimal", "%1.", 720) + LVL(1, "lowerLetter", "%2.", 1440), LVL(0, "bullet", "", 720) + LVL(1, "bullet", "", 1440)], [0, 1]);
  test("indented numbered items", function () {
    function IND(id, n) { return NUM(id, 0) + '<w:ind w:left="' + n + '"/>'; }
    return imp({ numbering: LISTS, body:
      P("N one", NUM(1, 0)) + P("N one sub a", IND(1, 1080)) + P("N one sub b", IND(1, 1080)) + P("N two", NUM(1, 0)) + P("N real sub", NUM(1, 1)) + P("N three", NUM(1, 0)) +
      P("Gap") + P("B one", NUM(2, 0)) + P("B pushed in", IND(2, 1080)) + P("B two", NUM(2, 0))
    }).then(function (r) {
      var b = r.project.blocks;
      eq(brief(b), ["#0:N one", "#0:N one sub a", "#0:N one sub b", "#0:N two", "#1:N real sub", "#0:N three", "p:Gap", "*0:B one", "*1:B pushed in", "*0:B two"],
        "28 a numbered item keeps the level the file gives it whatever its indent; a real sub-level is still one; a bullet pushed in is still a sub-item");
      eq(markers(b.slice(0, 6)), "1. 2. 3. 4. a. 5.", "28 so the numbers are the ones Word printed, and a reference to step 4 still finds step 4");
      ok(!entry(r.report, "list-numbering"), "28 and nothing is reported as renumbered", JSON.stringify(entry(r.report, "list-numbering")));
    });
  });

  // ---- 29. a list of figures is not the contents list ----
  function LISTOF(code, lines, style) {
    return PX(FLD("begin") + INSTR(code) + FLD("separate") + R(lines[0]), S(style)) + lines.slice(1).map(function (l) { return P(l, S(style)); }).join("") + PX(FLD("end"));
  }
  test("list of figures", function () {
    return imp({ body: P("Overview", S("Heading1")) + P("TOF-BEFORE") + P("Table of Figures", S("Heading1")) + LISTOF(' TOC \\h \\z \\c "Figure" ', ["Figure 1: Network overview 4", "Figure 2: Zones 6"], "TOF") + P("TOF-AFTER") })
      .then(function (r) {
        var b = r.project.blocks, e = entry(r.report, "figures-list");
        eq([brief(b), r.project.options.contents], [["h1:Overview", "p:TOF-BEFORE", "p:TOF-AFTER"], false],
          "29 a list of figures is left out with the heading typed above it, the text round it stays, and the template's contents list is not switched on for it");
        eq([e && e.count, e && e.examples, !!entry(r.report, "contents")], [1, ["Figure 1: Network overview 4", "Table of Figures", "Figure 2: Zones 6"], false],
          "29 it is reported as a list of figures, with its lines quoted, and not as the table of contents");
        var s = F.sentence(e);
        ok(r.report.notCarried.indexOf(e) >= 0 && /^A list of figures or tables was not carried over\. The template has none to put in its place\. The captions themselves were kept\.$/.test(s) && !/contents/i.test(s) && plainWords(s) &&
          /^2 lists of figures or tables were not carried over\. The template has none to put in their place\./.test(F.sentence({ code: "figures-list", count: 2 })), "29 the sentence does not promise a contents list in its place", s);
        return imp({ body: P("Contents", S("Heading1")) + LISTOF(' TOC \\o "1-3" \\h \\z \\u ', ["Scope 2", "Findings 5"], "TOC1") + LISTOF(' TOC \\h \\z \\c "Table" ', ["Table 1: Ports 3"], "TOF") + P("Scope", S("Heading1")) + P("Text.") });
      }).then(function (r) {
        var c = entry(r.report, "contents"), f = entry(r.report, "figures-list");
        eq([brief(r.project.blocks), r.project.options.contents], [["h1:Scope", "p:Text."], true], "29 with both, the contents list is switched on for the table of contents");
        eq([c && c.count, c && c.examples, f && f.count, f && f.examples], [1, ["Scope 2", "Contents", "Findings 5"], 1, ["Table 1: Ports 3"]], "29 and each list is reported under its own name with its own lines");
        return imp({ body: P("Scope", S("Heading1")) + LISTOF(' TOC \\o "1-2" \\c "Figure" ', ["Scope 2"], "TOC1") + P("Text.") });
      }).then(function (r) {
        eq([r.project.options.contents, count(r.report, "contents"), count(r.report, "figures-list")], [true, 1, 0], "29 a contents list that also names a caption label is still the contents list");
      });
  });

  // ---- 30, 39. a link on a picture ----
  var PIC_RELS = [["rIdP", "image", "media/image1.png"], ["rIdWeb", "hyperlink", "https://www.example.com/network-diagram?rev=3", true], ["rIdFile", "hyperlink", "file:///C:/plans/site.vsdx", true]];
  test("links on pictures", function () {
    return imp({ rels: PIC_RELS, files: { "word/media/image1.png": PNG }, body:
      PX(PIC("rIdP", { name: "Linked web", click: "rIdWeb" })) + PX(PIC("rIdP", { name: "Linked file", click: "rIdFile" })) + PX(PIC("rIdP", { name: "No link" })) + PX(LINK("rIdWeb", R("a text link")))
    }).then(function (r) {
      var p = r.project, b = p.blocks, e = entry(r.report, "picture-links");
      eq(brief(b), ["kept picture", "picture", "picture", "p:a text link"], "39 a picture that links to a web address travels as it is; one with a link that cannot be carried, or with none, is an ordinary picture");
      eq(b[0].rels.filter(function (x) { return x.external; }).map(function (x) { return [x.type.split("/").pop(), x.external]; }), [["hyperlink", "https://www.example.com/network-diagram?rev=3"]],
        "39 and the kept picture has its link, the exact address");
      eq(e && [e.count, e.blockIds, e.examples], [1, [b[1].id], ["file:///C:/plans/site.vsdx"]], "30 the link that was left off is reported, with its picture and where it pointed");
      ok(e && r.report.notCarried.indexOf(e) >= 0 && F.sentence(e) === "1 picture or drawing had a link on it. It was kept, but without the link." && /^3 pictures or drawings had a link on them\. They were kept, but without the link\.$/.test(F.sentence({ code: "picture-links", count: 3 })),
        "30 in a sentence that reads properly for one and for many", e && F.sentence(e));
      eq([r.report.carried.links, r.report.carried.pictures, r.report.carried.keptObjects], [1, 2, 1], "30 only the text link is counted as a link brought across");
      return exported(p).then(function (x) {
        ok(/<a:hlinkClick /.test(x.doc) && external(x.rels).indexOf("https://www.example.com/network-diagram?rev=3") >= 0 && !/site\.vsdx/.test(x.rels + x.doc),
          "39 the exported Word file still has the picture's link to the web address, and not the file link");
      });
    }).then(function () {
      return imp({ rels: PIC_RELS, files: { "word/media/image1.png": PNG }, body: PX(LINK("rIdWeb", PIC("rIdP", { name: "Wrapped" }))) + PX(FIELD(' HYPERLINK "https://example.org/f" ', PIC("rIdP", { name: "In a field" }))) });
    }).then(function (r) {
      var b = r.project.blocks, e = entry(r.report, "picture-links");
      eq([brief(b), r.report.carried.links], [["picture", "picture"], 0], "30 a link written round a picture alone (as a hyperlink or as a field) is not counted as a link brought across");
      eq(e && [e.count, e.blockIds, e.examples], [2, [b[0].id, b[1].id], ["https://www.example.com/network-diagram?rev=3", "https://example.org/f"]], "39 it is reported, with the picture and the address");
      ok(!/link/.test(F.summary(r.report)) && /2 pictures/.test(F.summary(r.report)), "30 and the summary does not say a link was brought across", F.summary(r.report));
      return imp({ rels: PIC_RELS, files: { "word/media/image1.png": PNG }, body: PX(LINK("rIdWeb", R("Open the diagram ") + PIC("rIdP", { name: "With words" }))) });
    }).then(function (r) {
      var b = r.project.blocks;
      eq([b[0].runs, r.report.carried.links, count(r.report, "picture-links")], [[{ t: "Open the diagram ", link: "https://www.example.com/network-diagram?rev=3" }], 1, 1],
        "30 with words and a picture in one link, the words keep the link and it is counted once; the picture's loss of it is still said");
    });
  });

  // ---- 31. a caption that holds a footnote or a link ----
  test("captions with notes", function () {
    var notes = FOOTNOTES([[3, PX(FNMARK + R(" Source: site survey 2026"))]]);
    return imp({ footnotes: notes, rels: [["rIdP", "image", "media/image1.png"], ["rIdWeb", "hyperlink", "https://example.com/x", true]], files: { "word/media/image1.png": PNG }, body:
      PX(PIC("rIdP", { name: "Net" })) + PX(R("Figure 1: Net") + FNREF(3) + LINK("rIdWeb", R(" source")), S("Caption")) +
      PX(PIC("rIdP", { name: "Zones" })) + P("Figure 2: Zones", S("Caption"))
    }).then(function (r) {
      var p = r.project, b = p.blocks, keys = Object.keys(p.footnotes);
      eq(brief(b), ["picture", "p:Figure 1: Net source", "picture [Figure 2: Zones]"], "31 a caption that holds a footnote or a link stays a paragraph under its picture; a plain caption still becomes the picture's caption");
      eq(b[1].runs, [{ t: "Figure 1: Net" }, { t: "", fn: keys[0] }, { t: " source", link: "https://example.com/x" }], "31 so the footnote reference and the link are both still there");
      eq(p.footnotes[keys[0]].runs, [{ t: "Source: site survey 2026" }], "31 with the note's text");
      eq([r.report.carried.captions, r.report.carried.footnotes, r.report.carried.links, r.report.carried.paragraphs], [1, 1, 1, 1], "31 and the counts say what was brought across");
      return exported(p).then(function (x) { ok(/Source: site survey 2026/.test(x.notes), "31 the exported Word file prints the footnote", x.notes.slice(-300)); });
    }).then(function () {
      // A footnote nothing refers to any more is not counted as brought across.
      return imp({ footnotes: FOOTNOTES([[3, PX(FNMARK + R(" In the title"))], [4, PX(FNMARK + R(" In the text"))]]),
        styles: STYLES([STYLE("Title", "Title")]), body: PX(R("The report") + FNREF(3), S("Title")) + PX(R("Words") + FNREF(4)) });
    }).then(function (r) {
      eq([r.project.info.title, r.report.carried.footnotes], ["The report", 1], "31 footnotes are counted from the text that refers to them");
    });
  });

  // ---- 32. which block a caption belongs to ----
  test("caption targets", function () {
    var base = { rels: [["rIdP", "image", "media/image1.png"]], files: { "word/media/image1.png": PNG } };
    function run(body) { return imp(Object.assign({}, base, { body: body })); }
    var PICTURE = PX(PIC("rIdP", { name: "Shot" }));
    return run(PICTURE + P("Table 1: Open ports by zone", S("Caption")) + TABLE).then(function (r) {
      eq([brief(r.project.blocks), r.report.carried.captions], [["picture", "table [Table 1: Open ports by zone]"], 1], "32 a table's caption written above it goes to the table, not to an uncaptioned picture before it");
      return run(TABLE + P("Table 2: Second", S("Caption")) + TABLE);
    }).then(function (r) {
      eq(brief(r.project.blocks), ["table [Table 2: Second]", "table"], "32 between two tables the label does not decide, and the table before takes it as it always did");
      return run(TABLE + P("Figure 1: Overview", S("Caption")) + PICTURE);
    }).then(function (r) {
      eq(brief(r.project.blocks), ["table", "picture [Figure 1: Overview]"], "32 a figure's caption written above its picture goes to the picture, not to the table before it");
      return run(PICTURE + P("Figure 2: Layout", S("Caption")) + TABLE + P("Gap") + PICTURE + P("Network as surveyed", S("Caption")) + TABLE + P("Gap") + PICTURE + P("Table 9: nothing to hold it", S("Caption")) + P("Gap") + PICTURE + P("Fig. 3 Detail", S("Caption")) + TABLE);
    }).then(function (r) {
      eq([brief(r.project.blocks), r.report.carried.captions], [["picture [Figure 2: Layout]", "table", "p:Gap", "picture [Network as surveyed]", "table", "p:Gap", "picture [Table 9: nothing to hold it]", "p:Gap", "picture [Fig. 3 Detail]", "table"], 4],
        "32 a figure caption under its picture stays there; with no label the block before takes it; a label with nothing of its kind beside it falls back to the block before");
    });
  });

  // ---- 33, 57. a link to a file, and where it was ----
  test("file links point at their paragraph", function () {
    return imp({ rels: [["rIdDoc", "hyperlink", "Other%20report.docx", true], ["rIdFtp", "hyperlink", "ftp://ftp.example.com/a", true]], body:
      P("Intro") + PX(R("See ") + LINK("rIdDoc", R("the other report")) + R(" and ") + LINK("rIdFtp", R("the archive"))) + PX(R("Also ") + '<w:hyperlink w:anchor="_Ref1">' + R("section 2") + '</w:hyperlink>') +
      PX(FIELD(' HYPERLINK "Appendix A.xlsx" ', R("the appendix")))
    }).then(function (r) {
      var b = r.project.blocks, other = entry(r.report, "other-links"), inside = entry(r.report, "internal-links");
      eq(other && [other.count, other.examples, other.blockIds], [3, ["Other%20report.docx", "ftp://ftp.example.com/a", "Appendix A.xlsx"], [b[1].id, b[3].id]], "33 links to another file or address are counted apart, quoted, and point at the paragraphs they were in");
      eq(inside && [inside.count, inside.blockIds], [1, [b[2].id]], "33 a link to a place inside the document points at its paragraph too");
      ok(F.sentence(other).indexOf("inside the document") < 0 && /^1 link to a place inside the document was not carried over/.test(F.sentence(inside)), "57 only the bookmark link is called a link to a place inside the document", F.sentence(other));
      eq(b.map(text), ["Intro", "See the other report and the archive", "Also section 2", "the appendix"], "33 the words of each are kept");
    });
  });

  // ---- 34. a table inside a footnote ----
  test("table in a footnote", function () {
    var notes = FOOTNOTES([[2, PX(FNMARK + R(" See figures:")) + T([TR([TC("CELLTEXT 42 percent"), TC(PX(R("second ") + R("cell", '<w:b/>')))]), TR([TC("row two"), TC(PX(""))])], [2000, 2000]) + P("After the table.")]]);
    return imp({ footnotes: notes, body: PX(R("Claim") + FNREF(2)) }).then(function (r) {
      var p = r.project, fn = p.footnotes[Object.keys(p.footnotes)[0]], e = entry(r.report, "objects-in-notes");
      eq(fn.runs, [{ t: "See figures:\nCELLTEXT 42 percent\nsecond " }, { t: "cell", b: true }, { t: "\nrow two\nAfter the table." }], "34 the words of a table inside a footnote are kept, cell by cell, as lines of the note, in order");
      eq(e && [e.count, e.tables, e.examples], [1, 1, ["See figures: CELLTEXT 42 percent second cell row two After the table."]], "34 the table is still reported as not carried, and the quote holds the words that were in it");
      var s = F.sentence(e);
      ok(/^1 picture, drawing or table inside a footnote or endnote was not carried over\. The note's text was kept\. The words in the table are now lines of the note\.$/.test(s) && plainWords(s), "34 the sentence says where the table's words went", s);
      ok(F.sentence({ code: "objects-in-notes", count: 2 }) === "2 pictures, drawings or tables inside a footnote or endnote were not carried over. The note's text was kept.", "34 a report with no table count reads as it did");
      return exported(p).then(function (x) { ok(/CELLTEXT 42 percent/.test(x.notes), "34 the exported Word file prints them in the footnote"); });
    });
  });

  // ---- every code has its words ----
  test("sentences", function () {
    var all = I.CODES.toCheck.concat(I.CODES.notCarried, I.CODES.changed), bad = [];
    ["fields-no-text", "objects-lost", "notes-missing", "theme-missing", "links-in-drawings", "linked-objects", "figures-list", "picture-links", "other-links"].forEach(function (c) { if (all.indexOf(c) < 0) bad.push(c + " is not listed"); });
    all.forEach(function (code) {
      [1, 3].forEach(function (n) { var s = F.sentence({ code: code, count: n }); if (/Something else/.test(s) || !plainWords(s)) bad.push(code + ": " + s); });
    });
    eq(bad, [], "every report code the reader can give has a plain sentence, for one and for many");
  });

  chain.then(finish);
})();
</script>
