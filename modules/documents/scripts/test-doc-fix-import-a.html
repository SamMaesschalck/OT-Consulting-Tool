<html lang="en"><head><meta charset="utf-8"/><title>Document tool: what an import must not change unseen</title></head>
<body>
<pre id="out">running...</pre>
<!--
  Reading a Word file (review findings 5 to 15, 23, 27 and 51). Nothing from the
  file is dropped or altered without a line in the import report:

    - headings numbered again from 1 while the text still names the old numbers;
    - hidden text, which Word neither shows nor prints;
    - letters typed in a symbol font (an ohm sign stored as "W");
    - a table column that Word numbers by itself;
    - Word's built-in "List Number 2" and "List Bullet 3" styles;
    - a numbered list that resumes after a different numbered list;
    - the heading typed above a contents list, and the page breaks round it;
    - a legacy form check box and drop-down;
    - the prompt of a content control nobody filled in;
    - a link to a file, which is not a link to a place inside the document.

  Every file is built here, shaped the way Word writes it, and read by the real
  reader; the export is the real writer's.
-->
<script src="../js/version.js"></script>
<script src="../js/product.js"></script>
<script src="../js/logo.js"></script>
<script src="../js/hero-asset.js"></script>
<script src="../vendor/docx.umd.js"></script>
<script src="../js/zip-io.js"></script>
<script src="../js/docx-graft.js"></script>
<script src="../js/house-docx.js"></script>
<script src="../js/docx-import.js"></script>
<script src="../data/document.js"></script>
<script src="../js/model.js"></script>
<script src="../js/import-flow.js"></script>
<script>
(function () {
  var lines = [], fail = 0;
  function ok(c, n, d) { lines.push((c ? "PASS " : "FAIL ") + n + (!c && d ? " - " + d : "")); if (!c) fail++; }
  function eq(a, b, n) { var x = JSON.stringify(a), y = JSON.stringify(b); ok(x === y, n, "got " + x + " wanted " + y); }
  function finish() {
    alive = false;
    lines.push("", fail === 0 ? "ALL TESTS PASSED" : fail + " FAILED");
    document.getElementById("out").textContent = lines.join("\n");
  }
  // Unzipping runs off the main thread, and headless Edge's virtual clock runs
  // out the moment the page has nothing queued. A message bounced to ourselves
  // keeps a task queued, without moving the clock, until the tests finish.
  var alive = true, bounce = new MessageChannel();
  bounce.port1.onmessage = function () { if (alive) bounce.port2.postMessage(0); };
  bounce.port2.postMessage(0);

  var A = window.App, I = A.DocxImport, H = A.HouseDocx, Zip = A.ZipIO, M = A.DocModel, F = A.DocImportFlow;
  var W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  var MC = "http://schemas.openxmlformats.org/markup-compatibility/2006";
  var WP = "http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing";
  var REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships/";
  var NS = ' xmlns:w="' + W + '" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:mc="' + MC + '"' +
    ' xmlns:wp="' + WP + '" xmlns:wps="http://schemas.microsoft.com/office/word/2010/wordprocessingShape"' +
    ' xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w14="http://schemas.microsoft.com/office/word/2010/wordml" mc:Ignorable="w14"';
  var HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';

  // ---- WordprocessingML, briefly ----
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function R(text, rPr) { return '<w:r>' + (rPr ? '<w:rPr>' + rPr + '</w:rPr>' : '') + '<w:t xml:space="preserve">' + esc(text) + '</w:t></w:r>'; }
  function PX(inner, pPr) { return '<w:p>' + (pPr ? '<w:pPr>' + pPr + '</w:pPr>' : '') + inner + '</w:p>'; }
  function P(text, pPr, rPr) { return PX(R(text, rPr), pPr); }
  function S(id) { return '<w:pStyle w:val="' + id + '"/>'; }
  function NUM(id, lvl) { return '<w:numPr><w:ilvl w:val="' + (lvl || 0) + '"/><w:numId w:val="' + id + '"/></w:numPr>'; }
  function FONT(name) { return '<w:rFonts w:ascii="' + name + '" w:hAnsi="' + name + '"/>'; }
  function STYLE(id, name, o) {
    o = o || {};
    return '<w:style w:type="' + (o.type || "paragraph") + '"' + (o.dflt ? ' w:default="1"' : '') + ' w:styleId="' + id + '"><w:name w:val="' + name + '"/>' +
      (o.based ? '<w:basedOn w:val="' + o.based + '"/>' : '') + (o.pPr ? '<w:pPr>' + o.pPr + '</w:pPr>' : '') + (o.rPr ? '<w:rPr>' + o.rPr + '</w:rPr>' : '') + '</w:style>';
  }
  function STYLES(list) { return HEAD + '<w:styles' + NS + '>' + STYLE("Normal", "Normal", { dflt: true }) + STYLE("Heading1", "heading 1", { pPr: '<w:outlineLvl w:val="0"/>' }) + (list || []).join("") + '</w:styles>'; }
  function TC(inner) { return '<w:tc>' + (inner.charAt(0) === "<" ? inner : P(inner)) + '</w:tc>'; }
  function TR(cells) { return '<w:tr>' + cells.join("") + '</w:tr>'; }
  function T(rows, grid) { return '<w:tbl><w:tblPr/><w:tblGrid>' + grid.map(function (w) { return '<w:gridCol w:w="' + w + '"/>'; }).join("") + '</w:tblGrid>' + rows.join("") + '</w:tbl>'; }
  function FLD(type, rPr, ff) { return '<w:r>' + (rPr ? '<w:rPr>' + rPr + '</w:rPr>' : '') + '<w:fldChar w:fldCharType="' + type + '"' + (ff ? '>' + ff + '</w:fldChar>' : '/>') + '</w:r>'; }
  function INSTR(code, rPr) { return '<w:r>' + (rPr ? '<w:rPr>' + rPr + '</w:rPr>' : '') + '<w:instrText xml:space="preserve">' + esc(code) + '</w:instrText></w:r>'; }
  function FIELD(code, result, ff) { return FLD("begin", "", ff) + INSTR(code) + FLD("separate") + (result || "") + FLD("end"); }
  var BREAK = PX('<w:r><w:br w:type="page"/></w:r>');
  function LVL(i, fmt, txt, left, pStyle) {
    return '<w:lvl w:ilvl="' + i + '"><w:start w:val="1"/><w:numFmt w:val="' + fmt + '"/>' + (pStyle ? '<w:pStyle w:val="' + pStyle + '"/>' : '') +
      '<w:lvlText w:val="' + txt + '"/><w:pPr><w:ind w:left="' + left + '" w:hanging="360"/></w:pPr></w:lvl>';
  }
  function NUMBERING(abstracts, nums) {
    return HEAD + '<w:numbering' + NS + '>' + abstracts.map(function (a, i) { return '<w:abstractNum w:abstractNumId="' + i + '">' + a + '</w:abstractNum>'; }).join("") +
      nums.map(function (abs, i) { return '<w:num w:numId="' + (i + 1) + '"><w:abstractNumId w:val="' + abs + '"/></w:num>'; }).join("") + '</w:numbering>';
  }
  // A package. o: { body, styles, numbering, rels: [[id, kind, target, external]] }
  function make(o) {
    var CT = "application/vnd.openxmlformats-officedocument.wordprocessingml.";
    var rels = '<Relationship Id="rIdS" Type="' + REL + 'styles" Target="styles.xml"/>', types = '<Override PartName="/word/styles.xml" ContentType="' + CT + 'styles+xml"/>';
    var files = [{ name: "word/styles.xml", bytes: Zip.bytesOf(o.styles || STYLES()) }];
    if (o.numbering) {
      rels += '<Relationship Id="rIdN" Type="' + REL + 'numbering" Target="numbering.xml"/>';
      types += '<Override PartName="/word/numbering.xml" ContentType="' + CT + 'numbering+xml"/>';
      files.push({ name: "word/numbering.xml", bytes: Zip.bytesOf(o.numbering) });
    }
    (o.rels || []).forEach(function (r) { rels += '<Relationship Id="' + r[0] + '" Type="' + REL + r[1] + '" Target="' + esc(r[2]) + '"' + (r[3] ? ' TargetMode="External"' : '') + '/>'; });
    return Zip.write([
      { name: "[Content_Types].xml", bytes: Zip.bytesOf(HEAD + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/word/document.xml" ContentType="' + CT + 'document.main+xml"/>' + types + '</Types>') },
      { name: "_rels/.rels", bytes: Zip.bytesOf(HEAD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="' + REL + 'officeDocument" Target="word/document.xml"/></Relationships>') },
      { name: "word/document.xml", bytes: Zip.bytesOf(HEAD + '<w:document' + NS + '><w:body>' + o.body + '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/></w:sectPr></w:body></w:document>') },
      { name: "word/_rels/document.xml.rels", bytes: Zip.bytesOf(HEAD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + rels + '</Relationships>') }
    ].concat(files));
  }
  function imp(o) { return make(o).then(function (blob) { return I.read(blob, { name: "made.docx" }); }); }

  // ---- reading the result ----
  function text(b) { return b.runs ? b.runs.map(function (r) { return r.t; }).join("") : (b.text || ""); }
  function brief(blocks) {
    return blocks.map(function (b) {
      var tag = b.type === "heading" ? "h" + b.level : b.type === "list" ? (b.list === "bullet" ? "*" : "#") + b.level + (b.restart ? "r" : "") + (b["continue"] ? "c" : "")
        : b.type === "paragraph" ? "p" : b.type;
      return tag + (text(b) ? ":" + text(b) : "");
    });
  }
  function entry(report, code) {
    var found = null;
    ["toCheck", "changed", "notCarried"].forEach(function (l) { report[l].forEach(function (e) { if (e.code === code) found = e; }); });
    return found;
  }
  function count(report, code) { var e = entry(report, code); return e ? e.count : 0; }
  function byText(blocks, t) { for (var i = 0; i < blocks.length; i++) if (text(blocks[i]) === t) return blocks[i]; return null; }
  function markers(blocks) {
    var n = H.listNumbers(blocks), out = [];
    (function walk(list) {
      list.forEach(function (b) {
        if (b.type === "table") b.rows.forEach(function (row) { row.cells.forEach(function (c) { walk(c.blocks); }); });
        if (b.type === "list") out.push(n[b.id].marker);
      });
    })(blocks);
    return out.join(" ");
  }
  function documentXml(blob) {
    return Zip.read(blob).then(function (files) { return Zip.text(files.filter(function (x) { return x.name === "word/document.xml"; })[0]); });
  }
  function exported(project) {
    return H.buildDocument(project, { issueStatus: "draft" }).then(function (res) { return documentXml(res.blob); });
  }
  function plainWords(s) { return !/[\u2013\u2014]/.test(s) && !/\b[A-Z]{4,}\b/.test(s) && !/the tool/i.test(s); }

  var chain = Promise.resolve();
  function test(name, fn) {
    chain = chain.then(fn).then(null, function (e) { ok(false, name + ": it ran", (e && (e.cause ? e.cause.stack || e.cause.message : e.stack || e.message)) || String(e)); });
  }

  // ---- 5. heading numbers ----
  var HEAD_NUM = NUMBERING([LVL(0, "decimal", "%1", 432, "Heading1") + LVL(1, "decimal", "%1.%2", 576, "Heading2")], [0]);
  var HEAD_STYLES = HEAD + '<w:styles' + NS + '>' + STYLE("Normal", "Normal", { dflt: true }) +
    STYLE("Heading1", "heading 1", { pPr: '<w:numPr><w:numId w:val="1"/></w:numPr><w:outlineLvl w:val="0"/>' }) +
    STYLE("Heading2", "heading 2", { pPr: '<w:numPr><w:ilvl w:val="1"/><w:numId w:val="1"/></w:numPr><w:outlineLvl w:val="1"/>' }) + '</w:styles>';
  var OFF = '<w:numPr><w:numId w:val="0"/></w:numPr>';
  test("heading numbers", function () {
    return imp({ styles: HEAD_STYLES, numbering: HEAD_NUM, body:
      P("Executive summary", S("Heading1") + OFF) + P("Summary text.") + P("Introduction", S("Heading1")) + P("Findings", S("Heading1")) + P("Network findings", S("Heading2")) +
      PX(R("The gaps are described in section ") + FIELD(" REF _Ref1 \\n \\h ", R("2.1")) + R(" on page ") + FIELD(" PAGEREF _Ref1 \\h ", R("7")) + R(".")) +
      PX(R("Dated ") + FIELD(' DATE \\@ "d MMM" ', R("1 Jan"))) + P("Glossary", S("Heading1") + OFF)
    }).then(function (r) {
      var b = r.project.blocks, e = entry(r.report, "heading-numbers");
      eq([r.project.options.numberHeadings, brief(b).slice(0, 5)], [true, ["h1:Executive summary", "p:Summary text.", "h1:Introduction", "h1:Findings", "h2:Network findings"]],
        "5 the headings come across as headings and numbering is switched on");
      eq(H.headingNumbers(b)[b[0].id], "1", "5 the heading the original left unnumbered takes number 1 in the template (which is why it must be said)");
      ok(!!e && r.report.changed.indexOf(e) >= 0 && I.CODES.changed.indexOf("heading-numbers") >= 0, "5 the report has a heading-numbers line in the changed list", JSON.stringify(r.report.changed.map(function (x) { return x.code; })));
      eq(e && [e.headings, e.references, e.count], [2, 2, 4], "5 it counts the headings that had no number and the references kept as text (a date field is not one)");
      eq(e && e.blockIds, [b[0].id, byText(b, "Glossary").id, byText(b, "The gaps are described in section 2.1 on page 7.").id],
        "5 it points at the unnumbered headings and at the paragraph that holds the references");
      var s = F.sentence(e);
      ok(/numbered again from 1/.test(s) && /2 headings that had no number in the original now have one/.test(s) && /2 cross-references to a section or a page were kept as the text they showed/.test(s) &&
        /Check every reference to a section or page number/.test(s) && plainWords(s), "5 the sentence says what happened and what to check", s);
      ok(/1 heading that had no number in the original now has one, so the numbers after it have moved/.test(F.sentence({ code: "heading-numbers", count: 1, headings: 1, references: 0 })) &&
        !/cross-reference/.test(F.sentence({ code: "heading-numbers", count: 1, headings: 1, references: 0 })), "5 the sentence reads properly for one heading and no reference");
      return imp({ styles: HEAD_STYLES, numbering: HEAD_NUM, body: P("Introduction", S("Heading1")) + P("Scope", S("Heading2")) + P("Text") });
    }).then(function (r) {
      ok(r.project.options.numberHeadings === true && !entry(r.report, "heading-numbers"), "5 no line when every heading was numbered and nothing refers to one");
      return imp({ body: P("Introduction", S("Heading1")) + PX(R("See ") + FIELD(" REF _Ref1 \\h ", R("Scope"))) });
    }).then(function (r) {
      ok(r.project.options.numberHeadings === false && !entry(r.report, "heading-numbers") && count(r.report, "fields") === 1, "5 no line when the headings are not numbered at all");
    });
  });

  // ---- 6, 23, 51. hidden text ----
  function textBox(inner) {
    var words = '<w:txbxContent>' + inner + '</w:txbxContent>';
    return '<w:r><mc:AlternateContent><mc:Choice Requires="wps"><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="1143000" cy="508000"/><wp:docPr id="1" name="Note box"/><wp:cNvGraphicFramePr/>' +
      '<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.microsoft.com/office/word/2010/wordprocessingShape"><wps:wsp><wps:cNvSpPr txBox="1"/>' +
      '<wps:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="1143000" cy="508000"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></wps:spPr><wps:txbx>' + words + '</wps:txbx><wps:bodyPr/></wps:wsp></a:graphicData></a:graphic>' +
      '</wp:inline></w:drawing></mc:Choice><mc:Fallback><w:pict><v:rect id="box1" style="width:90pt;height:40pt"><v:textbox>' + words + '</v:textbox></v:rect></w:pict></mc:Fallback></mc:AlternateContent></w:r>';
  }
  test("hidden text", function () {
    var V = '<w:vanish/>';
    var styles = STYLES([STYLE("Hid", "Hidden note", { type: "character", rPr: V }), STYLE("HidPara", "Hidden paragraph", { rPr: V })]);
    return imp({ styles: styles, body:
      P("Notes", S("Heading1")) +
      PX(R("Alpha visible. ") + R("SECRETNOTE margin is forty percent. ", V) + R("Omega visible.")) +
      P("WHOLEHIDDEN drafting paragraph.", '<w:rPr><w:vanish/></w:rPr>', V) +
      PX(R("Before ") + R("STYLEHIDDEN words ", '<w:rStyle w:val="Hid"/>') + R("kept anyway", '<w:rStyle w:val="Hid"/><w:vanish w:val="0"/>')) +
      T([TR([TC(PX(R("CELLHIDDEN ", V) + R("cell text"))), TC("other cell")])], [3000, 3000]) +
      P("PARASTYLEHIDDEN line.", S("HidPara")) + PX(R("Shown in a hidden style", '<w:vanish w:val="0"/>'), S("HidPara")) +
      PX(FLD("begin", V) + INSTR(' XE "INDEXMARK" ', V) + FLD("end", V) + R("After the index mark")) +
      PX(R("Page ") + R("12", '<w:webHidden/>')) +
      PX(R("Box follows.") + textBox(PX(R("Box words ") + R("BOXHIDDEN", '<w:rStyle w:val="Hid"/>') + R(" shown", '<w:rStyle w:val="Hid"/><w:vanish w:val="0"/>'))))
    }).then(function (r) {
      var p = r.project, b = p.blocks, e = entry(r.report, "hidden-text");
      var kept = b.filter(function (x) { return x.type === "kept"; })[0], rest = JSON.stringify(b.filter(function (x) { return x.type !== "kept"; }));
      var words = ["SECRETNOTE", "WHOLEHIDDEN", "STYLEHIDDEN", "CELLHIDDEN", "PARASTYLEHIDDEN", "INDEXMARK"];
      eq(words.filter(function (w) { return rest.indexOf(w) >= 0 || JSON.stringify(p.footnotes).indexOf(w) >= 0; }), [], "6 no hidden words in any block or footnote");
      eq(brief(b).filter(function (x) { return x.charAt(0) === "p"; }), ["p:Alpha visible. Omega visible.", "p:Before kept anyway", "p:Shown in a hidden style", "p:After the index mark", "p:Page 12", "p:Box follows."],
        "6 the visible text on each side is kept and joined; a paragraph hidden throughout leaves no block; hidden switched off on a run is kept; web-hidden text is kept");
      eq(brief(b.filter(function (x) { return x.type === "table"; })[0].rows[0].cells[0].blocks), ["p:cell text"], "6 the same in a table cell");
      ok(!!e && r.report.notCarried.indexOf(e) >= 0 && I.CODES.notCarried.indexOf("hidden-text") >= 0, "6 the report has a hidden-text line in the not carried list");
      eq(e && [e.count, e.examples], [5, ["SECRETNOTE margin is forty percent.", "WHOLEHIDDEN drafting paragraph.", "STYLEHIDDEN words", "CELLHIDDEN", "PARASTYLEHIDDEN line."]],
        "6 each hidden run is counted once and quoted, so it can be read and typed in if wanted (an index mark showed nothing and is not counted)");
      ok(e && e.blockIds && e.blockIds.indexOf(byText(b, "Alpha visible. Omega visible.").id) >= 0, "6 it points at the paragraph the hidden text was in", JSON.stringify(e && e.blockIds));
      var s = F.sentence(e);
      ok(/^5 pieces of hidden text were left out\./.test(s) && plainWords(s) && /^1 piece of hidden text was left out\./.test(F.sentence({ code: "hidden-text", count: 1 })), "6 the sentence reads properly for one and for many", s);
      // A kept text box loses its styles, so what a style hid must be hidden on the run itself.
      var box = new DOMParser().parseFromString(kept.xml, "application/xml"), runs = box.getElementsByTagNameNS(W, "r"), seen = {};
      for (var i = 0; i < runs.length; i++) {
        var t = runs[i].getElementsByTagNameNS(W, "t")[0], rPr = runs[i].getElementsByTagNameNS(W, "rPr")[0];
        if (t && rPr) seen[t.textContent.trim()] = rPr.getElementsByTagNameNS(W, "vanish").length;
      }
      eq([seen["BOXHIDDEN"], seen["shown"], seen["Box words"]], [1, 0, 0], "51 in a kept text box, text hidden through a style is still hidden once the style is gone, and nothing else is");
      return exported(p).then(function (xml) {
        var outside = xml.replace(/<w:txbxContent>[\s\S]*?<\/w:txbxContent>/g, "");
        eq(words.filter(function (w) { return outside.indexOf(w) >= 0; }), [], "6 the exported Word file does not print the hidden words");
        ok(/Alpha visible\. Omega visible\./.test(xml), "6 and it does print the visible ones");
      });
    });
  });

  // ---- 7, 27. symbol fonts ----
  test("symbol fonts", function () {
    var SY = FONT("Symbol"), WD = FONT("Wingdings"), W2 = FONT("Wingdings 2");
    var styles = STYLES([STYLE("Greek", "Greek line", { rPr: SY })]);
    function SYM(font, ch) { return '<w:r><w:sym w:font="' + font + '" w:char="' + ch + '"/></w:r>'; }
    return imp({ styles: styles, body:
      PX(R("Resistance is 10 ") + R("W", SY) + R(" and length 5 ") + R("m", SY) + R("m. Done ") + R("\u00FC", WD) + R(" ok.")) +
      PX(R("Patched: ") + R("P", W2) + R(" Tested: ") + R("O", W2) + R(" Private: ") + R("\uF0FC", WD) + R(" Loose: ") + R("\uF057") + R(" Odd: ") + R("b", FONT("Webdings")) + R(" Web: ") + R("a", FONT("Webdings"))) +
      PX(R("Power 10 W, 5 mm, gr\u00FC\u00DF", FONT("Calibri"))) +
      PX(R("Sym: ") + SYM("Symbol", "F06D") + SYM("Wingdings", "00FC") + SYM("Symbol", "006D") + SYM("Wingdings", "F022") + SYM("Client Icons", "F0E0") + SYM("Arial", "00A9")) +
      P("abg 2 W", S("Greek")) +
      PX(R("Mixed: ") + R("a = 5 \u03A9", SY))
    }).then(function (r) {
      var b = r.project.blocks, e = entry(r.report, "symbols");
      eq(text(b[0]), "Resistance is 10 \u03A9 and length 5 \u03BCm. Done \u2713 ok.", "7 a letter typed in Symbol is the Greek letter it showed, and a Wingdings tick is a tick");
      ok(text(b[0]).indexOf("10 W") < 0 && text(b[0]).indexOf("5 mm") < 0 && text(b[0]).indexOf("\u00FC") < 0, "7 the stored letters W, m and u-umlaut are not passed through");
      eq(text(b[1]), "Patched: \u2713 Tested: \u2717 Private: \u2713 Loose: \u25A1 Odd: \u25A1 Web: \u2714",
        "27 Wingdings 2 P and O are a tick and a cross; a private-range character follows its font; one with no symbol font, or with no match, is a box");
      eq(text(b[2]), "Power 10 W, 5 mm, gr\u00FC\u00DF", "7 the same letters in an ordinary font are untouched");
      eq(text(b[3]), "Sym: \u03BC\u2713\u03BC\u25A1\u25A1\u00A9", "27 w:sym goes by its font: Symbol F06D and 006D are both mu, Wingdings 00FC is the tick, an unmatched or unknown symbol is a box, an ordinary one is itself");
      eq(text(b[4]), "\u03B1\u03B2\u03B3 2 \u03A9", "7 a symbol font set by the paragraph style counts too; digits and spaces stay");
      eq(text(b[5]), "Mixed: \u03B1 = 5 \u03A9", "7 a real Greek letter typed in the Symbol font stays as it is");
      eq(e && [e.count, e.blockIds], [4, [b[1].id, b[3].id]], "7 every box is counted under symbols, with the paragraphs to look at");
      eq(b.map(function (x) { return x.runs.length; }), [1, 1, 1, 1, 1, 1], "7 no working keys are left to split the runs");
      ok(JSON.stringify(b).indexOf("sym") < 0, "7 nothing about the font is left on the runs");
    });
  });

  // ---- 8. a column that Word numbers by itself ----
  var LISTS = NUMBERING([LVL(0, "decimal", "%1.", 720) + LVL(1, "lowerLetter", "%2.", 1440), LVL(0, "bullet", "", 720)], [0, 1, 0, 0]);
  test("numbered cells", function () {
    function NO(id) { return TC(PX("", NUM(id || 1, 0))); }
    return imp({ numbering: LISTS, body:
      T([TR([TC("No."), TC("Requirement")]), TR([NO(), TC("Fit the lock")]), TR([NO(), TC("Label the port")]), TR([NO(), TC("Record it")]), TR([NO(2), TC(PX("", ""))])], [1000, 5000]) +
      PX("", NUM(1, 0)) + P("After")
    }).then(function (r) {
      var p = r.project, t = p.blocks[0], col = t.rows.slice(1, 4).map(function (row) { return row.cells[0].blocks; });
      eq(col.map(function (c) { return c.map(function (x) { return [x.type, x.list, x.level, x.runs]; }); }), [[["list", "number", 0, []]], [["list", "number", 0, []]], [["list", "number", 0, []]]],
        "8 an empty numbered paragraph in a cell is kept as a list item with no words");
      eq(col.map(function (c) { return !!c[0]["continue"]; }), [false, true, true], "8 the second and third carry on the first");
      eq(markers(p.blocks), "1. 2. 3. \u2022", "8 so the column counts 1, 2, 3 (and an empty bulleted cell shows its bullet)");
      eq(brief(t.rows[4].cells[1].blocks), ["p"], "8 an empty cell with no numbering is an empty cell");
      eq(brief(p.blocks.slice(1)), ["p:After"], "8 an empty numbered paragraph in the body still makes no block");
      eq(r.report.carried.listItems, 0, "8 they are not counted as list items of the body");
      var n = M.normalise(JSON.parse(JSON.stringify({ schema: p.schema, id: p.id, kind: p.kind, info: p.info, options: p.options, nextId: p.nextId, blocks: p.blocks, footnotes: {}, media: {}, parts: {} })));
      eq(n.blocks[0].rows[2].cells[0].blocks.map(function (x) { return [x.type, x.list, !!x["continue"]]; }), [["list", "number", true]], "8 the saved document keeps the item when it is loaded again");
      return exported(p).then(function (xml) {
        var dom = new DOMParser().parseFromString(xml, "application/xml"), tbls = dom.getElementsByTagNameNS(W, "tbl"), tbl = null;
        for (var i = 0; i < tbls.length; i++) if (tbls[i].textContent.indexOf("Fit the lock") >= 0) tbl = tbls[i];
        var rows = tbl.getElementsByTagNameNS(W, "tr"), ids = [];
        for (var k = 1; k < 4; k++) {
          var id = rows[k].getElementsByTagNameNS(W, "tc")[0].getElementsByTagNameNS(W, "numId")[0];
          ids.push(id ? id.getAttributeNS(W, "val") : null);
        }
        ok(ids[0] != null && ids[0] === ids[1] && ids[1] === ids[2], "8 in the exported Word file each of the three cells is numbered, on one list", JSON.stringify(ids));
      });
    });
  });

  // ---- 9. Word's built-in styles for the deeper levels of a list ----
  // As Word writes them: each style is a list of its own at level 0, with its own indent.
  var FAMILY_NUM = NUMBERING([LVL(0, "bullet", "", 360, "ListBullet"), LVL(0, "bullet", "", 643, "ListBullet2"), LVL(0, "bullet", "", 926, "ListBullet3"),
    LVL(0, "decimal", "%1.", 360, "ListNumber"), LVL(0, "decimal", "%1.", 643, "ListNumber2"), LVL(0, "bullet", "", 1492, "ListBullet5")], [0, 1, 2, 3, 4, 5]);
  function LS(id, name, num) { return STYLE(id, name, { pPr: '<w:numPr><w:numId w:val="' + num + '"/></w:numPr>' }); }
  var FAMILY_STYLES = STYLES([LS("ListBullet", "List Bullet", 1), LS("ListBullet2", "List Bullet 2", 2), LS("ListBullet3", "List Bullet 3", 3), LS("ListNumber", "List Number", 4),
    LS("ListNumber2", "List Number 2", 5), LS("ListBullet5", "List Bullet 5", 6), STYLE("ListContinue", "List Continue", { pPr: '<w:ind w:left="283"/>' }),
    LS("Aufzhlung2", "List Bullet 2", 2)]);
  test("built-in list styles", function () {
    return imp({ styles: FAMILY_STYLES, numbering: FAMILY_NUM, body:
      P("Bullet one", S("ListBullet")) + P("Bullet two", S("ListBullet")) + P("Bullet sub", S("ListBullet2")) + P("Bullet sub sub", S("ListBullet3")) + P("Bullet five", S("ListBullet5")) + P("Localised sub", S("Aufzhlung2")) +
      P("Gap") +
      P("Number one", S("ListNumber")) + P("Number two", S("ListNumber")) + P("Sub one", S("ListNumber2")) + P("Sub two", S("ListNumber2")) + P("Number three", S("ListNumber")) + P("Number four", S("ListNumber"))
    }).then(function (r) {
      var b = r.project.blocks;
      eq(brief(b), ["*0:Bullet one", "*0:Bullet two", "*1:Bullet sub", "*2:Bullet sub sub", "*2:Bullet five", "*1:Localised sub", "p:Gap",
        "#0:Number one", "#0:Number two", "#1:Sub one", "#1:Sub two", "#0:Number three", "#0:Number four"],
        "9 List Bullet 2 and 3 and List Number 2 are one and two levels down, by style id or by name, and the list that resumes is not started again");
      eq(markers(b.slice(7)), "1. 2. a. b. 3. 4.", "9 the numbers run 1, 2, then the sub items, then 3, 4 as in Word");
      var deep = entry(r.report, "lists-deeper"), ln = entry(r.report, "list-numbering");
      eq(deep && deep.blockIds, [byText(b, "Bullet five").id], "9 a level past the third is brought up and reported");
      eq(ln && ln.blockIds, [byText(b, "Sub one").id, byText(b, "Sub two").id], "9 the sub items, which Word numbered 1, 2 and the template letters, are reported");
      return imp({ styles: FAMILY_STYLES, numbering: FAMILY_NUM, body:
        P("Number one", S("ListNumber")) + P("Number two", S("ListNumber")) + P("Sub one", S("ListNumber2")) + P("More about the sub item", S("ListContinue")) + P("Number three", S("ListNumber")) +
        P("Gap") + P("Direct on the same list", NUM(4, 0)) });
    }).then(function (r) {
      var b = r.project.blocks;
      eq(brief(b), ["#0:Number one", "#0:Number two", "#1:Sub one", "p:More about the sub item", "#0c:Number three", "p:Gap", "#0c:Direct on the same list"],
        "9 after a List Continue paragraph the parent list carries on, and so does an item numbered directly on the list the plain style uses");
      eq(markers(b), "1. 2. a. 3. 4.", "9 so it is 3, not 2 after the sub list's 1");
    });
  });

  // ---- 10. a list that resumes after a different numbered list ----
  test("resumed lists", function () {
    return imp({ numbering: LISTS, body:
      P("Open the panel", NUM(1, 0)) + P("Check the switch", NUM(1, 0)) + P("A note.") +
      P("B one", NUM(3, 0)) + P("B two", NUM(3, 0)) + P("B three", NUM(3, 0)) + P("B four", NUM(3, 0)) + P("Another note.") +
      P("Sign the log", NUM(1, 0)) + P("Close the panel", NUM(1, 0))
    }).then(function (r) {
      var b = r.project.blocks, sign = byText(b, "Sign the log"), n = H.listNumbers(b), ln = entry(r.report, "list-numbering");
      ok(n[sign.id].marker !== "5." && !sign["continue"], "10 a list that resumes after a different list does not take that list's count", n[sign.id].marker);
      eq([n[sign.id].marker, ln && ln.blockIds], ["1.", [sign.id]], "10 it starts at 1 and is reported with its block, the one item whose number changed");
      ok(/may not show the number the original showed/.test(F.sentence(ln)), "10 the line says the number may differ");
      return imp({ numbering: LISTS, body:
        P("Open the panel", NUM(1, 0)) + P("Check the switch", NUM(1, 0)) + T([TR([TC(P("In a cell", NUM(3, 0))), TC("x")])], [3000, 3000]) + P("Sign the log", NUM(1, 0)) });
    }).then(function (r) {
      var b = r.project.blocks, sign = byText(b, "Sign the log"), ln = entry(r.report, "list-numbering");
      eq([H.listNumbers(b)[sign.id].marker, !!sign["continue"], ln && ln.blockIds], ["1.", false, [sign.id]], "10 the same when the other list sat in a table cell");
      return imp({ numbering: LISTS, body: P("One", NUM(1, 0)) + P("Two", NUM(1, 0)) + P("A note.") + P("Three", NUM(1, 0)) + P("A note.") + P("B one", NUM(3, 0)) + P("B two", NUM(3, 0)) });
    }).then(function (r) {
      var b = r.project.blocks;
      eq([brief(b)[3], markers(b), !!entry(r.report, "list-numbering")], ["#0c:Three", "1. 2. 3. 1. 2.", false], "10 a list that resumes with only text between still carries on, and nothing is reported");
      return imp({ numbering: LISTS, body: P("A one", NUM(1, 0)) + P("A two", NUM(1, 0)) + P("B one", NUM(3, 0)) + P("A three", NUM(1, 0)) });
    }).then(function (r) {
      var b = r.project.blocks, ln = entry(r.report, "list-numbering");
      eq([brief(b), ln && ln.blockIds], [["#0:A one", "#0:A two", "#0r:B one", "#0r:A three"], [byText(b, "A three").id]],
        "10 with no text between, the list that comes back starts again too, and is reported; the new list that broke in is not");
    });
  });

  // ---- 11. the heading typed above a contents list ----
  var TOC_STYLES = STYLES([STYLE("TOCHeading", "TOC Heading", { based: "Heading1", pPr: '<w:outlineLvl w:val="9"/>' }), STYLE("TOC1", "toc 1"),
    STYLE("Unnumbered", "Heading no number", { based: "Heading1", pPr: '<w:outlineLvl w:val="9"/>' })]);
  function TOC(lines) {
    return PX(FLD("begin") + INSTR(' TOC \\o "1-3" \\h ') + FLD("separate") + R(lines[0]), S("TOC1")) +
      lines.slice(1).map(function (l) { return P(l, S("TOC1")); }).join("") + PX(FLD("end"));
  }
  test("contents heading", function () {
    return imp({ styles: TOC_STYLES, body:
      P("Prepared for ACME Water") + BREAK + P("Contents", S("TOCHeading")) + TOC(["Executive summary 3", "Findings 4"]) + BREAK +
      P("Executive summary", S("Heading1")) + P("Text.") + BREAK + P("Findings", S("Heading1")) + P("Left unnumbered", S("Unnumbered"))
    }).then(function (r) {
      var b = r.project.blocks, c = entry(r.report, "contents");
      eq(brief(b), ["p:Prepared for ACME Water", "pageBreak", "h1:Executive summary", "p:Text.", "pageBreak", "h1:Findings", "h1:Left unnumbered"],
        "11 the heading in Word's TOC Heading style goes with the contents list; the first heading is the first real one; no two page breaks are left side by side; a real page break stays; another style at outline level 9 is still a heading");
      eq([c && c.count, c && c.examples, r.project.options.contents], [1, ["Contents", "Executive summary 3", "Findings 4"], true], "11 the heading's word is quoted with the contents lines, and the template's own contents list is switched on");
      eq(entry(r.report, "front-matter").blockIds, [b[0].id, b[1].id], "11 the front matter line lists what is really before the first heading");
      return exported(r.project).then(function (xml) {
        ok(!/>Contents<\/w:t>[\s\S]*>Contents<\/w:t>/.test(xml.replace(/<w:hdr[\s\S]*$/, "")) || xml.split(">Contents</w:t>").length === 2, "11 the exported Word file has one Contents heading, the template's own", String(xml.split(">Contents</w:t>").length - 1));
      });
    }).then(function () {
      // An older template: the heading is a plain Heading 1 that only says "Contents".
      return imp({ styles: TOC_STYLES, body: P("Cover words") + P("Table of Contents", S("Heading1")) + TOC(["Scope 2"]) + P("Scope", S("Heading1")) + P("Contents of the pack", S("Heading1")) + P("Text.") + P("Contents", S("Heading1")) + P("A section really called Contents.") });
    }).then(function (r) {
      var b = r.project.blocks, c = entry(r.report, "contents");
      eq(brief(b), ["p:Cover words", "h1:Scope", "h1:Contents of the pack", "p:Text.", "h1:Contents", "p:A section really called Contents."],
        "11 a Heading 1 that only says Contents, directly above the list, goes too; a heading that says more, or has no list under it, stays");
      ok(c && c.examples.indexOf("Table of Contents") >= 0, "11 and it is quoted in the report", JSON.stringify(c));
    });
  });

  // ---- 12. the page break after the original's cover and contents ----
  test("leading page break", function () {
    var COVER = '<w:sdt><w:sdtPr><w:docPartObj><w:docPartGallery w:val="Cover Pages"/><w:docPartUnique/></w:docPartObj></w:sdtPr><w:sdtContent>' + P("ACME Water") + P("Network review") + '</w:sdtContent></w:sdt>';
    var CONTENTS = '<w:sdt><w:sdtPr><w:docPartObj><w:docPartGallery w:val="Table of Contents"/><w:docPartUnique/></w:docPartObj></w:sdtPr><w:sdtContent>' + P("Contents", S("TOCHeading")) + TOC(["Executive summary 3"]) + '</w:sdtContent></w:sdt>';
    return imp({ styles: TOC_STYLES, body: COVER + CONTENTS + BREAK + P("Executive summary", S("Heading1")) + P("Text.") + BREAK + P("More text.") }).then(function (r) {
      var b = r.project.blocks;
      eq(brief(b), ["h1:Executive summary", "p:Text.", "pageBreak", "p:More text."], "12 the page break that followed the original's cover and contents is not carried; the document starts at its first heading; a later break stays");
      eq([r.project.options.contents, !!entry(r.report, "front-matter"), count(r.report, "cover-page"), count(r.report, "contents")], [true, false, 1, 1],
        "12 nothing is listed as front matter, and the cover and contents are still reported");
      return imp({ styles: TOC_STYLES, body: BREAK + BREAK + P("Straight in") + P("A heading", S("Heading1")) });
    }).then(function (r) {
      eq(brief(r.project.blocks), ["p:Straight in", "h1:A heading"], "12 page breaks that open a document are never carried: the template's front pages end on a new page themselves");
      return imp({ styles: TOC_STYLES, body: P("Kept cover line") + BREAK + CONTENTS + BREAK + P("First", S("Heading1")) });
    }).then(function (r) {
      eq(brief(r.project.blocks), ["p:Kept cover line", "pageBreak", "h1:First"], "12 a break on each side of a contents list that was left out becomes one break");
      return imp({ styles: TOC_STYLES, body: P("One") + BREAK + BREAK + P("Two") });
    }).then(function (r) {
      eq(brief(r.project.blocks), ["p:One", "pageBreak", "pageBreak", "p:Two"], "12 two breaks the author really put side by side are left alone");
    });
  });

  // ---- 13. legacy form fields ----
  test("form fields", function () {
    function BOX(inner) { return '<w:ffData><w:name w:val="Check1"/><w:enabled/><w:checkBox><w:sizeAuto/>' + inner + '</w:checkBox></w:ffData>'; }
    function DROP(inner) { return '<w:ffData><w:name w:val="Drop1"/><w:enabled/><w:ddList>' + inner + '</w:ddList></w:ffData>'; }
    var ENTRIES = '<w:listEntry w:val="Low"/><w:listEntry w:val="Medium"/><w:listEntry w:val="High"/>';
    return imp({ styles: TOC_STYLES, body:
      PX(R("Tick: ") + FIELD(" FORMCHECKBOX ", "", BOX('<w:default w:val="0"/><w:checked/>'))) +
      PX(R("Empty: ") + FIELD(" FORMCHECKBOX ", "", BOX('<w:default w:val="0"/>'))) +
      PX(R("By default: ") + FIELD(" FORMCHECKBOX ", "", BOX('<w:default w:val="1"/>')) + R(" and unticked: ") + FIELD(" FORMCHECKBOX ", "", BOX('<w:default w:val="1"/><w:checked w:val="0"/>'))) +
      PX(R("Risk: ") + FIELD(" FORMDROPDOWN ", "", DROP('<w:result w:val="1"/>' + ENTRIES)) + R(" first: ") + FIELD(" FORMDROPDOWN ", "", DROP(ENTRIES))) +
      PX(R("Nothing to choose: ") + FIELD(" FORMDROPDOWN ", "", DROP("")) + R(".")) +
      PX(R("Typed: ") + FIELD(" FORMTEXT ", R("typed in a form field"), '<w:ffData><w:name w:val="Text1"/><w:enabled/><w:textInput/></w:ffData>')) +
      PX(R("No result part: ") + FLD("begin", "", BOX('<w:checked/>')) + INSTR(" FORMCHECKBOX ") + FLD("end")) +
      PX(FLD("begin") + INSTR(' TOC \\o "1-3" ') + FLD("separate") + R("Scope 2 ") + FIELD(" FORMCHECKBOX ", "", BOX('<w:checked/>')) + FLD("end")) +
      P("After")
    }).then(function (r) {
      var b = r.project.blocks;
      eq(b.map(text), ["Tick: \u2612", "Empty: \u2610", "By default: \u2612 and unticked: \u2610", "Risk: Medium first: Low", "Nothing to choose: .", "Typed: typed in a form field", "No result part: \u2612", "After"],
        "13 a legacy check box is the ballot box it showed, ticked or not; a drop-down is the entry chosen; a text field keeps its text; nothing comes out of a contents list that is left out");
      ok(b.slice(0, 4).every(function (x) { return !/:\s*$/.test(text(x)); }), "13 no paragraph ends at its colon");
      eq([count(r.report, "controls"), count(r.report, "fields")], [1, 7], "13 a drop-down with nothing to show is listed as a control not carried, not as a field kept as its text");
    });
  });

  // ---- 14. the prompt of a content control nobody filled in ----
  test("placeholder prompts", function () {
    var styles = STYLES([STYLE("PlaceholderText", "Placeholder Text", { type: "character", rPr: '<w:color w:val="666666"/>' }), STYLE("Hint", "Client hint", { type: "character", based: "PlaceholderText" }),
      STYLE("Plain", "Plain character", { type: "character", rPr: '<w:color w:val="666666"/>' })]);
    function SDT(prompt, inner) { return '<w:sdt><w:sdtPr>' + (prompt ? '<w:showingPlcHdr/>' : '') + '<w:text/></w:sdtPr><w:sdtContent>' + inner + '</w:sdtContent></w:sdt>'; }
    var PH = '<w:rStyle w:val="PlaceholderText"/>';
    return imp({ styles: styles, body:
      P("Form", S("Heading1")) +
      PX(R("Empty control: ") + SDT(true, R("Click or tap here to enter text.", PH)) + R(" (end)")) +
      PX(R("Filled control: ") + SDT(false, R("Site A"))) +
      PX(R("Renamed style: ") + SDT(true, R("Choose an item.", '<w:rStyle w:val="Plain"/>'))) +
      PX(R("Style alone: ") + R("Enter a date.", '<w:rStyle w:val="Hint"/>')) +
      SDT(true, P("Click or tap here to enter the scope.")) +
      P("Ordinary grey", "", '<w:rStyle w:val="Plain"/>')
    }).then(function (r) {
      var b = r.project.blocks;
      eq(b[1].runs, [{ t: "Empty control: " }, { t: "Click or tap here to enter text.", red: true }, { t: " (end)" }], "14 the prompt of an unfilled content control is red text; the words round it are not");
      eq(b[2].runs, [{ t: "Filled control: Site A" }], "14 a filled control is ordinary text");
      eq([b[3].runs[1], b[4].runs[1]], [{ t: "Choose an item.", red: true }, { t: "Enter a date.", red: true }], "14 the control's own flag is enough when the style has another name, and the style (or one based on it) is enough without the control");
      eq([b[5].type, b[5].runs, b[6].runs], ["paragraph", [{ t: "Click or tap here to enter the scope.", red: true }], [{ t: "Ordinary grey" }]], "14 a whole paragraph in an unfilled control is red too; grey text that is not a prompt is not");
      var doc = M.normalise(JSON.parse(JSON.stringify({ schema: r.project.schema, id: r.project.id, kind: "report", info: Object.assign({}, r.project.info, { title: "T" }), options: r.project.options, nextId: r.project.nextId, blocks: b, footnotes: {}, media: {}, parts: {} })));
      eq(M.promptCount(doc), 4, "14 the Issue check counts each of them, so a Final is refused while one remains");
    });
  });

  // ---- 15. a link to a file is not a link to a place inside the document ----
  test("links to files", function () {
    return imp({ rels: [["rIdU", "hyperlink", "\\\\server\\share\\Design.docx", true], ["rIdF", "hyperlink", "file:///C:/docs/plan.docx", true], ["rIdJ", "hyperlink", "javascript:alert(1)", true],
      ["rIdW", "hyperlink", "https://example.com/", true]], body:
      PX(R("See ") + '<w:hyperlink r:id="rIdU">' + R("the design document") + '</w:hyperlink>' + R(", ") + '<w:hyperlink r:id="rIdF">' + R("the plan") + '</w:hyperlink>' + R(", ") +
        '<w:hyperlink r:id="rIdJ">' + R("a script") + '</w:hyperlink>' + R(", ") + '<w:hyperlink w:anchor="_Toc1">' + R("section 2") + '</w:hyperlink>' + R(" and ") + '<w:hyperlink r:id="rIdW">' + R("the site") + '</w:hyperlink>') +
      PX(FIELD(' HYPERLINK "C:\\\\docs\\\\register.xlsx" ', R("the register")) + R(" then ") + FIELD(' HYPERLINK \\l "bookmark1" ', R("the annex")))
    }).then(function (r) {
      var b = r.project.blocks, other = entry(r.report, "other-links"), inside = entry(r.report, "internal-links");
      eq(b[0].runs, [{ t: "See the design document, the plan, a script, section 2 and " }, { t: "the site", link: "https://example.com/" }], "15 the words of every link are kept; only a web or email link is carried as a link");
      eq([count(r.report, "internal-links"), count(r.report, "other-links"), r.report.carried.links], [2, 4, 1], "15 links to a bookmark are counted apart from links to a file, a share or another address");
      ok(other && r.report.notCarried.indexOf(other) >= 0 && I.CODES.notCarried.indexOf("other-links") >= 0 && other.examples.indexOf("\\\\server\\share\\Design.docx") >= 0, "15 the report quotes where the file links pointed", JSON.stringify(other));
      var s = F.sentence(other);
      ok(/^4 links to a file or to another address that is not a web or email address were not carried over\. The text of each was kept\.$/.test(s) && s.indexOf("inside the document") < 0 && plainWords(s), "15 the sentence for a file link does not call it a place inside the document", s);
      ok(/^2 links to a place inside the document were not carried over/.test(F.sentence(inside)) && /^1 link to a file .* was not carried over/.test(F.sentence({ code: "other-links", count: 1 })), "15 the bookmark sentence is unchanged, and the new one reads properly for one");
    });
  });

  chain.then(finish);
})();
</script>
