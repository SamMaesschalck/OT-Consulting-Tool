<html lang="en"><head><meta charset="utf-8"/><title>Document tool: the shell</title></head>
<body>
<pre id="out">running...</pre>
<!--
  The tool's shell from file://, in a frame, used as a person would use it: New,
  Load, Save and Save as, the question about unsaved changes, which file Save
  writes to after each way a document can arrive (above all that an import
  never writes over the Word file), another tool's file refused by name,
  autosave and restoring it with every picture, a copy whose pictures are gone,
  autosave switched off, drag and drop, the sidebar and its outline, the suite
  bridge against a fake suite, and the tour. The pages, the editor, the history
  and the Word import are other files' work: here they are replaced by small
  stand-ins that record what the shell asked of them, so this page tests the
  shell alone. IndexedDB never answers in headless Edge, so the store behind
  autosave is an object in this page, kept across reloads of the frame.
  Needs --allow-file-access-from-files (tools/run-tests.ps1 passes it).
-->
<iframe id="f" style="width:1280px;height:800px;border:0"></iframe>
<script>
(function () {
  var lines = [], fail = 0;
  // Written out as it goes: a step that never comes back then shows as the
  // last line reached, with no "ALL TESTS PASSED" after it.
  function ok(c, n, d) {
    lines.push((c ? "PASS " : "FAIL ") + n + (!c && d ? " - " + d : "")); if (!c) fail++;
    document.getElementById("out").textContent = lines.join("\n") + "\n\nincomplete";
  }
  // Virtual time jumps to its end as soon as no timer is waiting, and reading
  // a Blob is real work no timer stands for: one is kept waiting throughout.
  var beat = setInterval(function () {}, 20);
  function finish() {
    clearInterval(beat);
    lines.push("", fail === 0 ? "ALL TESTS PASSED" : fail + " FAILED");
    document.getElementById("out").textContent = lines.join("\n");
  }
  window.addEventListener("error", function (e) { ok(false, "the page ran without a script error", e.message + " (line " + e.lineno + ")"); finish(); });
  function poll(test, ms) {
    var end = Date.now() + (ms || 30000);
    return new Promise(function (resolve, reject) {
      (function go() {
        var v; try { v = test(); } catch (e) { v = null; }
        if (v) return resolve(v);
        if (Date.now() > end) return reject(new Error("timed out: " + test.toString().slice(0, 160)));
        setTimeout(go, 20);
      })();
    });
  }
  function later(ms) { return new Promise(function (res) { setTimeout(res, ms || 60); }); }
  function J(v) { return JSON.stringify(v); }
  function bytes(n, seed) { var b = new Uint8Array(n); for (var i = 0; i < n; i++) b[i] = (i * 31 + (seed || 7)) & 255; return b; }
  function same(a, b) { if (a.length !== b.length) return false; for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; }

  var POINTERS = "spt-document:autosave:v1";
  // The store behind autosave, in this page, so it outlives a reload of the frame.
  var mem = { docs: {}, blobs: {}, puts: 0 };
  function memStore() {
    return {
      putDoc: function (id, json) { mem.docs[id] = json; mem.puts++; return Promise.resolve(); },
      getDoc: function (id) { return Promise.resolve(mem.docs[id] || null); },
      // Kept as a Blob of THIS page: one that belongs to the frame stops
      // answering when the frame is reloaded, which a real store's would not.
      putBlob: function (id, key, blob) { (mem.blobs[id] = mem.blobs[id] || {})[key] = new Blob([blob], { type: blob.type }); return Promise.resolve(); },
      getBlobs: function (id) { return Promise.resolve(mem.blobs[id] || {}); },
      remove: function (id) { delete mem.docs[id]; delete mem.blobs[id]; return Promise.resolve(); },
      ok: function () { return Promise.resolve(true); }
    };
  }

  var errors = [], spy, pick, downloads, W, A, D, S, M;
  // A file handle as the browser gives one, recording what is written to it.
  function fakeHandle(name, text) {
    var st = { text: text == null ? null : text, writes: 0, opened: 0 };
    return { kind: "file", name: name, store: st,
      queryPermission: function () { return Promise.resolve("granted"); },
      requestPermission: function () { return Promise.resolve("granted"); },
      createWritable: function () {
        st.opened++;
        return Promise.resolve({
          write: function (b) { return Promise.resolve(typeof b === "string" ? b : b.text()).then(function (t) { st.text = t; st.writes++; }); },
          close: function () { return Promise.resolve(); }
        });
      },
      getFile: function () { return Promise.resolve(new W.File([st.text == null ? "{}" : st.text], name, { type: "application/json" })); } };
  }
  // The stand-ins. Each page draws a heading, so the shell's own fallback is
  // not what is being looked at; Document information also draws one field.
  function standIns() {
    spy = { mount: [], unmount: 0, focus: [], select: [], redraw: [], record: [], clear: 0, pages: [], imports: [] };
    A.DocEditor.mount = function (el) { spy.mount.push(el); };
    A.DocEditor.unmount = function () { spy.unmount++; };
    A.DocEditor.focusBlock = function (id, o) { spy.focus.push(id); };
    A.DocEditor.selectBlocks = function (ids) { spy.select.push(ids); };
    A.DocEditor.redraw = function (ids) { spy.redraw.push(ids); };
    A.DocHistory.record = function (e) { spy.record.push(e); };
    A.DocHistory.clear = function () { spy.clear++; };
    ["info", "preview", "issue", "report", "about", "welcome"].forEach(function (p) {
      A.DocPages[p] = function (main, arg) {
        spy.pages.push(p);
        main.appendChild(D.h("h1", { class: "page-title", tabindex: "-1", text: "Stand-in " + p }));
        if (p === "info") main.appendChild(D.h("input", { type: "text", "data-field": "title" }));
      };
    });
  }
  function boot(frame, q) {
    return new Promise(function (res) {
      frame.onload = function () {
        var w = frame.contentWindow;
        w.confirm = function () { return true; }; w.alert = function () {};
        w.addEventListener("error", function (e) { errors.push(e.message); });
        w.addEventListener("unhandledrejection", function (e) { errors.push("rejection: " + ((e.reason && e.reason.message) || e.reason)); });
        poll(function () { return w.DocumentTool; }).then(function () {
          W = w; A = w.App; D = A.DocApp; S = A.DocStorage; M = A.DocModel;
          S.bytesStore = memStore();
          downloads = [];
          S.download = function (blob, name) { downloads.push({ blob: blob, name: name }); };
          // The file dialogs cannot be shown headless: these answer for them.
          pick = { save: [], open: [], nextSave: null, nextOpen: null };
          w.showSaveFilePicker = function (o) {
            pick.save.push(o);
            if (!pick.nextSave) { var e = new Error("closed"); e.name = "AbortError"; return Promise.reject(e); }
            var hd = pick.nextSave; pick.nextSave = null;
            return Promise.resolve(hd);
          };
          w.showOpenFilePicker = function (o) {
            pick.open.push(o);
            if (!pick.nextOpen) { var e = new Error("closed"); e.name = "AbortError"; return Promise.reject(e); }
            var hd = pick.nextOpen; pick.nextOpen = null;
            return Promise.resolve([hd]);
          };
          standIns();
          res(w);
        });
      };
      frame.src = "../index.html" + (q || "");
    });
  }
  function $(id) { return W.document.getElementById(id); }
  function q(sel) { return W.document.querySelector(sel); }
  function toastText() { return $("toast").textContent; }
  function navPages() { return Array.prototype.map.call(W.document.querySelectorAll("#nav .nav-item"), function (n) { return n.getAttribute("data-page"); }).join(" "); }
  function modalBtn(act) { return q('.doc-modal [data-act="' + act + '"]'); }
  function key(el, k, o) {
    var e = new W.KeyboardEvent("keydown", Object.assign({ key: k, bubbles: true, cancelable: true }, o || {}));
    el.dispatchEvent(e);
    return e;
  }
  function pointers() { try { return JSON.parse(W.localStorage.getItem(POINTERS) || "{}"); } catch (e) { return {}; } }
  // A project file's text, made by the model itself.
  function fileText(build) {
    var d = M.create();
    d.info.title = "Loaded document";
    if (build) build(d);
    return M.toFile(d).then(function (b) { return b.text(); }).then(function (t) { return { id: d.id, text: t, doc: d }; });
  }
  function chooseWithInput(file) {
    var dt = new W.DataTransfer();
    dt.items.add(file);
    $("file-input").files = dt.files;
    $("file-input").dispatchEvent(new W.Event("change", { bubbles: true }));
  }
  function unloadAsks() {
    var e = new W.Event("beforeunload", { cancelable: true });
    W.dispatchEvent(e);
    return e.defaultPrevented;
  }

  var frame = document.getElementById("f");
  var hA, hB, hDocx, savedText, docId, pngBytes = bytes(300, 1), bigBytes = bytes(200000, 5), kPng, kBig;

  boot(frame).then(function () {
    W.localStorage.removeItem(POINTERS);

    // ---------- starting, and the page-level helpers ----------
    ok(D.state.doc === null && D.state.page === "welcome" && navPages() === "welcome about", "it starts with no document, on the start page", navPages());
    ok($("btn-save").disabled && $("btn-save").textContent === "Save" && $("save-state").textContent === "", "Save is off until there is a document");
    ok($("version-badge").textContent === A.Version.label && /OT Cyber Document Tool/.test(q(".sidebar-legal").textContent), "the version is in the header and the sidebar");
    ok($("main").firstChild !== null && !$("main").classList.contains("hidden") && $("edit-view").classList.contains("hidden"), "the start page is drawn in the main view, and the editor's view is hidden");
    var el = D.h("div", { class: "x", text: "<b>not bold</b>", "data-k": "v", hidden: false, onClick: function () { el.clicked = true; } }, ["<i>text</i>", D.h("span", { text: "kid" }), null]);
    el.click();
    ok(el.querySelector("b") === null && el.querySelector("i") === null && /<b>not bold<\/b><i>text<\/i>kid$/.test(el.textContent) && el.className === "x" && el.getAttribute("data-k") === "v" && !el.hasAttribute("hidden") && el.clicked, "h builds nodes: text is text, never markup; listeners and attributes are set");
    D.say("Three blocks selected");
    D.busy("Reading", 0.25);
    ok(q(".doc-busy .doc-busy-label").textContent === "Reading" && q(".doc-busy progress").value === 0.25, "busy shows a label and how far it has got");
    D.busy("Reading more");
    ok(!q(".doc-busy progress").hasAttribute("value") && W.document.querySelectorAll(".doc-busy").length === 1, "with no fraction the bar only shows that work is going on");
    D.busy(null);
    ok(q(".doc-busy") === null, "busy(null) takes it away");
    $("btn-load").focus();
    var asked = D.confirmBox({ title: "Delete it?", text: "It will go.", ok: "Delete", cancel: "Keep" });
    ok(q(".doc-modal") && q(".doc-modal").getAttribute("role") === "dialog" && q(".doc-modal h2").textContent === "Delete it?" && modalBtn("ok").textContent === "Delete" && modalBtn("cancel").textContent === "Keep" && !$("modal").classList.contains("hidden"), "confirmBox is a dialog in the page");
    ok(W.document.activeElement === modalBtn("ok"), "the keyboard goes into it");
    key(W.document.activeElement, "Escape");
    return asked.then(function (v) {
      ok(v === false && q(".doc-modal") === null && $("modal").classList.contains("hidden") && W.document.activeElement === $("btn-load"), "Escape answers no, and the keyboard goes back where it was");
      var p2 = D.confirmBox({ title: "Sure?" });
      modalBtn("ok").click();
      return p2;
    }).then(function (v) {
      ok(v === true, "the ok button answers yes");
      return poll(function () { return $("live").textContent === "Three blocks selected"; });
    });
  }).then(function () {
    ok(true, "say writes to the live region");
    D.toast("Done", "warn");
    ok(toastText() === "Done" && /warn/.test($("toast").className) && !/hidden/.test($("toast").className), "toast shows a message");

    // ---------- New, unsaved changes, Save ----------
    $("btn-new").click();
    return poll(function () { return D.state.doc; });
  }).then(function () {
    docId = D.state.doc.id;
    ok(D.state.page === "info" && navPages() === "info edit preview issue about" && spy.pages.slice(-1)[0] === "info", "New starts a document and opens Document information", navPages());
    ok(D.state.dirty === false && !$("btn-save").disabled && $("btn-save").textContent === "Save" && unloadAsks() === false, "a new document is not unsaved work yet");
    ok(/^Untitled document · not saved yet$/.test($("save-state").textContent), "the header says it is not saved", $("save-state").textContent);
    ok(q('#nav .nav-item[data-page="issue"] .badge').textContent === "1" && q('#nav .nav-item[data-page="info"]').getAttribute("aria-current") === "page", "the Issue entry counts what is still to complete (the title), and the page in view is marked");
    D.state.doc.info.title = "First document";
    D.touched({ info: true });
    ok(D.state.dirty === true && $("btn-save").textContent === "Save*" && $("btn-save").classList.contains("btn-unsaved") && unloadAsks() === true, "a change makes it unsaved: Save*, and closing the window asks");
    return poll(function () { return !q('#nav .nav-item[data-page="issue"] .badge') && /^First document · unsaved changes$/.test($("save-state").textContent); });
  }).then(function () {
    ok(true, "the badge and the header follow the change a moment later");
    hA = fakeHandle("First document 0.1.json");
    pick.nextSave = hA;
    $("btn-save").click();
    return poll(function () { return hA.store.writes === 1 && !D.state.dirty; });
  }).then(function () {
    var o = pick.save[0], saved = JSON.parse(hA.store.text);
    ok(pick.save.length === 1 && o.suggestedName === "First document 0.1.json" && J(o.types[0].accept) === J({ "application/json": [".json"] }), "the first Save asks where, offering <title> <revision>.json", o.suggestedName);
    ok(saved.schema === "spt-document/1.0" && saved.id === docId && saved.info.title === "First document" && saved.savedBy.product === "OT Cyber Document Tool" && !!saved.savedAt, "and writes the project file there");
    ok($("btn-save").textContent === "Save" && unloadAsks() === false && /Saved to First document 0\.1\.json/.test(toastText()) && /· First document 0\.1\.json$/.test($("save-state").textContent), "it is then saved, and says where");
    D.touched({ blocks: [D.state.doc.blocks[0].id] });
    $("btn-save").click();
    return poll(function () { return hA.store.writes === 2 && !D.state.dirty; });
  }).then(function () {
    ok(pick.save.length === 1, "the next Save writes the same file without asking");
    var hCopy = fakeHandle("Copy.json");
    pick.nextSave = hCopy;
    $("btn-save").dispatchEvent(new W.MouseEvent("click", { bubbles: true, shiftKey: true }));
    return poll(function () { return hCopy.store.writes === 1; }).then(function () {
      ok(pick.save.length === 2 && hA.store.writes === 2 && S.currentName() === "Copy.json", "Shift+click is Save as: it asks again and the new file becomes the document's file");
      // Saved into another file, it is a document of its own from here on.
      ok(D.state.doc.id !== docId && JSON.parse(hCopy.store.text).id === D.state.doc.id && JSON.parse(hA.store.text).id === docId, "and it takes an id of its own, which the earlier file does not share");
      docId = D.state.doc.id;
      D.touched({ info: true });
      // Closing the dialog is not a failure and saves nothing.
      $("btn-save").dispatchEvent(new W.MouseEvent("click", { bubbles: true, shiftKey: true }));
      return later(200);
    }).then(function () {
      ok(D.state.dirty === true && pick.save.length === 3 && !/not saved/.test(toastText()), "closing the save dialog leaves the document unsaved and says nothing alarming");
      var e = key(W.document.body, "s", { ctrlKey: true });
      return poll(function () { return hCopy.store.writes === 2 && !D.state.dirty; }).then(function () {
        ok(e.defaultPrevented && pick.save.length === 3, "Ctrl+S saves, in place of the browser's own save");
      });
    });
  }).then(function () {

    // ---------- the question about unsaved changes ----------
    D.touched({ info: true });
    $("btn-new").click();
    ok(q(".doc-modal h2").textContent === "Save your changes first?" && /First document/.test(q(".doc-modal p").textContent) && W.document.activeElement === modalBtn("save"), "New over unsaved changes asks first, and Save is the button in hand");
    modalBtn("cancel").click();
    return later(100);
  }).then(function () {
    ok(D.state.doc.id === docId && D.state.dirty === true, "Cancel keeps the document as it was");
    $("btn-new").click();
    modalBtn("discard").click();
    return poll(function () { return D.state.doc.id !== docId; });
  }).then(function () {
    ok(D.state.dirty === false && D.state.page === "info" && spy.clear >= 2, "Discard changes goes on to the new document, with its history cleared");
    ok(S.currentName() === "", "and New forgets the file: nothing can be saved over the earlier document's file");
    var second = D.state.doc.id;
    D.state.doc.info.title = "Second";
    D.touched({ info: true });
    var hSecond = fakeHandle("Second 0.1.json");
    pick.nextSave = hSecond;
    $("btn-new").click();
    modalBtn("save").click();
    return poll(function () { return D.state.doc.id !== second; }).then(function () {
      ok(hSecond.store.writes === 1 && JSON.parse(hSecond.store.text).id === second && D.state.dirty === false, "Save in the question saves the document, then goes on");
      D.touched({ info: true });
      $("btn-new").click();
      modalBtn("save").click();   // and the save dialog is then closed
      return later(200);
    }).then(function () {
      ok(D.state.dirty === true && q(".doc-modal") === null, "if that save is abandoned, the document stays open and unsaved");
      D.markClean();
      ok(D.state.dirty === false && $("btn-save").textContent === "Save", "markClean clears the flag");
    });
  }).then(function () {

    // ---------- Load: which file Save writes to ----------
    return fileText(function (d) {
      kPng = M.addMedia(d, new W.Blob([pngBytes], { type: "image/png" }), { name: "a.png", width: 3, height: 3 });
      kBig = M.addMedia(d, new W.Blob([bigBytes], { type: "image/jpeg" }), { name: "b.jpg", width: 9, height: 9 });
      d.blocks.push(M.make.heading(d, 1, "Alpha"), M.make.picture(d, kPng, 3, 3), M.make.heading(d, 2, "Alpha one"), M.make.prompt(d, "Fill in"),
        M.make.heading(d, 1, "Beta"), M.make.picture(d, kBig, 9, 9), M.make.heading(d, 1, "Gamma"), M.make.paragraph(d, "end"));
    });
  }).then(function (f) {
    savedText = f.text; docId = f.id;
    hB = fakeHandle("Loaded document 0.1.json", savedText);
    pick.nextOpen = hB;
    $("btn-load").click();
    return poll(function () { return D.state.doc && D.state.doc.id === docId; });
  }).then(function () {
    var o = pick.open[0], acc = J(o.types[0].accept);
    ok(/\.json/.test(acc) && /\.docx/.test(acc) && o.multiple === false, "Load offers document files and Word files");
    ok(D.state.page === "edit" && D.state.dirty === false && spy.mount.length === 1 && spy.mount[0] === $("edit-view") && $("main").classList.contains("hidden") && !$("edit-view").classList.contains("hidden"), "a project file opens in the editor, which is given its own view");
    ok(D.state.doc.media[kBig].blob.size === 200000 && M.missing(D.state.doc).length === 0 && /Opened Loaded document 0\.1\.json/.test(toastText()), "with its pictures");
    ok(S.currentName() === "Loaded document 0.1.json", "a file opened through the dialog is adopted once it has loaded");
    D.touched({ blocks: [D.state.doc.blocks[0].id] });
    var before = pick.save.length;
    $("btn-save").click();
    return poll(function () { return hB.store.writes === 1 && !D.state.dirty; }).then(function () {
      ok(pick.save.length === before && JSON.parse(hB.store.text).id === docId, "so Save writes back to it without asking");
    });
  }).then(function () {
    // The same file through the plain file input: no handle comes with it.
    chooseWithInput(new W.File([savedText], "Loaded document 0.1.json", { type: "application/json" }));
    return poll(function () { return spy.mount.length === 2; });
  }).then(function () {
    ok(D.state.doc.id === docId && S.currentName() === "" && spy.unmount === 1, "a file from the file input opens too, and the handle there was is forgotten");
    D.touched({ info: true });
    var before = pick.save.length, hNew = fakeHandle("Elsewhere.json");
    pick.nextSave = hNew;
    $("btn-save").click();
    return poll(function () { return hNew.store.writes === 1; }).then(function () {
      ok(pick.save.length === before + 1 && hB.store.writes === 1, "so its first Save asks where, and the file opened earlier is not written");
    });
  }).then(function () {
    // Dropped on the tool.
    var dt = new W.DataTransfer();
    dt.items.add(new W.File([savedText], "Dropped.json", { type: "application/json" }));
    var over = new W.DragEvent("dragover", { bubbles: true, cancelable: true, dataTransfer: dt });
    W.document.body.dispatchEvent(over);
    var drop = new W.DragEvent("drop", { bubbles: true, cancelable: true, dataTransfer: dt });
    W.document.body.dispatchEvent(drop);
    return poll(function () { return spy.mount.length === 3; }).then(function () {
      ok(over.defaultPrevented && drop.defaultPrevented && S.currentName() === "" && /Opened Dropped\.json/.test(toastText()), "a file dropped anywhere on the tool is opened, taken by the tool itself, with no handle");
      var dt2 = new W.DataTransfer();
      dt2.items.add(new W.File(["x"], "photo.png", { type: "image/png" }));
      W.document.body.dispatchEvent(new W.DragEvent("drop", { bubbles: true, cancelable: true, dataTransfer: dt2 }));
      ok(/drop it on the page in Edit/.test(toastText()) && D.state.doc.id === docId, "a picture dropped outside the page is not opened as a document; the message says where it goes");
    });
  }).then(function () {

    // ---------- another tool's file, by name ----------
    var cases = [
      ['{"schema":"spt-review-pack/1.1","packId":"p"}', "pack.json", /pack\.json is a review pack\. Open it in the OT Cyber Report Review Tool\./],
      ['{"schema":"spt-review/1.0"}', "rev.json", /rev\.json is a review file\. Open it in the OT Cyber Report Review Tool/],
      ['{"schema":"spt-risk-project/1.4"}', "risk.json", /risk\.json is a risk assessment project file\. Open it in the OT Cyber Risk Assessment Tool\./],
      ['{"schemaVersion":"2.3","project":{}}', "acme.json", /acme\.json is an assessment project file\. Open it in the OT Cyber Assessment Tool\./],
      ['{"hello":1}', "other.json", /other\.json is not a document file\./],
      ['this is not json', "notes.json", /notes\.json is not a document file\./],
      ['{"schema":"spt-document/9.0","blocks":[]}', "future.json", /spt-document\/9\.0.*newer version/]
    ];
    var chain = Promise.resolve(), mounts = spy.mount.length;
    cases.forEach(function (c) {
      chain = chain.then(function () { return W.DocumentTool.load(new W.File([c[0]], c[1])); }).then(function (opened) {
        ok(opened === false && c[2].test(toastText()) && /err/.test($("toast").className), "refused: " + c[1], toastText());
      });
    });
    return chain.then(function () {
      ok(D.state.doc.id === docId && spy.mount.length === mounts && D.state.dirty === false, "and the open document is left as it was each time");
      return W.DocumentTool.load(new W.File([new Uint8Array([0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1])], "old.bin"));
    }).then(function (opened) {
      ok(opened === false && /old Word file \(\.doc\)/.test(toastText()), "an old .doc is refused with what to do about it, by its name or by its first bytes", toastText());
      return W.DocumentTool.load(savedText);
    }).then(function (opened) {
      ok(opened === true && D.state.doc.id === docId, "DocumentTool.load takes the text of a file as well as a File");
    });
  }).then(function () {

    // ---------- a Word file starts an import, and can never be saved over ----------
    var imported;
    A.DocImportFlow.start = function (file) {
      spy.imports.push(Array.prototype.slice.call(arguments));

    });
  }).then(function () {

    // ---------- in the suite ----------
    var msgs = [];

      var rc = got("recent")[1].data;
      ok(got("dirty")[1].data.dirty === false && rc.action === "save" && rc.name === "From the suite.json" && rc.kind === "Document" && rc.hasHandle === true, "and when they are saved, with the save noted in Recent files", J(rc));
      // A file the user reopens from Recent files comes with the handle the browser kept.
      var hr = fakeHandle("Reopened.json", savedText);
      A.HostBridge.__setHandleLookup(function (name, cb) { cb(hr); });

      return poll(function () { return q(".spt-host-banner .btn.primary"); }).then(function (btn) {
        btn.click();
        return poll(function () { return S.currentName() === "Reopened.json"; });
      }).then(function () {

        var before = pick.save.length;

        return poll(function () { return hr.store.writes === 1; }).then(function () {
          ok(pick.save.length === before, "a file reopened from Recent files with its handle is saved back in place, as in the assessment tool");
        });

      document.body.removeChild(hosted);
    });
  }).then(function () {

    // ---------- the real store, where the browser lets it run ----------
    // Everything above used the store in this page. The one the tool ships
    // with is a thin wrapper over IndexedDB, which answers in real time while
    // this run's clock is virtual: the timer below burns a little real time
    // on every tick so that it has the chance to. Where it still does not

    var sink = 0, burn = setInterval(function () { for (var i = 0; i < 2e7; i++) sink += i % 7; }, 20);

      return poll(function () { return S.autosave.status() !== "unknown"; }, 60000);
    }).then(function () {
      var st = S.bytesStore;

        return;
      }
      var doc = M.create(), raw = bytes(70000, 4), other = "doc-real-store-other";

        return Promise.all([st.getDoc(doc.id), st.getBlobs(doc.id), st.getDoc("doc-nobody")]);

        ok(typeof r[0] === "string" && JSON.parse(r[0]).info.title === "Real store" && J(Object.keys(r[1])) === J([k]) && r[1][k].size === 70000 && r[2] === null, "the real store keeps the document's record and its picture, each under the document's id");
        return S.autosave.restore(doc.id);

        clearInterval(burn);
        return st.remove(other);

    }).then(null, function (e) { clearInterval(burn); throw e; });
  }).then(function () {
    ok(errors.length === 0, "no script error or unhandled rejection in the tool throughout", errors.join(" | "));
    finish();
  }, function (e) { ok(false, "the page ran to the end", (e && e.stack) || String(e)); finish(); });
})();
