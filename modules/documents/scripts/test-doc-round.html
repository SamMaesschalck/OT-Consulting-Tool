<html lang="en"><head><meta charset="utf-8"/><title>Document tool: export and read back</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'" />
</head>
<body>
<pre id="out">running...</pre>
<!--
  The round trip (docs/document-tool-design.md 5.7 and section 7). The preview
  is drawn from the model, not from the Word file, so this page is what says
  the two agree: a document is exported with the real writer and graft, the
  export is read with the real importer, and the blocks must be the same.

    1. A document written in the tool, with every block type and run format.
    2. Every committed Word fixture: imported, exported, imported again. The
       same blocks, the same kept objects, the same picture bytes and every
       carried part byte for byte.
    3. The same again through a save and a load of the project file.

  The page carries the tool's own Content-Security-Policy and expects no
  violation during an import, a picture insert and an export.

  The house front matter of the export (cover, document control, contents
  list) is recognised by the importer and taken out of the body: the body
  must read back with nothing before it, nothing under Check first, and
  Document information as the first document had it.

  What is set aside before comparing, and why:
    - relationship ids (sptK<n>), which are given afresh at each import;
    - the width of a kept object the writer made smaller to fit the page.
-->
<script src="../js/version.js"></script>
<script src="../js/product.js"></script>
<script src="../js/logo.js"></script>
<script src="../js/hero-asset.js"></script>
<script src="../vendor/docx.umd.js"></script>
<script src="../js/zip-io.js"></script>
<script src="../js/docx-graft.js"></script>
<script src="../js/house-docx.js"></script>
<script src="../js/docx-import.js"></script>
<script src="../data/document.js"></script>
<script src="../js/model.js"></script>
<script src="../js/pictures.js"></script>
<script src="fixtures/index.js"></script>
<script>
  // One wrapper per fixture, whatever the index lists.
  (window.FixtureIndex || []).forEach(function (f) { document.write('<script src="fixtures/' + f.name + '.js"><\/script>'); });
</script>
<script>
(function () {
  var lines = [], fail = 0, done = false;
  function ok(c, n, d) { lines.push((c ? "PASS " : "FAIL ") + n + (!c && d ? " - " + d : "")); if (!c) fail++; }
  function finish() {
    done = true; alive = false;
    lines.push("", fail === 0 ? "ALL TESTS PASSED" : fail + " FAILED");
    document.getElementById("out").textContent = lines.join("\n");
  }
  // Until the page finishes it ends in a failure, so a run cut short cannot
  // read as a short pass.
  document.getElementById("out").textContent = "FAIL the page did not finish: re-run it alone with a larger time budget";
  window.addEventListener("error", function (e) { ok(false, "no script error", e.message + " " + e.filename + ":" + e.lineno); });
  var violations = [];
  document.addEventListener("securitypolicyviolation", function (e) { violations.push(e.violatedDirective + " " + e.blockedURI); });
  // Unzipping runs off the main thread and headless Edge's virtual clock runs
  // out when nothing is queued; a message bounced to ourselves keeps a task
  // queued without moving the clock (as test-doc-zip.html).
  var alive = true, bounce = new MessageChannel();
  bounce.port1.onmessage = function () { if (alive) bounce.port2.postMessage(0); };
  bounce.port2.postMessage(0);

  var A = window.App, M = A.DocModel, H = A.HouseDocx, I = A.DocxImport, Z = A.ZipIO;
  var W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  var PNG = "iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAFElEQVR42mNkYPhfz0AEYBxVSF+FAP5FDvcfRYWgAAAAAElFTkSuQmCC";
  function bytes(b64) { var s = atob(b64), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  function sig(blob) { return blob.arrayBuffer().then(function (buf) { var u = new Uint8Array(buf); return u.length + ":" + Z.crc32(u); }); }
  // A SmartArt data part names its drawing part by a document relationship
  // id, which each import renames; everything else in a part must not change.
  function partSig(entry) {
    return entry.blob.arrayBuffer().then(function (buf) {
      var u = new Uint8Array(buf);
      if (/diagramData/.test(entry.contentType || "")) u = Z.bytesOf(Z.text(u).replace(/relId="sptK\d+(c\d+)?"/g, 'relId="sptK"'));
      return (entry.contentType || "") + " " + u.length + ":" + Z.crc32(u);
    });
  }

  // ---- what a block is, for comparing ---------------------------------------
  function runsBrief(runs) {
    return (runs || []).map(function (r) {
      var f = ["b", "i", "u", "s", "sup", "sub", "code", "red"].filter(function (k) { return r[k]; }).join("");
      return (f ? "[" + f + "]" : "") + (r.link ? "<" + r.link + ">" : "") + (r.fn ? "{fn}" : "") + r.t;
    }).join("|");
  }
  // o.media maps a media key to its bytes' signature; o.fitted lists the kept
  // blocks the writer made smaller. A picture or an in-line kept object with
  // no alignment is centred (3.2), so the two are one thing here.
  function brief(b, o) {
    var s = b.type + (b.land ? " land" : "");
    if (b.type === "heading") return s + b.level + " " + (b.runs || []).map(function (r) { return r.t; }).join("");
    if (b.type === "paragraph") return s + (b.align ? " " + b.align : "") + " " + runsBrief(b.runs);
    if (b.type === "list") return s + " " + b.list + b.level + (b.restart ? " restart" : "") + (b.continue ? " continue" : "") + " " + runsBrief(b.runs);
    if (b.type === "prompt") return s + " " + b.text;
    if (b.type === "picture") return s + " " + (o.media[b.media] || "no bytes") + (o.sizes === false ? "" : " " + b.width + "x" + b.height) + " " + (b.align || "center") + " alt=" + (b.alt || "") + " cap=" + (b.caption || "");
    if (b.type === "kept") return s + " " + b.kind + (b.floating ? " floating" : "") + ((o.fitted || []).indexOf(b.id) === -1 && o.sizes !== false ? " " + b.width + "x" + b.height : "") + " [" + (b.text || "") + "] label=" + (b.label || "") + " " + (b.floating ? "" : b.align || "center") + " cap=" + (b.caption || "") + " rels=" + (b.rels || []).length;
    if (b.type === "table") {
      return s + " header" + b.header + " cols" + b.cols.length + " cap=" + (b.caption || "") + " " + b.rows.map(function (r) {
        return "(" + r.cells.map(function (c) { return (c.span > 1 ? "span" + c.span + " " : "") + (c.rowSpan > 1 ? "rows" + c.rowSpan + " " : "") + c.blocks.map(function (x) { return brief(x, o); }).join(" / "); }).join(" ; ") + ")";
      }).join("");
    }
    return s;
  }
  function mediaSigs(doc) {
    var out = {}, chain = Promise.resolve();
    Object.keys(doc.media || {}).forEach(function (k) {
      chain = chain.then(function () { var e = doc.media[k]; return e.blob ? sig(e.blob).then(function (s) { out[k] = e.type + " " + s; }) : null; });
    });
    return chain.then(function () { return out; });
  }
  function partSigs(doc) {
    var out = [], chain = Promise.resolve();
    Object.keys(doc.parts || {}).forEach(function (k) {
      chain = chain.then(function () { return partSig(doc.parts[k]).then(function (s) { out.push(s); }); });
    });
    return chain.then(function () { return out.sort(); });
  }
  function footnoteTexts(doc) {
    var out = [];
    M.each(doc, function (b) { (b.runs || []).forEach(function (r) { if (r.fn) out.push(runsBrief((doc.footnotes[r.fn] || {}).runs)); }); });
    return out;
  }
  function keptKinds(doc) {
    var out = [];
    M.each(doc, function (b) { if (b.type === "kept") out.push(b.kind + (b.floating ? " floating" : "")); });
    return out;
  }
  function keptXml(doc) {
    var out = "";
    M.each(doc, function (b) { if (b.type === "kept") out += b.xml; });
    return out;
  }
  // A report's cover, document control and contents list are recognised and
  // taken out of the body by the importer, so its body is the blocks as read.
  // A short document opens with one line under its title instead.
  function bodyOf(doc, first) {
    var bl = doc.blocks.slice();
    if (first.kind === "short") return bl.slice(1);
    return bl;
  }
  // Document information as the cover and document control print it.
  function printedInfo(info) {
    var o = {};
    ["title", "docType", "reference", "client", "site", "author", "qaReviewBy", "authorisedBy", "issuedTo", "issuedDate"].forEach(function (k) { o[k] = String(info[k] || "").trim(); });
    o.revision = String(info.revision || "").trim() || "0.1";
    o.classification = String(info.classification || "").trim() || "Confidential";
    o.date = String(info.issuedDate || "").trim() || String(info.date || "").trim();
    return o;
  }
  function diff(a, b) {
    var out = [], n = Math.max(a.length, b.length);
    for (var k = 0; k < n && out.length < 4; k++) if (a[k] !== b[k]) out.push("#" + k + ": " + String(a[k]).slice(0, 220) + "  ->  " + String(b[k]).slice(0, 220));
    return out.join("\n     ");
  }

  // Export `first` as a draft, read it back, and compare. `opts.sizes` false
  // leaves printed sizes out (a document whose pictures the writer clamps).
  function round(label, first, opts) {
    opts = opts || {};
    var built, firstMedia, firstParts;
    return mediaSigs(first).then(function (m) { firstMedia = m; return partSigs(first); }).then(function (p) {
      firstParts = p;
      return H.buildDocument(first, { issueStatus: "draft" });
    }).then(function (res) {
      built = res;
      ok(res.blob && res.blob.size > 1000, label + ": it exports", res.blob && res.blob.size);
      return I.read(res.blob, { name: label + ".docx" });
    }).then(function (r2) {
      var second = r2.project;
      return mediaSigs(second).then(function (m2) {
        return partSigs(second).then(function (p2) {
          var o1 = { media: firstMedia, fitted: built.fitted, sizes: opts.sizes }, o2 = { media: m2, fitted: bodyOf(second, first).map(function (b) { return b.id; }), sizes: opts.sizes };
          // A fitted block's size is left out on both sides, by position.
          var fittedAt = {};
          first.blocks.forEach(function (b, i) { if ((built.fitted || []).indexOf(b.id) !== -1) fittedAt[i] = true; });
          var body2 = bodyOf(second, first);
          var a = first.blocks.map(function (b) { return brief(b, o1); });
          var b = body2.map(function (x, i) { return brief(x, { media: m2, fitted: fittedAt[i] ? [x.id] : [], sizes: opts.sizes }); });
          ok(JSON.stringify(a) === JSON.stringify(b), label + ": the export reads back as the same " + a.length + " blocks", diff(a, b));
          if (first.kind !== "short") {
            var rep2 = second.importReport || {};
            // Check first lists only the document's own blocks before its first heading, if it has any.
            var lead = 0;
            while (lead < first.blocks.length && first.blocks[lead].type !== "heading") lead++;
            var wantCheck = lead > 0 && lead < first.blocks.length ? ["front-matter:" + lead] : [];
            var gotCheck = (rep2.toCheck || []).map(function (e) { return e.code + ":" + e.count; });
            ok(!!rep2.front && JSON.stringify(gotCheck) === JSON.stringify(wantCheck), label + ": its own cover and document control are recognised, and nothing of theirs is under Check first",
              JSON.stringify(gotCheck) + " against " + JSON.stringify(wantCheck));
            ok(JSON.stringify(printedInfo(first.info)) === JSON.stringify(printedInfo(second.info)), label + ": Document information reads back as it was",
              JSON.stringify(printedInfo(second.info)) + " against " + JSON.stringify(printedInfo(first.info)));
          }
          ok(JSON.stringify(footnoteTexts(first)) === JSON.stringify(footnoteTexts(second)), label + ": the same footnotes, in order", JSON.stringify(footnoteTexts(second)));
          var k1 = keptKinds(first), k2 = keptKinds(second);
          ok(JSON.stringify(k1) === JSON.stringify(k2), label + ": the same " + k1.length + " kept objects, of the same kinds", k1.join(",") + " -> " + k2.join(","));
          // The pictures the document itself holds (the cover art and logo
          // the template adds are not in the first project).
          var want = Object.keys(firstMedia).filter(function (k) { return usedMedia(first)[k]; }).map(function (k) { return firstMedia[k]; }).sort();
          var have = Object.keys(m2).map(function (k) { return m2[k]; });
          var missing = want.filter(function (s) { var at = have.indexOf(s); if (at === -1) return true; have.splice(at, 1); return false; });
          ok(missing.length === 0, label + ": every picture's bytes are in the export unchanged (" + want.length + ")", missing.join(", "));
          ok(JSON.stringify(firstParts) === JSON.stringify(p2), label + ": every carried part is byte for byte the same (" + firstParts.length + ")", diff(firstParts, p2));
          ok(!first.theme === !second.theme, label + ": the theme is carried when there is a kept object", String(second.theme));
          return { second: second, built: built };
        });
      });
    }).then(null, function (e) { ok(false, label + ": the round trip ran", (e && (e.stack || e.message)) || String(e)); return null; });
  }
  function usedMedia(doc) {
    var used = {};
    M.each(doc, function (b) { if (b.type === "picture" && b.media) used[b.media] = true; if (b.type === "kept" && b.preview) used[b.preview] = true; });
    return used;
  }

  // ---- 1. a document written in the tool ------------------------------------
  function para(id, t) { return { id: id, type: "paragraph", runs: [{ t: t }] }; }
  function written(kind) {
    return M.normalise({
      schema: "spt-document/1.0", id: "doc-round-" + kind, kind: kind,
      info: { title: "Network segmentation proposal", docType: "Proposal", reference: "OPP-10442", client: "Northfield Water", site: "Ashby treatment works",
        author: "A. Consultant", revision: "0.1", date: "2026-11-11", qaReviewBy: "", authorisedBy: "", issuedTo: "", issuedDate: "", classification: "Confidential" },
      options: { numberHeadings: false, contents: kind === "report" }, nextId: 200,
      footnotes: { f1: { runs: [{ t: "Costs are " }, { t: "budgetary", i: true }, { t: "." }] } },
      media: { m1: { type: "image/png", name: "plan.png", width: 8, height: 8, source: "insert", blob: new Blob([bytes(PNG)], { type: "image/png" }) } },
      parts: {},
      blocks: [
        { id: "b1", type: "heading", level: 1, runs: [{ t: "Summary" }] },
        { id: "b2", type: "paragraph", runs: [{ t: "Plain, " }, { t: "bold", b: true }, { t: ", " }, { t: "italic", i: true }, { t: ", " }, { t: "underlined", u: true }, { t: ", " },
          { t: "struck", s: true }, { t: ", x" }, { t: "2", sup: true }, { t: ", H" }, { t: "2", sub: true }, { t: "O, " }, { t: "code", code: true }, { t: ", " },
          { t: "bold italic", b: true, i: true }, { t: " and a " }, { t: "link", link: "https://example.com/a?b=1&c=2" }, { t: "." }, { t: "", fn: "f1" }] },
        { id: "b3", type: "paragraph", align: "center", runs: [{ t: "Centred\nover two lines" }] },
        { id: "b4", type: "paragraph", align: "right", runs: [{ t: "Right" }] },
        { id: "b5", type: "paragraph", align: "justify", runs: [{ t: "Justified text." }] },
        { id: "b6", type: "heading", level: 2, runs: [{ t: "Options" }] },
        { id: "b7", type: "list", list: "number", level: 0, runs: [{ t: "Separate the control network." }] },
        { id: "b8", type: "list", list: "number", level: 1, runs: [{ t: "With a firewall." }] },
        { id: "b9", type: "list", list: "number", level: 2, runs: [{ t: "And rules." }] },
        { id: "b10", type: "list", list: "number", level: 0, runs: [{ t: "Add a demilitarised zone." }] },
        { id: "b11", type: "list", list: "bullet", level: 0, runs: [{ t: "A bullet." }] },
        { id: "b12", type: "list", list: "bullet", level: 1, runs: [{ t: "A deeper bullet." }] },
        para("b13", "Between the lists."),
        { id: "b14", type: "list", list: "number", level: 0, runs: [{ t: "A new list starts at one." }] },
        { id: "b15", type: "list", list: "number", level: 0, runs: [{ t: "And goes on." }] },
        para("b16", "Between again."),
        { id: "b17", type: "list", list: "number", level: 0, continue: true, runs: [{ t: "Carries on at three." }] },
        { id: "b18", type: "heading", level: 3, runs: [{ t: "Detail" }] },
        { id: "b19", type: "prompt", text: "Add the cost of each option." },
        { id: "b20", type: "paragraph", runs: [{ t: "The site is " }, { t: "to be confirmed", red: true }, { t: "." }] },
        { id: "b21", type: "table", header: 1, cols: [1, 2, 1], caption: "Zones and their assets", rows: [
          { cells: [{ blocks: [para("b30", "Zone")] }, { blocks: [para("b31", "Assets")] }, { blocks: [para("b32", "Level")] }] },
          { cells: [{ rowSpan: 2, blocks: [para("b33", "Control")] }, { blocks: [para("b34", "PLCs"), { id: "b35", type: "list", list: "bullet", level: 0, runs: [{ t: "Line 1" }] }] }, { blocks: [para("b36", "2")] }] },
          { cells: [{ blocks: [para("b37", "HMIs")] }, { blocks: [para("b38", "2")] }] },
          { cells: [{ span: 3, blocks: [para("b39", "A cell across the table")] }] }
        ] },
        { id: "b22", type: "picture", media: "m1", width: 96, height: 96, align: "right", caption: "Current network", alt: "Diagram of the current network" },
        { id: "b23", type: "pageBreak" },
        para("b24", "After the break."),
        { id: "b25", type: "heading", level: 2, land: true, runs: [{ t: "Wide register" }] },
        { id: "b26", type: "table", land: true, header: 0, cols: [1, 1], rows: [{ cells: [{ blocks: [para("b40", "A")] }, { blocks: [para("b41", "B")] }] }] },
        { id: "b27", type: "kept", kind: "equation", xml: '<m:oMath xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math" xmlns:w="' + W + '"><m:r><m:t>a+b=c</m:t></m:r></m:oMath>', rels: [], width: 0, height: 0, floating: false, text: "a+b=c", label: "", description: "Equation" },
        para("b28", "The end.")
      ]
    });
  }

  var chain = Promise.resolve();
  ["report", "short"].forEach(function (kind) {
    chain = chain.then(function () { return round("written " + kind, written(kind)); });
  });

  // A picture inserted as a person would, through the intake the editor uses,
  // then printed and read back: the insert runs under the policy too.
  chain = chain.then(function () {
    var doc = M.create("report");
    doc.info.title = "A picture";
    doc.blocks = [{ id: M.newId(doc, "b"), type: "heading", level: 1, runs: [{ t: "One picture" }] }];
    return A.DocPictures.fromFile(new File([bytes(PNG)], "inserted.png", { type: "image/png" })).then(function (pic) {
      var key = M.addMedia(doc, pic.blob, { type: pic.type, name: pic.name, width: pic.width, height: pic.height, source: "insert" });
      doc.blocks.push(M.make.picture(doc, key, pic.width, pic.height));
      ok(doc.media[key] && doc.media[key].blob.size > 0, "a picture goes in through DocPictures.fromFile", key);
      return round("inserted picture", doc);
    }, function (e) { ok(false, "a picture goes in through DocPictures.fromFile", e && e.message); });
  });

  // ---- 2. every fixture: import, export, import ------------------------------
  var index = window.FixtureIndex || [];
  ok(index.length >= 6, "the Word fixtures are here", index.length);
  index.forEach(function (fx) {
    chain = chain.then(function () {
      var b64 = (window.Fixtures || {})[fx.name];
      if (!b64) { ok(false, fx.name + ": its wrapper loaded"); return; }
      return I.read(new File([bytes(b64)], fx.file), { name: fx.file }).then(function (r) {
        var first = r.project;
        if (!first.info.title) first.info.title = "Round trip";
        return round(fx.name, first).then(function (res) {
          if (!res) return;
          // Once more through the project file, as Save and Load do, and out
          // again: the second export must hold what the first did.
          return M.toFile(first).then(function (blob) { return blob.text(); }).then(function (text) {
            var loaded = M.fromText(text);
            ok(M.missing(loaded).length === 0, fx.name + ": saved and loaded, nothing is missing");
            return round(fx.name + " after save and load", loaded);
          });
        });
      }, function (e) { ok(false, fx.name + ": it imports", e && e.message); });
    });
  });

  // ---- 3. a copied chart, diagram and object survive the trip ----------------
  chain = chain.then(function () {
    var b64 = (window.Fixtures || {})["fx-art"];
    if (!b64) return;
    return I.read(new File([bytes(b64)], "fx-art.docx"), { name: "fx-art.docx" }).then(function (r) {
      var doc = M.normalise(r.project), kept = doc.blocks.filter(function (b) { return b.type === "kept"; });
      doc.info.title = "Copies";
      var copies = M.copyBlocks(doc, kept);
      doc.blocks = doc.blocks.concat(copies);
      return H.buildDocument(doc, { issueStatus: "draft" }).then(function (res) { return I.read(res.blob, { name: "copies.docx" }); }).then(function (r2) {
        // The two floating copies end the document with nothing between them, so they
        // read back as one drawing (floating drawings on neighbouring lines travel together).
        var k1 = keptKinds(doc).sort(), k2 = keptKinds(r2.project).sort();
        var inLine = function (k) { return !/ floating$/.test(k); }, anchors = (keptXml(r2.project).match(/<wp:anchor\b/g) || []).length, was = (keptXml(doc).match(/<wp:anchor\b/g) || []).length;
        ok(k1.length === kept.length * 2 && JSON.stringify(k1.filter(inLine)) === JSON.stringify(k2.filter(inLine)) && was > 0 && anchors === was,
          "every kept object copied once: the export reads back with both of each (" + k1.length + ", " + anchors + " floating)", k2.join(",") + " anchors " + anchors + " against " + was);
      });
    }).then(null, function (e) { ok(false, "copied kept objects export and read back", e && (e.stack || e.message)); });
  });

  chain.then(function () {
    ok(violations.length === 0, "no Content-Security-Policy violation during the imports, the insert and the exports", violations.join("; "));
  }).then(finish, function (e) { ok(false, "the page ran to the end", e && (e.stack || e.message)); finish(); });
})();
</script>
</body></html>
