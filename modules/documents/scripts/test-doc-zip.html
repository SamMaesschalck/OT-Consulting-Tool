  }).then(function () {
    // ---- directory entries -------------------------------------------------
    var withDirs = [{ name: "word/", bytes: new Uint8Array(0) }, PARTS[1], { name: "word/media/", bytes: new Uint8Array(0) }, PARTS[6]];
    return Zip.write(withDirs).then(Zip.read);
  }).then(function (back) {
    ok(back.length === 2 && back[0].name === "word/document.xml" && back[1].name === "word/tiny.xml", "directory entries are not written");
    return Zip.write([]).then(Zip.read);
  }).then(function (back) {
    ok(back.length === 0, "an empty list writes a valid empty zip");

    // ---- refusals when writing ---------------------------------------------
    var many = [];
    for (var i = 0; i < 65536; i++) many.push({ name: "p" + i, bytes: new Uint8Array(0) });
    return refused(Zip.write(many), /too many parts/, "write refuses more than 65,535 entries");
  }).then(function () {
    return refused(Zip.write([PARTS[1], PARTS[6], PARTS[1]]), /same name/, "write refuses two parts with one name");
  }).then(function () {

    // ---- zips written by other tools ---------------------------------------
    var a = enc.encode(new Array(300).join("data descriptor entry ")), b = enc.encode("stored with a descriptor"), c = enc.encode("extra field here");
    return deflateRaw(a).then(function (da) {
      var blob = rawZip([
        { name: "deflated-dd.xml", data: da, method: 8, usize: a.length, crc: Zip.crc32(a), flags: 0x0808, descriptor: true },
        storedEntry("stored-dd.bin", b, { flags: 0x0808, descriptor: true }),
        // An extra field in the local header that the directory does not have: the data starts later than the directory suggests.
        storedEntry("extra.bin", c, { localExtra: new Uint8Array([0x55, 0x54, 0x05, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00]) }),
        storedEntry("folder/", new Uint8Array(0)),
        storedEntry("caf\u00E9/\u56FE.txt", enc.encode("utf-8 name"))
      ], { comment: "a comment after the directory" });
      return Zip.read(blob).then(function (back) {
        ok(back.length === 5, "a zip with data descriptors, an extra field, a folder and a comment is read");
        ok(same(back[0].bytes, a), "a deflated entry with a data descriptor (zeros in its local header) reads correctly");
        ok(same(back[1].bytes, b), "a stored entry with a data descriptor reads correctly");
        ok(same(back[2].bytes, c), "an entry whose local header has an extra field reads correctly");
        ok(back[3].name === "folder/" && back[3].bytes.length === 0, "a directory entry comes back as it is, with no bytes");
        ok(back[4].name === "caf\u00E9/\u56FE.txt" && Zip.text(back[4]) === "utf-8 name", "a UTF-8 name is read");
      });
    });
  }).then(function () {

    // ---- limits and refusals when reading ----------------------------------
    var small = enc.encode("small");
    var huge = rawZip([storedEntry("a.bin", small), storedEntry("b.bin", small, { method: 8, declare: { usize: 400 * 1024 * 1024 } }),
      storedEntry("c.bin", small, { method: 8, declare: { usize: 200 * 1024 * 1024 } })]);
    return refused(Zip.read(huge), /unpacks to more than 500 MB/, "a zip that declares more than 500 MB is refused before anything is inflated");
  }).then(function () {
    var two = rawZip([storedEntry("a.bin", noise(600)), storedEntry("b.bin", noise(600))]);
    return refused(Zip.read(two, { maxTotalBytes: 1000 }), /unpacks to more than/, "maxTotalBytes is counted across entries")
      .then(function () { return Zip.read(two, { maxTotalBytes: 1200 }); })
      .then(function (back) { ok(back.length === 2, "a zip exactly at maxTotalBytes is read"); })
      .then(function () { return refused(Zip.read(two, { maxEntries: 1 }), /too many entries/, "maxEntries refuses a zip with more"); });
  }).then(function () {
    var list = [];
    for (var i = 0; i < 5001; i++) list.push(storedEntry("e" + i, new Uint8Array(0)));
    return refused(Zip.read(rawZip(list)), /too many entries \(5001\)/, "more than 5,000 entries are refused by default");
  }).then(function () {
    // The bomb: 2 MB of zeros that the directory says is 100 bytes.
    var zeros = new Uint8Array(2 * 1024 * 1024);
    return deflateRaw(zeros).then(function (d) {
      var bomb = rawZip([{ name: "bomb.xml", data: d, method: 8, usize: 100, crc: 0 }]);
      return refused(Zip.read(bomb), /larger than it declares/, "an entry that inflates past its declared size is stopped")
        .then(function () {
          var short = rawZip([{ name: "short.xml", data: d, method: 8, usize: zeros.length + 10, crc: 0 }]);
          return refused(Zip.read(short), /smaller than it declares/, "an entry that inflates to less than it declares is refused");
        });
    });
  }).then(function () {
    return refused(Zip.read(rawZip([{ name: "junk.xml", data: noise(300), method: 8, usize: 900, crc: 0 }])), /damaged|declares/, "a deflated entry that is not deflate data is refused");
  }).then(function () {
    return refused(Zip.read(new Blob([enc.encode("\u00D0\u00CF\u0011\u00E0 this is an old .doc, not a zip at all, padded out past twenty-two bytes")])), /not a zip file/, "a file that is not a zip is refused");
  }).then(function () {
    return refused(Zip.read(new Blob([new Uint8Array(5)])), /not a zip file/, "a file too short to be a zip is refused");
  }).then(function () {
    return refused(Zip.read(null), /nothing was given/, "nothing to read is refused");
  }).then(function () {
    return refused(Zip.read(rawZip([storedEntry("secret.xml", enc.encode("x"), { flags: 0x0801 })])), /encrypted/, "an encrypted entry is refused");
  }).then(function () {
    return refused(Zip.read(rawZip([storedEntry("a", enc.encode("x"))], { count: 0xFFFF })), /ZIP64/, "an entry count of 65,535 (the ZIP64 marker) is refused");
  }).then(function () {
    return refused(Zip.read(rawZip([storedEntry("a", enc.encode("x"))], { cdAt: 0xFFFFFFFF })), /ZIP64/, "a directory offset of FFFFFFFF (the ZIP64 marker) is refused");
  }).then(function () {
    return refused(Zip.read(rawZip([storedEntry("big", enc.encode("x"), { declare: { usize: 0xFFFFFFFF, csize: 0xFFFFFFFF } })])), /ZIP64/, "an entry sized FFFFFFFF (the ZIP64 marker) is refused");
  }).then(function () {
    return refused(Zip.read(rawZip([{ name: "lzma.bin", data: enc.encode("x"), method: 14, usize: 1, crc: 0 }])), /not supported/, "a compression method other than stored or deflate is refused");
  }).then(function () {
    return refused(Zip.read(rawZip([storedEntry("cut.bin", noise(50), { declare: { usize: 5000, csize: 5000 } })])), /cut short|damaged/, "an entry that runs past the end of the file is refused");
  }).then(function () {
    return refused(Zip.read(rawZip([storedEntry("a", enc.encode("x"))], { cdAt: 7 })), /damaged/, "a directory that is not where the end record says is refused");
  }).then(function () {

    // ---- a file packed by the vendored docx library ------------------------
    var D = window.docx;
    var doc = new D.Document({
      creator: "Test", title: "Zip test",
      sections: [{ children: [
        new D.Paragraph({ heading: D.HeadingLevel.HEADING_1, children: [new D.TextRun({ text: "Heading" })] }),
        new D.Paragraph({ children: [new D.TextRun({ text: "caf\u00E9 \u00A3 \u56FE, and a footnote" }), new D.FootnoteReferenceRun(1)] })
      ] }],
      footnotes: { 1: { children: [new D.Paragraph({ children: [new D.TextRun({ text: "note" })] })] } }
    });
    return D.Packer.toBlob(doc);
  }).then(function (packed) {
    return Zip.read(packed).then(function (first) {
      var dirs = first.filter(function (p) { return /\/$/.test(p.name); }), files = first.filter(function (p) { return !/\/$/.test(p.name); });
      ok(files.some(function (p) { return p.name === "word/document.xml"; }) && files.some(function (p) { return p.name === "[Content_Types].xml"; }),
        "a file packed by the docx library is read (" + files.length + " parts)");
      ok(dirs.length > 0, "the library's zip has directory entries (" + dirs.length + ")");
      ok(Zip.text(files.filter(function (p) { return p.name === "word/document.xml"; })[0]).indexOf("caf\u00E9 \u00A3 \u56FE, and a footnote") !== -1, "its document text is read as UTF-8");
      var types = files.filter(function (p) { return p.name === "[Content_Types].xml"; })[0];
      var ordered = [types].concat(first.filter(function (p) { return p !== types; }));
      return Zip.write(ordered).then(function (blob) {
        return bytesOfBlob(blob).then(function (u8) {
          var dir = directory(u8);
          ok(dir.length === files.length && !dir.some(function (d) { return /\/$/.test(d.name); }), "re-zipped, it has the same parts and no directory entries");
          ok(dir[0].name === "[Content_Types].xml", "re-zipped, [Content_Types].xml is first");
          return Zip.read(blob);
        });
      }).then(function (second) {
        var expect = [types].concat(files.filter(function (p) { return p !== types; }));
        ok(sameParts(second, expect) === "", "re-zipped, every part has identical bytes", sameParts(second, expect));
      });
    });
  }).then(function () {

    // ---- a file saved by Word ----------------------------------------------
    var word = b64(WORD_ZIP), dir = directory(word);
    ok(dir.length === 11 && dir.every(function (d) { return d.method === 8 && d.flags === 6; }), "the Word file is Word's own zip (11 deflated entries, Word's flags)");
    return Zip.read(new Blob([word])).then(function (first) {
      ok(first.length === 11 && first[0].name === "[Content_Types].xml", "a file saved by Word is read (11 parts)");
      ok(first.every(function (p, n) { return p.bytes.length === dir[n].usize && Zip.crc32(p.bytes) === dir[n].crc; }), "every part of it has the size and CRC-32 Word recorded");
      var docXml = Zip.text(first.filter(function (p) { return p.name === "word/document.xml"; })[0]);
      ok(docXml.indexOf("Text before the objects.") !== -1 && docXml.indexOf("<w:document ") !== -1, "its document part is the XML Word wrote");
      return Zip.write(first, { mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" }).then(function (blob) {
        return bytesOfBlob(blob).then(function (u8) {
          var again = directory(u8);
          ok(again.every(function (d, n) { return d.crc === dir[n].crc && d.usize === dir[n].usize && d.name === dir[n].name; }), "re-zipped, each entry has the CRC-32 Word recorded for it");
          return Zip.read(blob);
        });
      }).then(function (second) {
        ok(sameParts(second, first) === "", "re-zipped and read again, every part is identical", sameParts(second, first));
      });
    });
  }).catch(function (e) {
    ok(false, "the page ran to the end", (e && e.stack) || String(e));
  }).then(finish);
})();
</script>
</body></html>
