<html lang="en"><head><meta charset="utf-8"/><title>Document tool: Word import, text</title></head>
<body>
<pre id="out">running...</pre>
<!--
  App.DocxImport on the text of a Word file (docs/document-tool-design.md 4.4):
  headings, the title, lists, runs, links, fields, notes, tables, alignment,
  tracked changes, what is reported instead of carried, sections, and the shape
  of the project and the report it returns.

  Every fixture is written here as XML and zipped by this page's own small
  writer (stored entries, nothing shared with App.ZipIO), so the reader is
  never tested against a file its own code produced. The markup follows what
  Word 365 writes; the cases real files added are marked "real Word".
-->
<script src="../js/zip-io.js"></script>
<script src="../js/docx-import.js"></script>
<script>
(function () {
  var lines = [], fail = 0;
  function ok(c, n, d) { lines.push((c ? "PASS " : "FAIL ") + n + (!c && d ? " - " + d : "")); if (!c) fail++; }
  function eq(a, b, n) { var x = JSON.stringify(a), y = JSON.stringify(b); ok(x === y, n, "got " + x + " wanted " + y); }
  function finish() {
    lines.push("", fail === 0 ? "ALL TESTS PASSED" : fail + " FAILED");
    document.getElementById("out").textContent = lines.join("\n");
  }
  // Unzipping is real work, not a timer: without a timer pending, virtual time
  // would run out while it is still going.
  var tick = setInterval(function () {}, 20);
  var I = window.App.DocxImport;

  // ---- a zip writer of this page's own -----------------------------------------
  var CRC = (function () { var t = [], n, c, k; for (n = 0; n < 256; n++) { c = n; for (k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc(u) { var c = 0xFFFFFFFF; for (var i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function bytes(v) { return typeof v === "string" ? new TextEncoder().encode(v) : v; }
  function zip(parts) {
    var chunks = [], central = [], offset = 0;
    parts.forEach(function (p) {
      var name = bytes(p.name), data = bytes(p.data), sum = crc(data);
      var lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
      lh.setUint32(14, sum, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
      chunks.push(new Uint8Array(lh.buffer), name, data);
      var ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
      ch.setUint32(16, sum, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
      ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), name);
      offset += 30 + name.length + data.length;
    });
    var size = 0; central.forEach(function (c) { size += c.length; });
    var e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, parts.length, true); e.setUint16(10, parts.length, true);
    e.setUint32(12, size, true); e.setUint32(16, offset, true);
    return new Blob(chunks.concat(central, [new Uint8Array(e.buffer)]));
  }

  // ---- WordprocessingML, briefly ---------------------------------------------------
  var NS = ' xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"' +
    ' xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006" xmlns:w14="http://schemas.microsoft.com/office/word/2010/wordml"';
  var HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  var REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships/";
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function R(text, rPr) { return '<w:r>' + (rPr ? '<w:rPr>' + rPr + '</w:rPr>' : '') + '<w:t xml:space="preserve">' + esc(text) + '</w:t></w:r>'; }
  function PX(inner, pPr) { return '<w:p>' + (pPr ? '<w:pPr>' + pPr + '</w:pPr>' : '') + inner + '</w:p>'; }
  function P(text, pPr, rPr) { return PX(R(text, rPr), pPr); }
  function S(id) { return '<w:pStyle w:val="' + id + '"/>'; }
  function NUM(id, lvl) { return '<w:numPr><w:ilvl w:val="' + (lvl || 0) + '"/><w:numId w:val="' + id + '"/></w:numPr>'; }
  function STYLE(id, name, o) {
    o = o || {};
    return '<w:style w:type="' + (o.type || "paragraph") + '"' + (o.dflt ? ' w:default="1"' : '') + ' w:styleId="' + id + '"><w:name w:val="' + name + '"/>' +
      (o.based ? '<w:basedOn w:val="' + o.based + '"/>' : '') + (o.pPr ? '<w:pPr>' + o.pPr + '</w:pPr>' : '') + (o.rPr ? '<w:rPr>' + o.rPr + '</w:rPr>' : '') + (o.extra || '') + '</w:style>';
  }
  function STYLES(list, defaults) { return HEAD + '<w:styles' + NS + '>' + (defaults || '') + STYLE("Normal", "Normal", { dflt: true }) + list.join("") + '</w:styles>'; }
  function TC(inner, tcPr) { return '<w:tc>' + (tcPr ? '<w:tcPr>' + tcPr + '</w:tcPr>' : '') + (inner.charAt(0) === "<" ? inner : P(inner)) + '</w:tc>'; }
  function TR(cells, trPr) { return '<w:tr>' + (trPr ? '<w:trPr>' + trPr + '</w:trPr>' : '') + cells.join("") + '</w:tr>'; }
  function T(rows, grid, tblPr) {
    return '<w:tbl><w:tblPr>' + (tblPr || '') + '</w:tblPr>' + (grid ? '<w:tblGrid>' + grid.map(function (w) { return '<w:gridCol w:w="' + w + '"/>'; }).join("") + '</w:tblGrid>' : '') + rows.join("") + '</w:tbl>';
  }
  var PORTRAIT = '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/></w:sectPr>';
  // A package. o: { body, sect, styles, numbering, footnotes, endnotes, comments, core, rels: [[id, type, target, external]],
  //                 files: { name: text or bytes }, types: [[partName, contentType]], main }
  function make(o) {
    var main = o.main || "word/document.xml", dir = main.slice(0, main.lastIndexOf("/") + 1), base = main.slice(dir.length);
    var rels = (o.rels || []).slice(), files = [], types = (o.types || []).slice();
    function add(name, kind, text, type) {
      if (text == null) return;
      files.push({ name: dir + name, data: text });
      rels.push(["rIdAuto" + rels.length, REL + kind, name]);
      types.push(["/" + dir + name, type]);
    }
    var wml = "application/vnd.openxmlformats-officedocument.wordprocessingml.";
    add("styles.xml", "styles", o.styles, wml + "styles+xml");
    add("numbering.xml", "numbering", o.numbering, wml + "numbering+xml");
    add("footnotes.xml", "footnotes", o.footnotes, wml + "footnotes+xml");
    add("endnotes.xml", "endnotes", o.endnotes, wml + "endnotes+xml");
    add("comments.xml", "comments", o.comments, wml + "comments+xml");
    for (var n in (o.files || {})) files.push({ name: n, data: o.files[n] });
    var top = '<Relationship Id="rId1" Type="' + REL + 'officeDocument" Target="' + main + '"/>';
    if (o.core) { files.push({ name: "docProps/core.xml", data: o.core }); top += '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>'; }
    var parts = [
      { name: "[Content_Types].xml", data: HEAD + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/>' +
        '<Override PartName="/' + main + '" ContentType="' + (o.mainType || wml + "document.main+xml") + '"/>' +
        types.map(function (t) { return '<Override PartName="' + esc(t[0]) + '" ContentType="' + t[1] + '"/>'; }).join("") + '</Types>' },
      { name: "_rels/.rels", data: HEAD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + top + '</Relationships>' },
      { name: main, data: o.document || (HEAD + '<w:document' + NS + '><w:body>' + o.body + (o.sect === undefined ? PORTRAIT : o.sect) + '</w:body></w:document>') },
      { name: dir + "_rels/" + base + ".rels", data: HEAD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        rels.map(function (r) { return '<Relationship Id="' + r[0] + '" Type="' + r[1] + '" Target="' + esc(r[2]) + '"' + (r[3] ? ' TargetMode="External"' : '') + '/>'; }).join("") + '</Relationships>' }
    ];
    return zip(parts.concat(files));
  }
  function imp(o, opts) { return I.read(make(o), opts || { name: "fixture.docx" }); }

  // ---- reading the result ---------------------------------------------------------
  function text(b) { return b.runs ? b.runs.map(function (r) { return r.t; }).join("") : (b.text || ""); }
  function brief(blocks) {
    return blocks.map(function (b) {
      var tag = b.type === "heading" ? "h" + b.level : b.type === "list" ? (b.list === "bullet" ? "•" : "#") + b.level + (b.restart ? "r" : "") + (b.continue ? "c" : "")
        : b.type === "paragraph" ? "p" : b.type;
      return tag + (b.land ? "L" : "") + (text(b) ? ":" + text(b) : "");
    });
  }
  function entry(report, code) {
    var found = null;
    ["toCheck", "changed", "notCarried"].forEach(function (l) { report[l].forEach(function (e) { if (e.code === code) found = e; }); });
    return found;
  }
  function count(report, code) { var e = entry(report, code); return e ? e.count : 0; }
  function byText(blocks, t) { for (var i = 0; i < blocks.length; i++) if (text(blocks[i]) === t) return blocks[i]; return null; }
  function cells(table) { return table.rows.map(function (row) { return row.cells.map(function (c) { return (c.span ? "s" + c.span : "") + (c.rowSpan ? "r" + c.rowSpan : "") + "[" + brief(c.blocks).join("|") + "]"; }).join(" "); }); }

  var tests = [];
  function test(name, fn) { tests.push({ name: name, fn: fn }); }
  function run(i) {
    if (i >= tests.length) { clearInterval(tick); finish(); return; }
    var t = tests[i];
    Promise.resolve().then(t.fn).then(null, function (e) { ok(false, t.name + ": threw", (e && (e.cause ? e.cause.stack : e.stack)) || String(e)); })
      .then(function () { run(i + 1); });
  }

  // ---- headings ------------------------------------------------------------------------
  test("headings", function () {
    var styles = STYLES([
      STYLE("Heading1", "heading 1", { pPr: '<w:outlineLvl w:val="0"/>', rPr: '<w:b/>' }),
      STYLE("Heading2", "heading 2", { pPr: '<w:outlineLvl w:val="1"/>' }),
      STYLE("MySection", "Section title (client)", { based: "Heading2" }),
      STYLE("berschrift1", "heading 1"),                       // a German install: the id is localised, the name is not
      STYLE("Lokal", "Überschrift 2"),
      STYLE("Titre3", "Titre 3"),
      STYLE("Heading3", "Rubrique", {}),                       // LibreOffice and Google Docs: only the id says so
      STYLE("Heading5", "heading 5", { pPr: '<w:outlineLvl w:val="4"/>' }),
      STYLE("BoldBig", "Big and bold", { rPr: '<w:b/><w:sz w:val="40"/>' }),
      STYLE("LoopA", "Loop a", { based: "LoopB" }), STYLE("LoopB", "Loop b", { based: "LoopA" })
    ]);
    return imp({ styles: styles, body:
      P("By outline level", '<w:outlineLvl w:val="1"/>') + P("By its style", S("Heading1")) + P("By the chain", S("MySection")) +
      P("Localised id", S("berschrift1")) + P("Localised name", S("Lokal")) + P("French name", S("Titre3")) + P("By id alone", S("Heading3")) +
      P("Deeper than three", S("Heading5")) + P("Only big and bold", S("BoldBig")) + P("Body level nine", S("Heading1") + '<w:outlineLvl w:val="9"/>') +
      PX(R("Bold ", '<w:b/>') + R("and italic", '<w:i/>') + R(" heading"), S("Heading2")) + P("In a loop", S("LoopA"))
    }).then(function (r) {
      var b = r.project.blocks;
      eq(brief(b), ["h2:By outline level", "h1:By its style", "h2:By the chain", "h1:Localised id", "h2:Localised name", "h3:French name", "h3:By id alone",
        "h3:Deeper than three", "p:Only big and bold", "h1:Body level nine", "h2:Bold and italic heading", "p:In a loop"],
        "headings: by outline level, style, chain, localised id and name, id alone; never by bold");
      eq(b[10].runs, [{ t: "Bold and italic heading" }], "headings: bold and italic are not carried on a heading's runs");
      eq(b[8].runs, [{ t: "Only big and bold", b: true }], "headings: a bold style stays bold body text");
      var deep = entry(r.report, "headings-deeper");
      ok(deep && deep.count === 1 && deep.blockIds[0] === b[7].id, "headings: level 5 becomes 3 and is reported with its block", JSON.stringify(deep));
      ok(r.project.options.numberHeadings === false, "headings: not numbered unless a heading style carries numbering");
    });
  });
  test("numbered headings", function () {
    var numbering = HEAD + '<w:numbering' + NS + '><w:abstractNum w:abstractNumId="0"><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="decimal"/><w:pStyle w:val="Heading1"/><w:lvlText w:val="%1"/></w:lvl></w:abstractNum><w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num></w:numbering>';
    return imp({ styles: STYLES([STYLE("Heading1", "heading 1", { pPr: '<w:numPr><w:numId w:val="1"/></w:numPr><w:outlineLvl w:val="0"/>' })]),
      numbering: numbering, body: P("Scope", S("Heading1")) + P("Text") }).then(function (r) {
      eq(brief(r.project.blocks), ["h1:Scope", "p:Text"], "numbered headings: the heading is a heading, not a list item, and its number is not typed in");
      ok(r.project.options.numberHeadings === true, "numbered headings: options.numberHeadings is switched on");
    });
  });

  // ---- title, properties, front matter ------------------------------------------------------
  var CORE = HEAD + '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>Title from the properties</dc:title><dc:creator>Fixture Author</dc:creator></cp:coreProperties>';
  test("title", function () {
    var styles = STYLES([STYLE("Title", "Title"), STYLE("Subtitle", "Subtitle"), STYLE("Heading1", "heading 1"), STYLE("CoverTitle", "Client cover title", { based: "Title" })]);
    return imp({ styles: styles, core: CORE, body: P("  ", S("Title")) + P("Site network review", S("CoverTitle")) + P("A subtitle", S("Subtitle")) +
      P("Prepared for a client") + P("Second title", S("Title")) + P("Body text") }).then(function (r) {
      var p = r.project;
      ok(p.info.title === "Site network review", "title: the first Title paragraph with text fills info.title (found down the style chain)", p.info.title);
      eq(brief(p.blocks), ["p:A subtitle", "p:Prepared for a client", "h1:Second title", "p:Body text"], "title: it is not a block; Subtitle is a paragraph; a later Title is a level 1 heading");
      ok(p.info.author === "Fixture Author", "title: dc:creator fills info.author");
      var fm = entry(r.report, "front-matter");
      ok(fm && fm.count === 2 && JSON.stringify(fm.blockIds) === JSON.stringify([p.blocks[0].id, p.blocks[1].id]) && r.report.toCheck[0] === fm,
        "front matter: the blocks before the first heading are listed under toCheck with their ids", JSON.stringify(fm));
    }).then(function () {
      return imp({ core: CORE, body: P("No title paragraph") + P("And no heading") });
    }).then(function (r) {
      ok(r.project.info.title === "Title from the properties", "title: dc:title is used when no Title paragraph gave one");
      ok(!entry(r.report, "front-matter"), "front matter: not reported when the document has no heading at all (it would list every block)");
    });
  });

  // ---- lists ------------------------------------------------------------------------------------
  function LVL(i, fmt, txt, left, extra) { return '<w:lvl w:ilvl="' + i + '"><w:start w:val="' + ((extra && extra.start) || 1) + '"/><w:numFmt w:val="' + fmt + '"/><w:lvlText w:val="' + txt + '"/><w:pPr><w:ind w:left="' + left + '" w:hanging="360"/></w:pPr></w:lvl>'; }
  var NUMBERING = HEAD + '<w:numbering' + NS + '>' +
    '<w:abstractNum w:abstractNumId="0">' + LVL(0, "bullet", "", 720) + LVL(1, "bullet", "o", 1440) + LVL(2, "bullet", "", 2160) + LVL(3, "bullet", "", 2880) + '</w:abstractNum>' +
    '<w:abstractNum w:abstractNumId="1">' + LVL(0, "decimal", "%1.", 720) + LVL(1, "lowerLetter", "%2.", 1440) + LVL(2, "lowerRoman", "%3.", 2160) + '</w:abstractNum>' +
    '<w:abstractNum w:abstractNumId="2">' + LVL(0, "upperRoman", "Step %1", 720, { start: 5 }) + '</w:abstractNum>' +
    '<w:abstractNum w:abstractNumId="3">' + LVL(0, "none", "", 720) + '</w:abstractNum>' +
    '<w:abstractNum w:abstractNumId="4">' + LVL(0, "decimal", "%1)", 720) + LVL(1, "decimal", "%1.%2.", 1440) + '</w:abstractNum>' +
    '<w:abstractNum w:abstractNumId="5"><w:numStyleLink w:val="ListStyle"/></w:abstractNum>' +
    '<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num><w:num w:numId="2"><w:abstractNumId w:val="1"/></w:num>' +
    '<w:num w:numId="3"><w:abstractNumId w:val="1"/><w:lvlOverride w:ilvl="0"><w:startOverride w:val="1"/></w:lvlOverride></w:num>' +
    '<w:num w:numId="4"><w:abstractNumId w:val="2"/></w:num><w:num w:numId="5"><w:abstractNumId w:val="3"/></w:num>' +
    '<w:num w:numId="6"><w:abstractNumId w:val="1"/></w:num><w:num w:numId="7"><w:abstractNumId w:val="4"/></w:num>' +
    '<w:num w:numId="8"><w:abstractNumId w:val="5"/></w:num><w:num w:numId="9"><w:abstractNumId w:val="0"/></w:num></w:numbering>';
  var LIST_STYLES = STYLES([STYLE("ListNumber", "List Number", { pPr: '<w:numPr><w:numId w:val="2"/></w:numPr>' }),
    STYLE("ListStyle", "My list", { type: "numbering", pPr: '<w:numPr><w:numId w:val="2"/></w:numPr>' })]);
  test("lists", function () {
    return imp({ styles: LIST_STYLES, numbering: NUMBERING, body:
      P("Bullet one", NUM(1, 0)) + P("Bullet nested", NUM(1, 1)) + P("Bullet very deep", NUM(1, 3)) +
      P("Gap one") +
      P("One", NUM(2, 0)) + P("Two", NUM(2, 0)) + P("Two a", NUM(2, 1)) + P("Three", NUM(2, 0)) + P("New list", NUM(3, 0)) +
      P("Gap two") +
      P("Carries on", NUM(2, 0)) +
      P("Gap three") +
      // real Word: Increase Indent on a list item leaves ilvl at 0 and writes a larger indent
      P("Flat", NUM(6, 0)) + P("Pushed in", NUM(6, 0) + '<w:ind w:left="1080"/>') + P("Flat again", NUM(6, 0)) +
      P("Gap four") +
      P("Whole list moved a", NUM(9, 0) + '<w:ind w:left="2000"/>') + P("Whole list moved b", NUM(9, 0) + '<w:ind w:left="2000"/>') +
      P("Gap five") +
      P("Roman step", NUM(4, 0)) + P("Format none", NUM(5, 0)) + P("By its style", S("ListNumber")) +
      P("Switched off", S("ListNumber") + '<w:numPr><w:numId w:val="0"/></w:numPr>') + P("No such list", NUM(77, 0)) +
      P("Gap six") +
      P("Bracket", NUM(7, 0)) + P("Legal style", NUM(7, 1)) + P("Linked style", NUM(8, 0))
    }).then(function (r) {
      var b = r.project.blocks;
      eq(brief(b), ["•0:Bullet one", "•1:Bullet nested", "•2:Bullet very deep", "p:Gap one",
        "#0:One", "#0:Two", "#1:Two a", "#0:Three", "#0r:New list", "p:Gap two", "#0:Carries on", "p:Gap three",
        "#0:Flat", "#0:Pushed in", "#0:Flat again", "p:Gap four", "•0:Whole list moved a", "•0:Whole list moved b", "p:Gap five",
        "#0:Roman step", "p:Format none", "#0:By its style", "p:Switched off", "p:No such list", "p:Gap six",
        "#0:Bracket", "#1:Legal style", "#0r:Linked style"],
        "lists: kind, level, restart on a new numId, no carrying on once another numbered list has come between, one item indented, a whole list indented, none, off, via a style");
      var deep = entry(r.report, "lists-deeper");
      ok(deep && deep.count === 1 && deep.blockIds[0] === b[2].id, "lists: a fourth level is capped at 2 and reported", JSON.stringify(deep));
      var ln = entry(r.report, "list-numbering"), want = [byText(b, "Carries on").id, byText(b, "Roman step").id, byText(b, "By its style").id, byText(b, "Legal style").id];
      eq(ln && ln.blockIds, want, "list numbering: reported for a list resumed after another list, a format out of the house order, literal text with a start of 5, and 1.1 numbering; not for 1. a. i. or 1)");
      ok(b.every(function (x) { return !("__li" in x) && JSON.stringify(x).indexOf("__") < 0; }), "lists: no working fields are left on the blocks");
    });
  });
  // real Word: ListIndent and ListOutdent through COM (and the ribbon's indent buttons on some lists)
  // never change ilvl. Every item stays at level 0 and only w:ind moves: 720 is the level's own
  // indent, 1080 and 1440 are pushed in, and 360 is an item pulled back past the start.
  test("lists as Word really indents them", function () {
    function IND(n) { return NUM(2, 0) + '<w:ind w:left="' + n + '"/>'; }
    return imp({ styles: LIST_STYLES, numbering: NUMBERING, body:
      P("First", NUM(2, 0)) + P("Second", NUM(2, 0)) + P("Second, a", IND(1080)) + P("Second, b", IND(1080)) + P("Second, b, i", IND(1440)) + P("Pulled back", IND(360)) + P("Last", NUM(2, 0)) }).then(function (r) {
      eq(brief(r.project.blocks), ["#0:First", "#0:Second", "#0:Second, a", "#0:Second, b", "#0:Second, b, i", "#0:Pulled back", "#0:Last"],
        "lists: a numbered item keeps its level whatever its indent, because Word numbers it 3, 4, 5 all the same");
      ok(!entry(r.report, "list-numbering"), "lists: so no number changes and nothing is reported");
    });
  });
  test("list functions", function () {
    var styles = I.parseStyles(LIST_STYLES), numbering = I.parseNumbering(NUMBERING);
    var doc = new DOMParser().parseFromString('<w:pPr' + NS + '>' + NUM(2, 1) + '<w:ind w:left="1500"/></w:pPr>', "application/xml");
    var li = I.listInfo(doc.documentElement, styles, numbering);
    ok(li && li.kind === "number" && li.numId === "2" && li.ilvl === 1 && li.numFmt === "lowerLetter" && li.left === 1500, "listInfo: kind, numId, level, format and the paragraph's own indent", JSON.stringify(li));

      eq(brief(b), ["h1:Introduction", "p:Kept inserted moved here commented", "p:After the contents"], "tracked changes are accepted; the cover page, both contents lists and everything in them are left out");
      var tc = entry(rep, "tracked-changes");
      eq(tc && [tc.count, tc.insertions, tc.deletions], [4, 2, 2], "tracked changes: reported once with both counts");
      var c = entry(rep, "comments");
      eq(c && [c.count, c.examples], [2, ["Is this right?", "Check the figure."]], "comments: dropped, counted and quoted");
      var h = entry(rep, "headers-footers");
      eq(h && [h.count, h.examples], [2, ["Customer header text", "Page 1 of 9, customer footer"]], "headers and footers: not carried, quoted; an empty one is not counted");
      eq([count(rep, "contents"), r.project.options.contents], [2, true], "contents: a contents control and a TOC field are each dropped whole and switch options.contents on");
      eq([count(rep, "internal-links"), count(rep, "fields")], [0, 0], "contents: the links and page numbers inside a dropped contents list are not reported one by one");
      var cover = entry(rep, "cover-page");
      eq(cover && [cover.count, cover.examples], [1, ["ACME Water", "Network review 2026"]], "cover page: a cover building block is dropped and its text quoted");
      ok(!entry(rep, "front-matter"), "front matter: nothing is left before the first heading here");
    });
  });

  // ---- sections ------------------------------------------------------------------------------------------------
  test("sections", function () {
    var LAND = '<w:sectPr><w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/></w:sectPr>';
    var COLS = '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:cols w:num="2" w:space="708"/></w:sectPr>';
    var CONT = '<w:sectPr><w:type w:val="continuous"/><w:pgSz w:w="11906" w:h="16838"/></w:sectPr>';
    return imp({ sect: CONT, body:
      P("p1") + P("p2", PORTRAIT) + P("l1") + T([TR([TC("wide")])], [1]) + P("l2", LAND) + P("p3") + P("p4", COLS) + P("p5", PORTRAIT) + P("p6")
    }).then(function (r) {
      eq(brief(r.project.blocks), ["p:p1", "p:p2", "pL:l1", "tableL", "pL:l2", "p:p3", "p:p4", "pageBreak", "p:p5", "p:p6"],
        "sections: blocks of a landscape section are flagged; a new-page section without a turn is a page break; a turn and a continuous break add nothing");
      var c = entry(r.report, "columns");
      ok(c && c.count === 1 && c.blockIds[0] === byText(r.project.blocks, "p3").id, "sections: two columns become one and are reported", JSON.stringify(c));
    }).then(function () {
      return imp({ sect: '<w:sectPr><w:pgSz w:w="16838" w:h="11906"/></w:sectPr>', body: P("only") });
    }).then(function (r) {
      ok(r.project.blocks[0].land === true, "sections: a page wider than it is tall is landscape even without w:orient");
    });
  });

  // ---- finding the document ----------------------------------------------------------------------------------------
  test("a main part with another name", function () {
    return imp({ main: "word/document2.xml", styles: STYLES([STYLE("Heading1", "heading 1")]), body: P("Found", S("Heading1")) + P("Text") }).then(function (r) {
      eq(brief(r.project.blocks), ["h1:Found", "p:Text"], "the main part is found through the officeDocument relationship, and its styles through its own relationships");
    }).then(function () {
      return imp({ main: "content/main.xml", styles: STYLES([STYLE("Heading1", "heading 1")]), body: P("Elsewhere", S("Heading1")) });
    }).then(function (r) {
      eq(brief(r.project.blocks), ["h1:Elsewhere"], "nothing depends on the word/ folder");
    });
  });

  // ---- the project and the report ---------------------------------------------------------------------------------------
  test("project and report", function () {
    var seen = [];
    return imp({ styles: STYLES([STYLE("Heading1", "heading 1")]), body: P("One", S("Heading1")) + P("Two") }, { name: "My report.docx", onProgress: function (f, label) { seen.push([f, label]); } }).then(function (r) {
      var p = r.project, rep = r.report;
      ok(p.schema === "spt-document/1.0" && p.kind === "report" && /^doc-/.test(p.id) && !isNaN(Date.parse(p.createdAt)), "project: schema, kind report, an id and a creation time");
      eq(Object.keys(p.info).sort(), ["author", "authorisedBy", "classification", "client", "date", "docType", "issuedDate", "issuedTo", "qaReviewBy", "reference", "revision", "site", "title"], "project: every info field is present");
      eq([p.info.revision, p.info.classification, p.options], ["0.1", "Confidential", { numberHeadings: false, contents: false }], "project: defaults for revision, classification and options");
      ok(typeof p.nextId === "number" && p.blocks.every(function (b) { return +b.id.slice(1) < p.nextId; }), "project: nextId is past every id handed out");
      ok(p.footnotes && p.media && p.parts && !("theme" in p), "project: footnotes, media and parts are there; no theme without a kept object");
      ok(p.importReport === rep, "project: the report is stored as importReport");
      eq([rep.source.name, rep.source.size > 0, !isNaN(Date.parse(rep.source.importedAt))], ["My report.docx", true, true], "report: the source's name, size and time");
      eq(rep.carried, { headings: 1, paragraphs: 1, listItems: 0, tables: 0, pictures: 0, keptObjects: 0, captions: 0, footnotes: 0, links: 0 }, "report: carried counts");
      eq(rep.changed, [{ code: "formatting", count: 1 }], "report: formatting is always reported, and nothing else for a plain document");
      eq([rep.toCheck, rep.notCarried], [[], []], "report: empty lists are empty");
      var fr = seen.map(function (s) { return s[0]; });
      ok(fr.length >= 3 && fr[fr.length - 1] === 1 && fr.every(function (f, i) { return i === 0 || f >= fr[i - 1]; }) && seen.every(function (s) { return typeof s[1] === "string" && s[1]; }),
        "progress: fractions rise to 1, each with a label", JSON.stringify(seen));
    }).then(function () {
      var body = ""; for (var i = 0; i < 1500; i++) body += P("Paragraph " + i);
      return imp({ body: body });
    }).then(function (r) {
      ok(r.project.blocks.length === 1500 && text(r.project.blocks[1499]) === "Paragraph 1499", "a long document is read in steps and arrives whole");
    });
  });

  // ---- the exported parsers -----------------------------------------------------------------------------------------------
  test("parseStyles and headingLevel", function () {
    var s = I.parseStyles(STYLES([
      STYLE("Heading1", "heading 1", { pPr: '<w:outlineLvl w:val="0"/><w:jc w:val="center"/>', rPr: '<w:b/><w:sz w:val="32"/><w:color w:val="0F4761"/>' }),
      STYLE("Sub", "Client sub heading", { based: "Heading1", rPr: '<w:b w:val="0"/><w:i/>' }),
      STYLE("A", "a", { based: "B" }), STYLE("B", "b", { based: "A" })
    ], '<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Aptos" w:hAnsi="Aptos"/><w:sz w:val="24"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="160" w:line="278" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>'));
    var sub = s.byId.Sub;
    eq([sub.name, sub.basedOn, sub.outlineLvl, sub.b, sub.i, sub.size, sub.color, sub.font, sub.jc, sub.spacing.after], ["Client sub heading", "Heading1", 0, false, true, 32, "0F4761", "Aptos", "center", "160"],
      "parseStyles: a style resolved down its chain and over the document defaults");
    ok(s.byId.A && s.byId.B && s.defaultParagraph === "Normal", "parseStyles: a loop in basedOn ends instead of hanging; the default paragraph style is found");
    function pPr(inner) { return new DOMParser().parseFromString('<w:pPr' + NS + '>' + inner + '</w:pPr>', "application/xml").documentElement; }
    eq([I.headingLevel(pPr(S("Sub")), s), I.headingLevel(pPr('<w:outlineLvl w:val="2"/>'), s), I.headingLevel(pPr(S("A")), s), I.headingLevel(null, s)], [1, 3, 0, 0], "headingLevel: from the chain, from the paragraph, none");
    var empty = I.parseStyles("");
    ok(empty.get("x") === null && I.headingLevel(pPr(S("Heading1")), empty) === 0, "parseStyles: no styles part gives an empty map, not an error");
    var th = I.parseTheme('<a:theme xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:themeElements><a:clrScheme name="x"><a:dk1><a:sysClr val="windowText" lastClr="000000"/></a:dk1><a:accent1><a:srgbClr val="C00000"/></a:accent1></a:clrScheme><a:fontScheme name="x"><a:majorFont><a:latin typeface="Aptos Display"/><a:ea typeface=""/><a:cs typeface=""/></a:majorFont><a:minorFont><a:latin typeface="Georgia"/><a:ea typeface=""/><a:cs typeface=""/></a:minorFont></a:fontScheme></a:themeElements></a:theme>');
    eq([th.colors.accent1, th.colors.dk1, th.fonts.minor.latin, th.fonts.major.latin], ["C00000", "000000", "Georgia", "Aptos Display"], "parseTheme: colours and fonts");
  });

  run(0);
})();
</script>
</body></html>
