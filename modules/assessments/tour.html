    (function () {
      try {
        var t = localStorage.getItem("ot-theme");
        if (t !== "dark" && t !== "light") {
          t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>

  <script>
    // Combined demo page: every assessment is pre-filled with a complete,
    // realistic engagement. Switch between them with the Instrument list in the
    // sidebar; each one is ready to export to Word / Excel from the header.
    //
    // The project metadata (client, dates) is shared across the file, so we
    // re-apply the active assessment's dataset on every instrument switch to keep
    // its client name, evidence, remediation and narrative internally consistent.
    // Each instrument keeps its own responses, so switching is cheap.
    window.addEventListener("DOMContentLoaded", function () {
      var App = window.App, E = App.Engine;
      App.UI.init();

      // Map each active instrument id to its demo-data applier.
      var SEED = {
        "iec-62443-3-3":      App.TourSL,
        "iec-62443-4-2":      App.Tour42,
        "ncsc-caf":           App.TourCAF,
        "general-ot-posture": App.TourPosture,
        "iec-62443-2-1-2024": App.TourML,
        "nis2-assessment":    App.TourNIS2,
        "nis2-quick-gap":     App.TourNIS2Quick,
        "iec-62443-4-1":      App.Tour41,
        "iec-62443-2-1-2010": App.TourCSMS,
        "ncsc-caf-aviation":  App.TourCAFAviation,
        "eu-cra":             App.TourCRA,
        "eu-machinery":       App.TourMachinery,
        "supplier-screener":  App.TourSupplier,
        "risk-appetite":      App.TourRiskAppetite,
        "nist-800-53":        App.TourNIST,
        "nist-800-82":        App.TourNIST82,
        "cis-controls-v8":    App.TourCIS,
        "onr-syaps-management": App.TourSyAPS.management,
        "onr-syaps-cyber":      App.TourSyAPS.cyber,
        "onr-syaps-full":       App.TourSyAPS.full
      };

      // Seed each instrument's dataset the first time it is activated.
      // updateMetadata (inside apply) emits "engagement-changed", which the UI
      // re-renders on, so the view ends up consistent.
      //
      // ONCE each, not on every activation. This handler fires again every time
      // the consultant opens an instrument they have already looked at, and
      // again when this script activates 62443-3-3 at the end to land on its
      // report. Re-applying is not harmless: it adds the demo's zones a second
      // time, and now that three datasets carry a previous assessment it also
      // mints a second 2024 assessment on every revisit.
      var seeded = {};
      E.on("instrument-changed", function (inst) {
        if (!inst) return;
        var mod = SEED[inst.id];
        if (!mod || typeof mod.apply !== "function") return;
        if (!seeded[inst.id]) {
          seeded[inst.id] = true;
          mod.apply(E);
          return;
        }
        // Already seeded, but the CLIENT NAME is shared by the whole file while
        // each demo is a different organisation - so whichever dataset was
        // applied last owned the header for all of them, and every demo showed
        // the last one's client. Re-stamping just the metadata on each switch
        // puts the right organisation back at the top. Metadata only: calling
        // apply() again would duplicate answers and zones, which is what the
        // seeded guard is here to prevent.
        if (mod.metadata && E.updateMetadata) E.updateMetadata(mod.metadata);
      });

      // Seed every assessment once so all are filled (the handler above applies
      // each as it is activated).
      Object.keys(SEED).forEach(function (id) {
        try { E.activateInstrument(id); } catch (e) { console.error("Seed failed for " + id, e); }
      });

      // Where to land. There used to be a page per demo - tour-caf-report.html,
      // tour-sl-guidance.html and eight more - each one a copy of this file's
      // script list that activated one instrument and went to one view. They
      // are a hash on this page instead:
      //
      //   tour.html                                  every demo, 62443-3-3 report
      //   tour.html#ncsc-caf                         the CAF demo, its report
      //   tour.html#ncsc-caf/caf-principle/C1        a specific capture page
      //   tour.html#iec-62443-3-3/fr/FR1             SL guidance for FR1
      //   tour.html#risk-appetite/ra-verdict         the assessor's read
      //
      // One page to keep current, and a deep link for any instrument and view
      // rather than only the ten that happened to have a file.
      function land() {
        var parts = String(location.hash || "").replace(/^#/, "").split("/").filter(Boolean);
        var id = parts[0] || "iec-62443-3-3";
        var view = parts[1] || "report";
        var arg = parts[2] || null;
        if (!SEED[id] && id !== "iec-62443-3-3") {
          console.warn("No demo for '" + id + "'; landing on the default.");
          id = "iec-62443-3-3"; view = "report"; arg = null;
        }
        try {
          E.activateInstrument(id);
          App.UI.go(view, arg);
        } catch (e) {
          console.error("Could not land on " + id + "/" + view, e);
          E.activateInstrument("iec-62443-3-3");
          App.UI.go("report");
        }
      }
      land();
      // Editing the hash re-lands without a reload, so one window can walk
      // through several demos.
      window.addEventListener("hashchange", land);
    });
  </script>
