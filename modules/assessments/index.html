<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OT Cyber Assessment Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/review-author.css" />
  <link rel="stylesheet" href="css/doc-preview.css" />
  <!-- Apply the saved (or system) colour theme before first paint to avoid a
       flash. The toggle in the header updates this and persists the choice. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("ot-theme");
        if (t !== "dark" && t !== "light") {
          t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <span class="brand-logo"><img src="data/shared/AVEVASelect-LogoLockup-Landscape-Positive.png" alt="SolutionsPT - AVEVA Select UK &amp; Ireland" /></span>
        <span class="sub">OT Cyber Assessment Tool</span>
      </div>
      <span id="engagement-summary" class="engagement-summary"></span>
      <div class="spacer"></div>
      <div class="header-actions no-print">
        <button id="btn-theme" class="btn ghost" title="Toggle dark mode" aria-label="Toggle dark mode"></button>
        <!-- New starts a fresh project and discards the current one, so it is
             separated from the everyday project actions beside it. Word is the
             single primary action: it is the client deliverable, and Excel as a
             co-equal blue button made neither read as the default. -->
        <button id="btn-new"  class="btn ghost" title="Start a new project. The current one is discarded.">New</button>
        <span class="header-sep" aria-hidden="true"></span>
        <button id="btn-engagement" class="btn ghost" title="Edit engagement details">Engagement</button>
        <button id="btn-load" class="btn ghost" title="Load a project JSON file (Save then writes back to it)">Load</button>
        <button id="btn-save" class="btn ghost" title="Save the project to its file, overwriting it in place. Shift+click: Save as… (new file/copy)">Save</button>
        <span class="header-sep" aria-hidden="true"></span>
        <button id="btn-xlsx" class="btn ghost" title="Export technical workbook">Excel</button>
        <button id="btn-docx" class="btn primary" title="Export executive document">Word</button>
        <input id="file-input" type="file" accept="application/json,.json" class="hidden" />
      </div>
    </div>
    <div id="sidebar" class="sidebar no-print"></div>
    <div id="main" class="main"></div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <!-- Vendor libraries (classic scripts, no module imports) -->
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/exceljs.min.js"></script>
  <script src="vendor/docx.umd.js"></script>

  <!-- Data: a single manifest that document.write()s the shared and active-instrument
       files in dependency order. Regenerate via scripts/build-data.ps1 after editing
       any JSON or adding a new instrument folder. -->
  <script src="data/manifest.js"></script>

  <!-- App modules (order matters) -->
  <script src="js/version.js"></script>
  <script src="js/product.js"></script>
  <script src="js/host-bridge.js"></script>
  <script src="js/logo.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/scoring-domain-letter.js"></script>
  <script src="js/scoring-caf-achieved.js"></script>
  <script src="js/scoring-program-ml.js"></script>
  <script src="js/scoring-nis2.js"></script>
  <script src="js/scoring-csms.js"></script>
  <script src="js/scoring-cra.js"></script>
  <script src="js/scoring-risk-appetite.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/report-sections.js"></script>
  <script src="js/report.js"></script>
  <script src="js/export-xlsx.js"></script>
  <script src="js/hero-asset.js"></script>
  <script src="js/export-docx.js"></script>
  <!-- The Word preview: the exported file read back (docx-import.js, over
       zip-io.js) and drawn as pages (doc-preview.js), all shared/ copies. -->
  <script src="js/zip-io.js"></script>
  <script src="js/docx-import.js"></script>
  <script src="js/doc-preview.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/docx-blocks.js"></script>
  <script src="js/review-core.js"></script>
  <script src="js/review-author.js"></script>
  <script src="js/review.js"></script>

  <script>
    window.addEventListener("DOMContentLoaded", function () {
      try {
        window.App.UI.init({ autosave: true });
      } catch (e) {
        console.error(e);
        var el = document.getElementById("main");
        if (el) el.innerHTML = "<div class='card'><div class='card-b'><h2>Failed to start</h2><pre style='white-space:pre-wrap'>" + (e && e.stack || e) + "</pre></div></div>";
      }
    });
  </script>
</body>
</html>
