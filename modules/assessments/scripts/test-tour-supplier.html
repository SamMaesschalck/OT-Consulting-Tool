<!doctype html>
<html><head><meta charset="utf-8"/><title>Supplier screener tour dataset</title>
<style>body{font:16px "Segoe UI",sans-serif;padding:22px;color:#1A2533}.ok{color:#2E7D52}.bad{color:#B23A33;font-weight:600}.row{padding:2px 0;font-family:Consolas,monospace;font-size:14px}.sum{padding:10px;border:1px solid #C8D2DD;border-radius:4px;margin:14px 0;font-weight:600}</style>
</head>
<body>
<h1>Supplier Cyber Exposure Screener tour dataset - complete demo report</h1>
<div id="out"></div>
<div id="summary" class="sum"></div>

<script src="harness.js"></script>
<script>H.app({ docx: "mock", tours: H.ALL_TOURS }); H.dom();</script>
<script>
window.docx = (function () {
  function TextRun(opts) {
    if (typeof opts === "string") opts = { text: opts };
    this.__type = "TextRun";
    this.text = opts.text != null ? opts.text : (Array.isArray(opts.children) ? opts.children.join("") : "");
    this.bold = !!opts.bold; this.italics = !!opts.italics;
    this.color = opts.color || null; this.size = opts.size || null;
  }
  function Paragraph(opts) {
    opts = opts || {};
    this.__type = "Paragraph";
    this.children = opts.children || [];
    this.style = opts.style || null; this.heading = opts.heading || null;
    this.text = this.children.map(function (r) { return r && r.text != null ? r.text : ""; }).join("");
    this.runs = this.children;
  }
  function TableCell(opts) { this.__type = "TableCell"; this.children = (opts && opts.children) || []; this.shading = (opts && opts.shading) || null; }
  function TableRow(opts)  { this.__type = "TableRow"; this.children = (opts && opts.children) || []; }
  function Table(opts)     { this.__type = "Table"; this.rows = (opts && opts.rows) || []; }
  function ImageRun(opts)  { this.__type = "ImageRun"; this.text = ""; }
  function PageBreak()     { this.__type = "PageBreak"; this.text = ""; }
  function Header(opts)    { this.__type = "Header"; this.children = (opts && opts.children) || []; }
  function Footer(opts)    { this.__type = "Footer"; this.children = (opts && opts.children) || []; }
  function Document(opts)  { this.__type = "Document"; this.sections = (opts && opts.sections) || []; }
  return {
    Document: Document, Paragraph: Paragraph, TextRun: TextRun,
    TableCell: TableCell, TableRow: TableRow, Table: Table,
    ImageRun: ImageRun, PageBreak: PageBreak, Header: Header, Footer: Footer,
    HeadingLevel: { TITLE: "Title", HEADING_1: "Heading1", HEADING_2: "Heading2", HEADING_3: "Heading3" },
    AlignmentType: { LEFT: "left", CENTER: "center", RIGHT: "right", BOTH: "both" },
    WidthType: { PERCENTAGE: "pct", DXA: "dxa" },
    ShadingType: { SOLID: "solid" },
    TableLayoutType: { FIXED: "fixed" },
    PageOrientation: { PORTRAIT: "portrait", LANDSCAPE: "landscape" },
    HeightRule: { EXACT: "exact", ATLEAST: "atLeast" },
    PageNumber: { CURRENT: "current" },
    Packer: { toBlob: function (doc) { window.__capturedDoc = doc; return Promise.resolve(new Blob(["dummy"])); } }
  };
})();
</script>
<script>
(function () {
  window.confirm = function () { return true; };
  window.alert = function () {};
  var A = window.App, E = A.Engine;
  // Chart rasterisation is flaky under headless file://; stub for determinism.
  A.Charts.svgToPngBlob = function (svg, scale, cb) { cb(new Blob(["png"])); };
  var out = document.getElementById("out");
  var pass = 0, fail = 0;
  function check(label, cond, detail) {
    var d = document.createElement("div");
    d.className = "row " + (cond ? "ok" : "bad");
    d.textContent = (cond ? "PASS " : "FAIL ") + label + (!cond && detail ? " — " + detail : "");
    out.appendChild(d);
    if (cond) pass++; else fail++;
  }
  function finish() {
    var s = document.getElementById("summary");
    s.className = "sum " + (fail === 0 ? "ok" : "bad");
    s.textContent = fail === 0 ? "ALL TESTS PASSED (" + pass + ")" : pass + " passed, " + fail + " FAILED";
  }
  function main() { return document.getElementById("main"); }

  try {
    E.loadCatalog();
    A.UI.init({ autosave: false });

    // Replicate the combined tour.html: seed every demo (H.demoSeeds is
    // tour.html's SEED map), each once on its first activation and on a later
    // one only its metadata stamped again, then land on the screener.
    var SEED = H.demoSeeds(), seeded = {};
    E.on("instrument-changed", function (inst) {
      var mod = inst && SEED[inst.id];
      if (!mod || typeof mod.apply !== "function") return;
      if (!seeded[inst.id]) { seeded[inst.id] = true; mod.apply(E); return; }
      if (mod.metadata && E.updateMetadata) E.updateMetadata(mod.metadata);
    });
    var seedFailures = [];
    Object.keys(SEED).forEach(function (id) {
      try { E.activateInstrument(id); } catch (e) { seedFailures.push(id + ": " + e.message); }
    });
    var nSeed = Object.keys(SEED).length;
    check("all " + nSeed + " demo assessments seed without throwing", seedFailures.length === 0 && nSeed === 20, seedFailures.join(" | "));

    E.activateInstrument("supplier-screener");
    check("App.TourSupplier applier exposed", !!A.TourSupplier && typeof A.TourSupplier.apply === "function");
    var inst = E.state.instrument;
    var tid = E.state.activeTargetId;
    check("the supplier is the target (Ferrovia Controls Ltd)", (E.getActiveTarget() || {}).name === "Ferrovia Controls Ltd");

    // All 18 questions answered with evidence; every below-top question planned.
    var unanswered = [], noEvidence = [], gapsNoPlan = [];
    inst.questions.forEach(function (q) {
      var r = E.findResponse(tid, q.id);
      if (!r || typeof r.band !== "number") { unanswered.push(q.id); return; }
      if (!r.evidence) noEvidence.push(q.id);
      if (r.band < 3 && !(r.owner && r.action && r.impact && r.priorityBand)) gapsNoPlan.push(q.id);
    });
    check("all 18 questions answered with a band", unanswered.length === 0, unanswered.join(","));
    check("every answer carries evidence", noEvidence.length === 0, noEvidence.join(","));
    check("every below-top question carries a full improvement plan", gapsNoPlan.length === 0, gapsNoPlan.join(","));

    var scored = E.scoreActiveTarget();
    var byDom = {}; scored.perDomain.forEach(function (d) { byDom[d.domainId] = d; });
    check("grades tell the story: strong dev/vuln, weak reg, mid prod/chain",
      byDom.corp.grade === "B" && byDom.dev.grade === "B" && byDom.prod.grade === "C" &&
      byDom.vuln.grade === "A" && byDom.reg.grade === "F" && byDom.chain.grade === "C",
      scored.perDomain.map(function (d) { return d.domainId + "=" + d.grade; }).join(","));
    check("headline held at D by the regulatory F", scored.headlineGrade === "D", String(scored.headlineGrade));
    check("14 below-top questions on the roadmap", (scored.roadmap || []).length === 14, String((scored.roadmap || []).length));

    // Routing: prod (C) and reg (F) fire; dev (B) and vuln (A) do not.
    var res = A.Report.triggeredFollowUpRoutes(inst, scored);
    var routeDoms = res.triggered.map(function (t) { return t.route.domainId; }).join(",");
    check("routing fires for prod and reg only", routeDoms === "prod,reg", routeDoms);

    var rn = E.getReportNarrative ? E.getReportNarrative() : null;
    check("consultant narrative filled", !!rn && /Commission the EU CRA Gap Assessment/.test(rn.topPriorities || ""));

    A.UI.go("report");
    var t = main().textContent;
    check("report shows Where to go deeper with the CRA route", t.indexOf("Where to go deeper") !== -1 && t.indexOf("EU CRA Gap Assessment / EU Machinery Regulation Gap Assessment") !== -1);

    // ---- the Word report ----
    A.ExportDOCX.buildAsync(E.state.engagement, inst, null, E.state.profile, E.getActiveNarrative(),
      { targetId: tid },
      function (err) {
        try {
          if (err) { check("tour Word report builds - " + (err.message || err), false); finish(); return; }
          var doc = window.__capturedDoc, paras = [];
          function walk(node) {
            if (!node) return;
            if (node.__type === "Paragraph") { paras.push(node); return; }
            if (node.__type === "Table") { node.rows.forEach(walk); return; }
            if (node.__type === "TableRow" || node.__type === "TableCell") { node.children.forEach(walk); return; }
            if (Array.isArray(node)) node.forEach(walk);
          }
          doc.sections.forEach(function (s) { walk(s.children); });
          var allText = paras.map(function (p) { return p.text; }).join("\n");

          check("doc builds with the screener's own cover", allText.indexOf("Supplier Cyber") !== -1 && allText.indexOf("General OT Security") === -1);
          check("exec summary: supplier grade D for the client", allText.indexOf("indicative supplier cyber exposure grade of D") !== -1 && allText.indexOf("Aldergate Rail Infrastructure") !== -1);
          check("consultant narrative lands in the doc", allText.indexOf("Commission the EU CRA Gap Assessment") !== -1);
          check("Where to go deeper section routes to the CRA deep dive", allText.indexOf("Where to go deeper") !== -1 && allText.indexOf("Regulatory exposure & readiness (graded F)") !== -1);
          check("roadmap carries the remediation plans", allText.indexOf("per-session activated access") !== -1);
          check("basis of assessment carries the screening interviews", allText.indexOf("M. Alvarez") !== -1);
        } catch (e) { check("doc assertions threw: " + e.message, false); }
        finish();
      });
  } catch (e) {
    check("harness threw: " + (e && e.message), false);
    if (e && e.stack) { var d = document.createElement("div"); d.className = "row"; d.textContent = e.stack; out.appendChild(d); }
    finish();
  }
})();
</script>
</body></html>
