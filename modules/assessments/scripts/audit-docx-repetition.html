<html lang="en"><head><meta charset="utf-8"/><title>Word report repetition, every demo</title></head>
<body>
<!--
  Builds the real Word report for every demo dataset (as tour.html seeds them,
  with the options the export buttons pass) and lists the text that appears
  more than once in one document: whole sentences of eight words or more, and
  ten-word phrases shared between different paragraphs. Table cells count, so
  a definition repeated in the glossary shows up. An audit, not a test: it
  prints the findings and AUDIT-DONE.
  Optional query string ?only=<instrument id> limits it to one report.
-->
<pre id="out">running…</pre>
<script src="harness.js"></script>
<script>H.app({ xlsx: true, docx: true, tours: ["41", "42", "caf", "caf-aviation", "cis", "cra", "csms", "machinery", "ml", "nis2", "nis2-quick", "nist", "nist82", "posture", "risk-appetite", "sl", "supplier", "syaps"] }); H.dom();</script>
<script>
function docXml(blob) {
  return blob.arrayBuffer().then(function (buf) {
    var v = new DataView(buf), u8 = new Uint8Array(buf), eocd = -1;
    for (var i = buf.byteLength - 22; i >= 0; i--) { if (v.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
    var n = v.getUint16(eocd + 10, true), p = v.getUint32(eocd + 16, true);
    for (var k = 0; k < n; k++) {
      var method = v.getUint16(p + 10, true), csize = v.getUint32(p + 20, true);
      var nlen = v.getUint16(p + 28, true), xlen = v.getUint16(p + 30, true), clen = v.getUint16(p + 32, true);
      var local = v.getUint32(p + 42, true);
      var name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
      if (name === "word/document.xml") {
        var start = local + 30 + v.getUint16(local + 26, true) + v.getUint16(local + 28, true);
        var data = u8.subarray(start, start + csize);
        var bytes = method === 0 ? Promise.resolve(data)
          : new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
        return bytes.then(function (b) { return new TextDecoder().decode(b); });
      }
      p += 46 + nlen + xlen + clen;
    }
    return "";
  });
}
var W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
// Every paragraph's text, in document order, tables included.
function paragraphs(xml) {
  var doc = new DOMParser().parseFromString(xml, "application/xml");
  return Array.prototype.map.call(doc.getElementsByTagNameNS(W, "p"), function (p) {
    return Array.prototype.map.call(p.getElementsByTagNameNS(W, "t"), function (t) { return t.textContent; }).join("").replace(/\s+/g, " ").trim();
  }).filter(function (s) { return s.length > 0; });
}
function sentences(para) {
  return para.split(/(?<=[.?!])\s+(?=[A-Z0-9“"(])/).map(function (s) { return s.trim(); }).filter(Boolean);
}
function words(s) { return s.toLowerCase().replace(/[^a-z0-9' ]+/g, " ").split(/\s+/).filter(Boolean); }

function analyse(paras) {
  var sentSeen = {}, dupSent = [];
  paras.forEach(function (p, pi) {
    sentences(p).forEach(function (s) {
      if (words(s).length < 8) return;
      var key = s.toLowerCase();
      if (sentSeen[key] != null && sentSeen[key] !== pi) { if (dupSent.indexOf(s) === -1) dupSent.push(s); }
      else if (sentSeen[key] == null) sentSeen[key] = pi;
    });
  });
  // Ten-word phrases shared by different paragraphs, merged into runs.
  var N = 10, gramAt = {}, shared = {};
  paras.forEach(function (p, pi) {
    var w = words(p);
    for (var i = 0; i + N <= w.length; i++) {
      var g = w.slice(i, i + N).join(" ");
      if (gramAt[g] == null) gramAt[g] = pi;
      else if (gramAt[g] !== pi) shared[g] = true;
    }
  });
  var phrases = Object.keys(shared);
  // Drop phrases already explained by a duplicated whole sentence.
  var dupText = dupSent.join(" ").toLowerCase().replace(/[^a-z0-9' ]+/g, " ");
  phrases = phrases.filter(function (g) { return dupText.indexOf(g) === -1; });
  return { dupSent: dupSent, phrases: phrases, words: paras.reduce(function (a, p) { return a + words(p).length; }, 0) };
}

(function () {
  var out = document.getElementById("out"), lines = [];
  var A = window.App, E = A.Engine;
  window.confirm = function () { return true; }; window.alert = function () {};
  A.Charts.svgToPngBlob = function (svg, s, cb) { cb(new Blob(["png"])); };
  E.loadCatalog(); A.UI.init({ autosave: false });
  var SEED = {
    "iec-62443-3-3": A.TourSL, "iec-62443-4-2": A.Tour42, "ncsc-caf": A.TourCAF, "general-ot-posture": A.TourPosture,
    "iec-62443-2-1-2024": A.TourML, "nis2-assessment": A.TourNIS2, "nis2-quick-gap": A.TourNIS2Quick, "iec-62443-4-1": A.Tour41,
    "iec-62443-2-1-2010": A.TourCSMS, "ncsc-caf-aviation": A.TourCAFAviation, "eu-cra": A.TourCRA, "eu-machinery": A.TourMachinery,
    "supplier-screener": A.TourSupplier, "risk-appetite": A.TourRiskAppetite, "nist-800-53": A.TourNIST, "nist-800-82": A.TourNIST82,
    "cis-controls-v8": A.TourCIS, "onr-syaps-management": A.TourSyAPS.management, "onr-syaps-cyber": A.TourSyAPS.cyber, "onr-syaps-full": A.TourSyAPS.full
  };
  E.on("instrument-changed", function (inst) { var m = inst && SEED[inst.id]; if (m && m.apply) m.apply(E); });
  var only = (location.search.match(/only=([^&]+)/) || [])[1];
  var ids = Object.keys(SEED).filter(function (id) { return !only || id === decodeURIComponent(only); });
  var chain = Promise.resolve(), totals = { sent: 0, phr: 0 };
  ids.forEach(function (id) {
    chain = chain.then(function () {
      E.activateInstrument(id);
      var opts = {
        cafProfileRegistry: E.getCAFProfileRegistry ? E.getCAFProfileRegistry() : null,
        cafProfileId: E.getActiveCAFProfileId ? E.getActiveCAFProfileId() : null,
        cafProfile: E.getActiveCAFProfile ? E.getActiveCAFProfile() : null,
        cafOverlay: E.getActiveCAFOverlay ? E.getActiveCAFOverlay() : null,
        targetId: E.state.activeTargetId,
        riskAppetiteSetup: E.state.scoringFamily === "risk-appetite-coherence" ? E.getRiskAppetiteSetup() : null,
        progress: A.UI.__progressExportPayload ? A.UI.__progressExportPayload() : null,
        craSetup: E.getCRASetupRaw ? E.getCRASetupRaw() : null
      };
      return new Promise(function (res) {
        A.ExportDOCX.buildAsync(E.state.engagement, E.state.instrument, E.state.taxonomy, E.state.profile,
          E.getActiveNarrative ? E.getActiveNarrative() : null, opts, function (err, blob) { res(err ? { err: err } : { blob: blob }); });
      }).then(function (r) {
        if (r.err) { lines.push("== " + id + ": BUILD ERROR " + (r.err.message || r.err)); return; }
        return docXml(r.blob).then(function (xml) {
          var a = analyse(paragraphs(xml));
          totals.sent += a.dupSent.length; totals.phr += a.phrases.length;
          lines.push("== " + id + "  (" + a.words + " words; " + a.dupSent.length + " repeated sentences, " + a.phrases.length + " other shared 10-word phrases)");
          a.dupSent.forEach(function (s) { lines.push("   S: " + s.slice(0, 200)); });
          a.phrases.slice(0, 40).forEach(function (g) { lines.push("   P: " + g); });
        });
      });
    });
  });
  chain.then(function () {
    lines.push("TOTAL repeated sentences " + totals.sent + ", shared phrases " + totals.phr);
    out.textContent = lines.join("\n") + "\nAUDIT-DONE";
  }, function (e) { out.textContent = lines.join("\n") + "\nthrew: " + (e && e.message) + "\nAUDIT-DONE"; });
})();
</script>
</body></html>
