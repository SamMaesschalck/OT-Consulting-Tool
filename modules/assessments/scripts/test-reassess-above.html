<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Reassessment: above-baseline showcase</title></head>
<body>
<pre id="out">running…</pre>

<script src="harness.js"></script>
<script>H.app(); H.dom();</script>
<script>
H.test(function (ok) {
  window.confirm = function () { return true; }; window.alert = function () {};
  var A = window.App, E = A.Engine;
  function idOf(r) { return r.requirementId || r.outcomeId || r.itemId; }
  try {
    E.loadCatalog();
    A.UI.init({ autosave: false });
    E.activateInstrument("cis-controls-v8");
    var tid = E.state.activeTargetId;
    // In-profile answer + an above-baseline (1.3 is NOT in IG1) implementation.
    E.setResponse(tid, "1.1", { applicable: true, state: "achieved" });
    E.setResponse(tid, "1.3", { applicable: true, state: "achieved" });
    var overlay = E.getActiveCAFOverlay();
    var current = E.state.engagement.responses.filter(function (r) { return r.targetId === tid; });
    var baseline = current.filter(function (r) { return idOf(r) !== "1.3"; }); // baseline lacks 1.3

    var common = { instrument: E.state.instrument, taxonomy: E.state.taxonomy, profile: E.state.profile, family: "caf-achieved", cafOverlay: overlay };

    // 1.3 newly implemented above baseline
    var cmp = A.Compare.compare(Object.assign({}, common, { baselineResponses: baseline, currentResponses: current }));
    ok(cmp.aboveBaseline && cmp.aboveBaseline.length >= 1, "compare surfaces above-baseline controls", cmp.aboveBaseline && String(cmp.aboveBaseline.length));
    var ab = (cmp.aboveBaseline || []).filter(function (a) { return a.code === "1.3"; })[0];
    ok(ab && ab.isNew === true, "1.3 is flagged as newly implemented above baseline (isNew)", ab && String(ab.isNew));
    ok(ab && ab.group && /Inventory and Control of Enterprise Assets/.test(ab.group), "above-baseline item carries its Control area", ab && ab.group);
    ok(ab && /Implemented/.test(ab.state), "above-baseline item shows its state label", ab && ab.state);
    ok(cmp.aboveBaselineNew === 1, "aboveBaselineNew counts the new above-baseline control", String(cmp.aboveBaselineNew));

    // 1.3 present in both -> maintained (not new)
    var cmp2 = A.Compare.compare(Object.assign({}, common, { baselineResponses: current, currentResponses: current }));
    var ab2 = (cmp2.aboveBaseline || []).filter(function (a) { return a.code === "1.3"; })[0];
    ok(ab2 && ab2.isNew === false, "1.3 present in both assessments is 'maintained' (not new)", ab2 && String(ab2.isNew));
    ok(cmp2.aboveBaselineNew === 0, "no new above-baseline when unchanged");

    // no effect on the movement/gap comparison (1.3 is not a scored in-scope item)
    ok(!(cmp.movements || []).some(function (m) { return m.code === "1.3"; }), "above-baseline 1.3 is not in the scored movements list");
  } catch (e) {
    ok(false, "threw: " + e.message + "\n" + (e.stack || ""));
  }
});
</script>
</body></html>
