<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Names in narrative pack prose</title></head>
<body>
<!--
  Pack boilerplate used to say "the organisation named on the title page" (and
  "the supplier named on the title page"), which is what you write when you do
  not know the name. The tool always knows it. Packs now carry {clientName},
  {clientShort} and {targetName}, filled once where a report is built
  (Report.render and ExportDOCX.buildAsync) so every place that prints
  boilerplate verbatim gets the name.

  Checked here: the short-name rules, the fallback when no name has been
  entered, that the shared loaded pack is never modified, and that the posture
  and supplier screener documents now name who they are about.
-->
<pre id="out" style="font:12px monospace; white-space:pre-wrap">running…</pre>
<script>
// Text-capturing docx stand-in, as in the report-customisation test.
window.docx = (function () {
  function TextRun(o){ if(typeof o==="string") o={text:o}; this.__type="TextRun"; this.text=(o&&o.text)||""; }
  function Paragraph(o){ o=o||{}; this.__type="Paragraph"; this.children=o.children||[]; this.heading=o.heading||null;
    this.style=o.style||null; this.text=this.children.map(function(r){return r&&r.text!=null?r.text:"";}).join(""); }
  function TableCell(o){ o=o||{}; this.__type="TableCell"; this.children=o.children||[]; }
  function TableRow(o){ o=o||{}; this.__type="TableRow"; this.children=o.children||[]; }
  function Table(o){ o=o||{}; this.__type="Table"; this.rows=o.rows||[]; }
  function ImageRun(){ this.__type="ImageRun"; this.text=""; }
  function PageBreak(){ this.__type="PageBreak"; this.text=""; }
  function Header(o){ this.__type="Header"; this.children=(o&&o.children)||[]; }
  function Footer(o){ this.__type="Footer"; this.children=(o&&o.children)||[]; }
  function Document(o){ this.__type="Document"; this.sections=o.sections||[]; window.__doc=this; }
  var Packer={ toBlob:function(d){ window.__doc=d; return Promise.resolve(new Blob(["x"])); } };
  return { Document:Document,Paragraph:Paragraph,TextRun:TextRun,TableCell:TableCell,TableRow:TableRow,
    Table:Table,ImageRun:ImageRun,PageBreak:PageBreak,Header:Header,Footer:Footer,
    PageNumber:{CURRENT:"CURRENT",TOTAL_PAGES:"TOTAL_PAGES"},
    PageOrientation:{PORTRAIT:"portrait",LANDSCAPE:"landscape"},
    TableLayoutType:{FIXED:"fixed",AUTOFIT:"autofit"}, HeightRule:{AUTO:"auto",EXACT:"exact",AT_LEAST:"atLeast"},
    HeadingLevel:{TITLE:"Title",HEADING_1:"Heading1",HEADING_2:"Heading2",HEADING_3:"Heading3"},
    AlignmentType:{LEFT:"left",CENTER:"center",RIGHT:"right"},
    WidthType:{PERCENTAGE:"pct",DXA:"dxa"}, ShadingType:{SOLID:"solid"}, Packer:Packer };
})();
</script>
<script src="harness.js"></script>
<script>H.app({ docx: "mock", tours: ["posture", "supplier"] }); H.dom();</script>
<script>
H.test(function (ok, done) {
  var A = window.App, E = A.Engine, R = A.Report;
  window.confirm = function () { return true; };
  window.alert = function () {};

  function docText() {
    var t = [];
    (function walk(n) {
      if (!n) return;
      if (Array.isArray(n)) { n.forEach(walk); return; }
      if (n.__type === "Paragraph") { t.push(n.text || ""); return; }
      if (n.__type === "Table") { walk(n.rows); return; }
      if (n.__type === "TableRow" || n.__type === "TableCell") { walk(n.children); return; }
    })(((window.__doc && window.__doc.sections) || []).map(function (s) { return s.children; }));
    return t.join("\n");
  }

  // ---- 1. the short name ---------------------------------------------------
  [ ["Wearvale Water plc", "Wearvale Water"],
    ["Fenwick Nuclear Services Ltd", "Fenwick Nuclear Services"],
    ["Aldergate Rail Infrastructure Ltd.", "Aldergate Rail Infrastructure"],
    ["Northbridge Manufacturing", "Northbridge Manufacturing"],
    ["Severn Trent Group plc", "Severn Trent Group"],
    ["Acme Holdings Pty Ltd", "Acme Holdings"],
    ["Siemens AG", "Siemens"],
    ["Smith & Co Ltd", "Smith & Co"],
    ["Plc", "Plc"]
  ].forEach(function (c) {
    ok(R.clientShortName(c[0]) === c[1], "'" + c[0] + "' shortens to '" + c[1] + "'", R.clientShortName(c[0]));
  });

  // ---- 2. filling, and what happens with no name ---------------------------
  var pack = { boilerplate: { a: "The report covers {clientName}.", b: "{clientShort} is exposed.",
                              c: "Later, {clientShort}'s board decides.", d: "Keep {weakestDomainName} for later." } };
  var named = R.personaliseNarrative(pack, { engagement: { clientName: "Wearvale Water plc" }, targets: [] }, {});
  ok(named.boilerplate.a === "The report covers Wearvale Water plc.", "full name where the pack asks for it", named.boilerplate.a);
  ok(named.boilerplate.b === "Wearvale Water is exposed.", "short name where the pack asks for that", named.boilerplate.b);
  ok(named.boilerplate.d === "Keep {weakestDomainName} for later.",
     "other slots are left for the family's own composer to fill", named.boilerplate.d);
  ok(pack.boilerplate.a === "The report covers {clientName}.", "the original pack object is not modified");

  var unnamed = R.personaliseNarrative(pack, { engagement: { clientName: "" }, targets: [] }, {});
  ok(unnamed.boilerplate.a === "The report covers the organisation.",
     "with no name entered it falls back to 'the organisation'", unnamed.boilerplate.a);
  ok(unnamed.boilerplate.b === "The organisation is exposed.",
     "capitalised where it starts a sentence", unnamed.boilerplate.b);
  ok(unnamed.boilerplate.c === "Later, the organisation's board decides.",
     "and left lower case mid-sentence", unnamed.boilerplate.c);

  var tpack = { x: "Exposure carried through {targetName}." };
  var withTarget = R.personaliseNarrative(tpack, { engagement: {}, targets: [{ id: "t1", name: "Ferrovia Controls Ltd" }] },
                                          { targetDimensionLabel: "Supplier" });
  ok(withTarget.x === "Exposure carried through Ferrovia Controls Ltd.", "the target's name where it has one", withTarget.x);
  var defaultTarget = R.personaliseNarrative(tpack, { engagement: {}, targets: [{ id: "t1", name: "Supplier 1" }] },
                                             { targetDimensionLabel: "Supplier" });
  ok(defaultTarget.x === "Exposure carried through the supplier assessed.",
     "and not 'Supplier 1', which is a default rather than a name", defaultTarget.x);

  // The packs themselves no longer carry the old phrase.
  var packs = A.Data.instruments;
  var still = Object.keys(packs).filter(function (id) {
    return packs[id].narrative && /named on the title page/.test(JSON.stringify(packs[id].narrative));
  });
  ok(still.length === 0, "no narrative pack says 'named on the title page'", still.join(", "));

  E.loadCatalog();
  A.UI.init({ autosave: false });

  // ---- 3. the posture screener's Word document -----------------------------
  E.activateInstrument("general-ot-posture");
  A.TourPosture.apply(E);
  var tidP = E.state.activeTargetId;
  A.ExportDOCX.buildAsync(E.state.engagement, E.state.instrument, E.state.taxonomy, E.state.profile,
    E.getActiveNarrative(), { targetId: tidP }, function (errP) {
    try {
      ok(!errP, "the posture document builds", errP && errP.message);
      var tp = docText();
      ok(/security posture of Northbridge Manufacturing,/.test(tp),
         "the posture report says whose posture it is", (tp.match(/security posture of [^,.]*[,.]/) || [""])[0]);
      ok(!/named on the title page|\{client|\{target/.test(tp), "with nothing generic or unfilled left");
    } catch (e1) { ok(false, "posture checks threw: " + e1.message); }

    // ---- 4. the supplier screener's Word document ---------------------------
    E.activateInstrument("supplier-screener");
    A.TourSupplier.apply(E);
    var tidS = E.state.activeTargetId;
    A.ExportDOCX.buildAsync(E.state.engagement, E.state.instrument, E.state.taxonomy, E.state.profile,
      E.getActiveNarrative(), { targetId: tidS }, function (errS) {
      try {
        ok(!errS, "the supplier document builds", errS && errS.message);
        var ts = docText();
        ok(/carried through Ferrovia Controls Ltd,/.test(ts),
           "the supplier report names the SUPPLIER, not the client on the cover",
           (ts.match(/carried through [^.]*\./) || [""])[0]);
        ok(!/named on the title page|\{client|\{target/.test(ts), "with nothing generic or unfilled left");

        // ---- 5. the screen report gets the same --------------------------------
        A.UI.go("report");
        var m = document.getElementById("main");
        ok(!/\{client|\{target/.test(m.textContent), "the screen report has no unfilled name slot");
      } catch (e2) { ok(false, "supplier checks threw: " + e2.message); }
      done();
    });
  });
});
</script>
</body></html>
