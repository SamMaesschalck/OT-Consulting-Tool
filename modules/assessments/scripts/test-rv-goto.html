<html lang="en"><head><meta charset="utf-8"/><title>Review: Go to lands for every demo</title></head>
<body>
<!--
  Go to on a comment about the report used to dead-end with "only in the Word
  report" for most sections in twelve instruments, even where the consultant
  edits that text somewhere else. For every demo, each section of the Word
  report is put through App.Review.goTo with the toast counted. Every section
  the consultant writes or can edit (document control, executive summary, basis
  of assessment, method, progress, next steps, terms, findings and roadmaps)
  must land somewhere, and so must every paragraph or table row that opens with
  an item's code. Only text written from the framework may say it is only in
  the Word report, and then it names the section.
  A comment's block id and document index are positions, which move as the
  report is edited: Go to finds the document by its title and the block by its
  wording within its section (a table cell by the row and column headings the
  review tool notes), and uses the positions only when those find nothing.
-->
<script src="harness.js"></script>
<script>H.app({ docx: true, tours: H.ALL_TOURS }); H.dom();</script>
<script>
H.test(function (ok, done) {
  window.confirm = function () { return true; }; window.alert = function () {};
  var A = window.App, E = A.Engine, RV = A.Review, RC = A.ReviewCore;
  A.Charts.svgToPngBlob = function (svg, s, cb) { cb(new Blob(["png"], { type: "image/png" })); };
  E.loadCatalog(); A.UI.init({ autosave: false });
  var SEED = H.demoSeeds();
  E.on("instrument-changed", function (inst) { var m = inst && SEED[inst.id]; if (m && m.apply && !m.__busy) { m.__busy = true; try { m.apply(E); } finally { m.__busy = false; } } });
  var toasts = [];
  A.UI.__review.toast = function (msg) { toasts.push(msg); };

  // The consultant's own text, or text the tool lets them edit.
  var MUST = /^document-control|^executive-summary$|^basis-of-assessment$|^people-interviewed$|^documents-reviewed$|^systems-observed$|^method-and-limitations$|^progress-since-previous-assessment$|^change-since-the-previous-assessment$|^proposed-next-steps$|^terms-used-in-the-findings$|^findings-by-|^fr\d+-|^scope-and-method$|roadmap/;
  var seq = 0;
  function thread(anchor) {
    return { comment: { id: "c-goto-" + (++seq), reviewer: "J. Marsh", severity: "suggestion", anchor: anchor, text: "x", suggestion: null }, status: "open", replies: [] };
  }
  function closeModals() {
    Array.prototype.forEach.call(document.querySelectorAll(".modal-f .btn"), function (b) { if (/^(Cancel|Close)$/.test(b.textContent)) b.click(); });
  }
  function opensWithCode(text, catalog) {
    var s = RC.norm(text);
    return catalog.filter(function (c) {
      var code = RC.norm(c.code || c.id);
      return code.length >= 2 && /[a-z.]/i.test(code) && s.indexOf(code + " ") === 0;
    })[0] || null;
  }

  var ids = Object.keys(SEED), chain = Promise.resolve(), summary = [];
  ids.forEach(function (id) {
    chain = chain.then(function () {
      E.activateInstrument(id);
      return new Promise(function (res, rej) { RV.currentDocs(function (e, d) { if (e) rej(e); else res(d); }); });
    }).then(function (docs) {
      var catalog = A.Compare.catalogFor(E.state.instrument, E.state.scoringFamily);
      var seen = {}, tried = 0, landed = 0, missMust = [], missItem = [], unnamed = [], itemTried = 0, nowhere = [];
      docs.forEach(function (d, di) {
        d.blocks.forEach(function (b) {
          if (b.front || !b.sectionKey) return;
          var anchor = { documentIndex: di, kind: "block", sectionKey: b.sectionKey, sectionTitle: b.sectionTitle, blockId: b.id, quote: b.text || "", cell: null, targetName: "", itemId: "", field: "" };
          // One go per section, from its first block.
          var k = di + "|" + b.sectionKey;
          if (!seen[k]) {
            seen[k] = true; tried++;
            toasts = [];
            var went = RV.goTo(thread(anchor));
            closeModals();
            if (went) landed++;
            else {
              nowhere.push(b.sectionTitle);
              if (MUST.test(b.sectionKey)) missMust.push(b.sectionKey);
              if (!toasts.length || toasts[0].indexOf("\"" + b.sectionTitle + "\"") === -1) unnamed.push(b.sectionKey);
            }
          }
          // A finding: a paragraph, or a table row, opening with an item's code.
          var texts = b.type === "table" ? b.rows.map(function (r, ri) { return { text: r.cells[0] && r.cells[0].text, row: ri }; }) : [{ text: b.text, row: null }];
          texts.forEach(function (x) {
            if (itemTried >= 6 || !x.text) return;
            var item = opensWithCode(x.text, catalog);
            if (!item) return;
            itemTried++;
            var a2 = Object.assign({}, anchor, x.row != null ? { quote: x.text, cell: { row: x.row, col: 0 } } : {});
            var went2 = RV.goTo(thread(a2));
            closeModals();
            if (!went2) missItem.push(item.code || item.id);
          });
        });
      });
      ok(!missMust.length, id + ": every section the consultant writes or edits lands somewhere", missMust.join(", "));
      ok(!missItem.length, id + ": every finding that opens with an item's code lands (" + itemTried + " tried)", missItem.join(", "));
      ok(!unnamed.length, id + ": what has nowhere to go says so, naming the section", unnamed.join(", "));
      summary.push(id + " " + landed + "/" + tried + " (only in Word: " + nowhere.join(" | ") + ")");
    }).catch(function (e) { ok(false, id + ": threw " + (e && e.message) + " " + (e && e.stack)); });
  });
  // ---- after the report has been edited: positions have moved ------------------------
  var mv = {};
  function docsNow() { return new Promise(function (res, rej) { RV.currentDocs(function (e, d) { if (e) rej(e); else res(d); }); }); }
  chain = chain.then(function () {
    E.activateInstrument("ncsc-caf");
    A.UI.go("report");
    return docsNow();
  }).then(function (d) {
    var catalog = A.Compare.catalogFor(E.state.instrument, E.state.scoringFamily);
    var have = {}; A.UI.__review.sectionKeys().forEach(function (k) { have[k] = true; });
    // A cell of a row that opens with an item's code, in a section with no
    // card of its own, some way down the document.
    // A cell that is an item's code, or opens with it.
    function cellItem(text) {
      var s = RC.norm(text);
      return catalog.filter(function (c) { return RC.norm(c.code || c.id) === s; })[0] || opensWithCode(s, catalog);
    }
    function rowItem(r) {
      var item = null;
      r.cells.forEach(function (c) { item = item || cellItem(c.text); });
      return item;
    }
    var pick = null;
    d[0].blocks.forEach(function (b) {
      if (pick || b.type !== "table" || have[b.sectionKey] || b.rows.length < 4) return;
      b.rows.forEach(function (r, ri) {
        if (pick || ri < 2) return;
        var item = rowItem(r);
        if (!item) return;
        r.cells.forEach(function (c, ci) {
          if (!pick && c.text && !cellItem(c.text) && b.rows.filter(function (x) { return x.cells[ci] && x.cells[ci].text === c.text; }).length > 1) pick = { b: b, row: ri, col: ci, item: item, text: c.text };
        });
      });
    });
    ok(!!pick, "there is a table whose rows name an item by its code and repeat a value down a column (" + (pick && pick.b.sectionKey) + ")");
    mv.pick = pick;
    mv.anchor = { documentIndex: 0, documentTitle: d[0].title, kind: "block", sectionKey: pick.b.sectionKey, sectionTitle: pick.b.sectionTitle, blockId: pick.b.id, blockType: "table",
      quote: pick.text, cell: { row: pick.row, col: pick.col }, rowKey: pick.b.rows[pick.row].cells[0].text, colHead: pick.b.rows[0].cells[pick.col].text, targetName: "", itemId: "", field: "" };
    ok(RV.goTo(thread(mv.anchor)) === "item:" + pick.item.id, "Go to on that cell reaches the row's item");
    closeModals();
    // The same value sits in other rows: the row heading the review tool noted
    // says which, even when the row number it saved is another row's.
    var otherRow = -1;
    pick.b.rows.forEach(function (r, ri) {
      if (otherRow === -1 && ri > 0 && ri !== pick.row && r.cells[pick.col] && r.cells[pick.col].text === pick.text && rowItem(r) && rowItem(r).id !== pick.item.id &&
          r.cells[0].text !== pick.b.rows[pick.row].cells[0].text) otherRow = ri;
    });
    ok(otherRow !== -1, "another row of it holds the same value under another row heading");
    if (otherRow !== -1) {
      var moved = Object.assign({}, mv.anchor, { cell: { row: otherRow, col: pick.col } });
      ok(RV.goTo(thread(moved)) === "item:" + pick.item.id, "with rows added above it, the cell is found by its row heading, not its row number");
      closeModals();
      var bare = Object.assign({}, moved); delete bare.rowKey; delete bare.colHead;
      ok(RV.goTo(thread(bare)) === "item:" + rowItem(pick.b.rows[otherRow]).id, "a comment from before row headings were noted still goes by its row number");
      closeModals();
    }
    // Edits above the table: more paragraphs in the summary, a basis register,
    // a section hidden. Every block id after them moves.
    E.setReportNarrative({ regulatoryExposure: "First line of the exposure note.\nSecond line of it.\nThird line of it.", topPriorities: "Priority one for the client.\nPriority two.\nPriority three.\nPriority four." });
    var bb = E.getBasisOfAssessment();
    bb.interviews.push({ name: "A. Person", role: "Engineer", date: "2026-10-01" }, { name: "C. Person", role: "Manager", date: "2026-10-02" });
    bb.documents.push({ title: "Network drawing", reference: "ND-1", date: "" }); E.touchBasisOfAssessment();
    var hide = d[0].probe.filter(function (p) { return p.key && p.level === 1 && p.key !== pick.b.sectionKey && !/executive|document-control/.test(p.key); })[0];
    E.setReportSection(hide.key, { hidden: true });
    mv.hidden = hide.key;
    return docsNow();
  }).then(function (d) {
    var now = d[0].blocks.filter(function (b) { return b.id === mv.pick.b.id; })[0];
    ok(!now || now.sectionKey !== mv.pick.b.sectionKey, "after edits above it, the comment's block id is another block (" + (now ? now.type + " in " + now.sectionKey : "gone") + ")");
    ok(RV.isStale(thread(mv.anchor)) === false, "the comment still matches the report");
    toasts = [];
    ok(RV.goTo(thread(mv.anchor)) === "item:" + mv.pick.item.id, "and Go to still reaches the row's item", toasts.join(" "));
    closeModals();
    // A second site: the first site's document may no longer be first.
    var wrongIndex = Object.assign({}, mv.anchor, { documentIndex: 5 });
    ok(RV.goTo(thread(wrongIndex)) === "item:" + mv.pick.item.id, "a document is found by its title when its place among the documents has changed");
    closeModals();
    E.clearReportSection(mv.hidden);
  }).catch(function (e) { ok(false, "positions: threw " + (e && e.message) + " " + (e && e.stack)); });
  chain.then(function () {
    ok(true, "sections that land, per demo: " + summary.join("; "));
  }).then(done);
});
</script>
</body></html>
