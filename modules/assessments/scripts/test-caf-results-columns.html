<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>CAF results table columns</title>
<link rel="stylesheet" href="../css/app.css" /></head>
<body>
<div class="app"><div class="header"><div class="brand"><span class="sub">x</span></div>
<span id="engagement-summary"></span><div class="spacer"></div>
<div class="header-actions"><button id="btn-theme"></button><button id="btn-engagement"></button><button id="btn-new"></button>
<button id="btn-load"></button><button id="btn-save"></button><button id="btn-xlsx"></button><button id="btn-docx"></button>
<input id="file-input" type="file"/></div></div>
<div id="sidebar" class="sidebar"></div><div id="main" class="main"></div></div>
<div id="toast" class="toast hidden"></div>
<pre id="out" style="font:12px monospace">running…</pre>
<script>
window.docx = (function () {
  function TextRun(o){ if(typeof o==="string") o={text:o}; this.__type="TextRun"; this.text=o.text||""; }
  function Paragraph(o){ o=o||{}; this.__type="Paragraph"; this.children=o.children||[]; this.heading=o.heading||null;
    this.text=this.children.map(function(r){return r&&r.text!=null?r.text:"";}).join(""); }
  function TableCell(o){ o=o||{}; this.__type="TableCell"; this.children=o.children||[]; }
  function TableRow(o){ o=o||{}; this.__type="TableRow"; this.children=o.children||[]; }
  function Table(o){ o=o||{}; this.__type="Table"; this.rows=o.rows||[]; }
  function ImageRun(){ this.__type="ImageRun"; this.text=""; }
  function PageBreak(){ this.__type="PageBreak"; this.text=""; }
  function Header(o){ this.__type="Header"; this.children=(o&&o.children)||[]; }
  function Footer(o){ this.__type="Footer"; this.children=(o&&o.children)||[]; }
  function Document(o){ this.__type="Document"; this.sections=o.sections||[]; window.__doc=this; }
  var Packer={ toBlob:function(d){ window.__doc=d; return Promise.resolve(new Blob(["x"])); } };
  return { Document:Document,Paragraph:Paragraph,TextRun:TextRun,TableCell:TableCell,TableRow:TableRow,
    Table:Table,ImageRun:ImageRun,PageBreak:PageBreak,Header:Header,Footer:Footer,
    PageNumber:{CURRENT:"CURRENT",TOTAL_PAGES:"TOTAL_PAGES"},
    PageOrientation:{PORTRAIT:"portrait",LANDSCAPE:"landscape"},
    TableLayoutType:{FIXED:"fixed",AUTOFIT:"autofit"}, HeightRule:{AUTO:"auto",EXACT:"exact",AT_LEAST:"atLeast"},
    HeadingLevel:{TITLE:"Title",HEADING_1:"Heading1",HEADING_2:"Heading2",HEADING_3:"Heading3"},
    AlignmentType:{LEFT:"left",CENTER:"center",RIGHT:"right"},
    WidthType:{PERCENTAGE:"pct"}, ShadingType:{SOLID:"solid"}, Packer:Packer };
})();
</script>
<script src="harness.js"></script>
<script>H.app({ xlsx: true, docx: "mock", tours: ["caf"] });</script>
<script>
// The by-principle results table spends its second-to-last column on N/A, not
// on the applicable total (which its Meeting-expected denominator carries).
// The by-objective table keeps BOTH, because its own last column is Applicable.
window.addEventListener("DOMContentLoaded", function () {
  var A = window.App, E = A.Engine, out = [], fail = 0;
  function ok(c, n, d) { out.push((c ? "PASS " : "FAIL ") + n + (!c && d ? " - " + d : "")); if (!c) fail++; }
  function headersOf(table) {
    return [].map.call(table.querySelectorAll("thead th"), function (n) { return n.textContent.trim(); });
  }
  try {
    A.UI.init();
    E.activateInstrument("ncsc-caf");
    A.TourCAF.apply(E);
    var scored = E.scoreActiveTarget();
    var host = document.createElement("div");
    A.Report.render(host, { engagement: E.state.engagement, instrument: E.state.instrument,
      taxonomy: E.state.taxonomy, profile: E.state.profile, narrative: E.getActiveNarrative(),
      scored: scored, scoredAll: E.scoreAllTargets(), activeTarget: E.getActiveTarget(),
      targetProfile: E.state.engagement.targetProfile,
      cafProfileRegistry: E.getCAFProfileRegistry(), cafProfileId: E.getActiveCAFProfileId(),
      cafProfile: E.getActiveCAFProfile() });

    var tables = [].slice.call(host.querySelectorAll("table.tbl"));
    var objT = tables.filter(function (t) { return headersOf(t)[0] === "Objective"; })[0];
    var prinT = tables.filter(function (t) { return headersOf(t)[0] === "Principle"; })[0];
    ok(!!objT && !!prinT, "found both results tables");

    var oh = headersOf(objT), ph = headersOf(prinT);
    out.push("  objective : " + oh.join(" | "));
    out.push("  principle : " + ph.join(" | "));

    ok(ph.indexOf("N/A") !== -1, "principle table has an N/A column");
    ok(ph.indexOf("Applicable") === -1, "principle table no longer has an Applicable column");
    ok(ph[ph.length - 1] === "Meeting expected", "principle table still ends with Meeting expected");
    ok(ph[ph.length - 2] === "N/A", "N/A sits immediately before Meeting expected");

    ok(oh.indexOf("N/A") !== -1 && oh.indexOf("Applicable") !== -1,
       "objective table keeps BOTH N/A and Applicable");
    ok(oh[oh.length - 1] === "Applicable", "objective table still ends with Applicable");

    // The numbers must be the N/A counts, not the applicable totals.
    var firstRow = [].map.call(prinT.querySelectorAll("tbody tr")[0].querySelectorAll("td"),
      function (n) { return n.textContent.trim(); });
    var p0 = scored.byPrinciple[0];
    ok(firstRow[firstRow.length - 2] === String(p0.counts.na || 0),
       "principle row shows the N/A count", firstRow[firstRow.length - 2] + " vs na=" + (p0.counts.na || 0));
    var footCells = [].map.call(prinT.querySelectorAll("tfoot td"), function (n) { return n.textContent.trim(); });
    var naSum = scored.byPrinciple.reduce(function (a, p) { return a + (p.counts.na || 0); }, 0);
    ok(footCells[footCells.length - 2] === String(naSum), "principle totals row sums N/A",
       footCells[footCells.length - 2] + " vs " + naSum);

    // Word must match the screen.
    A.ExportDOCX.buildAsync(E.state.engagement, E.state.instrument, E.state.taxonomy, E.state.profile,
      E.getActiveNarrative(), { targetId: E.state.activeTargetId }, function (err) {
        if (err) { ok(false, "Word build: " + err.message); }
        else {
          var heads = [];
          (window.__doc.sections || []).forEach(function (sec) {
            (sec.children || []).forEach(function (n) {
              if (n && n.__type === "Table" && (n.rows || []).length) {
                heads.push((n.rows[0].children || []).map(function (c) {
                  return (c.children || []).map(function (p) { return p.text || ""; }).join("").trim();
                }));
              }
            });
          });
          // A results table, not the glossary: the glossary defines the terms
          // "Objective" and "Principle" in its own first column, so match on a
          // row that also carries the count columns.
          function resultsHead(first) {
            return heads.filter(function (h) {
              return h[0] === first && (h.indexOf("N/A") !== -1 || h.indexOf("Applicable") !== -1);
            })[0];
          }
          var wPrin = resultsHead("Principle");
          var wObj  = resultsHead("Objective");
          ok(!!wPrin && wPrin.indexOf("N/A") !== -1 && wPrin.indexOf("Applicable") === -1,
             "Word principle table matches the screen (N/A, no Applicable)", wPrin ? wPrin.join("|") : "-");
          ok(!!wObj && wObj.indexOf("N/A") !== -1 && wObj.indexOf("Applicable") !== -1,
             "Word objective table keeps both", wObj ? wObj.join("|") : "-");

          // ---- what was ACHIEVED, named ------------------------------------
          // The results tables give counts and the roadmap gives gaps, so
          // without this a reader finishes the report knowing how many
          // outcomes were achieved but never which.
          var texts = [];
          (function walk(n) {
            if (!n) return;
            if (n.__type === "Paragraph") { texts.push(n.text || ""); return; }
            if (n.__type === "Table") { (n.rows || []).forEach(walk); return; }
            if (n.__type === "TableRow" || n.__type === "TableCell") { (n.children || []).forEach(walk); return; }
            if (Array.isArray(n)) n.forEach(walk);
          })((window.__doc.sections || []).map(function (s) { return s.children || []; }));
          var docText = texts.join("\n");
          ok(/Outcomes achieved|Contributing outcomes achieved/i.test(docText),
             "the Word report has a section naming what was achieved");
          ok(/assessed as achieved/i.test(docText),
             "which says how many of how many");

          var achieved = (scored.perOutcome || []).filter(function (it) {
            return it.profileApplicable !== false && it.state === "achieved";
          });
          ok(achieved.length > 0, "the demo has achieved outcomes to list",
             String(achieved.length));
          if (achieved.length) {
            ok(docText.indexOf(achieved[0].outcomeId) !== -1,
               "and an achieved outcome is named in the document", achieved[0].outcomeId);
          }

          // Excel must agree with Word.
          var wb = A.ExportXLSX.build(E.state.engagement, E.state.instrument,
            E.state.taxonomy, E.state.profile, { targetId: E.state.activeTargetId });
          ok((wb.SheetNames || []).indexOf("Achieved") !== -1,
             "the workbook has an Achieved sheet", (wb.SheetNames || []).join(", "));
          var sh = wb.Sheets["Achieved"];
          if (sh) {
            var cells = Object.keys(sh).filter(function (k) { return k[0] !== "!"; })
              .map(function (k) { var c = sh[k]; return String(c && c.v != null ? c.v : ""); }).join("\n");
            ok(achieved.length === 0 || cells.indexOf(achieved[0].outcomeId) !== -1,
               "listing the same achieved outcomes as the Word report",
               achieved.length ? achieved[0].outcomeId : "none");
            ok(!/Not Achieved/i.test(cells),
               "and not the ones that were not achieved");
          }
        }
        out.push(""); out.push(fail === 0 ? "ALL TESTS PASSED" : fail + " FAILED");
        document.getElementById("out").textContent = out.join("\n");
      });
  } catch (e) {
    ok(false, "threw: " + e.message + "\n" + (e.stack || ""));
    out.push(""); out.push(fail + " FAILED");
    document.getElementById("out").textContent = out.join("\n");
  }
});
</script>
</body></html>
