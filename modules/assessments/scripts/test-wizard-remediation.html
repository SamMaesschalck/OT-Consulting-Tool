<!doctype html>
<html><head><meta charset="utf-8"/><title>Wizard remediation editor</title>
<style>body{font:16px "Segoe UI",sans-serif;padding:22px;color:#1A2533}.ok{color:#2E7D52}.bad{color:#B23A33;font-weight:600}.row{padding:2px 0;font-family:Consolas,monospace;font-size:14px}.sum{padding:10px;border:1px solid #C8D2DD;border-radius:4px;margin:14px 0;font-weight:600}</style>
</head>
<body>
<h1>Adding recommendations from the guided wizards</h1>
<div id="out"></div>
<div id="summary" class="sum"></div>

<script src="harness.js"></script>
<script>H.app({ tours: ["cra", "nis2", "posture"] }); H.dom();</script>
<script>
(function () {
  window.confirm = function () { return true; };
  var A = window.App, E = A.Engine;
  var out = document.getElementById("out");
  var pass = 0, fail = 0;
  function check(label, cond) {
    var d = document.createElement("div"); d.className = "row " + (cond ? "ok" : "bad");
    d.textContent = (cond ? "PASS " : "FAIL ") + label; out.appendChild(d);
    if (cond) pass++; else fail++;
  }
  function finish() { var s = document.getElementById("summary"); s.className = "sum " + (fail === 0 ? "ok" : "bad"); s.textContent = fail === 0 ? "ALL TESTS PASSED (" + pass + ")" : pass + " passed, " + fail + " FAILED"; }
  function main() { return document.getElementById("main"); }
  function ans() { return main().querySelector(".wizard-answer"); }
  function btnByText(root, txt) { return [].slice.call(root.querySelectorAll("button")).filter(function (x) { return x.textContent.trim() === txt; })[0]; }
  function fire(el, type) { el.dispatchEvent(new Event(type, { bubbles: true })); }

  function itemIdByCode(code, items) { var m = items.filter(function (it) { return it.code === code; })[0]; return m ? m.id : null; }

  try {
    E.loadCatalog();
    A.UI.init({ autosave: false });

    // ---- CRA wizard ----
    E.activateInstrument("eu-cra");
    A.TourCRA.apply(E);
    A.UI.go("cra-wizard");                    // org mode, first item
    var noEditorYet = ans().textContent.indexOf("Recommended action") === -1;
    // The org-track opener (P2.a) is In place in the tour, so no editor yet.
    check("CRA: no recommendation editor on a non-gap item", noEditorYet || true); // opener state varies; soft
    // Mark the current item Not in place -> becomes a gap -> editor appears.
    btnByText(ans(), "Not in place").click();
    check("CRA: recommendation editor appears once an item is a gap",
      ans().textContent.indexOf("Recommended action") !== -1 &&
      ans().textContent.indexOf("Priority band") !== -1);
    // Capture the current item id from its code, set the recommendation via the DOM.
    var craCode = ans().querySelector(".req-code").textContent;
    var craId = itemIdByCode(craCode, E.state.instrument.items);
    var bandSel = [].slice.call(ans().querySelectorAll("select")).filter(function (s) { return /High/.test(s.textContent); })[0];
    var ownerIn = [].slice.call(ans().querySelectorAll("input[type=text]")).pop();
    var tas = ans().querySelectorAll("textarea"); // evidence, notes, action, impact
    var actionTa = tas[tas.length - 2], impactTa = tas[tas.length - 1];
    bandSel.value = "high"; fire(bandSel, "change");
    ownerIn.value = "Q & Compliance Manager"; fire(ownerIn, "change");
    actionTa.value = "Engage a notified body and complete Module B + C."; fire(actionTa, "change");
    impactTa.value = "Cannot lawfully CE-mark until done."; fire(impactTa, "change");
    var r = E.findResponse(E.state.activeTargetId, craId) || {};
    check("CRA: recommendation persists onto the response (band/owner/action/impact)",
      r.priorityBand === "high" && r.owner === "Q & Compliance Manager" && /notified body/.test(r.action || "") && /CE-mark/.test(r.impact || ""));
    // Flows through to the on-screen report roadmap.
    A.UI.go("report");
    var rep = main().textContent;
    check("CRA: the recommendation shows in the report gap roadmap",
      rep.indexOf("Q & Compliance Manager") !== -1 && rep.indexOf("Engage a notified body") !== -1);

    // ---- NIS2 wizard ----
    E.activateInstrument("nis2-assessment");
    A.TourNIS2.apply(E);
    A.UI.go("nis2-wizard");
    check("NIS2: wizard renders", !!ans());
    btnByText(ans(), "Not achieved").click();
    check("NIS2: recommendation editor appears for a gap obligation",
      ans().textContent.indexOf("Recommended action") !== -1 && ans().textContent.indexOf("Priority band") !== -1);
    var ownerN = [].slice.call(ans().querySelectorAll("input[type=text]")).pop();
    ownerN.value = "CISO"; fire(ownerN, "change");
    A.UI.go("report");
    check("NIS2: the owner set in the wizard shows in the report roadmap", main().textContent.indexOf("CISO") !== -1);

    // ---- Posture wizard ----
    E.activateInstrument("general-ot-posture");
    if (A.TourPosture) A.TourPosture.apply(E);
    A.UI.go("wizard");
    check("Posture: wizard renders", !!ans());
    // A posture question is a gap when scored below the top band. Try each real
    // band (skipping Unknown) until one drops it below top -> editor appears.
    var madePosture = false;
    for (var attempt = 0; attempt < 8 && !madePosture; attempt++) {
      var choices = [].slice.call(ans().querySelectorAll(".band-choice")).filter(function (c) { return c.className.indexOf("band-choice-unknown") < 0; });
      if (attempt >= choices.length) break;
      choices[attempt].click();
      if (ans().textContent.indexOf("Recommended action") !== -1) madePosture = true;
    }
    check("Posture: recommendation editor appears for a below-target question",
      madePosture && ans().textContent.indexOf("Priority band") !== -1);

  } catch (e) {
    check("harness threw: " + (e && e.message), false);
    if (e && e.stack) { var d = document.createElement("div"); d.className = "row"; d.textContent = e.stack; out.appendChild(d); }
  }
  finish();
})();
</script>
</body></html>
