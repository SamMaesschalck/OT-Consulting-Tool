<html lang="en"><head><meta charset="utf-8"/><title>Target plurals and the Excel target-met row</title></head>
<body>
<!--
  Two follow-ups that sat between file owners after the fix-first round:

  1. Compound target labels were pluralised by adding an s to the whole
     label on screen and in the organisation-wide Word document
     ("dutyholder / sites", "...governance posture)s"). The screen and Word
     now use the Excel tab rule: drop the bracket, pluralise each " / "
     alternative on its head noun, and use the declared plural when there is one.
  2. The multi-zone workbook's "Target met" row printed a bare "No" for a
     zone whose in-scope FRs were not all answered, where the screen and Word
     say "Not yet (N of M FRs assessed)".
-->
<script src="harness.js"></script>
<script>H.app({ xlsx: true, docx: true }); H.dom();</script>
<script>
function docXml(blob) {
  return blob.arrayBuffer().then(function (buf) {
    var v = new DataView(buf), u8 = new Uint8Array(buf), eocd = -1;
    for (var i = buf.byteLength - 22; i >= 0; i--) { if (v.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
    var n = v.getUint16(eocd + 10, true), p = v.getUint32(eocd + 16, true);
    for (var k = 0; k < n; k++) {
      var method = v.getUint16(p + 10, true), csize = v.getUint32(p + 20, true);
      var nlen = v.getUint16(p + 28, true), xlen = v.getUint16(p + 30, true), clen = v.getUint16(p + 32, true);
      var local = v.getUint32(p + 42, true);
      var name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
      if (name === "word/document.xml") {
        var start = local + 30 + v.getUint16(local + 26, true) + v.getUint16(local + 28, true);
        var data = u8.subarray(start, start + csize);
        var bytes = method === 0 ? Promise.resolve(data)
          : new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
        return bytes.then(function (b) { return new TextDecoder().decode(b); });
      }
      p += 46 + nlen + xlen + clen;
    }
    return "";
  });
}
function plainText(xml) {
  var W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  var doc = new DOMParser().parseFromString(xml, "application/xml");
  return Array.prototype.map.call(doc.getElementsByTagNameNS(W, "p"), function (p) {
    return Array.prototype.map.call(p.getElementsByTagNameNS(W, "t"), function (t) { return t.textContent; }).join("");
  }).join("\n");
}
function responsesFor(inst, targetId, upTo, frs) {
  var S = window.App.Scoring;
  return (inst.requirements || []).filter(function (req) { return !frs || frs.indexOf(req.frId) >= 0; }).map(function (req) {
    var comps = {};
    S.requirementItems(req).forEach(function (it) {
      comps[it.componentId] = { state: it.firstSL <= upTo ? "met" : "not-met" };
    });
    return { targetId: targetId, requirementId: req.id, components: comps };
  });
}

H.test(function (ok, done) {
  window.confirm = function () { return true; }; window.alert = function () {};
  var A = window.App, E = A.Engine, S = A.Scoring;
  E.loadCatalog(); A.UI.init({ autosave: false });
  var P = A.UI.__pluralLabel;

  // ---- 1. screen plurals ------------------------------------------------
  ok(typeof P === "function", "the screen's plural helper is reachable");
  var cases = [
    ["Dutyholder / site", "Dutyholders / sites"],
    ["Organisation (leadership / governance posture)", "Organisations"],
    ["Supplier / product developer (development organisation or product line)", "Suppliers / product developers"],
    ["Manufacturer / product with digital elements", "Manufacturers / products with digital elements"],
    ["Entity", "Entities"],
    ["Site", "Sites"],
    ["Machine", "Machines"],
    ["Component", "Components"],
    ["supplier", "suppliers"]
  ];
  cases.forEach(function (c) {
    var got = P(c[0], {});
    ok(got === c[1], "screen: " + c[0] + " -> " + c[1], got);
  });
  ok(P("Zone or conduit", { targetDimensionLabel: "Zone or conduit", targetDimensionLabelPlural: "Zones and conduits" }) === "Zones and conduits",
     "screen: a declared plural still wins");

  // ---- 2. Excel target-met row --------------------------------------------
  E.activateInstrument("iec-62443-3-3");
  var inst = E.state.instrument, tax = E.state.taxonomy, prof = E.state.profile;
  var e = JSON.parse(JSON.stringify(E.state.engagement));
  e.targets = [{ id: "z1", name: "Control zone" }, { id: "z2", name: "Safety zone" }, { id: "z3", name: "DMZ" }];
  e.targetProfile = { defaultTargetSL: 1, perFR: {}, perZone: {} };
  // z1 met in full, z2 met so far on FR1 only, z3 untouched.
  e.responses = responsesFor(inst, "z1", 4).concat(responsesFor(inst, "z2", 4, ["FR1"]));
  e.reportCustom = {};
  var scored = S.scoreEngagement(e, inst, tax, prof).perTarget.map(function (t) { return t.result; });
  ok(scored[0].overallTargetStatus === "met" && scored[1].overallTargetStatus === "incomplete",
     "set-up: zone 1 met, zone 2 incomplete", scored.map(function (r) { return r.overallTargetStatus; }).join(", "));
  var wb = A.ExportXLSX.build(e, inst, tax, prof, { targetId: "z1" });
  var ws = wb.Sheets["Zones and conduits"];
  ok(!!ws, "the workbook has the Zones and conduits tab", wb.SheetNames.join(", "));
  if (ws) {
    var rg = XLSX.utils.decode_range(ws["!ref"]), last = [];
    for (var c = 0; c <= rg.e.c; c++) {
      var cell = ws[XLSX.utils.encode_cell({ r: rg.e.r, c: c })];
      last.push(cell ? String(cell.v) : "");
    }
    ok(last[0] === "Target met", "the last row is the Target met row", last.join(" | "));
    ok(last[1] === "Yes", "zone 1 reads Yes", last[1]);
    ok(last[2] === "Not yet (1 of 7 FRs assessed)", "zone 2 reads Not yet with the count, not No", last[2]);
    ok(last[3] === "Not assessed", "zone 3 reads Not assessed", last[3]);
  }

  // ---- 3. organisation-wide Word plurals ----------------------------------
  E.activateInstrument("onr-syaps-cyber");
  var oi = E.state.instrument;
  ok(!oi.targetDimensionLabelPlural && oi.targetDimensionLabel === "Dutyholder / site", "set-up: ONR label has no declared plural");
  var oe = JSON.parse(JSON.stringify(E.state.engagement));
  oe.targets = [{ id: "s1", name: "North site" }, { id: "s2", name: "South site" }];
  oe.responses = [];
  oe.reportCustom = {};
  new Promise(function (res) {
    A.ExportDOCX.buildAsync(oe, oi, E.state.taxonomy, E.state.profile, E.getActiveNarrative(),
      { targetId: "s1", orgWide: true, siteEntries: [
        { id: "a1", name: "North site", responses: [] },
        { id: "a2", name: "South site", responses: [] }] },
      function (err, blob) { if (err) console.log("build error: " + err.message); res(err ? null : blob); });
  }).then(function (blob) {
    ok(!!blob, "the organisation-wide Word document builds");
    return blob ? docXml(blob).then(plainText) : "";
  }).then(function (txt) {
    ok(/dutyholders \/ sites/i.test(txt), "Word says dutyholders / sites", (txt.match(/[^\n]*\/ site[^\n]*/i) || [""])[0].slice(0, 200));
    ok(!/dutyholder \/ sites/i.test(txt), "and never dutyholder / sites");
  }).then(done, function (err) { ok(false, "threw: " + (err && err.message)); done(); });
});
</script>
</body></html>
