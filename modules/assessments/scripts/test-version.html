<html lang="en"><head><meta charset="utf-8"/><title>Version: in the tool, never in a report</title>
<link rel="stylesheet" href="../css/app.css" /></head>
<body>
<!--
  The tool's version (js/version.js, the suite version copied in from
  shared/version.js) has to be visible IN THE TOOL, so anyone
  can say which release they are using, and recorded in the project files it
  saves. It must NEVER reach a report: test-review-leak.html opens the Word and
  Excel files of six demos (3-3, CAF, risk appetite, posture, NIS2, CRA),
  decompresses every part, and finds no version anywhere in them, text or
  properties. (This page scanned three empty instruments the same way, which
  that page's scan now covers.)
-->
<script src="harness.js"></script>
<script>H.app(); H.dom();</script>
<script>
H.test(function (ok, done) {
  window.confirm = function () { return true; }; window.alert = function () {};
  var A = window.App, E = A.Engine, V = A.Version;
  A.Charts.svgToPngBlob = function (svg, s, cb) { cb(new Blob(["png"])); };

  // ---- the one source ------------------------------------------------------
  ok(V && V.number === "0.6.0", "the tool is version 0.6.0", V && V.number);
  ok(V.label === "v0.6", "shown as v0.6 (a .0 patch is left off)", V.label);
  ok(V.labelOf("0.3.1") === "v0.3.1" && V.labelOf("1.0.0") === "v1.0", "a patch release shows its patch number, a .0 does not");
  ok(V.compare("0.4.0", "0.3.0") === 1 && V.compare("0.3.0", "0.3.0") === 0 && V.compare("0.2.9", "0.3.0") === -1 &&
     V.compare("0.10.0", "0.9.0") === 1, "versions compare part by part, not as text");
  // The number is the suite's (shared/version.js, copied in); the name is this
  // module's own (js/product.js).
  ok(V.product === "OT Cyber Assessment Tool" && A.Product && A.Product.id === "assessments",
     "the suite version carries this module's product name", V.product + " / " + (A.Product && A.Product.id));

  // ---- shown in the tool ---------------------------------------------------
  // The test shell has no header brand; give it the one index.html has.
  document.querySelector(".header").insertAdjacentHTML("afterbegin",
    '<div class="brand"><span class="sub">OT Cyber Assessment Tool</span></div>');
  E.loadCatalog(); A.UI.init({ autosave: false });
  var badge = document.querySelector(".header .brand .version-badge");
  ok(badge && badge.textContent === "v0.6", "the header shows the version", badge && badge.textContent);
  ok(/0\.6\.0/.test(badge.title), "with the full number on hover", badge.title);
  var legal = document.querySelector(".sidebar-legal");
  ok(/OT Cyber Assessment Tool v0\.6\b/.test(legal.textContent), "the sidebar notice names the version", legal.textContent);
  A.UI.openLicence();
  ok(/OT Cyber Assessment Tool v0\.6 \(version 0\.6\.0\)/.test(document.querySelector(".licence-modal").textContent),
     "and so does the licence pop-up");
  document.querySelector(".licence-modal").click();
  A.UI.init({ autosave: false });
  ok(document.querySelectorAll(".version-badge").length === 1, "starting the UI again does not add a second badge");

  // ---- instrument content versions, printed on every report ----------------
  // A plain release number. Suffixes such as "-draft", "-skeleton-guided" or
  // "-paraphrased" were internal notes, and they printed in the document
  // control table of client deliverables.
  var odd = E.state.instruments.filter(function (i) { return i.status === "active"; })
    .filter(function (i) { return !/^\d+\.\d+\.\d+$/.test(String(i.contentVersion || "")); })
    .map(function (i) { return i.id + "=" + i.contentVersion; });
  ok(odd.length === 0, "every instrument's content version is a plain number, with no draft or other suffix", odd.join(", "));
  ok(!/^\d+\.\d+\.\d+$/.test("1.0.0-draft"), "and the check rejects a draft suffix");

  // ---- recorded in project files ------------------------------------------
  E.newProject && E.newProject();
  var pf1 = E.getProjectFile(), pf2 = E.getProjectFile();
  ok(pf1.createdWithVersion === "0.6.0" && pf1.savedWithVersion === "0.6.0",
     "a new project records the version it was created and saved with", JSON.stringify([pf1.createdWithVersion, pf1.savedWithVersion]));
  ok(pf1.createdAt && pf1.createdAt === pf2.createdAt, "and keeps its creation date from one save to the next (it used to be re-stamped)");

  E.loadProjectFile({ schemaVersion: A.Storage.SCHEMA_VERSION, project: A.Storage.defaultProject(), assessments: {},
                      createdAt: "2024-01-01T00:00:00.000Z" });
  var legacy = E.getProjectFile();
  ok(!("createdWithVersion" in legacy), "a file from before versions were recorded is not given one it never had");
  ok(legacy.savedWithVersion === "0.6.0", "but records the version that saves it now");
  ok(legacy.createdAt === "2024-01-01T00:00:00.000Z", "and keeps its original creation date");

  E.loadProjectFile({ schemaVersion: A.Storage.SCHEMA_VERSION, project: A.Storage.defaultProject(), assessments: {},
                      createdAt: "2025-06-01T00:00:00.000Z", createdWithVersion: "0.2.0", savedWithVersion: "0.2.0" });
  ok(E.getProjectFile().createdWithVersion === "0.2.0", "a file made with an earlier version keeps saying so");

  var warnNew = A.UI.__newerFileWarning({ savedWithVersion: "0.7.0" });
  ok(/saved with v0\.7 of the tool, newer than this copy \(v0\.6\)/.test(warnNew),
     "opening a project from a newer release warns", warnNew);
  ok(A.UI.__newerFileWarning({ savedWithVersion: "0.6.0" }) === "" && A.UI.__newerFileWarning({ savedWithVersion: "0.5.1" }) === "" &&
     A.UI.__newerFileWarning({}) === "", "the same, an older or an unrecorded version does not");
  done();
});
</script>
</body></html>
