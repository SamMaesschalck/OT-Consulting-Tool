<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Risk appetite narrative pack</title></head>
<body>
<!--
  The risk appetite narrative pack, and the Word document built from it.

  Two things are checked. First, that the pack is actually USED: a pack nobody
  reads is dead data, and before it existed this family's Word document had no
  executive summary, no glossary, no "where it sits" text, and closed with an
  appendix explaining 62443-3-3 Security Levels because the methodology table
  fell back to capability-sl.

  Second, that the prose reads as if a person wrote it. These documents go to a
  board under the SolutionsPT name. So: no em or en dashes (an ordinary spaced
  hyphen is fine), none of the stock phrases that give generated text away, no
  vocabulary that describes the tool rather than the work, and no template slot
  left unfilled.
-->
<pre id="out" style="font:12px monospace; white-space:pre-wrap">running…</pre>
<script>
// A text-capturing docx stand-in, the same shape the report-customisation test
// uses. Paragraph text is the concatenation of its runs; headings are tagged.
window.docx = (function () {
  function TextRun(o){ if(typeof o==="string") o={text:o}; this.__type="TextRun"; this.text=(o&&o.text)||""; }
  function Paragraph(o){ o=o||{}; this.__type="Paragraph"; this.children=o.children||[]; this.heading=o.heading||null;
    this.style=o.style||null; this.text=this.children.map(function(r){return r&&r.text!=null?r.text:"";}).join(""); }
  function TableCell(o){ o=o||{}; this.__type="TableCell"; this.children=o.children||[]; }
  function TableRow(o){ o=o||{}; this.__type="TableRow"; this.children=o.children||[]; }
  function Table(o){ o=o||{}; this.__type="Table"; this.rows=o.rows||[]; }
  function ImageRun(){ this.__type="ImageRun"; this.text=""; }
  function PageBreak(){ this.__type="PageBreak"; this.text=""; }
  function Header(o){ this.__type="Header"; this.children=(o&&o.children)||[]; }
  function Footer(o){ this.__type="Footer"; this.children=(o&&o.children)||[]; }
  function Document(o){ this.__type="Document"; this.sections=o.sections||[]; window.__doc=this; }
  var Packer={ toBlob:function(d){ window.__doc=d; return Promise.resolve(new Blob(["x"])); } };
  return { Document:Document,Paragraph:Paragraph,TextRun:TextRun,TableCell:TableCell,TableRow:TableRow,
    Table:Table,ImageRun:ImageRun,PageBreak:PageBreak,Header:Header,Footer:Footer,
    PageNumber:{CURRENT:"CURRENT",TOTAL_PAGES:"TOTAL_PAGES"},
    PageOrientation:{PORTRAIT:"portrait",LANDSCAPE:"landscape"},
    TableLayoutType:{FIXED:"fixed",AUTOFIT:"autofit"}, HeightRule:{AUTO:"auto",EXACT:"exact",AT_LEAST:"atLeast"},
    HeadingLevel:{TITLE:"Title",HEADING_1:"Heading1",HEADING_2:"Heading2",HEADING_3:"Heading3"},
    AlignmentType:{LEFT:"left",CENTER:"center",RIGHT:"right"},
    WidthType:{PERCENTAGE:"pct",DXA:"dxa"}, ShadingType:{SOLID:"solid"}, Packer:Packer };
})();
</script>
<script src="harness.js"></script>
<script>H.app({ docx: "mock", tours: ["risk-appetite"] }); H.dom();</script>
<script>
H.test(function (ok, done) {
  var A = window.App, E = A.Engine, R = A.Report, T = A.TourRiskAppetite;
  window.confirm = function () { return true; };
  window.alert = function () {};

  // ---- the style rules, applied to prose -----------------------------------
  // Dashes. U+2014 and U+2013 outright, and a hyphen with a space either side,
  // which is the same pause typed differently. Hyphenated words are fine.
  var DASHES = [ [/—/, "em dash"], [/–/, "en dash"] ];
  // Stock phrases that mark text as generated. Whole words, case-insensitive.
  var TELLS = ["delve", "tapestry", "landscape", "leverage", "leveraging", "robust", "seamless", "seamlessly",
    "navigate", "navigating", "pivotal", "crucial", "holistic", "foster", "realm", "testament", "underscore",
    "underscores", "moreover", "furthermore", "additionally", "ultimately", "embark", "unlock", "empower",
    "journey", "cutting-edge", "game-changer", "in today's", "it is important to note", "it's important to note",
    "not only", "in conclusion", "a myriad", "plethora", "paramount", "meticulous", "synergy"];
  // Vocabulary that describes the tool rather than the work. Ruled out for
  // anything a client reads; sector baselines may be named, the rest may not.
  var TOOL_WORDS = [/scaffold/i, /structured prompt/i, /band arithmetic/i, /\bcomputed\b/i, /overrid/i,
    /technical layer/i, /the tool\b/i, /rolled up from/i, /moved off/i];

  function styleProblems(text) {
    var s = String(text || ""), found = [];
    DASHES.forEach(function (d) { if (d[0].test(s)) found.push(d[1]); });
    TELLS.forEach(function (w) {
      var re = new RegExp("(^|[^a-z])" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "([^a-z]|$)", "i");
      if (re.test(s)) found.push("'" + w + "'");
    });
    TOOL_WORDS.forEach(function (re) { if (re.test(s)) found.push("tool word " + re.source); });
    return found;
  }

  // Every string in an object, with its path, skipping the authoring notes.
  function strings(obj, path, out) {
    out = out || [];
    if (typeof obj === "string") { out.push({ path: path, text: obj }); return out; }
    if (Array.isArray(obj)) { obj.forEach(function (v, i) { strings(v, path + "[" + i + "]", out); }); return out; }
    if (obj && typeof obj === "object") {
      Object.keys(obj).forEach(function (k) { if (k.charAt(0) !== "_") strings(obj[k], path ? path + "." + k : k, out); });
    }
    return out;
  }

  // The rules above have to be able to fail, or every pass below means
  // nothing. A deliberately bad sentence, one fault of each kind.
  var sample = styleProblems("It is crucial to delve into the landscape — moreover, the scaffold is robust - really.");
  ok(sample.length >= 7, "the style check catches what it is meant to catch", sample.join(", "));
  ok(styleProblems("A point-in-time, item-by-item read of a well-run site.").length === 0,
     "and leaves ordinary hyphenated words alone");

  E.loadCatalog();
  A.UI.init({ autosave: false });
  E.activateInstrument("risk-appetite");

  // ---- 1. the pack exists and loads ---------------------------------------
  var N = E.getActiveNarrative();
  ok(!!N, "the risk appetite instrument has a narrative pack");
  ok(N && N.boilerplate && N.executiveSummary && N.executiveSummary.templates,
     "with boilerplate and an executive summary, the same shape as the other packs");
  ["report_intro", "about_instrument", "series_context", "how_to_read", "method", "limitations",
   "not_measurement_caveat", "chart_note", "bands_source"].forEach(function (k) {
    ok(N && N.boilerplate && String(N.boilerplate[k] || "").trim().length > 40, "boilerplate has " + k);
  });
  ["aligned", "under-protected", "over-invested"].forEach(function (k) {
    ok(N.executiveSummary.templates["exec_verdict_" + k], "an executive summary opening for " + k);
    ok(N.executiveSummary.boilerplate["stakes_" + k], "and a paragraph on why it matters, for " + k);
    ok((N.next_steps_scaffold[k] || []).length >= 3, "and a first draft of next steps for " + k);
  });

  // ---- 2. every string in the pack passes the style rules ------------------
  var all = strings(N, "", []);
  ok(all.length > 40, "the pack is checked string by string", String(all.length));
  var bad = all.map(function (s) { return { path: s.path, p: styleProblems(s.text) }; })
               .filter(function (x) { return x.p.length; });
  ok(bad.length === 0, "no string in the pack uses a dash, a stock phrase or tool vocabulary",
     bad.slice(0, 6).map(function (x) { return x.path + ": " + x.p.join(", "); }).join(" | "));

  // UK spelling, spot-checked on the words this pack actually uses.
  var packText = all.map(function (s) { return s.text; }).join(" ");
  ok(!/\b(organization|characterize|prioritize|recognize|program)\b/i.test(packText),
     "UK spelling throughout", (packText.match(/\b(organization|characterize|prioritize|recognize|program)\b/i) || [""])[0]);

  // ---- 3. the Word document for the demo ----------------------------------
  T.apply(E);
  var tid = E.state.activeTargetId;
  // With the progress payload the UI hands the export, so the Word document
  // carries the change since the 2024 visit, as it would for a consultant.
  var opts = { targetId: tid, riskAppetiteSetup: E.getRiskAppetiteSetup(), progress: A.UI.__progressExportPayload() };
  A.ExportDOCX.buildAsync(E.state.engagement, E.state.instrument, E.state.taxonomy, E.state.profile,
    E.getActiveNarrative(), opts, function (err) {
    try {
      ok(!err, "the Word document builds", err && err.message);
      var doc = window.__doc;
      var paras = [], cells = [], headings = [];
      (function walk(n, inCell) {
        if (!n) return;
        if (Array.isArray(n)) { n.forEach(function (x) { walk(x, inCell); }); return; }
        if (n.__type === "Paragraph") {
          var t = n.__headingText || n.text || "";
          if (n.__headingText) headings.push(n.__headingText);
          (inCell ? cells : paras).push({ text: t, placeholder: n.style === "PlaceholderText" });
          return;
        }
        if (n.__type === "Table") { walk(n.rows, true); return; }
        if (n.__type === "TableRow" || n.__type === "TableCell") { walk(n.children, true); return; }
      })((doc && doc.sections || []).map(function (s) { return s.children; }), false);
      var text = paras.map(function (p) { return p.text; }).join("\n");

      // Structure: on a par with the other families' documents.
      ["Executive summary", "The verdict", "Stated against revealed appetite", "Inherent risk exposure",
       "Apparent risk appetite", "How to read this report", "About this assessment",
       "Terms used in this report", "Method and limitations", "Proposed next steps",
       "Change since the previous assessment",
       "Appendix: scoring methodology"].forEach(function (hd) {
        ok(headings.indexOf(hd) !== -1, "the document has a '" + hd + "' section", headings.join(" | "));
      });
      ok(headings.indexOf("Executive summary") < headings.indexOf("The verdict"),
         "the executive summary comes first");

      // The executive summary is composed, with every slot filled.
      // Names, not "the organisation named on the title page". The full name
      // at first mention, the short form after: "Wearvale Water plc's services"
      // is not how anyone writes.
      ok(/how much cyber risk Wearvale Water plc faces/.test(text),
         "the report introduces the client by name, in full");
      ok(/Wearvale Water is carrying more cyber risk than its exposure warrants/.test(text),
         "the summary opens with the verdict, using the short name after that");
      ok(/Wearvale Water's (board|circumstances|appetite)/.test(text),
         "and the short form in the possessive", (text.match(/Wearvale Water's \w+/) || [""])[0]);
      ok(!/Wearvale Water plc's/.test(text), "never 'Wearvale Water plc's'");
      ok(/The question for Wearvale Water's board is/.test(text), "the board question names whose board");
      ok(!/named on the title page/.test(text), "nothing says 'the organisation named on the title page'");
      ok(!/\{(clientName|clientShort|targetName)\}/.test(text) && !cells.some(function (c) { return /\{client/.test(c.text); }),
         "no name slot is left unfilled anywhere in the document");
      ok(/would normally hold an averse appetite/.test(text),
         "with the article right: 'an averse', not 'a averse'",
         (text.match(/would normally hold [^.]*/) || [""])[0]);
      ok(/The appetite described in interview was cautious, but the systems themselves point to tolerant\./.test(text),
         "it says what the technical review added");

      // ---- the headline carries both appetite readings ----------------------
      // The body argues the real appetite is tolerant, so a headline quoting
      // only the stated "cautious" would be milder than the report beneath it.
      ok(/Its leadership describes a cautious appetite, but its systems reveal a tolerant one, so in practice Wearvale Water accepts more risk than its leadership believes\./.test(text),
         "the summary's verdict carries both readings, stated and revealed",
         (text.match(/Its leadership describes[^.]*\./) || [""])[0]);
      ok(/Apparent appetite: stated Cautious, revealed Tolerant\./.test(text),
         "and so does the verdict section's headline line",
         (text.match(/Apparent appetite:[^\n]*/) || [""])[0]);
      // NOT "on either reading": with severe exposure the stated cautious reading
      // is one band off the line (aligned) and only the revealed one is
      // under-protected. Saying "either" here would be untrue.
      ok(!/on either reading/i.test(text),
         "and does not claim 'on either reading', which is not true for this client");

      // ---- change since the 2024 visit, in Word ---------------------------------
      ok(/Wearvale Water has moved closer to proportion, with its appetite now nearer to what its exposure warrants\./.test(
           text.slice(text.indexOf("Executive summary"), text.indexOf("The verdict"))),
         "the executive summary says Wearvale has moved closer to proportion");
      ok(/At the previous assessment the verdict was under-protected, with severe exposure and an open appetite\./.test(text),
         "the change section states the 2024 verdict and positions");
      ok(/Eight readings moved between the two assessments\. No single move is better or worse in itself/.test(text),
         "and says the moves are neither better nor worse in themselves",
         (text.match(/[A-Z][a-z]+ readings moved[^.]*\./) || [""])[0]);
      ok(cells.some(function (c) { return c.text === "More cautious"; }) && cells.some(function (c) { return c.text === "Higher"; }),
         "the moved items are named by direction in the table");
      ok(!/\bImproved\b|\bRegressed\b/.test(text + cells.map(function (c) { return c.text; }).join(" ")),
         "and the document never says improved or regressed");
      ok(/The hollow marker shows where Wearvale Water sat at the previous assessment/.test(text),
         "the chart note explains the previous-position marker");

      // ---- why two Highs sit under a Severe exposure ----------------------------
      ok(/The severe rating is set by the consequence of a compromise and its connections with suppliers and other organisations\. Geopolitical exposure and regulatory weight are rated high\. Exposure follows its highest reading, not an average, so they do not pull the rating down\./.test(text),
         "the exposure narrative explains the two High readings under the Severe headline",
         (text.match(/severe rating is set by[^\n]*/) || [""])[0]);
      ok(!/moderate geopolitical|moderate regulatory/i.test(text),
         "and describes them as they were rated, high, not moderate");

      // ---- APP.4, named as the root cause ---------------------------------------
      var spot = /How risk gets accepted is rated open, against cautious for appetite overall, and it is the main cause of the drift\. Because nothing requires a recorded decision to accept a risk, risks are accepted without one, and the appetite applied in practice moves away from the one the board intends\./;
      ok(spot.test(text), "the informal risk acceptance is named as the governance root cause of the drift",
         (text.match(/How risk gets accepted is rated[^\n]*/) || [""])[0]);
      var summaryPart = text.slice(text.indexOf("Executive summary"), text.indexOf("The verdict"));
      // Printed into the output for anyone reviewing the prose by eye.
      ok.note("\n---- composed executive summary (Wearvale demo) ----\n" + summaryPart + "\n---- end ----\n");
      ok(spot.test(summaryPart), "in the executive summary itself, not only further down");
      ok(summaryPart.search(/main cause of the drift/) < summaryPart.search(/appetite the estate reveals/),
         "and before the assessor's reasoning, so the mechanism is read before the evidence");
      ok(/appetite the estate reveals/.test(text), "it carries the assessor's reasoning");
      ok(/1\.4 million people/.test(text), "and the consultant's own context paragraph");
      ok(/The question for Wearvale Water's board is whether to accept the risk/.test(text),
         "and frames the decision for the board");
      ok(/All 18 areas in scope were characterised, including the technical review/.test(text),
         "and states coverage in a sentence");
      // ---- a board-length summary, with nothing lost from the report ---------
      // It ran to about 870 words across 16 paragraphs. A board reads a page.
      var summaryWords = summaryPart.split(/\s+/).filter(Boolean).length;
      var summaryParas = summaryPart.split("\n").filter(function (l) { return l.trim(); }).length - 1;
      ok(summaryWords <= 550, "the executive summary is board length", summaryWords + " words, " + summaryParas + " paragraphs");
      // What left the summary moved into the body, not out of the report.
      var bodyPart = text.slice(text.indexOf("The verdict"));
      var NB = (R.personaliseNarrative(N, E.state.engagement, E.state.instrument).executiveSummary || {}).boilerplate || {};
      [["report_intro", "how much cyber risk Wearvale Water plc faces"],
       ["exec_fit_method", (NB.exec_fit_method || "").slice(0, 50)],

       ["not_determination", (NB.not_determination || "").slice(0, 50)]].forEach(function (p) {
        ok(p[1] && summaryPart.indexOf(p[1]) === -1 && bodyPart.indexOf(p[1]) !== -1,
           "'" + p[0] + "' now sits in the body of the report, not the summary", p[1]);
      });
      ok(/Evidence: /.test(cells.map(function (c) { return c.text; }).join("\n")),
         "the item tables carry each reading's evidence");

      var unfilled = (text.match(/\{[a-zA-Z]+\}/g) || []);
      ok(unfilled.length === 0, "no template slot is left unfilled", unfilled.join(" "));

      // The verdict is explained in the pack's words for a board, not in the
      // scoring profile's rule text, which was written for whoever maintains the
      // scoring and ends "Named worst-first in the report".
      // Compared with the pack as the document sees it: with the client's name
      // filled in, since the raw pack still carries {clientShort}.
      var NP = R.personaliseNarrative(N, E.state.engagement, E.state.instrument);
      ok(text.indexOf(NP.verdict_narrative["explanation_under-protected"]) !== -1,
         "the verdict is explained in the pack's words",
         NP.verdict_narrative["explanation_under-protected"].slice(0, 60));
      ok(!/Named worst-first|mirror line|2\+ bands/.test(text),
         "and none of the scoring profile's authoring shorthand reaches the document",
         (text.match(/.{0,40}(Named worst-first|mirror line|2\+ bands).{0,30}/) || [""])[0]);

      // The appendix is this family's, not 62443-3-3's.
      var appendix = text.slice(text.lastIndexOf("Appendix: scoring methodology"));
      ok(!/Security Level|SL-T|SL-A|foundational requirement/i.test(appendix),
         "the methodology appendix no longer explains 62443-3-3 Security Levels",
         (appendix.match(/.{0,40}(Security Level|SL-T|SL-A).{0,40}/i) || [""])[0]);
      ok(/How to read this report/.test(appendix) && /severe exposure calls for an averse appetite/.test(text.slice(text.indexOf("How to read this report"), text.indexOf("About this assessment"))),
         "the fit is explained once, in How to read, and the appendix refers to it");

      // ---- each passage said once ---------------------------------------------
      // The summary carries the exposure drivers, the acceptance spotlight, the
      // assessor's reasoning and the direction since 2024; the body sections no
      // longer open with the same sentences.
      [["the exposure drivers", "The severe rating is set by"],
       ["the acceptance spotlight", "How risk gets accepted is rated open"],
       ["the assessor's reasoning", "The appetite described by leadership is not the appetite the estate reveals"],
       ["the direction since the last assessment", "Wearvale Water has moved closer to proportion"]].forEach(function (p) {
        var n = text.split(p[1]).length - 1;
        ok(n === 1 && summaryPart.indexOf(p[1]) !== -1, p[0] + " appears once, in the executive summary", n + " times");
      });
      // The general paragraph on what under-protection means is optional, off by default.
      ok(text.indexOf((NB["stakes_under-protected"] || "").slice(0, 50)) === -1,
         "the general verdict paragraph is left out unless switched on");
      // The thresholds are stated once; the glossary refers to How to read.
      ok(!cells.some(function (c) { return /two or more bands/.test(c.text); }),
         "the glossary does not restate the thresholds");

      // The glossary reaches Word, with the band definitions.
      ok(/Exposure bands/.test(text) && /Appetite bands/.test(text), "the glossary defines both scales");
      ok(cells.some(function (c) { return /Warranted appetite/.test(c.text); }),
         "including what 'warranted appetite' means");

      // Next steps come from the demo, not the red scaffold.
      ok(/Put the stated-vs-revealed gap to the board/.test(text) ||
         /stated-vs-revealed/.test(text) || /Commission an IEC 62443-3-3 assessment/.test(text),
         "the proposed next steps are the demo's own");

      // Written for this engagement, not for every possible one.
      ok(/The assessor also looked at how systems are patched/.test(text) && !/Where the optional technical review was included/.test(text),
         "the method describes the technical review as done, because it was");
      ok(!/vocabulary of OT Risk Appetite/.test(text), "the glossary does not call the assessment's own title a vocabulary");
      ok(!/\bthat line\b/.test(text), "nothing points at a line before the chart has drawn one");
      ok((text.match(/no score|rather than a score/g) || []).length <= 1, "how to read says once that there is no score");

      // Nothing red is left in the demo document: the method's prompt to
      // confirm how the engagement was run is answered in the tool
      // (reportNarrative.method), so the demo is ready to issue.
      var red = paras.filter(function (p) { return p.placeholder; }).map(function (p) { return p.text; });
      ok(red.length === 0, "nothing red is left: the demo answers the method prompt in the tool",
         red.join(" | "));

      // ---- 4. the prose in the document passes the style rules --------------
      // Body paragraphs only. Table cells may legitimately hold a "-" for an
      // empty value, and the document-control block is a table.
      var docBad = paras.map(function (p) { return { t: p.text, p: styleProblems(p.text) }; })
                        .filter(function (x) { return x.p.length; });
      ok(docBad.length === 0, "no paragraph in the Word document breaks the style rules",
         docBad.slice(0, 4).map(function (x) { return x.p.join(", ") + " in: " + x.t.slice(0, 90); }).join(" | "));
      var cellBad = cells.filter(function (c) { return /—|–/.test(c.text) && c.text.trim().length > 1; });
      ok(cellBad.length === 0, "and no table cell uses an em or en dash in running text",
         cellBad.slice(0, 3).map(function (c) { return c.text.slice(0, 80); }).join(" | "));
    } catch (e) {
      ok(false, "threw while reading the document: " + e.message + "\n" + (e.stack || ""));
    }

    // ---- 5. the screen report reads from the same pack ---------------------
    try {
      A.UI.go("report");
      var m = document.getElementById("main");
      ok(m.textContent.indexOf(N.boilerplate.how_to_read.slice(0, 60)) !== -1,
         "the report page's 'How to read' is the pack's");
      ok(m.textContent.indexOf(N.boilerplate.series_context.slice(0, 50)) !== -1,
         "its About section says where the assessment sits");
      ok(/Terms used in this report/.test(m.textContent), "and it now has a glossary");
      ok(/Executive summary: consultant input/.test(m.textContent) && /Context for the board/.test(m.textContent),
         "the consultant can write the two paragraphs the summary leaves for them");

      // ---- 6. a fresh assessment gets a next-steps draft that fits ----------
      E.newAssessment("risk-appetite");
      E.updateRiskAppetiteSetup({ exposureBand: "severe", appetiteBand: "tolerant" });
      var lines = R.nextStepsLines(E.state.engagement, { instrument: E.state.instrument, scored: E.scoreActiveTarget() });
      ok(lines.length && /as a decision/.test(lines[0]),
         "an under-protected read drafts next steps around a board decision, not a findings list",
         lines[0]);
      E.updateRiskAppetiteSetup({ exposureBand: "limited", appetiteBand: "averse" });
      lines = R.nextStepsLines(E.state.engagement, { instrument: E.state.instrument, scored: E.scoreActiveTarget() });
      ok(lines.length && /deliberate choice/.test(lines[0]),
         "an over-invested read drafts a different set", lines[0]);
    } catch (e2) {
      ok(false, "threw on the screen checks: " + e2.message + "\n" + (e2.stack || ""));
    }

    // ---- 7. the general verdict paragraph, switched on --------------------
    E.activateInstrument("risk-appetite"); T.apply(E);
    E.setReportNarrative({ includeVerdictContext: true });
    var stakesStart = (R.personaliseNarrative(N, E.state.engagement, E.state.instrument).executiveSummary.boilerplate["stakes_under-protected"] || "").slice(0, 50);
    A.ExportDOCX.buildAsync(E.state.engagement, E.state.instrument, E.state.taxonomy, E.state.profile, E.getActiveNarrative(),
      { targetId: E.state.activeTargetId, riskAppetiteSetup: E.getRiskAppetiteSetup() }, function (err3) {
        var allText = JSON.stringify(window.__doc && window.__doc.sections || []);
        ok(!err3 && stakesStart && allText.indexOf(stakesStart) !== -1,
           "switched on, the general verdict paragraph is in the verdict section");
        E.setReportNarrative({ includeVerdictContext: false });

        // ---- 8. coverage reads in order when the review was not done -------
        // "One could not be established" has to follow the areas it refers to,
        // with the note about the technical review after it, not between them.
        E.updateRiskAppetiteSetup({ includeTech: false });
        E.setResponse(E.state.activeTargetId, "APP3", { notEstablished: true });
        A.ExportDOCX.buildAsync(E.state.engagement, E.state.instrument, E.state.taxonomy, E.state.profile, E.getActiveNarrative(),
          { targetId: E.state.activeTargetId, riskAppetiteSetup: E.getRiskAppetiteSetup() }, function (err4) {
            var t4 = JSON.stringify(window.__doc && window.__doc.sections || []);
            ok(!err4 && /areas in scope were characterised\. One could not be established and is reported as such\. The optional technical review was not part of this engagement\./.test(t4),
               "coverage names the area that could not be established before the note on the technical review",
               (t4.match(/\d+ of the \d+ areas[^"]*/) || [""])[0]);
            done();
