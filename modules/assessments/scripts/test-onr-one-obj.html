<html lang="en"><head><meta charset="utf-8"/><title>One objective: no weakest-objective sentence</title></head>
<body>
<!--
  The ONR SyAPs cyber instrument covers one Fundamental Security Principle
  (FSyP 7). Its narrative pack says "The weakest Fundamental Security
  Principle is ..." in the executive summary and in the consultant's exposure
  seed, and with one objective that sentence either names FSyP 7 every time
  or names a Security Delivery Principle under the wrong title. The Word
  builder leaves such a sentence out when there is a single objective.

  This builds the executive summary for ONR cyber (one objective, the sentence
  must go, the rest of the paragraph stays) and for ONR management (five
  objectives, the sentence must stay), each with gaps recorded.
-->
<script src="harness.js"></script>
<script>H.app({ docx: true }); H.dom();</script>
<script>
function docXml(blob) {
  return blob.arrayBuffer().then(function (buf) {
    var v = new DataView(buf), u8 = new Uint8Array(buf), eocd = -1;
    for (var i = buf.byteLength - 22; i >= 0; i--) { if (v.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
    var n = v.getUint16(eocd + 10, true), p = v.getUint32(eocd + 16, true);
    for (var k = 0; k < n; k++) {
      var method = v.getUint16(p + 10, true), csize = v.getUint32(p + 20, true);
      var nlen = v.getUint16(p + 28, true), xlen = v.getUint16(p + 30, true), clen = v.getUint16(p + 32, true);
      var local = v.getUint32(p + 42, true);
      var name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
      if (name === "word/document.xml") {
        var start = local + 30 + v.getUint16(local + 26, true) + v.getUint16(local + 28, true);
        var data = u8.subarray(start, start + csize);
        var bytes = method === 0 ? Promise.resolve(data)
          : new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
        return bytes.then(function (b) { return new TextDecoder().decode(b); });
      }
      p += 46 + nlen + xlen + clen;
    }
    return "";
  });
}
var W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
function textOf(el) { return Array.prototype.map.call(el.getElementsByTagNameNS(W, "t"), function (t) { return t.textContent; }).join(""); }
function execSummary(xml) {
  var doc = new DOMParser().parseFromString(xml, "application/xml");
  var body = doc.getElementsByTagNameNS(W, "body")[0], cur = null, out = null;
  Array.prototype.forEach.call(body.children, function (el) {
    var st = el.localName === "p" && el.getElementsByTagNameNS(W, "pStyle")[0];
    var val = st ? st.getAttribute("w:val") : "";
    var t = textOf(el);
    if (/^Heading1$/i.test(val)) { cur = t.trim(); if (/Executive summary$/.test(cur)) out = []; return; }
    if (out && /Executive summary$/.test(cur || "")) out.push(t);
  });
  return out || [];
}
H.test(function (ok, done) {
  window.confirm = function () { return true; }; window.alert = function () {};
  var A = window.App, E = A.Engine;
  E.loadCatalog(); A.UI.init({ autosave: false });

  function build(id, answers) {
    E.activateInstrument(id);
    var tid = E.state.activeTargetId;
    answers.forEach(function (a) { E.setResponse(tid, a[0], { applicable: true, state: a[1] }); });
    return new Promise(function (res) {
      A.ExportDOCX.buildAsync(E.state.engagement, E.state.instrument, E.state.taxonomy, E.state.profile,
        E.getActiveNarrative(), { targetId: tid }, function (err, blob) { res(err ? null : blob); });
    }).then(function (blob) { return blob ? docXml(blob).then(execSummary) : []; });
  }

  build("onr-syaps-cyber", [["7.1.1", "not"], ["7.1.2", "partially"], ["7.1.3", "achieved"]]).then(function (paras) {
    var all = paras.join("\n");
    ok(paras.length > 3, "cyber: the executive summary prints", paras.length);
    ok(!/weakest Fundamental Security Principle/i.test(all), "cyber (one objective): no sentence names the weakest Fundamental Security Principle", all.slice(0, 600));
    ok(/(^|\n)In 7[^\n]*(partly demonstrated|not yet demonstrated)\./.test(all), "cyber: the rest of the gap-shape paragraph still prints", all);
    ok(!/\{weakestObjective/.test(all), "cyber: no template slot is left unfilled");
    // A principle carries its objective's id too; the summary names the SyDP
    // (7.1), never the objective number alone ("7 Effective Cyber ...").
    ok(/\b7\.1 Effective Cyber/.test(all) && !/(^|[^.\d])7 Effective Cyber/.test(all), "cyber: the weakest area is named by its SyDP number", all.slice(0, 600));
    return build("onr-syaps-management", [["1.1.1", "not"], ["1.1.2", "partially"], ["1.1.3", "achieved"]]);
  }).then(function (paras) {
    var all = paras.join("\n");
    ok(/The weakest coverage is in 1 Leadership/.test(all), "management (five objectives): the summary names the weakest Fundamental Security Principle", all.slice(0, 600));
    done();
  });
});
</script>
</body></html>
