<html lang="en"><head><meta charset="utf-8"/><title>Review: accepting suggested wording</title></head>
<body>
<!--
  Suggested wording is accepted in one click where the text can be changed in the
  tool, and only counts once it is in the Word document. Each editable kind is
  accepted through App.Review.accept, then the Word file is built separately and
  opened: a paragraph of a section's opening (that paragraph alone, the rest of
  the run still generated: test-review-para.html goes through it), a renamed
  section, a section title, each narrative field, the proposed next steps, and a
  plan and an evidence field. Then what must not be accepted: generated text
  falls back to Copy, and so do a stale comment and wording shared by several
  items. A change that does not reach the document is undone.
  Then what Accept must never do. A red prompt is never taken into a rewrite of a
  section's opening by the consultant's own Edit, nor reworded by Accept: it stays
  red, the Issue check still counts it, and it goes when it is answered. A
  generated paragraph beside a prompt or the consultant's input is accepted on its
  own, and leaves both as they were. Wording is only written to an
  item's field when the commented text is about that item (a role in the People
  interviewed table is not an item's owner), and only counts when it is in the
  section the comment is on. An answer a zone inherits is found by the scorer's
  own rules, and a change to a system-wide answer says so. One accepted change
  per comment, until it is undone.
-->
<script src="harness.js"></script>
<script>H.app({ docx: true, tours: H.ALL_TOURS }); H.dom();</script>
<script>
H.test(function (ok, done) {
  window.confirm = function () { return true; }; window.alert = function () {};
  var A = window.App, E = A.Engine, RV = A.Review, RC = A.ReviewCore, DB = A.DocxBlocks, X = A.ExportDOCX, I;
  A.Charts.svgToPngBlob = function (svg, s, cb) { cb(new Blob(["png"], { type: "image/png" })); };
  E.loadCatalog(); A.UI.init({ autosave: false });
  I = A.UI.__issue;
  var SEED = H.demoSeeds();
  E.on("instrument-changed", function (inst) { var m = inst && SEED[inst.id]; if (m && m.apply && !m.__busy) { m.__busy = true; try { m.apply(E); } finally { m.__busy = false; } } });

  function ids() { return E.state.engagement.targets.map(function (t) { return t.id; }); }
  // What is really in the Word file: built here, not through the review.
  function wordParas() {
    var jobs = I.jobs(ids(), "per"), out = [], chain = Promise.resolve();
    jobs.forEach(function (job) {
      chain = chain.then(function () {
        return new Promise(function (res, rej) {
          X.buildAsync(job.engagement, E.state.instrument, E.state.taxonomy, E.state.profile, E.getActiveNarrative(), Object.assign({}, job.opts, { issueStatus: "draft" }), function (err, b) { if (err) rej(err); else res(b); });
        }).then(H.unzipText).then(function (parts) {
          var x = parts.filter(function (p) { return p.name === "word/document.xml"; })[0].text;
          var doc = new DOMParser().parseFromString(x, "application/xml");
          var W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
          Array.prototype.forEach.call(doc.getElementsByTagNameNS(W, "p"), function (p) {
            var t = ""; Array.prototype.forEach.call(p.getElementsByTagNameNS(W, "t"), function (e) { t += e.textContent; });
            if (t.trim()) out.push(t.replace(/\s+/g, " ").trim());
          });
        });
      });
    });
    return chain.then(function () { return out; });
  }
  function docs() { return new Promise(function (res, rej) { RV.currentDocs(function (e, d) { if (e) rej(e); else res(d); }); }); }
  var seq = 0;
  // A thread in the store, as an import leaves it.
  function thread(anchor, suggestion) {
    var s = RV.ensureStore();
    if (!s.rounds.length) s.rounds.push({ round: 1, packId: "rp-test", createdAt: new Date().toISOString(), documents: [] });
    var t = { comment: { id: "c-test-" + (++seq), reviewer: "J. Marsh", createdAt: "2026-11-01T10:00:00Z", updatedAt: "2026-11-01T10:00:00Z", severity: "should-fix", anchor: anchor, text: "Reword.", suggestion: suggestion, relatesTo: null, check: null },
      round: 1, savedAt: "2026-11-01T10:00:00Z", fileId: "f1", status: "open", reason: "", replies: [], confirmedBy: [] };
    s.threads.push(t);
    return t;
  }
  function blockAnchor(b, d) { return { documentIndex: d || 0, kind: "block", sectionKey: b.sectionKey, sectionTitle: b.sectionTitle, blockId: b.id, quote: b.text, cell: null, targetName: "", itemId: "", field: "" }; }
  function acceptIt(t) { return new Promise(function (res) { RV.accept(t, res); }); }

  var chain = Promise.resolve();
  function step(fn) { chain = chain.then(fn); }

  // ---- a section's opening prose, and its renamed form ------------------------
  var leadKey, leadRun, lead0, other;
  step(function () {
    E.activateInstrument("ncsc-caf");
    return docs();
  });
  step(function (d0) {
    var probe = d0[0].probe;
    // Not the executive summary: its opening holds the consultant's input,
    // which a rewrite must not fix in place (tested further down).
    var s = probe.filter(function (p) { return p.key && p.key !== "executive-summary" && p.texts.length >= 2; })[0];
    ok(!!s, "there is a section opening with two paragraphs or more to try this on (" + (s && s.key) + ")");
    leadKey = s.key; leadRun = s.texts.slice(); lead0 = s.texts[0]; other = s.texts[1];
    var b = d0[0].blocks.filter(function (x) { return x.sectionKey === leadKey && x.type === "paragraph" && RC.norm(x.text) === RC.norm(lead0); })[0];
    var t = thread(blockAnchor(b), "A clearer opening sentence from the reviewer.");
    window.__t1 = t;
    var plan = RV.acceptPlan(t);
    ok(plan.can && plan.kind === "paragraph", "a paragraph of a section's opening can be accepted", JSON.stringify(plan));
    return acceptIt(t);
  });
  step(function (res) {
    ok(res.ok, "accepted", res.message);
    ok(window.__t1.status === "resolved" && window.__t1.accepted.kind === "paragraph", "the comment is resolved and says how");
    var c = E.getReportSection(leadKey);
    ok(!c.prose && c.paragraphs && c.paragraphs.length === 1 && c.paragraphs[0].from === RC.norm(lead0) && c.paragraphs[0].to === "A clearer opening sentence from the reviewer." && !isNaN(Date.parse(c.paragraphs[0].at)),
      "reportCustom holds that one paragraph's replacement, and no rewrite of the run", JSON.stringify(c));
    return wordParas();
  });
  step(function (ps) {
    ok(ps.indexOf("A clearer opening sentence from the reviewer.") !== -1, "the new wording is in the Word document");
    ok(ps.indexOf(RC.norm(lead0)) === -1, "the old wording is gone");
    ok(ps.indexOf(RC.norm(other)) !== -1, "the next paragraph of the run is still there");
    E.clearReportSection(leadKey);
    return docs();
  });
  // Renamed section: the key comes from the generated heading.
  step(function (d0) {
    E.setReportSection(leadKey, { title: "A renamed section" });
    return docs();
  });
  step(function (d1) {
    var b = d1[0].blocks.filter(function (x) { return x.sectionKey === leadKey && x.type === "paragraph" && RC.norm(x.text) === RC.norm(lead0); })[0];
    ok(!!b && b.sectionTitle === "A renamed section", "a renamed section's blocks carry its own key and the new title");
    var t = thread(blockAnchor(b), "Reworded under a renamed heading.");
    return acceptIt(t);
  });
  step(function (res) {
    ok(res.ok && E.getReportSection(leadKey).title === "A renamed section", "accepting there keeps the rename", res.message);
    return wordParas();
  });
  step(function (ps) {
    ok(ps.indexOf("Reworded under a renamed heading.") !== -1 && ps.some(function (p) { return /A renamed section/.test(p); }), "both are in the Word document");
    E.clearReportSection(leadKey);
    return docs();
  });
  // A heading is the section's title.
  step(function (d) {
    var head = d[0].blocks.filter(function (b) { return b.type === "heading" && !b.sub && b.sectionKey === leadKey; })[0];
    var t = thread(blockAnchor(head), "A plainer title");
    var plan = RV.acceptPlan(t);
    ok(plan.can && plan.kind === "section title", "a section's heading can be accepted as a rename", JSON.stringify(plan));
    return acceptIt(t);
  });
  step(function (res) {
    ok(res.ok && E.getReportSection(leadKey).title === "A plainer title", "accepted", res.message);
    return wordParas();
  });
  step(function (ps) {
    ok(ps.some(function (p) { return /A plainer title$/.test(p); }), "and the Word document has the new heading");
    E.clearReportSection(leadKey);
    return docs();
  });

  // ---- each narrative field --------------------------------------------------
  ["topPriorities", "regulatoryExposure"].forEach(function (field) {
    var val = "Our " + field + " paragraph, written by the consultant in the tool.";
    step(function () {
      var p = {}; p[field] = val; E.setReportNarrative(p);
      return docs();
    });
    step(function (d) {
      var b = DB.flatten(d[0].blocks).filter(function (x) { return x.text && RC.norm(x.text).indexOf(val) !== -1; })[0];
      ok(!!b, field + ": prints in the demo's Word document");
      var top = d[0].blocks.filter(function (x) { return x.id === b.id; })[0] || b;
      var t = thread({ documentIndex: 0, kind: "block", sectionKey: top.sectionKey, sectionTitle: top.sectionTitle, blockId: top.id, quote: b.text, cell: null }, b.text.replace("written by the consultant", "reworded by the reviewer"));
      var plan = RV.acceptPlan(t);
      ok(plan.can && plan.kind === "narrative", field + ": can be accepted", JSON.stringify(plan));
      return acceptIt(t).then(function (res) { ok(res.ok, field + ": accepted", res.message); });
    });
    step(function () {
      ok(/reworded by the reviewer/.test(E.getReportNarrative()[field]), field + ": the field now holds the new wording", E.getReportNarrative()[field]);
      return wordParas();
    });
    step(function (ps) {
      ok(ps.some(function (p) { return /reworded by the reviewer/.test(p); }), field + ": and it is in the Word document");
    });
  });
  // method: its own printing path.
  step(function () { E.activateInstrument("iec-62443-3-3"); E.setReportNarrative({ method: "We read the documents and walked the site with the control engineers." }); return docs(); });
  step(function (d) {
    var b = d[0].blocks.filter(function (x) { return x.text && /walked the site with the control engineers/.test(x.text); })[0];
    ok(!!b, "method: prints in the demo's Word document");
    var t = thread(blockAnchor(b), "We read the documents and walked the plant with the control engineers.");
    return acceptIt(t).then(function (res) { ok(res.ok, "method: accepted", res.message); });
  });
  step(function () { ok(/walked the plant/.test(E.getReportNarrative().method), "method: the field holds the new wording"); return wordParas(); });
  step(function (ps) { ok(ps.some(function (p) { return /walked the plant with the control engineers/.test(p); }), "method: and it is in the Word document"); E.activateInstrument("ncsc-caf"); });

  // ---- the next steps, scaffolded until someone edits them ---------------------
  var nsLines;
  step(function () { E.setReportNarrative({ nextSteps: undefined }); return docs(); });
  step(function (d) {
    var key = A.Report.sectionKey("Proposed next steps", { engagement: E.state.engagement });
    var list = d[0].blocks.filter(function (b) { return b.sectionKey === key && b.type !== "heading"; });
    nsLines = list.map(function (b) { return b.text; });
    ok(list.length >= 2 && E.getReportNarrative().nextSteps == null, "the next steps are still the scaffold (" + list.length + " lines)");
    var t = thread(blockAnchor(list[0]), "Agree the first action with the site manager by the end of the month.");
    window.__tns = t;
    var plan = RV.acceptPlan(t);
    ok(plan.can && plan.kind === "narrative", "a next step can be accepted", JSON.stringify(plan));
    return acceptIt(t).then(function (res) { ok(res.ok, "accepted", res.message); });
  });
  step(function () {
    var v = E.getReportNarrative().nextSteps;
    ok(/^Agree the first action/.test(v) && v.split("\n").length === nsLines.length, "the field is made from all the lines, with the one changed", v);
    return wordParas();
  });
  step(function (ps) {
    ok(ps.some(function (p) { return /Agree the first action with the site manager/.test(p); }) && !ps.some(function (p) { return p.indexOf(RC.norm(nsLines[0])) !== -1; }), "and the Word document has it in place of the old line");
    return docs();
  });

  // ---- plan and evidence fields ------------------------------------------------
  step(function (d) {
    var pack = RV.packItems();
    var it = pack.items.filter(function (i) { return i.status === "finding" && i.evidence && i.action && i.impact; })[0];
    window.__it = it;
    var t = thread({ documentIndex: 0, kind: "item", targetName: it.targetName, itemId: it.itemId, field: "evidence", quote: it.evidence, code: it.code, itemTitle: it.title }, it.evidence + " Source: network diagram rev 4.");
    var plan = RV.acceptPlan(t);
    ok(plan.can && plan.kind === "evidence", "an evidence field can be accepted from an item comment", JSON.stringify(plan));
    return acceptIt(t).then(function (res) { ok(res.ok, "accepted: evidence", res.message); });
  });
  step(function () { return wordParas(); });
  step(function (ps) {
    ok(ps.some(function (p) { return /Source: network diagram rev 4\./.test(p); }), "the new evidence is in the Word document");
    var it = window.__it;
    var t = thread({ documentIndex: 0, kind: "item", targetName: it.targetName, itemId: it.itemId, field: "action", quote: it.action, code: it.code, itemTitle: it.title }, "A much more specific recommended action for the site team.");
    return acceptIt(t).then(function (res) { ok(res.ok, "accepted: recommended action", res.message); });
  });
  step(function () { return wordParas(); });
  step(function (ps) {
    ok(ps.some(function (p) { return /A much more specific recommended action for the site team\./.test(p); }), "the new action is in the Word document");
    return docs();
  });
  // From the report text, not the item: the paragraph holds a field.
  step(function (d) {
    var it = window.__it;
    var nowImpact = E.findResponse(E.state.engagement.targets[0].id, it.itemId).impact;
    var hit = null;
    d[0].blocks.forEach(function (b) { if (!hit && b.text && RC.norm(b.text).indexOf(RC.norm(nowImpact)) !== -1) hit = b; });
    ok(!!hit, "the business impact prints in a paragraph of its own");
    var t = thread(blockAnchor(hit), hit.text.replace(nowImpact, "The plant could stop for a shift."));
    var plan = RV.acceptPlan(t);
    ok(plan.can && plan.kind === "business impact", "a plan field is found from the report's own paragraph", JSON.stringify(plan));
    return acceptIt(t).then(function (res) { ok(res.ok, "accepted: business impact from the report text", res.message); });
  });
  step(function () { return wordParas(); });
  step(function (ps) {
    ok(ps.some(function (p) { return /The plant could stop for a shift\./.test(p); }), "and it is in the Word document");
    return docs();
  });

  // ---- the Accept button itself, on the page ----------------------------------
  step(function () {
    E.activateInstrument("ncsc-caf");
    E.setReportNarrative({ topPriorities: "A priorities paragraph to accept through the button on the card." });
    A.UI.go("report");
    return docs();
  });
  step(function (d) {
    var b = DB.flatten(d[0].blocks).filter(function (x) { return /to accept through the button/.test(x.text || ""); })[0];
    var top = d[0].blocks.filter(function (x) { return x.id === b.id; })[0] || b;
    window.__t2 = thread({ documentIndex: 0, kind: "block", sectionKey: top.sectionKey, sectionTitle: top.sectionTitle, blockId: top.id, quote: b.text, cell: null }, b.text.replace("to accept through the button", "accepted through the button"));
    A.UI.go("report");
    var main = document.getElementById("main");
    return new Promise(function (res, rej) {
      var tries = 0;
      (function wait() {
        var c = main.querySelector('[data-comment-id="' + window.__t2.comment.id + '"] .rv-accept');
        if (c) return res(c);
        if (++tries > 400) return rej(new Error("no Accept button"));
        setTimeout(wait, 25);
      })();
    });
  });
  step(function (btn) {
    btn.click();
    var main = document.getElementById("main");
    return new Promise(function (res, rej) {
      var tries = 0;
      (function wait() {
        // The page redraws while Accept checks: the panel must end up settled.
        var n = main.querySelector(".review-card .rv-notice");
        if (n && !main.querySelector(".review-card .rv-busy")) return res(n);
        if (++tries > 800) return rej(new Error("the card never settled: " + main.querySelector(".review-card").textContent.slice(0, 300)));
        setTimeout(wait, 25);
      })();
    });
  });
  step(function (notice) {
    var main = document.getElementById("main");
    ok(/Accepted into the narrative, and checked in the rebuilt Word document\./.test(notice.textContent), "the button accepts, and the card says it was checked in the Word document", notice.textContent);
    ok(!main.querySelector(".review-card .rv-send").hasAttribute("disabled"), "and the card is usable again");
    ok(window.__t2.status === "resolved", "the comment is resolved");
    ok(/accepted through the button/.test(E.getReportNarrative().topPriorities), "and the field changed");
  });

  // ---- Go to ----------------------------------------------------------------------
  step(function () { return docs(); });
  step(function (d) {
    var main = document.getElementById("main");
    var pack = RV.packItems();
    var it = pack.items.filter(function (i) { return i.status === "finding"; })[0];
    // A section with a card on the report page.
    var key = "how-to-read-this-report", b = d[0].blocks.filter(function (x) { return x.sectionKey === key && x.type === "heading"; })[0];
    A.UI.go("engagement");
    var t = thread(blockAnchor(b), null);
    RV.goTo(t);
    ok(main.querySelector('[data-section="' + key + '"]') && main.querySelector('[data-section="' + key + '"]').classList.contains("check-flash"), "Go to from a report comment opens the report page at that section's card");
    // A section only the Word report has, edited elsewhere: the document
    // control page is the engagement details.
    var dc = d[0].blocks.filter(function (x) { return x.sectionKey === "document-control-and-confidentiality" && x.type === "heading"; })[0];
    ok(RV.goTo(thread(blockAnchor(dc), null)) === "engagement", "Go to on the document control page opens the engagement details");
    var em = document.querySelector(".modal");
    ok(!!em && /QA review by/.test(em.textContent), "where its fields are filled in");
    var emClose = em && Array.prototype.filter.call(em.querySelectorAll("button"), function (x) { return /Close|Cancel/.test(x.textContent); })[0];
    if (emClose) emClose.click();
    // Text written from the framework, with nowhere to edit it, says so by name.
    var sm = d[0].blocks.filter(function (x) { return x.sectionKey === "scoring-methodology" && x.type === "heading"; })[0];
    ok(!!sm && RV.goTo(thread(blockAnchor(sm), null)) === null, "Go to on the scoring methodology goes nowhere");
    ok(/"Scoring methodology" is only in the Word report/.test(document.getElementById("toast").textContent), "and says so, naming the section", document.getElementById("toast").textContent);
    // An item, on its capture page.
    RV.goTo(thread({ documentIndex: 0, kind: "item", targetName: it.targetName, itemId: it.itemId, field: "evidence", quote: it.evidence }, null));
    return new Promise(function (r) { setTimeout(r, 120); }).then(function () {
      var row = main.querySelector('[data-req-id="' + it.itemId + '"]');
      ok(!!row && row.classList.contains("jump-flash"), "Go to from an item comment opens its capture page and flashes it", it.itemId);
      // A roadmap field: the plan dialogue.
      RV.goTo(thread({ documentIndex: 0, kind: "item", targetName: it.targetName, itemId: it.itemId, field: "action", quote: it.action }, null));
      var m = document.querySelector(".modal");
      ok(!!m && m.textContent.indexOf(it.code) !== -1, "and from a plan field, the plan dialogue");
      var close = m && Array.prototype.filter.call(m.querySelectorAll("button"), function (x) { return /Close|Cancel/.test(x.textContent); })[0];
      if (close) close.click();
      // The basis of assessment; a general comment with nowhere to go.
      var basis = thread({ documentIndex: 0, kind: "general", sectionTitle: "Basis of assessment", quote: "" }, null);
      ok(RV.canGo(basis) && !RV.canGo(thread({ documentIndex: 0, kind: "general", sectionTitle: "General", quote: "" }, null)), "a general comment offers Go to only where there is somewhere to go");
      RV.goTo(basis);
      ok(!!main.querySelector('[data-check-anchor="basis"]'), "the basis of assessment comment goes to its register");
    });
  });

  // ---- what falls back to Copy ------------------------------------------------
  step(function () { return docs(); });
  step(function (d) {
    // Generated text: a paragraph of the methodology appendix or a results table.
    var table = d[0].blocks.filter(function (b) { return b.type === "table" && !b.front && /Results|Outcome/.test(b.sectionTitle || ""); })[0] || d[0].blocks.filter(function (b) { return b.type === "table" && !b.front; })[1];
    var cell = table.rows[1].cells[0];
    var t = thread({ documentIndex: 0, kind: "block", sectionKey: table.sectionKey, sectionTitle: table.sectionTitle, blockId: table.id, quote: cell.text, cell: { row: 1, col: 0 } }, "Different words for this cell.");
    var plan = RV.acceptPlan(t);
    ok(!plan.can && /cannot be changed here/.test(plan.why), "a generated table cell falls back to Copy, saying why", JSON.stringify(plan));
    // A stale comment.
    var t2 = thread({ documentIndex: 0, kind: "block", sectionKey: leadKey, sectionTitle: "x", blockId: "d0-b1", quote: "A sentence that is no longer in this report at all.", cell: null }, "New words.");
    var p2 = RV.acceptPlan(t2);
    ok(!p2.can && /no longer matches/.test(p2.why), "a comment that no longer matches falls back to Copy", JSON.stringify(p2));
    ok(RV.isStale(t2) === true, "and is marked as no longer matching, not lost");
    ok(RV.store().threads.indexOf(t2) !== -1, "it stays in the list");
    var t3 = thread(blockAnchor(d[0].blocks.filter(function (b) { return b.type === "heading" && !b.sub; })[0]), null);
    ok(RV.isStale(t3) === false, "a comment that still matches is not marked");
    // An item whose field has changed.
    var it = window.__it;
    var t4 = thread({ documentIndex: 0, kind: "item", targetName: it.targetName, itemId: it.itemId, field: "owner", quote: "Somebody who is not the owner now", code: it.code }, "A. Person");
    var p4 = RV.acceptPlan(t4);
    ok(!p4.can && /has changed since/.test(p4.why) && RV.isStale(t4) === true, "an item field changed since the review falls back to Copy", JSON.stringify(p4));
    // The same wording on two items.
    var rs = E.state.engagement.responses.filter(function (r) { return r.evidence; });
    E.setResponse(rs[0].targetId, rs[0].requirementId, { evidence: "The very same evidence wording on two items." });
    E.setResponse(rs[1].targetId, rs[1].requirementId, { evidence: "The very same evidence wording on two items." });
    return docs();
  });
  step(function (d) {
    var b = null;
    d[0].blocks.forEach(function (x) { if (!b && x.text && /The very same evidence wording on two items\./.test(x.text)) b = x; });
    if (!b) d[0].blocks.forEach(function (x) { if (!b && x.type === "table" && /The very same evidence wording/.test(x.text)) b = x; });
    ok(!!b, "the shared wording prints");
    var quote = b.type === "table" ? "The very same evidence wording on two items." : b.text, cell = null;
    // In a table, the comment is on the cell, as the review tool anchors it.
    if (b.type === "table") b.rows.forEach(function (r, ri) { r.cells.forEach(function (c, ci) { if (!cell && RC.norm(c.text) === quote) cell = { row: ri, col: ci }; }); });
    var t = thread({ documentIndex: 0, kind: "block", sectionKey: b.sectionKey, sectionTitle: b.sectionTitle, blockId: b.id, quote: quote, cell: cell }, quote.replace("very same", "one"));
    var plan = RV.acceptPlan(t);
    ok(!plan.can && /on 2 items/.test(plan.why), "wording recorded on two items falls back to Copy, as it could only change one", JSON.stringify(plan));
  });

  // ---- a section that opens differently per zone ----------------------------------
  // Only the commented paragraph is replaced, so the other zones' openings
  // are not at risk and Accept is offered (test-review-para.html accepts it).
  step(function () { E.activateInstrument("iec-62443-3-3"); return docs(); });
  step(function (d) {
    var byKey = {};

      var c = Object.assign({}, real(o));
      // Only once the change is in: the first read must still find the comment.
      var now = (E.findResponse(tid, it.itemId) || {}).evidence || "";
      if (/Seen on site\./.test(now)) {
        c[sec4.key] = Object.assign({}, c[sec4.key], { hidden: true });
        c[leadKey] = Object.assign({}, c[leadKey], { prose: "Captured evidence: " + now });
      }
      return c;
    };
    return acceptIt(sec4.t).then(function (res) {
      A.Report.reportCustom = real;
      ok(DB.flatten(RV.cachedDocs()[0].blocks).every(function (b) { return !/Seen on site\./.test(b.text || ""); }), "(the documents are back as they were)");
      ok(!res.ok && /did not reach the Word document/.test(res.message), "wording that prints only in another section does not count as accepted", res.message);
      ok(E.findResponse(tid, it.itemId).evidence === it.evidence && sec4.t.status === "open", "and the change is undone");
      var s = RV.store(); s.threads = s.threads.filter(function (t) { return t !== sec4.t; });
      return docs();
    });
  });

  // ---- an answer a zone inherits ----------------------------------------------------------
  var sh = {};
  step(function () { E.activateInstrument("iec-62443-3-3"); return docs(); });
  step(function () {
    var S = E.SHARED_TARGET_ID, eng = E.state.engagement, z = eng.targets[0];
    // A system-wide answer every zone inherits.
    var r = eng.responses.filter(function (x) {
      return x.targetId === S && Object.keys(x.components || {}).some(function (k) { return x.components[k].state && !(x.components[k].appliesTo || []).length; });
    })[0];
    ok(!!r, "the 3-3 demo has a system-wide answer");
    sh.S = S; sh.z = z; sh.id = r.requirementId;
    sh.was = { action: r.action || "" };
    E.setResponse(S, sh.id, { action: "Shared recommended action for every zone." });
    // The zone has an owner of its own, so it takes none of the shared plan:
    // its recommended action is blank, whatever the shared layer holds.
    E.setResponse(z.id, sh.id, { owner: "Zone owner only", action: "", impact: "", priorityBand: "", priorityRank: null });
    var it = RV.packItems().items.filter(function (i) { return i.targetId === z.id && i.itemId === sh.id; })[0];
    ok(it.action === "" && it.owner === "Zone owner only", "a zone with its own owner shows no inherited action in the pack", JSON.stringify([it.action, it.owner]));
    sh.t = thread({ documentIndex: 0, kind: "item", targetName: z.name, targetId: z.id, itemId: sh.id, field: "action", quote: it.action, code: it.code, itemTitle: it.title, groupName: it.groupName }, "Enforce it by March.");
    ok(RV.isStale(sh.t) === false, "a comment on that blank action is not marked as no longer matching");
    var plan = RV.acceptPlan(sh.t);
    ok(plan.can && plan.kind === "recommended action" && plan.revert.targetId === z.id, "and its wording goes to the zone's own answer, not the system-wide one", JSON.stringify(plan));
    // With no plan of its own, the zone inherits the shared one.
    E.setResponse(z.id, sh.id, { owner: "" });
    it = RV.packItems().items.filter(function (i) { return i.targetId === z.id && i.itemId === sh.id; })[0];
    ok(it.action === "Shared recommended action for every zone.", "with no plan of its own the zone shows the system-wide action", it.action);
    sh.t2 = thread({ documentIndex: 0, kind: "item", targetName: z.name, targetId: z.id, itemId: sh.id, field: "action", quote: it.action, code: it.code, itemTitle: it.title, groupName: it.groupName }, "Shared recommended action, agreed with the site.");
    ok(RV.isStale(sh.t2) === false, "a comment on it matches");
    plan = RV.acceptPlan(sh.t2);
    ok(plan.can && plan.revert.targetId === S, "and its wording goes to the system-wide answer", JSON.stringify(plan));
    return acceptIt(sh.t2);
  });
  step(function (res) {
    ok(res.ok && E.findResponse(sh.S, sh.id).action === "Shared recommended action, agreed with the site.", "accepted into the system-wide answer", res.message);
    ok(/This is a system-wide answer, so the change applies to every .+ that inherits it\./.test(res.message) && !/[\u2013\u2014]/.test(res.message), "and the message says it applies to every zone that inherits it", res.message);
    return new Promise(function (r) { RV.undoAccept(sh.t2, r); });
  });
  step(function (res) {
    ok(res.ok && E.findResponse(sh.S, sh.id).action === "Shared recommended action for every zone.", "Undo puts the system-wide wording back", res.message);
    E.setResponse(sh.S, sh.id, { action: sh.was.action });
    var s = RV.store(); s.threads = s.threads.filter(function (t) { return t !== sh.t && t !== sh.t2; });
  });
  chain.catch(function (e) { ok(false, "threw: " + (e && e.message) + " " + (e && e.stack)); }).then(done);
});
</script>
