<html lang="en"><head><meta charset="utf-8"/><title>Review tool: defects fixed, and four small features</title></head>
<body>
<pre id="out">running...</pre>
<!--
  One section per defect or feature, each from a fresh page, on small packs
  built here so every case is under the test's control:
    a comment made from a check quotes the whole block or cell; a cell comment
    is found again by its row and column, and a tie is never called the same;
    dismissed checks and a note alone are work to protect; notes are saved as
    they are typed; pack values are checked before they reach a style or a
    src, and the page carries a Content-Security-Policy; the checks' smaller
    faults; replies to earlier comments; the outline follows the section in
    view; the suggested wording box; a checklist No that offers a comment.
  Needs --allow-file-access-from-files (tools/run-tests.ps1 passes it).
-->
<iframe id="f" style="width:1280px;height:800px;border:0"></iframe>
<script src="../data/demo-pack.js"></script>
<script>
(function () {
  var lines = [], fail = 0;
  function ok(c, n, d) { lines.push((c ? "PASS " : "FAIL ") + n + (!c && d ? " - " + d : "")); if (!c) fail++; }
  function finish() {
    lines.push("", fail === 0 ? "ALL TESTS PASSED" : fail + " FAILED");
    document.getElementById("out").textContent = lines.join("\n");
  }
  var frame = document.getElementById("f");
  function poll(test, ms) {
    var end = Date.now() + (ms || 30000);
    return new Promise(function (resolve, reject) {
      (function go() {
        var v; try { v = test(); } catch (e) { v = null; }
        if (v) return resolve(v);
        if (Date.now() > end) return reject(new Error("timed out: " + test.toString().slice(0, 120)));
        setTimeout(go, 20);
      })();
    });
  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  var errors = [], confirms = 0, downloads = [];
  var W, R, D, RK;
  function load(q) {
    return new Promise(function (res) {
      frame.onload = function () {
        var w = frame.contentWindow;
        confirms = 0; downloads = [];
        w.confirm = function () { confirms++; return true; }; w.alert = function () {};
        w.HTMLAnchorElement.prototype.click = function () { if (this.download) downloads.push(this.download); };
        w.addEventListener("error", function (e) { errors.push(e.message); });
        poll(function () { return w.ReviewTool; }).then(function () { W = w; R = w.ReviewTool; D = w.document; RK = w.App.ReviewChecks; res(w); });
      };
      frame.src = "../index.html" + (q || "");
    });
  }
  function clean() { try { Object.keys(localStorage).forEach(function (k) { if (/^spt-review:/.test(k)) localStorage.removeItem(k); }); } catch (e) {} }
  function settle() { if (R) { R.state.dirty = false; R.state.composer = null; R.state.replyBox = null; } }
  function fresh(q) {
    settle(); clean();
    localStorage.setItem("spt-review:reviewer:v1", "Me Myself");
    frame.style.width = "1280px";
    return load(q);
  }
  function nav(id) { D.querySelector('.nav-item[data-page="' + id + '"]').click(); }
  function type(el, v, evt) { el.value = v; el.dispatchEvent(new W.Event(evt || "input", { bubbles: true })); }
  function toastText() { return D.getElementById("toast").textContent; }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function stored(pid) { var v = localStorage.getItem("spt-review:autosave:v1:" + pid); return v ? JSON.parse(v) : null; }
  function open(pack, name) { settle(); return R.loadTexts([{ name: name || "pack.json", text: JSON.stringify(pack) }]); }
  function texts(sel) { return Array.prototype.map.call(D.querySelectorAll(sel), function (n) { return n.textContent; }); }

  // ---- small packs ----------------------------------------------------------
  var seq = 0;
  function para(id, text, key, title, extra) {
    var b = { id: id, type: "paragraph", text: text, runs: [{ t: text, b: false, i: false, red: false }], red: false, sectionKey: key || "", sectionTitle: title || "" };
    Object.keys(extra || {}).forEach(function (k) { b[k] = extra[k]; });
    return b;
  }
  function head(id, n, title, key) {
    var runs = n == null ? [{ t: title }] : [{ t: n + " " }, { t: title }];
    return { id: id, type: "heading", level: 1, text: runs.map(function (r) { return r.t; }).join(""), runs: runs, sectionKey: key, sectionTitle: title };
  }
  function cell(text, paras) {
    return { blocks: (paras || [text]).map(function (t) { return { type: "paragraph", text: t, runs: [{ t: t }], red: false }; }), text: text, red: false };
  }
  function table(id, rows, key, title) {
    return { id: id, type: "table", sectionKey: key, sectionTitle: title, text: rows.map(function (r) { return r.join(" "); }).join(" "),
      rows: rows.map(function (r) { return { cells: r.map(function (t) { return typeof t === "string" ? cell(t) : t; }) }; }) };
  }
  function mkPack(blocks, o) {
    var p = clone(window.SPT_REVIEW_DEMO_PACK);
    p.packId = "rp-fix-" + Date.now().toString(36) + "-" + (++seq);
    p.round = 1;
    p.engagement.client = "Example Water"; p.engagement.site = "Works";
    p.documents = [{ title: "Works report", targetName: "Works", contentHash: "h" + seq, blocks: blocks, media: {} }];
    p.items = []; p.facts = { perTarget: [] };
    p.previousRound = { comments: [], verdicts: [] };
    Object.keys(o || {}).forEach(function (k) { p[k] = o[k]; });
    return p;
  }
  // The next round's pack: the same report unless changed, carrying comments.
  function round2(pack, cs, change) {
    var p = clone(pack);
    p.packId = pack.packId + "-r2"; p.round = 2;
    p.previousRound = { comments: cs.map(function (c) { return c.comment ? c : { comment: c, status: "open", reason: "", replies: [], round: 1, confirmedBy: [] }; }), verdicts: [] };
    if (change) change(p);
    return p;
  }
  function prevOf(c, o) {
    var p = { comment: c, status: "open", reason: "", replies: [], round: 1, confirmedBy: [] };
    Object.keys(o || {}).forEach(function (k) { p[k] = o[k]; });
    return p;
  }
  function cmt(id, anchor, text) {
    return { id: id, reviewer: "Me Myself", createdAt: "2026-11-01T09:00:00.000Z", updatedAt: "2026-11-01T09:00:00.000Z", severity: "should-fix", anchor: anchor, text: text || "Look at this.", suggestion: null, relatesTo: null, check: null };
  }
  function blockAnchorOf(b, key, o) {
    var a = { documentIndex: 0, documentTitle: "Works report", kind: "block", sectionKey: b.sectionKey, sectionTitle: b.sectionTitle, blockId: b.id, blockType: b.type, quote: b.text, cell: null, targetName: "Works", itemId: "", field: "" };
    Object.keys(o || {}).forEach(function (k) { a[k] = o[k]; });
    return a;
  }
  var LONG = "The historian is shared with Northbridge Manufacturing under an old support contract, and the remote access path that was set up for it is still open: the vendor account has no expiry, the jump host is not patched, and nobody on site could say who approves its use or reviews what it is used for from one quarter to the next.";
  var STATES = [["Ref", "Outcome", "State"], ["A1.a", "Governance", "Achieved"], ["A1.b", "Risk management", "Partially achieved"], ["A2.a", "Asset management", "Partially achieved"],
    ["A2.b", "Assurance", "Partially achieved"], ["B1.a", "Policy", "Not achieved"]];

  var sections = [
    // ---- 1 -------------------------------------------------------------------
    ["1: a comment made from a check quotes the whole block or cell", function () {
      var red = para("d0-b2", "The scope is set out below. [Consultant to describe the scope here]", "scope", "Scope", { red: true });
      red.runs = [{ t: "The scope is set out below. ", red: false }, { t: "[Consultant to describe the scope here]", red: true }];
      var two = cell("Reviewed on site Remote access — not reviewed", ["Reviewed on site", "Remote access — not reviewed"]);
      var blocks = [para("d0-b0", "Example Water runs the Works.", "", ""), head("d0-b1", 1, "Scope", "scope"), red, para("d0-b3", LONG, "scope", "Scope"),
        para("d0-b4", "The example water team asked for this review of the control room, the two pumping stations and the telemetry that links them to the Works.", "scope", "Scope"),
        table("d0-b5", [["Area", "What was done"], ["Network", two]], "scope", "Scope"),
        para("d0-b6", "12 of 300 controls were assessed as achieved. Each is listed with the evidence recorded against it.", "scope", "Scope")];
      var pack = mkPack(blocks, { facts: { perTarget: [{ targetName: "Works", roadmapEntries: 9, met: 30 }] } });
      return fresh().then(function () {
        var res = RK.run(pack, {}).filter(function (r) { return r.kind === "block"; });
        var byId = {}; blocks.forEach(function (b) { byId[b.id] = b; });
        function whole(r) { var b = byId[r.blockId]; return r.cell ? b.rows[r.cell.row].cells[r.cell.col].text : b.text; }
        var want = ["red-prompts:d0-b2", "other-names:d0-b3:Northbridge Manufacturing", "client-name:variant:0:example water", "dashes:d0-b5:1.1.1", "figures:d0-b6:3"];
        var ids = res.map(function (r) { return r.id; });
        ok(want.every(function (id) { return ids.indexOf(id) !== -1; }), "the red prompt, other name, name variant, cell dash and figure are found, under the ids they always had", ids.join(" | "));
        ok(res.length > 0 && res.every(function (r) { return r.fullText === whole(r); }), "every block result carries the whole block text, or the whole cell text, for the anchor",
          res.filter(function (r) { return r.fullText !== whole(r); }).map(function (r) { return r.id; }).join(" | "));
        var other = res.filter(function (r) { return r.id === want[1]; })[0], redR = res.filter(function (r) { return r.id === want[0]; })[0];
        ok(other.quote.length < LONG.length && /…$/.test(other.quote) && redR.quote === "[Consultant to describe the scope here]", "and keeps the clipped or partial words for showing", other.quote.length + " / " + redR.quote);
        open(pack);
        nav("checks");
        want.forEach(function (id) {
          var row = Array.prototype.filter.call(D.querySelectorAll(".rr-check"), function (n) { return n.getAttribute("data-check-id") === id; })[0];
          row.querySelector(".rr-check-comment").click();
        });
        var made = R.state.review.comments;
        ok(made.length === want.length && made.every(function (c) {
          var b = byId[c.anchor.blockId];
          return c.anchor.quote === (c.anchor.cell ? b.rows[c.anchor.cell.row].cells[c.anchor.cell.col].text : b.text) && c.anchor.blockType === b.type && c.anchor.kind === "block";
        }), "Make it a comment anchors each to the whole text of its block or cell, as a click on it would",
          made.map(function (c) { return c.check + "=" + c.anchor.quote.length; }).join(" | "));
        var onCell = made.filter(function (c) { return c.check === want[3]; })[0];
        ok(onCell.anchor.cell.row === 1 && onCell.anchor.cell.col === 1 && onCell.anchor.quote === two.text && onCell.anchor.rowKey === "Network" && onCell.anchor.colHead === "What was done",
          "a cell result quotes the whole cell, both paragraphs, and keeps its row and column", JSON.stringify(onCell.anchor));
        ok(texts(".rr-chip.met").filter(function (t) { return t === "Comment added"; }).length === want.length, "and each check line says a comment was added");
        // Round 2, report unchanged: each is found where it was, with nothing marked as changed.
        var p2 = round2(pack, clone(made));
        open(p2);
        ok(made.every(function (c) { var l = R.locatePrev(c.anchor); return l && l.how === "same" && l.block.id === c.anchor.blockId && !l.tie; }), "next round, with the report unchanged, each is found as the same text",
          made.map(function (c) { var l = R.locatePrev(c.anchor); return c.check + ":" + (l && l.how); }).join(" | "));
        nav("previous");
        ok(D.querySelectorAll("[data-prev-id]").length === want.length && D.querySelectorAll(".rr-chip.changed").length === 0, "and none is marked Text changed", texts(".rr-chip.changed").join(" | "));
      });
    }],
    // ---- 2 -------------------------------------------------------------------
    ["2: a cell comment is found by its row and column, and a tie is not called the same", function () {
      var t = table("d0-b2", STATES, "results", "Results");
      var blocks = [para("d0-b0", "Example Water", "", ""), head("d0-b1", 1, "Results", "results"), t,
        head("d0-b3", 2, "Evidence", "evidence"), para("d0-b4", "Evidence was not provided.", "evidence", "Evidence"), para("d0-b5", "Evidence was not provided.", "evidence", "Evidence"),
        head("d0-b6", 3, "Plans", "plans"), para("d0-b7", "Evidence was not provided.", "plans", "Plans"), para("d0-b8", "A plan is in place for the telemetry.", "plans", "Plans")];
      var pack = mkPack(blocks);
      var mine, old;
      return fresh().then(function () {
        open(pack);
        D.querySelector('[data-block-id="d0-b2"] td[data-cell="4.2"]').click();
        return poll(function () { return D.querySelector(".rr-composer textarea"); });
      }).then(function (ta) {
        type(ta, "A2.b looks achieved to me.");
        D.querySelector(".rr-c-add").click();
        mine = clone(R.state.review.comments[0]);
        ok(mine.anchor.cell.row === 4 && mine.anchor.rowKey === "A2.b" && mine.anchor.colHead === "State" && mine.anchor.quote === "Partially achieved",
          "a comment on a cell keeps the first cell of its row and the header of its column", JSON.stringify(mine.anchor));
        old = clone(mine); old.id = "c-old"; delete old.anchor.rowKey; delete old.anchor.colHead;
        var unique = cmt("c-unique", blockAnchorOf(t, null, { quote: "Not achieved", cell: { row: 5, col: 2 } }));
        var p1 = cmt("c-p-ev", blockAnchorOf(blocks[5])), p2 = cmt("c-p-plan", blockAnchorOf(blocks[7]));
        // Round 2: a row added above, so A2.b is one lower and every later block id has moved on by one.
        var r2 = round2(pack, [mine, old, unique, p1, p2], function (p) {
          var bs = p.documents[0].blocks;
          bs[2].rows.splice(1, 0, { cells: [cell("A0.z"), cell("New outcome"), cell("Partially achieved")] });
          bs.splice(1, 0, para("d0-bX", "A paragraph added before the results.", "", ""));
          bs.forEach(function (b, i) { b.id = "d0-b" + i; });
        });
        open(r2);
        var l = R.locatePrev(mine.anchor);
        ok(l && l.how === "same" && l.cell.row === 5 && l.cell.col === 2 && !l.tie, "next round it is found in its own row, which has moved down one", JSON.stringify(l && { how: l.how, cell: l.cell, tie: l.tie }));
        var lo = R.locatePrev(old.anchor);
        ok(lo && lo.how === "near" && lo.tie === true, "the same comment from an older file, with no row kept, is a tie among the cells that say it: not called the same", JSON.stringify(lo && { how: lo.how, cell: lo.cell, tie: lo.tie }));
        var lu = R.locatePrev(unique.anchor);
        ok(lu && lu.how === "same" && lu.cell.row === 6, "a cell whose words are in the table once is still simply found, row kept or not", JSON.stringify(lu && { how: lu.how, cell: lu.cell }));
        var lp = R.locatePrev(p1.anchor), lq = R.locatePrev(p2.anchor);
        ok(lp && lp.how === "near" && lp.tie === true && lp.block.sectionKey === "evidence" && lp.block.text === "Evidence was not provided.", "a paragraph repeated in its section is a tie, kept to that section", JSON.stringify(lp && { how: lp.how, id: lp.block.id, tie: lp.tie }));
        ok(lp.block.id === "d0-b5", "and the guess is the block now at the old id", lp.block.id);
        var moved = clone(p1.anchor); moved.blockId = "d0-b9";
        var lm = R.locatePrev(moved);
        ok(lm && lm.tie === true && lm.block.id === "d0-b6", "or, with no twin at the old id, the one nearest to where it was", lm && lm.block.id);
        ok(lq && lq.how === "same" && lq.block.sectionKey === "plans", "the same words once in another section are found there, as the same", JSON.stringify(lq && { how: lq.how, id: lq.block.id }));
        nav("previous");
        function card(id) { return D.querySelector('[data-prev-id="' + id + '"]'); }
        ok(/Check the place/.test(card("c-old").textContent) && /could not be matched to one cell/.test(card("c-old").textContent) && !/Text changed/.test(card("c-old").textContent),
          "a tie tells the reviewer to check the place, and does not claim the text changed", card("c-old").textContent);
        ok(!/Check the place/.test(card(mine.id).textContent) && !/Text changed/.test(card(mine.id).textContent), "the comment found by its row says neither");
        ok(/Check the place/.test(card("c-p-ev").textContent) && /more than once/.test(card("c-p-ev").textContent), "the repeated paragraph says the words are there more than once");
        // The row itself gone: the words elsewhere are not its cell.
        var r3 = round2(pack, [mine], function (p) { p.packId += "b"; p.documents[0].blocks[2].rows.splice(4, 1); });
        open(r3);
        var lg = R.locatePrev(mine.anchor);
        ok(lg && lg.how === "near" && lg.tie === true, "with its row removed, the same words in other rows are only a guess", JSON.stringify(lg && { how: lg.how, cell: lg.cell, tie: lg.tie }));
      });
    }],
    // ---- 3 -------------------------------------------------------------------
    ["3: dismissed checks, or a note alone, are work to protect", function () {
      var blocks = [para("d0-b0", "Example Water — the Works.", "", ""), head("d0-b1", 1, "Scope", "scope"), para("d0-b2", "TBC by the site.", "scope", "Scope")];
      var pack = mkPack(blocks), other = mkPack(blocks);
      return fresh().then(function () {
        ok(R.hasWork({ dismissedChecks: ["x"] }) && R.hasWork({ verdict: { value: "none", note: "A note." } }) && R.hasWork({ replies: [{ id: "r", to: "c", text: "t" }] }) &&
          !R.hasWork({ verdict: { value: "none", note: " " }, dismissedChecks: [], comments: [], checklist: [], confirmations: [] }),
          "dismissed checks, a note with no verdict and a reply each count as work; an empty review does not");
        open(pack);
        nav("checks");
        var n = D.querySelectorAll(".rr-check-dismiss").length;
        D.querySelector(".rr-check-dismiss").click();
        D.querySelector(".rr-check-dismiss").click();
        ok(n >= 2 && R.state.review.dismissedChecks.length === 2 && R.isDirty(), "two checks dismissed, nothing else done");
        // Another pack over it: asked in the page, and not by confirm().
        R.loadTexts([{ name: "other.json", text: JSON.stringify(other) }]);
        ok(!!D.getElementById("rr-leave-no") && confirms === 0 && R.state.pack.packId === pack.packId, "opening another pack over it asks first, in the tool's own dialog", "confirm() calls " + confirms);
        D.getElementById("rr-leave-no").click();
        ok(R.state.pack.packId === pack.packId && R.state.review.dismissedChecks.length === 2 && !D.querySelector(".rr-modal"), "Stay keeps the pack and the work as they were");
        R.loadTexts([{ name: "other.json", text: JSON.stringify(other) }]);
        D.getElementById("rr-leave-yes").click();
        var snap = stored(pack.packId);
        ok(R.state.pack.packId === other.packId, "Open the pack without saving opens it");
        ok(!!snap && snap.review.dismissedChecks.length === 2, "and the work left behind is stored at once, not lost with a write still waiting", JSON.stringify(snap && snap.review.dismissedChecks));
        open(pack);
        ok(!!D.getElementById("rr-restore") && R.state.restore && R.state.restore.review.dismissedChecks.length === 2, "opening the first pack again offers the dismissed checks back");
        D.getElementById("rr-restore-yes").click();
        ok(R.state.review.dismissedChecks.length === 2, "and Restore puts them back");
        // A note for the author alone.
        settle(); clean(); localStorage.setItem("spt-review:reviewer:v1", "Me Myself");
        open(pack);
        nav("summary");
        type(D.getElementById("rr-verdict-note"), "Only a note so far.");
        R.writeAutosave();
        open(other); open(pack);
        ok(!!D.getElementById("rr-restore") && R.state.restore.review.verdict.note === "Only a note so far.", "a note for the author with no verdict is offered back too");
      });
    }],
    // ---- 4 -------------------------------------------------------------------
    ["4: notes are saved as they are typed", function () {
      var pack = mkPack([para("d0-b0", "Example Water", "", ""), head("d0-b1", 1, "Scope", "scope"), para("d0-b2", "The scope is the Works.", "scope", "Scope")]);
      return fresh().then(function () {
        open(pack);
        nav("summary");
        var ta = D.getElementById("rr-verdict-note");
        ta.focus();
        type(ta, "Typed and not left.");   // input only: no change, no blur
        ok(R.state.review.verdict.note === "Typed and not left." && R.isDirty(), "the note for the author is in the review as it is typed, and the review is unsaved");
        ok(D.getElementById("rr-verdict-note") === ta && D.activeElement === ta, "without the page being drawn again under the caret");
        var ev = new W.Event("beforeunload", { cancelable: true });
        W.dispatchEvent(ev);
        var snap = stored(pack.packId);
        ok(ev.defaultPrevented && snap && snap.review.verdict.note === "Typed and not left.", "closing the window then warns, and the crash copy holds the note", JSON.stringify(snap && snap.review.verdict));
        settle();
        nav("checklist");
        var q = D.querySelector(".rr-q"), input = q.querySelector(".rr-note input");
        input.focus();
        type(input, "See the scope.");
        var a = R.state.review.checklist.filter(function (x) { return x.id === q.getAttribute("data-q"); })[0];
        ok(a && a.note === "See the scope." && R.isDirty() && q.querySelector(".rr-note input") === input && D.activeElement === input, "a checklist note is saved as it is typed too, with no redraw", JSON.stringify(a));
      });
    }],
    // ---- 5 -------------------------------------------------------------------
    ["5: pack values are checked before they reach a style or a src", function () {
      var PNG = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==";
      var t = table("d0-b2", [["Good", "Bad", "Plain"]], "scope", "Scope");
      t.rows[0].cells[0].fill = "1F4E79";
      t.rows[0].cells[1].fill = "FFF;background:url(https://tracker.invalid/beacon.png)";
      t.rows[0].cells[2].fill = "AUTO";
      function img(id, m, w) { return { id: id, type: "image", media: m, width: w, sectionKey: "scope", sectionTitle: "Scope" }; }
      var pack = mkPack([para("d0-b0", "Example Water", "", ""), head("d0-b1", 1, "Scope", "scope"), t, img("d0-b3", "ok", 300), img("d0-b4", "unc", 300), img("d0-b5", "web", 300), img("d0-b6", "html", 300),
        img("d0-b7", "ok", "1px;background:url(https://tracker.invalid/w.png)")]);
      pack.documents[0].media = { ok: PNG, unc: "file://attacker.invalid/share/x.png", web: "https://tracker.invalid/x.png", html: "data:text/html;base64,PGI+eDwvYj4=" };
      return fresh().then(function () {
        open(pack);
        var tds = D.querySelectorAll('[data-block-id="d0-b2"] td');
        ok(/rgb\(31, 78, 121\)/.test(tds[0].style.backgroundColor) && tds[0].style.color !== "", "a six-figure fill still shades its cell", tds[0].getAttribute("style"));
        ok(!tds[1].getAttribute("style") && !tds[2].getAttribute("style"), "a fill that is anything else is not put in a style", tds[1].getAttribute("style"));
        function pic(id) { return D.querySelector('[data-block-id="' + id + '"] img'); }
        ok(!!pic("d0-b3") && pic("d0-b3").getAttribute("src") === PNG, "an embedded PNG is shown");
        ok(!pic("d0-b4") && !pic("d0-b5") && !pic("d0-b6"), "a file address, a web address and data that is not a picture are never given to an img");
        ok(!!pic("d0-b7") && !pic("d0-b7").getAttribute("style"), "and a width that is not a number is left out", pic("d0-b7") && pic("d0-b7").getAttribute("style"));
        ok(!D.querySelector("#main img[src^='file:'], #main img[src^='http']"), "no picture in the report points outside the pack");

        var snap = stored(p2.packId);
        ok(snap && snap.review.replies.length === 2, "the crash copy holds the replies");
        return new Promise(function (res) { R.saveReview(null, res); });
      }).then(function (res) {
        saved = JSON.parse(res.text);
        ok(res.ok && Array.isArray(saved.replies) && saved.replies.length === 2 && saved.replies[0].to === "c-one" && saved.schema === "spt-review/1.0", "the review file holds them in a top-level replies array", JSON.stringify(saved.replies));
        // Merging: keyed by id, the later edit wins, nothing dropped.
        var a = clone(saved), b = clone(saved);

        ok(m.replies.length === 3 && m.replies[0].text === "Edited later." && m.replies[1].text === "It is, with the photo added." && m.replies[2].id === "r-new", "two copies merge by id: the later edit wins, and a reply only one has is kept",
          JSON.stringify(m.replies.map(function (r) { return r.text; })));

        ok(R.mergeReviews(none, none, false).replies === undefined && R.mergeReviews(none, saved, false).replies.length === 2, "and a copy with no replies merges as before");
        // Restore after a crash brings them back.
        settle();

        var oldFile = clone(saved); delete oldFile.replies; oldFile.comments = [cmt("c-mine", blockAnchorOf(blocks[2]), "Mine.")];
        open(p2);
        R.loadTexts([{ name: "old.json", text: JSON.stringify(oldFile) }]);
        ok(R.state.review.comments.length === 1 && !("replies" in R.state.review) && !R.isDirty(), "an older review file with no replies opens as it always did");
        // A colleague's file: theirs, read only.
        var theirs = clone(saved); theirs.reviewer = "C. Colleague"; theirs.fileId = "rf-theirs"; theirs.comments = [];
        R.loadTexts([{ name: "theirs.json", text: JSON.stringify(theirs) }]);
        D.getElementById("rr-whose-mine").click();
        nav("previous");
        var their = D.querySelector('[data-prev-id="c-one"] .rr-reply-theirs');
        ok(!!their && /C\. Colleague/.test(their.textContent) && /Read only/.test(their.textContent) && !their.querySelector("button") && !("replies" in R.state.review),
          "a colleague's replies show in the thread read only, and are not taken into your review", their && their.textContent);
      });
    }],
    // ---- B -------------------------------------------------------------------
    ["B: the outline follows the section in view", function () {
      var blocks = [para("d0-b0", "Example Water", "", "")];
      for (var s = 1; s <= 8; s++) {
        blocks.push(head("d0-h" + s, s, "Section " + s, "s" + s));
        for (var k = 0; k < 12; k++) blocks.push(para("d0-s" + s + "p" + k, "Paragraph " + k + " of section " + s + ". " + LONG, "s" + s, "Section " + s));
      }
      var pack = mkPack(blocks);
      var main, paper;
      function scrollTo(id) {
        var el = D.querySelector('#rr-paper [data-block-id="' + id + '"]');
        // Twice: the toolbar only takes its place at the top once the page has scrolled.
        for (var n = 0; n < 2; n++) main.scrollTop += el.getBoundingClientRect().top - D.querySelector(".rr-toolbar").getBoundingClientRect().bottom - 8;

      }).then(function () {

        frame.style.width = "1280px";

    }],
    // ---- C -------------------------------------------------------------------
    ["C: the suggested wording box", function () {
      var TEXT = "The site meets its target on five of seven requirements.";
      var pack = mkPack([para("d0-b0", "Example Water", "", ""), head("d0-b1", 1, "Scope", "scope"), para("d0-b2", TEXT, "scope", "Scope"), para("d0-b3", LONG + " " + LONG + " " + LONG + " " + LONG + " " + LONG + " " + LONG, "scope", "Scope")]);

      }).then(function () {
        var diff = D.querySelector(".rr-sug-diff");
        var dels = Array.prototype.map.call(diff.querySelectorAll("del"), function (n) { return n.textContent; }), ins = Array.prototype.map.call(diff.querySelectorAll("ins"), function (n) { return n.textContent; });
        ok(/^What changes:/.test(diff.textContent) && dels.join("|") === "five|requirements." && ins.join("|") === "six|requirements, which is good.", "as it is typed, the line shows the words taken out and put in", dels.join("|") + " / " + ins.join("|"));
        ok(D.querySelector(".rr-c-sug") === sug && R.state.composer.suggestion === sug.value, "without drawing the box again");
        var long = []; for (var i = 0; i < 60; i++) long.push("Line " + i + " of a much longer suggestion.");
        type(sug, long.join("\n"));
        return wait(300);
      }).then(function () {
        var h1 = sug.getBoundingClientRect().height;
        ok(h1 > h0 + 100 && h1 <= 322, "the box grows with its wording, up to a limit", h0 + " to " + h1);
        var reset = D.querySelector(".rr-sug-reset");
        ok(!!reset && reset.textContent === "Start again from the original", "once changed, a link offers to start again from the original");
        reset.click();
        ok(sug.value === TEXT && R.state.composer.suggestion === TEXT && /No change yet/.test(D.querySelector(".rr-sug-diff").textContent) && !D.querySelector(".rr-sug-reset") && sug.getBoundingClientRect().height < 200,
          "which puts the original back, and the box and the line with it", sug.value.slice(0, 40) + " / " + sug.getBoundingClientRect().height);
        type(sug, "");
        return wait(300);

        ok(/box is empty/.test(D.querySelector(".rr-sug-diff").textContent) && !!D.querySelector(".rr-sug-reset") && !D.querySelector(".rr-sug-diff ins"), "an emptied box says so rather than showing a change");
        type(sug, "The site meets its target on six of seven requirements.");

    // ---- D -------------------------------------------------------------------
    ["D: a checklist No offers a comment saying why", function () {
      var pack = mkPack([para("d0-b0", "Example Water", "", ""), head("d0-b1", 1, "Scope", "scope"), para("d0-b2", "The scope is the Works.", "scope", "Scope")]);
      var q, qText, qId;

        ok(D.querySelectorAll(".rr-q .rr-comment").length === 1, "on that question only");

        var q2 = D.querySelectorAll(".rr-q")[1];
        q2.querySelector('[data-answer="no"]').click();
        q2 = D.querySelectorAll(".rr-q")[1];

  var chain = Promise.resolve();
  sections.forEach(function (s) {
    chain = chain.then(function () {
      lines.push("-- " + s[0]);
      return s[1]();

  chain.then(function () {
