<html lang="en"><head><meta charset="utf-8"/><title>Suite shell: tours, recent files, hand-off and drops</title></head>
<body>
<pre id="out">running...</pre>
<iframe id="f" style="width:1440px;height:900px;border:0"></iframe>
<!--
  The suite shell in its folder build (platform/index.html, each tool its own
  page in a frame), with the real tools and the real host bridge:
    - a tour's unsaved changes and saves do not count (no bar tag, no close
      warning, nothing in Recent files);
    - Recent files says which review-tool entry is the pack and which the
      review file;
    - the bridge can hand a file from one tool to another (no tool offers it
      any more, but the plumbing still works), and a tour cannot;
    - a file dropped on the suite, or on a tool that does not take it, opens
      in the tool that reads it and never replaces the page;
    - the wording covers all four tools, and the Document Tool has its card,
      rail button, place beside the flow and file routing: its document file
      opens in it, and a Word file is refused with where to open it;
    - a tool can be closed from the rail or its card: with unsaved changes the
      suite asks first, and a closed tool opens fresh, offering nothing back.
  Run with tools/run-tests.ps1 -Root platform -Tests test-shell.html (headless
  runs need --allow-file-access-from-files, which run-tests.ps1 passes).
-->
<script src="../../modules/report-review/data/demo-pack.js"></script>
<script>
(function () {
  var lines = [], fail = 0;
  function ok(c, n, d) { lines.push((c ? "PASS " : "FAIL ") + n + (!c && d ? " - " + d : "")); if (!c) fail++; }
  function finish() {
    lines.push(""); lines.push(fail === 0 ? "ALL TESTS PASSED" : fail + " FAILED");
    document.getElementById("out").textContent = lines.join("\n");
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function until(test, ms, what) {
    var end = Date.now() + (ms || 30000);
    return new Promise(function (resolve, reject) {
      (function poll() {
        var v; try { v = test(); } catch (e) { v = null; }
        if (v) return resolve(v);
        if (Date.now() > end) return reject(new Error("timed out waiting for " + (what || "a condition")));
        setTimeout(poll, 50);
      })();
    });
  }
  var frame = document.getElementById("f");
  var S = null, Sh = null;
  function tool(key) {
    return until(function () {
      var f = Sh.frames[key];
      return f && f.ready && f.el.contentWindow && f.el.contentWindow.App && f.el.contentWindow.App.HostBridge && f;
    }, 60000, key + " to start").then(function (f) {
      var w = f.el.contentWindow;
      w.confirm = function () { return true; }; w.alert = function () {};
      return { f: f, w: w, d: w.document };
    });
  }
  // A message as the tool in that frame would send it (its window is the source).
  function postFrom(w, type, data, frameKey, module) {
    // An inline script in the frame, not eval: a tool's page may forbid eval.
    var s = w.document.createElement("script");
    s.textContent = "parent.postMessage(" + JSON.stringify({ protocol: "spt-suite/1", from: "module", module: module, frame: frameKey, type: type, data: data }).replace(/</g, "\\u003c") + ", '*')";
    w.document.documentElement.appendChild(s);
    s.parentNode.removeChild(s);
  }
  function dropEvent(w, type, files, text) {
    var dt = new w.DataTransfer();
    (files || []).forEach(function (f) { dt.items.add(new w.File([f.text], f.name, { type: "application/json" })); });
    if (text) dt.setData("text/plain", text);
    return new w.DragEvent(type, { bubbles: true, cancelable: true, dataTransfer: dt });
  }
  function toastText() { var t = S.document.getElementById("toast"); return t && !t.classList.contains("hidden") ? t.textContent : ""; }

  var pack = window.SPT_REVIEW_DEMO_PACK;
  var packText = JSON.stringify(pack);

  new Promise(function (resolve) {
    frame.onload = function () { resolve(); };
    frame.src = "../index.html";
  }).then(function () {
    return until(function () { return frame.contentWindow.Suite && frame.contentWindow.Suite.Shell; }, 30000, "the suite");
  }).then(function () {
    S = frame.contentWindow; Sh = S.Suite.Shell;
    S.confirm = function () { return true; };
    Sh.clearRecent();

    // ---- wording: four tools -----------------------------------------------
    var d = S.document;
    Sh.openLicence();
    var lic = d.querySelector(".licence-version");
    ok(lic && /every tool in the suite/.test(lic.textContent) && !/both tools/.test(lic.textContent), "the licence covers every tool, not both", lic && lic.textContent);
    d.querySelector(".licence-modal .btn.primary").click();
    ok(/review packs and review files/.test(d.querySelector(".recent-empty").textContent), "Recent files says it holds review packs and review files too");
    ok(/Project files, document files, review packs and review files/.test(d.querySelector(".recent-empty").textContent), "and document files");
    var pick = d.querySelector(".recent-pick");
    ok(pick && /project file, document file, review pack or review file/.test(pick.title), "Open a file names the four sorts of file it takes", pick && pick.title);
    ok(/Drop one anywhere in the suite/.test(d.querySelector(".recent-empty").textContent), "and, while it is empty, that a file can be dropped anywhere in the suite");
    var tips = d.querySelector(".help-tips").textContent;
    ok(/ring on a tool means it is open/.test(tips) && /filled amber dot means it has unsaved changes/.test(tips), "the help says what the rail's markers mean", tips);
    ok(!/drop a project file/i.test(tips), "and does not repeat the drop hint while the empty list already gives it");
    Sh.home();
    var send = d.querySelector(".help-card").textContent;
    ok(/Send for review/.test(send) && /Import review files/.test(send) && /Import risk context/.test(send), "the flow names the buttons that pass each file on", send);
    var helps = d.querySelectorAll(".tool-card[data-module='assessments'] .help-tool p, .tool-card[data-module='risk-assessment'] .help-tool p");
    ok(helps.length === 2 && /Send for review/.test(helps[0].textContent) && /Import review files/.test(helps[1].textContent),
      "each author tool's When to use it explains the author's half of a review");
    var flow = d.querySelector(".help-card .flow").textContent;
    ok(/Risk context file/.test(flow) && /62443-3-3/.test(flow) && /Review pack/.test(flow) && /Review file/.test(flow),
      "How the tools fit together names the files that pass between the tools", flow);

    // ---- the fourth tool: its card, the grid, its place beside the flow -------
    var cards = d.querySelectorAll(".tool-grid .tool-card");
    ok(cards.length === 4 && Array.prototype.map.call(cards, function (c) { return c.getAttribute("data-module"); }).join(",") === "assessments,risk-assessment,report-review,documents",
      "the home page has four tool cards, the Document Tool last");
    var dc = d.querySelector(".tool-card[data-module='documents']");
    ok(dc && dc.querySelector("h2").textContent === "OT Cyber Document Tool" && /SolutionsPT template/.test(dc.querySelector(".tool-summary").textContent) &&
       /pictures and drawings kept/.test(dc.querySelector(".tool-summary").textContent), "its card names it and says what it does", dc && dc.textContent);
    ok(dc && /not an assessment or risk report/.test(dc.querySelector(".help-tool p").textContent) && /draft or a final/.test(dc.querySelector(".help-tool p").textContent) &&
       dc.querySelector(".tool-tour") && /demo proposal/.test(dc.querySelector(".tool-tour").title), "with when to use it and its tour");
    var cols = S.getComputedStyle(d.querySelector(".tool-grid")).gridTemplateColumns.split(" ");
    var tops = Array.prototype.map.call(cards, function (c) { return Math.round(c.getBoundingClientRect().top); });
    ok(S.innerWidth >= 1200 && cols.length === 2 && tops[0] === tops[1] && tops[2] === tops[3] && tops[2] > tops[0],
      "at full width the cards sit as two rows of two, so none is alone", S.innerWidth + " wide, columns " + cols.join(" ") + ", tops " + tops.join(","));
    var tileColours = Array.prototype.map.call(d.querySelectorAll(".tool-card .tool-ic"), function (e) { return S.getComputedStyle(e).color; });
    ok(dc.querySelectorAll(".tool-ic svg path").length === 6 && tileColours.filter(function (c, i) { return tileColours.indexOf(c) === i; }).length === 4,
      "it has an icon and a colour of its own", tileColours.join(" | "));
    var steps = d.querySelectorAll(".help-card .flow > li");
    var last = steps[steps.length - 1];
    ok(d.querySelectorAll(".help-card .flow-step").length === 4 && last.getAttribute("data-module") === "documents" && last.classList.contains("flow-apart") &&
       !last.querySelector(".flow-arrow") && steps[steps.length - 2].classList.contains("flow-link") && /Review file/.test(steps[steps.length - 2].textContent),
      "How the tools fit together ends with the Document Tool, apart from the flow and with no arrow of its own");
    ok(/Proposals, method statements and other documents in the SolutionsPT template/.test(last.textContent) && /no file passes between it and the other tools/.test(last.textContent),
      "and says it works on its own", last.textContent);
    ok(!/[–—]/.test(d.getElementById("home").textContent), "no en or em dashes anywhere on the home page");
    // ---- the rail ------------------------------------------------------------
    var rail = d.getElementById("suite-bar");
    var home = rail.querySelector(".bar-home");
    ok(rail.tagName === "NAV" && home && home.getAttribute("aria-current") === "page" && rail.querySelectorAll(".bar-tab").length === 4,
      "the rail shows Home, current on the home page, and a button for each of the four tools");
    var wb = rail.querySelector(".bar-tab[data-key='documents']");
    ok(wb && wb.querySelector(".rail-label").textContent === "Write" && wb.getAttribute("aria-label") === "Write, OT Cyber Document Tool" && wb.querySelectorAll("svg path").length === 6,
      "the Document Tool's rail button is labelled Write, with its icon", wb && wb.getAttribute("aria-label"));
    ok(Array.prototype.every.call(rail.querySelectorAll("button.rail-btn"), function (b) {
      var label = (b.querySelector(".rail-label") || {}).textContent || "";
      return label && (b.getAttribute("aria-label") || "").toLowerCase().indexOf(label.toLowerCase()) !== -1;
    }), "every rail button's spoken name contains its visible label");
    ok(d.getElementById("btn-theme") && d.getElementById("btn-licence") && rail.contains(d.getElementById("btn-licence")), "the theme and licence buttons are in the rail");
    ok(Sh.when(new Date(2026, 10, 9, 14, 2).toISOString(), new Date(2026, 10, 9, 18, 0)) === "today, 14:02" &&
       Sh.when(new Date(2026, 10, 8, 9, 5).toISOString(), new Date(2026, 10, 9, 0, 30)) === "yesterday, 09:05" &&
       Sh.when(new Date(2026, 1, 3, 16, 45).toISOString(), new Date(2026, 10, 9)) === "3 Feb, 16:45" &&
       Sh.when(new Date(2025, 10, 3, 16, 45).toISOString(), new Date(2026, 10, 9)) === "3 Nov 2025" &&
       Sh.when("not a date") === "", "Recent files says when in plain words (today, yesterday, a date)");

    // ---- what a file is ----------------------------------------------------
    var K = Sh.fileKind;
    ok(K(packText).module === "report-review" && K(packText).what === "review pack", "a review pack goes to the review tool");
    ok(K(JSON.stringify({ schema: "spt-review/1.0", packId: "x", comments: [] })).what === "review file", "and so does a review file");
    ok(K(JSON.stringify({ schema: "spt-risk-project/0.2" })).module === "risk-assessment", "a risk project goes to the risk tool");
    ok(K(JSON.stringify({ schemaVersion: "2.0", assessments: {} })).module === "assessments", "an assessment project goes to the assessment tool");
    ok(K(JSON.stringify({ schema: "spt-risk-context/1.4" })).module === null, "a risk context file is not opened on its own");
    var docKind = K(JSON.stringify({ schema: "spt-document/1.0", id: "d1", kind: "report", blocks: [] }));
    ok(docKind && docKind.module === "documents" && docKind.what === "document file", "a document file goes to the Document Tool");
    ok(K(JSON.stringify({ schema: "spt-document/1.0", schemaVersion: "2.0" })).module === "documents", "even one that also carries a schemaVersion, which alone would mean an assessment project");
    ok(K("PK\u0003\u0004 not json") === null && K("[1,2]") === null && K(JSON.stringify({ schema: "something/1" })) === null, "anything else is not guessed at");

    // ---- a tour's changes and saves do not count -----------------------------
    Sh.open("report-review/tour");
    return tool("report-review/tour");
  }).then(function (t) {
    return until(function () { return t.w.ReviewTool && t.w.ReviewTool.state.pack; }, 20000, "the review tour's pack").then(function () {
      postFrom(t.w, "dirty", { dirty: true }, "report-review/tour", "report-review");
      postFrom(t.w, "recent", { action: "save", name: "demo-review.json", label: "Acme Petrochemicals", hasHandle: false }, "report-review/tour", "report-review");
      return sleep(300);
    }).then(function () {
      var f = Sh.frames["report-review/tour"];
      ok(f.dirty === false && f.el.getAttribute("data-dirty") === "false", "a tour saying it has unsaved changes is not marked unsaved");
      var tb = S.document.querySelector("#suite-bar .bar-tab[data-key='report-review/tour']");
      ok(tb && tb.getAttribute("aria-current") === "page" && /tour/.test(tb.getAttribute("aria-label")) && !tb.querySelector(".dot.dirty") && !/unsaved/.test(tb.getAttribute("aria-label")),
        "the rail shows the open tour, with no unsaved-changes marker", tb && tb.getAttribute("aria-label"));
      var ev = new S.Event("beforeunload", { cancelable: true });
      S.dispatchEvent(ev);
      ok(!ev.defaultPrevented, "closing the suite does not warn about a tour");
      ok(Sh.readRecent().length === 0, "a save in the tour is not added to Recent files", JSON.stringify(Sh.readRecent()));
      ok(t.w.App.HostBridge.canHandoff === false && t.w.App.HostBridge.handoff("assessments", "x.json", "{}") === false, "a tour cannot hand a file to another tool");
      postFrom(t.w, "handoff", { to: "assessments", name: "x.json", text: "{}" }, "report-review/tour", "report-review");
      return until(function () { return /tour/.test(toastText()); }, 5000, "the tour hand-off message").then(function () {
        ok(Sh.current() === "report-review/tour" && !Sh.frames.assessments, "and the suite refuses one sent anyway, staying where it was");
      });
    }).then(function () {
      // ---- the author's pack handed to the review tool, opened for the first time ----
      Sh.open("risk-assessment");
      return tool("risk-assessment");
    });
  }).then(function (rk) {
    ok(rk.w.App.HostBridge.canHandoff === true, "a tool in the suite may hand files on");
    ok(!Sh.frames["report-review"], "the review tool is not open yet");
    rk.w.App.HostBridge.handoff("report-review", "acme-review-pack-round-2.json", packText);
    return tool("report-review").then(function (rv) {
      return until(function () { return rv.w.ReviewTool.state.pack && rv.w.ReviewTool.state.pack.packId === pack.packId; }, 20000, "the handed pack to open").then(function () {
        ok(Sh.current() === "report-review", "the hand-off opens the review tool, held until it had started");
        ok(!rv.w.ReviewTool.state.demo && rv.w.ReviewTool.state.pack.round === pack.round, "with the pack open in it, as a real pack");
        ok(Sh.readRecent().some(function (e) { return e.module === "report-review" && e.name === "acme-review-pack-round-2.json"; }),
          "the pack it opened is in Recent files under the review tool");

        // ---- Recent files tells the pack from the review file -----------------
        rv.w.App.HostBridge.recent({ action: "save", name: "acme-review-round-2-pat.json", label: "Acme" });
        rv.w.App.HostBridge.recent({ action: "open", name: "renamed.json", label: "Acme", kind: "Review file" });
        return until(function () { return Sh.readRecent().length >= 3; }, 5000, "the recent entries");
      }).then(function () {
        Sh.home();
        var metas = Array.prototype.map.call(S.document.querySelectorAll(".recent-item"), function (li) { return li.querySelector(".recent-name").textContent + " = " + li.querySelector(".recent-meta").textContent; });
        function meta(n) { return metas.filter(function (m) { return m.indexOf(n + " = ") === 0; })[0] || ""; }
        ok(/Review pack/.test(meta("acme-review-pack-round-2.json")), "a pack is labelled Review pack in Recent files", meta("acme-review-pack-round-2.json"));
        ok(/Review file/.test(meta("acme-review-round-2-pat.json")), "a review file is labelled Review file", meta("acme-review-round-2-pat.json"));
        ok(/Review file/.test(meta("renamed.json")), "and a kind the tool gives is used as given", meta("renamed.json"));

        // ---- a review file handed back to the author's tool ----------------------
        var file = { schema: "spt-review/1.0", packId: pack.packId, reviewId: pack.reviewId, round: pack.round, fileId: "rf-x", reviewer: "Pat", savedAt: "2026-11-09T10:00:00.000Z", comments: [] };
        rv.w.App.HostBridge.handoff("OT Cyber Risk Assessment Tool", "acme-review-round-2-pat.json", JSON.stringify(file));
        return until(function () { return Sh.current() === "risk-assessment" && rk.d.querySelector(".spt-host-banner"); }, 10000, "the hand-back").then(function () {
          ok(/Import review files/.test(rk.d.querySelector(".spt-host-banner").textContent),
            "a review file handed back by product name reaches that tool's review card, which says where it goes when no report is open", rk.d.querySelector(".spt-host-banner").textContent);
          rk.d.querySelector(".spt-host-banner .spt-host-x").click();
        });
      }).then(function () {
        // ---- files dropped on the suite ----------------------------------------
        Sh.home();
        var over = dropEvent(S, "dragover", [{ name: "p.json", text: "{}" }]);
        S.document.body.dispatchEvent(over);
        ok(over.defaultPrevented, "a file dragged over the home page is accepted, so the browser does not open it in place of the suite");
        var pack2 = JSON.parse(packText); pack2.packId = "rp-dropped-on-home";
        var drop = dropEvent(S, "drop", [{ name: "dropped-pack.json", text: JSON.stringify(pack2) }]);
        S.document.querySelector(".home-main").dispatchEvent(drop);
        ok(drop.defaultPrevented, "dropping it does not navigate away");
        return until(function () { return rv.w.ReviewTool.state.pack.packId === "rp-dropped-on-home"; }, 15000, "the dropped pack").then(function () {
          ok(Sh.current() === "report-review", "a review pack dropped on the home page opens in the review tool");
          Sh.home();
          var junk = dropEvent(S, "drop", [{ name: "notes.json", text: "{\"hello\":1}" }]);
          S.document.body.dispatchEvent(junk);
          return until(function () { return /notes\.json is not a file the suite opens/.test(toastText()); }, 5000, "the message for an unknown file").then(function () {
            ok(junk.defaultPrevented && Sh.current() === null, "an unknown file gets a message and nothing else");
            // A Word file is a zip, which cannot be passed to a tool as text.
            var word = dropEvent(S, "drop", [{ name: "proposal.docx", text: "PK\u0003\u0004 a zip" }]);
            S.document.body.dispatchEvent(word);
            return until(function () { return /proposal\.docx is a Word or Excel file/.test(toastText()); }, 5000, "the message for a Word file");
          }).then(function () {
            ok(/which the suite does not open\. To put a Word file into the SolutionsPT template, open it with Load in the OT Cyber Document Tool\.$/.test(toastText()) &&
               Sh.current() === null && !Sh.frames.documents, "a Word file is still refused, and the message points to Load in the Document Tool", toastText());
            // ---- a document file opens in the Document Tool ------------------------
            var docFile = function (title) {
              return JSON.stringify({ schema: "spt-document/1.0", id: "doc-" + title, kind: "short", info: { title: title }, options: {}, nextId: 2,
                blocks: [{ id: "b1", type: "paragraph", runs: [{ t: "Dropped on the suite." }] }], footnotes: {}, media: {}, parts: {} });
            };
            var two = dropEvent(S, "drop", [{ name: "first-doc.json", text: docFile("First") }, { name: "second-doc.json", text: docFile("Second") }]);
            S.document.body.dispatchEvent(two);
            return until(function () { return /second-doc\.json was left out/.test(toastText()); }, 5000, "the one at a time note");
          }).then(function () {
            ok(/second-doc\.json was left out: open one document file at a time\.$/.test(toastText()), "of two document files dropped together the second is left out, in the document's own words", toastText());
            ok(Sh.current() === "documents", "and the first opens the Document Tool");
            return tool("documents");
          }).then(function (dt) {
            ok(dt.d.title === "OT Cyber Document Tool" && dt.w.App.Product.id === "documents" && dt.w.App.HostBridge.hosted && dt.f.product === "OT Cyber Document Tool" && dt.f.version === S.App.Version.label,
              "the Document Tool starts in its frame and tells the suite its name and version", dt.d.title + " / " + dt.f.product + " / " + dt.f.version);
            ok(/documents\/index\.html$/.test(dt.f.el.getAttribute("src") || "") && /"module":"documents"/.test(dt.f.el.name) && /"tour":false/.test(dt.f.el.name),
              "from its own page, knowing it is in the suite and not on its tour", dt.f.el.name);
            ok(S.document.title === "OT Cyber Document Tool - " + S.Suite.Data.product, "the suite's title follows", S.document.title);
            var here = S.document.querySelector("#suite-bar [aria-current='page']");
            ok(here && here.getAttribute("data-key") === "documents" && here.querySelector(".dot") && /^Write, OT Cyber Document Tool \(open/.test(here.getAttribute("aria-label")),
              "and the rail marks it as open and on show", here && here.getAttribute("aria-label"));
            // What the tool says when it opens or saves a file.
            dt.w.App.HostBridge.recent({ action: "save", name: "acme-proposal 0.1.json", label: "Acme proposal", kind: "Document" });
            dt.w.App.HostBridge.recent({ action: "open", name: "unlabelled-doc.json", label: "" });
            return until(function () { return Sh.readRecent().filter(function (e) { return e.module === "documents" && /acme-proposal|unlabelled-doc/.test(e.name); }).length === 2; }, 5000, "the document recent entries");
          }).then(function () {
            Sh.home();
            var rows = Array.prototype.filter.call(S.document.querySelectorAll(".recent-item"), function (li) { return /unlabelled-doc|acme-proposal/.test(li.textContent); });
            var metas = rows.map(function (li) { return li.querySelector(".recent-name").textContent + " = " + li.querySelector(".recent-meta").textContent; });
            ok(metas.indexOf("acme-proposal 0.1.json = Document · Acme proposal · Documents") !== -1, "a document file is labelled Document in Recent files, with its title and tool", metas.join(" | "));
            ok(metas.indexOf("unlabelled-doc.json = Document · Documents") !== -1, "also when the tool gives no kind", metas.join(" | "));
            ok(rows.length === 2 && rows[0].querySelector(".tool-ic[data-module='documents']") && /in the OT Cyber Document Tool$/.test(rows[0].querySelector(".recent-open").title),
              "under the Document Tool's icon");
            ok(/Drop a project file, document file, review pack or review file anywhere/.test(S.document.querySelector(".help-tips").textContent), "once the list has entries, the help carries the drop hint, document files included");
          });
        }).then(function () {
          // ---- dropped on a tool that does not take files itself ------------------
          Sh.open("risk-assessment");
          var tdrag = dropEvent(rk.w, "dragover", null, "some text");
          rk.d.body.dispatchEvent(tdrag);
          ok(!tdrag.defaultPrevented, "dragging text in a tool is left alone");
          var proj = JSON.parse(JSON.stringify(rk.w.RiskTool.state.project));
          proj.schema = proj.schema || "spt-risk-project/0.2";
          proj.suc = proj.suc || {}; proj.suc.name = "Dropped on the risk tool";
          var pack3 = JSON.parse(packText); pack3.packId = "rp-dropped-on-risk";
          var fdrag = dropEvent(rk.w, "dragover", [{ name: "x.json", text: "{}" }]);
          rk.d.body.dispatchEvent(fdrag);
          ok(fdrag.defaultPrevented, "a file dragged over a tool that does not take files is accepted for the suite");
          var fdrop = dropEvent(rk.w, "drop", [{ name: "risk.json", text: JSON.stringify(proj) }]);
          rk.d.querySelector("main, #main, body").dispatchEvent(fdrop);
          ok(fdrop.defaultPrevented, "and dropping it does not replace the tool's page");
          return until(function () { return rk.w.RiskTool.state.project.suc.name === "Dropped on the risk tool"; }, 15000, "the dropped risk project").then(function () {
            ok(Sh.current() === "risk-assessment", "a risk project dropped on the risk tool opens in it, through the suite");
            var gdrop = dropEvent(rk.w, "drop", [{ name: "pack3.json", text: JSON.stringify(pack3) }]);
            rk.d.body.dispatchEvent(gdrop);
            return until(function () { return rv.w.ReviewTool.state.pack.packId === "rp-dropped-on-risk"; }, 15000, "the pack dropped on the risk tool");
          }).then(function () {
            ok(Sh.current() === "report-review", "a review pack dropped on the risk tool opens in the review tool");
            var rdrop = dropEvent(rv.w, "drop", [{ name: "pack4.json", text: packText }]);
            rv.d.body.dispatchEvent(rdrop);
            ok(rdrop.defaultPrevented, "the review tool still takes a file dropped on it itself");
            // A review file the author drops on their own tool is theirs to import.
            Sh.open("risk-assessment");
            var oldBanner = rk.d.querySelector(".spt-host-banner");
            if (oldBanner && oldBanner.parentNode) oldBanner.parentNode.removeChild(oldBanner);
            var rf = { schema: "spt-review/1.0", packId: "rp-for-the-author", reviewId: "rv-x", round: 1, fileId: "rf-drop", reviewer: "Pat", savedAt: "2026-11-09T11:00:00.000Z", comments: [] };
            var adrop = dropEvent(rk.w, "drop", [{ name: "pat-review.json", text: JSON.stringify(rf) }]);
            rk.d.body.dispatchEvent(adrop);
            return until(function () { return rk.d.querySelector(".spt-host-banner") || rk.d.querySelector(".rv-notice"); }, 10000, "the author's tool to take the dropped review file").then(function (n) {
              ok(Sh.current() === "risk-assessment" && !rv.w.ReviewTool.state.pendingReview, "a review file dropped on the author's own tool stays there, not sent to the review tool", Sh.current());
              ok(/Import review files|review file/i.test(n.textContent), "and the tool says what it did with it", n.textContent);
            });
          });
        });
      });
    });
  }).then(function () {
    // ---- closing a tool ------------------------------------------------------
    // A closed tool opens fresh the next time, as if it had never been opened:
    // with unsaved changes the suite asks first, and closing anyway also
    // throws away the tool's autosave copy, which it would otherwise offer back.
    var d = S.document;
    var rkf = Sh.frames["risk-assessment"], rw = rkf.el.contentWindow, RT = rw.RiskTool;
    var fresh = RT.state.project.suc.name;
    ok(fresh === "Dropped on the risk tool", "the risk tool holds the dropped project", fresh);
    RT.touched(); RT.flushAutosave();
    return until(function () { return rkf.dirty; }, 5000, "the risk tool's unsaved changes").then(function () {
      ok(!!rw.localStorage.getItem(RT.AUTOSAVE_KEY), "with an autosave copy of them");
      Sh.open("risk-assessment");
      var x = d.querySelector('#suite-bar .rail-item.is-current [data-rail="close:risk-assessment"]');
      ok(x && x.classList.contains("rail-close") && x.getAttribute("aria-label") === "Close the OT Cyber Risk Assessment Tool",
        "an open tool has a close button beside it in the rail, saying which tool it closes", x && x.getAttribute("aria-label"));
      ok(!d.querySelector('[data-rail="close:assessments"]'), "a tool that is not open has none");
      x.click();
      var dlg = d.querySelector(".close-modal");
      ok(dlg && /Close the OT Cyber Risk Assessment Tool\?/.test(dlg.textContent) && /unsaved changes/.test(dlg.textContent) && d.activeElement && d.activeElement.textContent === "Cancel",
        "with unsaved changes it asks first, with Cancel ready", dlg && dlg.textContent);
      ok(!/[–—]/.test(dlg.textContent), "the question has no en or em dashes");
      dlg.querySelector(".btn.primary").click();
      ok(!d.querySelector(".close-modal") && Sh.frames["risk-assessment"] === rkf && rkf.el.isConnected && rkf.dirty, "Cancel leaves the tool open with its work");
      d.querySelector('[data-rail="close:risk-assessment"]').click();
      d.querySelector(".close-modal .close-anyway").click();
      return until(function () { return !Sh.frames["risk-assessment"]; }, 6000, "the risk tool to close").then(function () {
        ok(!rkf.el.isConnected && Sh.current() === null && !d.querySelector('[data-rail="close:risk-assessment"]'),
          "Close without saving takes the tool's frame away and shows the home page");
        var rb = d.querySelector("#suite-bar .bar-tab[data-key='risk-assessment']");
        ok(rb && !rb.querySelector(".dot.open, .dot.dirty") && !/\(open/.test(rb.getAttribute("aria-label")), "the rail no longer marks it open", rb && rb.getAttribute("aria-label"));
        ok(/is closed/.test(toastText()), "and says it is closed", toastText());
        Sh.open("risk-assessment");
        return tool("risk-assessment");
      }).then(function (again) {
        return sleep(600).then(function () {
          ok(again.w !== rw && again.w.RiskTool.state.project.suc.name !== "Dropped on the risk tool" && !again.w.RiskTool.isDirty(),
            "opened again, it starts fresh", again.w.RiskTool.state.project.suc.name);
          ok(!again.d.querySelector(".autosave-bar") && !again.w.localStorage.getItem(again.w.RiskTool.AUTOSAVE_KEY),
            "and offers nothing back: the work thrown away is not found as unsaved work");
        });
      });
    }).then(function () {
      // A tool with nothing unsaved closes at once, from its card on the home page.
      var df = Sh.frames.documents;
      ok(df && !df.dirty, "the Document Tool is open with nothing unsaved");
      Sh.home();
      var card = d.querySelector(".tool-card[data-module='documents']");
      var c = card.querySelector(".tool-close");
      ok(c && /^Close/.test(c.textContent) && /Go back to it/.test(card.querySelector(".tool-open").textContent), "an open tool's card has Close beside Go back to it");
      ok(!d.querySelector(".tool-card[data-module='assessments'] .tool-close"), "a closed tool's card does not");
      c.focus(); c.click();
      ok(!d.querySelector(".close-modal"), "with nothing unsaved it does not ask");
      return until(function () { return !Sh.frames.documents; }, 6000, "the Document Tool to close").then(function () {
        var card2 = d.querySelector(".tool-card[data-module='documents']");
        ok(!df.el.isConnected && !card2.querySelector(".tool-close") && /^Open/.test(card2.querySelector(".tool-open").textContent), "it closes, and its card offers Open again");
        ok(d.activeElement === card2.querySelector(".tool-open"), "the keyboard moves to the card's Open", d.activeElement && d.activeElement.className);
        // A tour closes from the rail too, and its button goes with it.
        ok(!!Sh.frames["report-review/tour"] && d.querySelector('[data-rail="close:report-review/tour"]'), "an open tour has a close button too");
        d.querySelector('[data-rail="close:report-review/tour"]').click();
        return until(function () { return !Sh.frames["report-review/tour"]; }, 6000, "the tour to close");
      }).then(function () {
        ok(!d.querySelector("#suite-bar .bar-tab[data-key='report-review/tour']") && !d.querySelector("#suite-bar .is-tour"), "a closed tour leaves the rail");
      });
    });
  }).catch(function (e) {
    ok(false, "the page ran to the end", e && e.message || e);
  }).then(function () {
    try { if (S) S.Suite.__noOwnGuard = true; } catch (e) {}
    finish();
  });
})();
</script>
